const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const moisLabel = (ym) => { if (!ym) return ""; const [y, m] = ym.split("-"); return MOIS[parseInt(m,10)-1] + " " + y; };
const moisCourant = () => new Date().toISOString().slice(0, 7);
const aujourdhui = () => new Date().toISOString().slice(0, 10);
const addMois = (ym, n) => { const [y,m] = ym.split("-").map(Number); const d = new Date(y, m-1+n, 1);

const heure = (iso) => { const d = new Date(iso);

const dateHeure = (iso) => dateLongue(iso) + " à " + heure(iso);

// Commission de gestion d'un bien sur un montant encaissé : pourcentage OU montant fixe
function commissionBien(bien, montantEncaisse) {
  if (!bien) return 0;
  if (bien.commissionMode === "fixe") return Math.min(Number(bien.commissionFixe) || 0, Number(montantEncaisse) || 0);
  return Math.round(Number(montantEncaisse || 0) * Number(bien.commission || 0) / 100);
}

// "cinq (5)" à partir de 5 — pour les jours d'échéance dans les baux
const cardinalJour = (n) => {
  const mots = ["","premier","deux","trois","quatre","cinq","six","sept","huit","neuf","dix",
    "onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf","vingt",
    "vingt et un","vingt-deux","vingt-trois","vingt-quatre","vingt-cinq","vingt-six","vingt-sept","vingt-huit"];
  n = Number(n) || 5;
  return (mots[n] || String(n)) + " (" + n + ")";
};

// Nettoie un numéro de téléphone ivoirien et le met au format international pour wa.me
const telWhatsApp = (tel) => {
  if (!tel) return "";
  let t = String(tel).replace(/[^\d+]/g, "");
  if (t.startsWith("+")) return t.slice(1);
  if (t.startsWith("00")) return t.slice(2);
  if (t.startsWith("225")) return t;
  return "225" + t; // Côte d'Ivoire par défaut
};

const ouvrirWhatsApp = (tel, message) => {
  const num = telWhatsApp(tel);
  const txt = encodeURIComponent(message);
  const url = num ? "https://wa.me/" + num + "?text=" + txt : "https://wa.me/?text=" + txt;
  window.open(url, "_blank");
};

// Génère un PDF A4 depuis un élément DOM et le télécharge. Retourne true si ok.
async function genererPdf(element, nomFichier) {
  if (!element) { alert("Document introuvable. Réessayez après quelques secondes."); return false; }
  if (!window.jspdf || !window.html2canvas) {
    alert("Les outils PDF ne sont pas encore chargés. Vérifiez votre connexion internet, patientez quelques secondes et réessayez. Vous pouvez aussi utiliser le bouton « Imprimer » puis choisir « Enregistrer en PDF ».");
    return false;
  }
  try {
    // Attendre que les polices soient chargées (belle typographie des contrats)
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
    // Attendre que les images (logo) soient bien chargées avant la capture
    const imgs = Array.from(element.querySelectorAll("img"));
    await Promise.all(imgs.map((im) => (im.complete && im.naturalWidth) ? Promise.resolve()
      : new Promise((res) => { im.onload = res; im.onerror = res; setTimeout(res, 2000); })));

    const canvas = await window.html2canvas(element, { scale: 2, backgroundColor: "#ffffff", useCORS: true, logging: false });
    const img = canvas.toDataURL("image/jpeg", 0.92);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "mm", format: "a4" });
    const pw = 210, ph = 297, marge = 8;
    const w = pw - marge * 2;
    const h = (canvas.height * w) / canvas.width;
    if (h <= ph - marge * 2) {
      pdf.addImage(img, "JPEG", marge, marge, w, h);
    } else {
      let y = 0;
      const pageH = ph - marge * 2;
      const ratio = canvas.width / w;
      while (y < canvas.height) {
        const sliceH = Math.min(pageH * ratio, canvas.height - y);
        const c2 = document.createElement("canvas");
        c2.width = canvas.width; c2.height = sliceH;
        c2.getContext("2d").drawImage(canvas, 0, y, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
        const img2 = c2.toDataURL("image/jpeg", 0.92);
        if (y > 0) pdf.addPage();
        pdf.addImage(img2, "JPEG", marge, marge, w, sliceH / ratio);
        y += sliceH;
      }
    }
    pdf.save(nomFichier);
    return true;
  } catch (e) {
    alert("Le téléchargement PDF n'a pas abouti. Utilisez le bouton « Imprimer » puis choisissez « Enregistrer en PDF » dans les options d'impression — le résultat est identique.");
    return false;
  }
}

/* ================================ images ================================== */

function dessiner(source, w0, h0, maxDim, q) {
  maxDim = maxDim || 900; q = q || 0.55;
  const r = Math.min(1, maxDim / Math.max(w0, h0));
  const w = Math.round(w0 * r), h = Math.round(h0 * r);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(source, 0, 0, w, h);
  return c.toDataURL("image/jpeg", q);
}

function fichierVersDataUrl(file, maxDim, q) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image();
      img.onload = () => resolve(dessiner(img, img.naturalWidth, img.naturalHeight, maxDim, q));
      img.onerror = () => reject(new Error("x")); img.src = r.result; };
    r.onerror = () => reject(new Error("x"));
    r.readAsDataURL(file);
  });
}

function EcranConfig({ onOk }) {
  const [url, setUrl] = useState("");
  const [key, setKey] = useState("");
  const [err, setErr] = useState(null);

  const valider = () => {
    const propre = (s) => s.replace(/[^\x21-\x7E]/g, "");
    const u = propre(url).replace(/\/+$/, "");
    const k = propre(key);
    if (!u.startsWith("https://") || !u.includes(".supabase.co")) {
      setErr("L'adresse doit ressembler à https://xxxxx.supabase.co"); return;
    }
    if (k.length < 30) { setErr("La clé semble incomplète. Copiez la clé publique en entier."); return; }
    ecrireCfg({ url: u, key: k });
    onOk({ url: u, key: k });

  return (

/* ============================ écran connexion ============================= */

function EcranConnexion({ cfg, onSession, onReconfig }) {
  const [email, setEmail] = useState("");
  const [mdp, setMdp] = useState("");
  const [err, setErr] = useState(null);
  const [occupe, setOccupe] = useState(false);

  const entrer = async () => {
    setOccupe(true); setErr(null);
    const { data, error } = await client(cfg).auth.signInWithPassword({ email: email.trim(), password: mdp });
    setOccupe(false);
    if (error) {
      const m = (error.message || "").toLowerCase();
      if (m.includes("not confirmed")) setErr("Ce compte n'est pas confirmé. Dans Supabase, supprimez-le et recréez-le avec Create new user en cochant Auto Confirm User.");
      else if (m.includes("invalid login")) setErr("Email ou mot de passe incorrect. Vérifiez que le compte a bien été créé avec un mot de passe saisi manuellement.");
      else setErr("Erreur Supabase : " + error.message);
      return;
    }
    onSession(data.session);
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-5" style={{ background: C.paper }}>
      <div className={card + " w-full max-w-sm"} style={{ borderColor: C.line }}>
        <div className="px-5 py-4 border-b" style={{ borderColor: C.line }}>
          <div className="font-bold" style={{ color: C.ink }}>SEASON IMMOBILIER</div>
          <p className="text-xs mt-0.5" style={{ color: C.mute }}>Connectez-vous pour accéder au dossier de l'agence.</p>
        </div>
        <div className="p-5 space-y-3">
          <Field label="Email"><Input type="email" value={email} onChange={(e) => setEmail(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && entrer()} /></Field>
          <Field label="Mot de passe"><Input type="password" value={mdp} onChange={(e) => setMdp(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && entrer()} /></Field>
          {err && <div className="px-3 py-2 rounded text-sm" style={{ background: C.claySoft, color: C.clay }}>{err}</div>}
          <Btn variant="accent" onClick={entrer} disabled={occupe}>{occupe ? "Connexion…" : "Se connecter"}</Btn>
          <div className="pt-2 border-t" style={{ borderColor: C.line }}>
            <div className="text-[10px] uppercase tracking-[0.14em] mb-1" style={{ color: C.mute }}>Base configurée</div>
            <div className="text-[11px] break-all" style={{ color: C.mute }}>{cfg.url}</div>
            <div className="text-[11px] break-all mt-1" style={{ color: C.mute }}>
              Clé : {cfg.key.slice(0, 22)}… ({cfg.key.length} caractères)
            </div>
            <button onClick={onReconfig} className="text-xs mt-2" style={{ color: C.green }}>Corriger ces informations</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ================================== app =================================== */

function Racine() {
  const [cfg, setCfg] = useState(lireCfg());
  const [session, setSession] = useState(null);
  const [pret, setPret] = useState(false);

  useEffect(() => {
    if (!cfg) { setPret(true); return; }
    const c = client(cfg);
    c.auth.getSession().then(({ data }) => { setSession(data.session); setPret(true); });
    const { data: sub } = c.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, [cfg]);

  const reconfig = () => { localStorage.removeItem(CFG_KEY); sb = null; setCfg(null); setSession(null); };

  if (!cfg) return <EcranConfig onOk={setCfg} />;
  if (!pret) return <div className="min-h-screen flex items-center justify-center" style={{ background: C.paper }}>
    <p className="text-sm" style={{ color: C.mute }}>Chargement…</p></div>;
  if (!session) return <EcranConnexion cfg={cfg} onSession={setSession} onReconfig={reconfig} />;
  return <App cfg={cfg} session={session} />;
}

function App({ cfg, session }) {
  const c = client(cfg);
  const moi = session.user.email;

  const [data, setData] = useState(lireCache() || EMPTY);
  const [pret, setPret] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const [etat, setEtat] = useState({ type: "info", txt: "Connexion…" });
  const [journal, setJournal] = useState([]);
  const [toast, setToast] = useState(null);
  const [notifsOk, setNotifsOk] = useState(
    typeof Notification !== "undefined" && Notification.permission === "granted");

  const monEnvoi = useRef(0);
  const timer = useRef(null);
  const enAttente = useRef(null);

  /* --- chargement initial --- */
  useEffect(() => {
    (async () => {
      const { data: ligne, error } = await c.from("agence").select("data, maj_le, maj_par").eq("id", "main").single();
      if (error) { setEtat({ type: "bad", txt: "Base inaccessible" }); setPret(true); return; }
      const d = ligne.data && ligne.data.biens ? ligne.data : EMPTY;
      const fusion = { ...EMPTY, ...d, parametres: { ...PARAMS_DEFAUT, ...(d.parametres || {}) } };
      setData(fusion); ecrireCache(fusion);
      setEtat({ type: "ok", txt: "Synchronisé" });
      setPret(true);
      const { data: j } = await c.from("journal").select("*").order("le", { ascending: false }).limit(60);
      setJournal(j || []);
    })();
  }, []);

  /* --- temps réel --- */
  useEffect(() => {
    const canal = c.channel("agence-live")
      .on("postgres_changes", { event: "*", schema: "public", table: "agence" }, (p) => {
        const n = p.new;
        if (!n || !n.data) return;
        if (n.maj_par === moi && Date.now() - monEnvoi.current < 4000) return;
        const fusion = { ...EMPTY, ...n.data, parametres: { ...PARAMS_DEFAUT, ...(n.data.parametres || {}) } };
        setData(fusion); ecrireCache(fusion);
        setEtat({ type: "ok", txt: "Mis à jour par " + (n.maj_par || "un collègue") });
      })
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "journal" }, (p) => {
        const e = p.new;
        setJournal((j) => [e, ...j].slice(0, 60));
        if (e.qui === moi) return;
        const msg = (e.qui || "Un collègue") + " · " + e.action;
        setToast(msg);
        setTimeout(() => setToast(null), 6000);
        if (typeof Notification !== "undefined" && Notification.permission === "granted") {
          try { new Notification("Season Immobilier", { body: msg }); } catch (x) {}
        }
      })
      .subscribe();
    return () => { c.removeChannel(canal); };
  }, []);

  /* --- enregistrement --- */
  const pousser = useCallback(async (d, action) => {
    setEtat({ type: "info", txt: "Enregistrement…" });
    monEnvoi.current = Date.now();
    const { error } = await c.from("agence").update({ data: d, maj_le: new Date().toISOString(), maj_par: moi }).eq("id", "main");
    if (error) { setEtat({ type: "bad", txt: "Hors ligne — modifications gardées sur ce poste" }); return; }
    setEtat({ type: "ok", txt: "Synchronisé" });
    if (action) await c.from("journal").insert({ qui: moi, action });
  }, []);

  const save = useCallback((next, action) => {
    setData(next); ecrireCache(next);
    enAttente.current = { next, action: action || enAttente.current?.action };
    clearTimeout(timer.current);
    timer.current = setTimeout(() => {
      const p = enAttente.current; enAttente.current = null;
      if (p) pousser(p.next, p.action);
    }, 900);
  }, [pousser]);

  const demanderNotifs = async () => {
    if (typeof Notification === "undefined") return;
    const r = await Notification.requestPermission();
    setNotifsOk(r === "granted");
  };

  const P = data.parametres || PARAMS_DEFAUT;

  /* ---------------------------------------------------------------------
     Vue métier : « tout », « gestion locative » ou « mise en location ».
     Les composants reçoivent une copie filtrée de data ; à l'enregistrement,
     saveVue réinjecte les éléments masqués pour qu'aucune donnée ne soit perdue.
     --------------------------------------------------------------------- */
  const [vueMetier, setVueMetier] = useState("tout");

  const dataVue = useMemo(() => {
    if (vueMetier === "tout") return data;
    const horsGestion = vueMetier === "location";
    const biens = (data.biens || []).filter((b) => !!b.horsGestion === horsGestion);
    const idsBiens = new Set(biens.map((b) => b.id));
    const locataires = (data.locataires || []).filter((l) => idsBiens.has(l.bienId));
    const idsLoc = new Set(locataires.map((l) => l.id));
    const idsProprios = new Set(biens.map((b) => b.proprietaireId).filter(Boolean));
    const parBien = (arr) => (arr || []).filter((x) => !x.bienId || idsBiens.has(x.bienId));
    const parLocataire = (arr) => (arr || []).filter((x) => !x.locataireId || idsLoc.has(x.locataireId));
    return {
      ...data,
      biens,
      locataires,
      proprietaires: (data.proprietaires || []).filter((pr) => idsProprios.has(pr.id)),
      paiements: parBien(data.paiements),
      facturesLoyer: parBien(data.facturesLoyer),
      recus: parBien(data.recus),
      etats: parBien(data.etats),
      baux: parBien(data.baux),
      cautions: parLocataire(data.cautions),
      preavis: parLocataire(data.preavis),
      tickets: parBien(data.tickets),
      mandats: parBien(data.mandats),
      relances: parBien(data.relances),
      imposFonciers: parBien(data.imposFonciers),
    };
  }, [data, vueMetier]);

  // Fusionne ce que le composant a enregistré avec ce que la vue lui masquait
  const saveVue = useCallback((next, action) => {
    if (vueMetier === "tout") return save(next, action);
    const fusion = { ...next };
    const cles = ["biens", "locataires", "proprietaires", "paiements", "facturesLoyer",
      "recus", "etats", "baux", "cautions", "preavis", "tickets", "mandats", "relances", "imposFonciers"];
    for (const k of cles) {
      const visibles = new Set((dataVue[k] || []).map((x) => x.id));
      const masques = (data[k] || []).filter((x) => !visibles.has(x.id));
      fusion[k] = [...(next[k] || []), ...masques];
    }
    return save(fusion, action);
  }, [save, data, dataVue, vueMetier]);

  const emailsCommerciaux = (P.commerciaux || []).map((e) => String(e).trim().toLowerCase());
  const estCommercial = emailsCommerciaux.includes(String(moi).trim().toLowerCase());
  const emailsCaisse = (P.accesCaisse || []).map((e) => String(e).trim().toLowerCase());
  const aAccesCaisse = !estCommercial || emailsCaisse.includes(String(moi).trim().toLowerCase());
  // Onglets accessibles à un commercial (accès limité) — la caisse s'ajoute si l'email est dans accesCaisse
  const ONGLETS_COMMERCIAL_BASE = ["dashboard","crm","biens","catalogue","diffusion","mandats","meubles","locataires","proprietaires","facturation","recus","renouvellements","etats","baux","travaux","prestataires","commissions"];
  const ONGLETS_COMMERCIAL = emailsCaisse.includes(String(moi).trim().toLowerCase())
    ? [...ONGLETS_COMMERCIAL_BASE, "caisse"] : ONGLETS_COMMERCIAL_BASE;

  const navComplete = [["dashboard","Tableau de bord"],["crm","CRM · Prospects"],["diffusion","Diffusion des offres"],["conformite","Conformité LBC/FT"],["finances","Analyse financière"],["proprietaires","Propriétaires"],["biens","Biens"],["catalogue","Catalogue"],["mandats","Mandats"],["meubles","Studios meublés"],["locataires","Locataires"],
    ["facturation","Factures de loyer"],["recus","Reçus de paiement"],["loyers","Loyers & quittances"],
    ["echeancier","Échéancier"],["impayes","Impayés"],["obligations","Obligations"],["renouvellements","Baux & préavis"],["cautions","Suivi des cautions"],["etats","États des lieux"],["baux","Contrats de bail"],
    ["factures","Charges & factures"],["travaux","Travaux & rappels"],["prestataires","Artisans & prestataires"],["commissions","Commissions"],["agents","Agents"],["cagnotte","Reversements propriétaires"],["point","Relevé propriétaire"],["caisse","Caisse & dépenses"],
    ["journal","Activité de l'équipe"],["export","Export & sauvegarde"],["parametres","Paramètres"]];
  const nav = estCommercial ? navComplete.filter(([id]) => ONGLETS_COMMERCIAL.includes(id)) : navComplete;

  // Si un commercial tombe sur un onglet interdit (ex. lien mémorisé), on le renvoie au tableau de bord
  const tabAutorise = estCommercial ? (ONGLETS_COMMERCIAL.includes(tab) ? tab : "dashboard") : tab;

  if (!pret) return <div className="min-h-screen flex items-center justify-center" style={{ background: C.paper }}>
    <p className="text-sm" style={{ color: C.mute }}>Chargement du dossier…</p></div>;

  const couleurEtat = { ok: C.green, info: C.gold, bad: C.clay }[etat.type];

  return (
    <div className="min-h-screen flex flex-col md:flex-row" style={{ background: C.paper }}>
      <aside className="md:w-60 md:min-h-screen shrink-0 sans-impression" style={{ background: C.ink }}>
        <div className="px-5 py-5 border-b flex items-center gap-2.5" style={{ borderColor: C.inkSoft,
          borderTop: "4px solid " + C.orange }}>
          {P.logo && <img src={P.logo} alt="" className="h-8 w-8 object-contain rounded bg-white p-0.5" />}
          <div><div className="text-white font-bold tracking-tight text-[14px] leading-tight">{P.societe || "SEASON"}</div>
            <div className="text-[10px] uppercase tracking-[0.16em]" style={{ color: C.greenVif }}>{P.slogan || "Gestion locative"}</div></div>
        </div>

        <div className="px-5 py-3 border-b text-[11px]" style={{ borderColor: C.inkSoft, color: "rgba(255,255,255,0.6)" }}>
          <div className="flex items-center gap-1.5">
            <span style={{ width: 7, height: 7, borderRadius: 99, background: couleurEtat, display: "inline-block" }}></span>
            <span>{etat.txt}</span>
          </div>
          <div className="mt-1 truncate">{moi}</div>
          {estCommercial && <div className="mt-1 inline-block px-1.5 py-0.5 rounded text-[9px] font-semibold uppercase tracking-wider"
            style={{ background: "rgba(255,255,255,0.12)", color: C.greenVif }}>Accès commercial</div>}
        </div>

        <nav className="p-2 flex md:block overflow-x-auto">
          {nav.map(([id, label]) => (
            <button key={id} onClick={() => setTab(id)}
              className="px-3 py-2.5 rounded text-sm w-full whitespace-nowrap text-left mb-0.5"
              style={{ background: tab === id ? C.inkSoft : "transparent",
                color: tab === id ? "#fff" : "rgba(255,255,255,0.62)",
                borderLeft: tab === id ? "3px solid " + C.orange : "3px solid transparent" }}>
              {label}
            </button>
          ))}
          <button onClick={() => c.auth.signOut()}
            className="px-3 py-2.5 rounded text-sm w-full text-left mt-2" style={{ color: "rgba(255,255,255,0.45)" }}>
            Se déconnecter
          </button>
        </nav>
      </aside>

      <main className="flex-1 p-5 md:p-8 max-w-6xl">
        {!notifsOk && (
          <div className="mb-4 px-4 py-2.5 rounded text-sm flex items-center justify-between gap-3 flex-wrap sans-impression"
            style={{ background: C.goldSoft, color: C.gold }}>
            <span>Activez les notifications pour être prévenue des saisies de votre comptable.</span>
            <Btn variant="ghost" onClick={demanderNotifs}>Activer</Btn>
          </div>
        )}

        {(data.biens || []).some((b) => b.horsGestion) && (
          <div className="mb-5 sans-impression">
            <div className="flex gap-2 flex-wrap items-center">
              <span className="text-xs font-semibold uppercase tracking-wide" style={{ color: C.mute }}>Vue</span>
              {[["tout", "Tout"], ["gestion", "Gestion locative"], ["location", "Mise en location"]].map(([k, lab]) => (
                <button key={k} onClick={() => setVueMetier(k)} className="px-3 py-1.5 rounded text-sm font-medium"
                  style={{ background: vueMetier === k ? C.ink : "transparent", color: vueMetier === k ? "#fff" : C.mute,
                    border: "1px solid " + (vueMetier === k ? C.ink : C.line) }}>{lab}</button>))}
            </div>
            {vueMetier !== "tout" && (
              <p className="text-[11px] mt-2" style={{ color: C.gold }}>
                Affichage restreint aux biens « {vueMetier === "gestion" ? "gestion locative" : "mise en location"} » et
                à tout ce qui s'y rattache : propriétaires, locataires, loyers, factures, reçus, contrats et états des lieux.
              </p>
            )}
          </div>
        )}

        {tabAutorise === "dashboard" && <Dashboard data={dataVue} go={setTab} journal={journal} moi={moi} />}
        {tabAutorise === "finances" && <Finances data={dataVue} />}
        {tabAutorise === "proprietaires" && <Proprietaires data={dataVue} save={saveVue} c={c} moi={moi} />}
        {tabAutorise === "biens" && <Biens data={dataVue} save={saveVue} c={c} />}
        {tabAutorise === "catalogue" && <Catalogue data={dataVue} save={saveVue} moi={moi} c={c} />}
        {tabAutorise === "mandats" && <Mandats data={dataVue} save={saveVue} moi={moi} c={c} />}
        {tabAutorise === "locataires" && <Locataires data={dataVue} save={saveVue} />}
        {tabAutorise === "facturation" && <FacturesLoyer data={dataVue} save={saveVue} moi={moi} />}
        {tabAutorise === "recus" && <Recus data={dataVue} save={saveVue} moi={moi} />}
        {tabAutorise === "loyers" && <Loyers data={dataVue} save={saveVue} moi={moi} />}
        {tabAutorise === "echeancier" && <Echeancier data={dataVue} />}
        {tabAutorise === "impayes" && <Impayes data={dataVue} save={saveVue} moi={moi} />}
        {tabAutorise === "obligations" && <Obligations data={dataVue} save={saveVue} moi={moi} c={c} />}
        {tabAutorise === "etats" && <EtatsDesLieux data={dataVue} save={saveVue} c={c} />}
        {tabAutorise === "baux" && <Baux data={dataVue} save={saveVue} />}
        {tabAutorise === "cautions" && <Cautions data={dataVue} save={saveVue} moi={moi} />}
        {tabAutorise === "renouvellements" && <Renouvellements data={dataVue} save={saveVue} />}
        {tabAutorise === "factures" && <Factures data={dataVue} save={saveVue} />}
        {tabAutorise === "travaux" && <Travaux data={dataVue} save={saveVue} moi={moi} />}
        {tabAutorise === "prestataires" && <Prestataires data={dataVue} save={saveVue} />}
        {tabAutorise === "agents" && <Agents data={dataVue} save={saveVue} />}
        {tabAutorise === "cagnotte" && <CagnotteProprietaires data={dataVue} />}
        {tabAutorise === "commissions" && <Commissions data={dataVue} save={saveVue} moi={moi} />}
        {tabAutorise === "caisse" && <Caisse data={dataVue} save={saveVue} moi={moi} c={c} />}
        {tabAutorise === "meubles" && <StudiosMeubles data={dataVue} save={saveVue} moi={moi} c={c} />}
        {tabAutorise === "crm" && <CRM data={dataVue} save={saveVue} moi={moi} c={c} />}
        {tabAutorise === "diffusion" && <Diffusion data={dataVue} save={saveVue} moi={moi} />}
        {tabAutorise === "conformite" && <Conformite data={dataVue} save={saveVue} moi={moi} />}
        {tabAutorise === "point" && <PointProprietaire data={dataVue} />}
        {tabAutorise === "journal" && <Journal journal={journal} moi={moi} />}
        {tabAutorise === "export" && <Export data={data} save={save} />}
        {tabAutorise === "parametres" && <Parametres data={data} save={save} moi={moi} />}
      </main>

      {toast && (
        <div className="fixed bottom-4 right-4 z-50 px-4 py-3 rounded shadow-lg text-sm max-w-xs sans-impression"
          style={{ background: C.ink, color: "#fff" }}>
          {toast}
        </div>
      )}
    </div>
  );
}

/* ============================== paramètres ================================ */

function Parametres({ data, save, moi }) {
  const P = data.parametres || PARAMS_DEFAUT;
  const [f, setF] = useState(P);
  const [msg, setMsg] = useState(null);
  const maj = (k, v) => setF({ ...f, [k]: v });
  const [nouvelEmail, setNouvelEmail] = useState("");
  const commerciaux = P.commerciaux || [];

  const ajouterCommercial = () => {
    const e = nouvelEmail.trim().toLowerCase();
    if (!e || !e.includes("@")) return;
    if (commerciaux.map((x) => x.toLowerCase()).includes(e)) { setNouvelEmail(""); return; }
    save({ ...data, parametres: { ...P, commerciaux: [...commerciaux, e] } }, "a ajouté un accès commercial : " + e);
    setNouvelEmail("");
  };
  const retirerCommercial = (e) => save({ ...data, parametres: { ...P, commerciaux: commerciaux.filter((x) => x !== e) } },
    "a retiré l'accès commercial : " + e);

  const accesCaisse = P.accesCaisse || [];
  const [nouvelEmailCaisse, setNouvelEmailCaisse] = useState("");
  const ajouterAccesCaisse = () => {
    const e = nouvelEmailCaisse.trim().toLowerCase();
    if (!e || !e.includes("@")) return;
    if (accesCaisse.map((x) => x.toLowerCase()).includes(e)) { setNouvelEmailCaisse(""); return; }
    save({ ...data, parametres: { ...P, accesCaisse: [...accesCaisse, e] } }, "a donné l'accès caisse à : " + e);
    setNouvelEmailCaisse("");
  };
  const retirerAccesCaisse = (e) => save({ ...data, parametres: { ...P, accesCaisse: accesCaisse.filter((x) => x !== e) } },
    "a retiré l'accès caisse : " + e);

  const chargerLogo = async (file) => {
    if (!file) return;
    try { setF({ ...f, logo: await fichierVersDataUrl(file, 320, 0.85) }); setMsg(null); }
    catch (e) { setMsg({ t: "bad", m: "Ce fichier image n'a pas pu être lu. Essayez un PNG ou un JPEG." }); }
  };

  const enregistrer = () => {
    save({ ...data, parametres: f }, "a modifié l'en-tête de l'agence");
    setMsg({ t: "ok", m: "En-tête enregistré et partagé avec l'équipe." });
  };

  return (
    <div>
      <Head title="Paramètres" sub="Logo et en-tête utilisés sur tous vos documents" />
      <div className="grid lg:grid-cols-2 gap-4">
        <div className={card} style={{ borderColor: C.line }}>
          <div className="px-4 py-3 border-b" style={{ borderColor: C.line }}>
            <h3 className="text-sm font-semibold" style={{ color: C.ink }}>Identité de l'agence</h3></div>
          <div className="p-4 space-y-3">
            <Field label="Logo">
              <div className="flex items-center gap-3">
                <div className="h-16 w-16 rounded border flex items-center justify-center shrink-0 overflow-hidden bg-white" style={{ borderColor: C.line }}>
                  {f.logo ? <img src={f.logo} alt="Logo" className="max-h-full max-w-full object-contain" />
                    : <span className="text-[10px] text-center px-1" style={{ color: C.mute }}>Aucun logo</span>}
                </div>
                <div className="flex flex-col gap-2">
                  <label className="inline-flex items-center px-3 py-2 rounded text-sm font-medium cursor-pointer" style={{ background: C.green, color: "#fff" }}>
                    Choisir une image
                    <input type="file" accept="image/*" className="hidden"
                      onChange={(e) => { const x = e.target.files && e.target.files[0]; e.target.value = ""; chargerLogo(x); }} />
                  </label>
                  {f.logo && <button onClick={() => maj("logo", "")} className="text-xs font-semibold text-left" style={{ color: C.clay }}>Retirer le logo</button>}
                </div>
              </div>
            </Field>
            <Field label="Nom de la société"><Input value={f.societe} onChange={(e) => maj("societe", e.target.value)} /></Field>
            <Field label="Mention sous le nom"><Input value={f.slogan} onChange={(e) => maj("slogan", e.target.value)} placeholder="Gestion locative · Abidjan" /></Field>
            <Field label="Adresse"><Input value={f.adresse} onChange={(e) => maj("adresse", e.target.value)} /></Field>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Téléphone"><Input value={f.tel} onChange={(e) => maj("tel", e.target.value)} /></Field>
              <Field label="Email"><Input value={f.email} onChange={(e) => maj("email", e.target.value)} /></Field>

function Finances({ data }) {
  const anneeActuelle = new Date().getFullYear();
  const [annee, setAnnee] = useState(anneeActuelle);
  const P = data.parametres || PARAMS_DEFAUT;

  const MOIS_COURTS = ["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];

  const stats = useMemo(() => {
    const moisAnnee = Array.from({ length: 12 }, (_, i) => annee + "-" + String(i + 1).padStart(2, "0"));
    // On ne compte que les encaissements VALIDÉS
    const payesAnnee = data.paiements.filter((p) => p.valide && p.mois && p.mois.slice(0, 4) === String(annee));

    // Revenus (commission agence) et loyers bruts par mois
    const parMois = moisAnnee.map((m) => {
      const ps = payesAnnee.filter((p) => p.mois === m);
      const brut = ps.reduce((s, p) => s + Number(p.montant || 0), 0);
      const com = ps.reduce((s, p) => {
        const b = data.biens.find((x) => x.id === p.bienId);
        return s + commissionBien(b, p.montant);
      }, 0);
      return { mois: m, brut, com };
    });

    const totalBrut = parMois.reduce((s, x) => s + x.brut, 0);
    const totalCom = parMois.reduce((s, x) => s + x.com, 0);

    // Charges de l'année (factures dont l'échéance ou la date tombe dans l'année, sinon toutes non payées)
    const charges = data.factures.filter((fc) => {
      const d = fc.echeance || fc.date || "";
      return d ? d.slice(0, 4) === String(annee) : true;
    });
    const totalCharges = charges.reduce((s, fc) => s + Number(fc.montant || 0), 0);

    // Répartition par bien
    const parBien = data.biens.map((b) => {
      const ps = payesAnnee.filter((p) => p.bienId === b.id);
      const brut = ps.reduce((s, p) => s + Number(p.montant || 0), 0);
      const com = commissionBien(b, brut);
      return { nom: b.nom, quartier: extraireQuartier(b.adresse), brut, com };
    }).filter((x) => x.brut > 0).sort((a, b) => b.brut - a.brut);

    // Répartition par quartier
    const quartiers = {};
    parBien.forEach((b) => { const q = b.quartier || "Non précisé"; quartiers[q] = (quartiers[q] || 0) + b.brut; });
    const parQuartier = Object.entries(quartiers).map(([nom, val]) => ({ nom, val })).sort((a, b) => b.val - a.val);

    // Taux d'occupation actuel
    const occ = new Set(data.locataires.filter((l) => l.actif !== false).map((l) => l.bienId));
    const nbBiens = data.biens.length;
    const tauxOcc = nbBiens ? Math.round(occ.size / nbBiens * 100) : 0;

    // Loyer potentiel mensuel (tous biens occupés) vs réellement encaissé (dernier mois plein)
    const potentielMensuel = data.biens.filter((b) => occ.has(b.id)).reduce((s, b) => s + Number(b.loyer || 0), 0);

    // Meilleur mois
    const meilleur = [...parMois].sort((a, b) => b.brut - a.brut)[0];

    return { parMois, totalBrut, totalCom, totalCharges, parBien, parQuartier, tauxOcc,
      nbBiens, nbOccupes: occ.size, potentielMensuel, meilleur, resultat: totalCom - totalCharges };
  }, [data, annee]);

  const maxMois = Math.max(...stats.parMois.map((x) => x.brut), 1);

  return (
    <div>
      <Head title="Analyse financière" sub="Pilotage des revenus, charges et performance du portefeuille"
        action={
          <div className="flex items-center gap-2">
            <button onClick={() => setAnnee(annee - 1)} className="px-2.5 py-1.5 rounded border text-sm" style={{ borderColor: C.line, color: C.ink }}>‹</button>
            <input type="number" value={annee} onChange={(e) => setAnnee(Number(e.target.value) || annee)} className="w-20 px-2 py-1.5 text-center font-bold tabular-nums rounded border bg-white outline-none" style={{ borderColor: C.line, color: C.ink }} />
            <button onClick={() => setAnnee(annee + 1)} className="px-2.5 py-1.5 rounded border text-sm" style={{ borderColor: C.line, color: C.ink }}>›</button>
          </div>
        } />

      {/* Indicateurs clés */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
        <StatFin label="Loyers encaissés (validés)" value={fcfa(stats.totalBrut)} tone="ink" sub="sur l'année" />
        <StatFin label="Revenus d'agence" value={fcfa(stats.totalCom)} tone="green" sub="commissions perçues" />
        <StatFin label="Charges" value={fcfa(stats.totalCharges)} tone="clay" sub="factures de l'année" />
        <StatFin label="Résultat net" value={fcfa(stats.resultat)} tone={stats.resultat >= 0 ? "green" : "clay"} sub="revenus − charges" />
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
        <StatFin label="Taux d'occupation" value={stats.tauxOcc + " %"} tone="gold" sub={stats.nbOccupes + " / " + stats.nbBiens + " biens"} />
        <StatFin label="Loyers potentiels / mois" value={fcfa(stats.potentielMensuel)} tone="ink" sub="biens occupés" />
        <StatFin label="Meilleur mois" value={stats.meilleur && stats.meilleur.brut ? MOIS_COURTS[Number(stats.meilleur.mois.slice(5)) - 1] : "—"}
          tone="green" sub={stats.meilleur && stats.meilleur.brut ? fcfa(stats.meilleur.brut) : "aucun encaissement"} />
        <StatFin label="Biens productifs" value={String(stats.parBien.length)} tone="ink" sub="ont généré des loyers" />
      </div>

      {/* Graphique revenus par mois */}
      <div className={card + " mb-6"} style={{ borderColor: C.line }}>
        <div className="px-4 py-3 border-b" style={{ borderColor: C.line }}>
          <h3 className="text-sm font-semibold" style={{ color: C.ink }}>Loyers encaissés par mois — {annee}</h3></div>
        <div className="p-4">
          {stats.totalBrut === 0 ? <p className="text-sm py-8 text-center" style={{ color: C.mute }}>Aucun encaissement validé sur {annee}.</p>
            : <div className="flex items-end gap-1.5 sm:gap-2" style={{ height: 200 }}>
                {stats.parMois.map((x, i) => (
                  <div key={i} className="flex-1 flex flex-col items-center gap-1 h-full justify-end">
                    <div className="text-[9px] tabular-nums" style={{ color: C.mute }}>{x.brut ? Math.round(x.brut / 1000) + "k" : ""}</div>
                    <div className="w-full rounded-t garder-couleur" title={fcfa(x.brut)}
                      style={{ height: (x.brut / maxMois * 160) + "px", minHeight: x.brut ? 3 : 0, background: C.greenVif }}></div>
                    <div className="text-[9px]" style={{ color: C.mute }}>{MOIS_COURTS[i]}</div>
                  </div>))}
              </div>}
        </div>
      </div>

      <div className="grid lg:grid-cols-2 gap-6 mb-6">
        {/* Top biens */}
        <div className={card} style={{ borderColor: C.line }}>
          <div className="px-4 py-3 border-b" style={{ borderColor: C.line }}>
            <h3 className="text-sm font-semibold" style={{ color: C.ink }}>Revenus par bien</h3></div>
          <div className="p-4">
            {stats.parBien.length === 0 ? <p className="text-sm" style={{ color: C.mute }}>Aucune donnée.</p>
              : <div className="space-y-2.5">
                  {stats.parBien.slice(0, 8).map((b, i) => {
                    const pct = Math.round(b.brut / stats.parBien[0].brut * 100);
                    return (
                      <div key={i}>
                        <div className="flex justify-between text-xs mb-1">
                          <span style={{ color: C.ink }}>{b.nom}</span>
                          <span className="tabular-nums" style={{ color: C.mute }}>{fcfa(b.brut)}</span></div>
                        <div className="h-2 rounded" style={{ background: "#F0EEE4" }}>
                          <div className="h-2 rounded garder-couleur" style={{ width: pct + "%", background: C.green }}></div></div>
                      </div>);
                  })}
                </div>}
          </div>
        </div>

        {/* Par quartier */}
        <div className={card} style={{ borderColor: C.line }}>
          <div className="px-4 py-3 border-b" style={{ borderColor: C.line }}>
            <h3 className="text-sm font-semibold" style={{ color: C.ink }}>Revenus par quartier / commune</h3></div>
          <div className="p-4">
            {stats.parQuartier.length === 0 ? <p className="text-sm" style={{ color: C.mute }}>Renseignez les adresses des biens pour voir cette répartition.</p>
              : <div className="space-y-2.5">
                  {stats.parQuartier.map((q, i) => {
                    const pct = Math.round(q.val / stats.parQuartier[0].val * 100);
                    return (
                      <div key={i}>
                        <div className="flex justify-between text-xs mb-1">
                          <span style={{ color: C.ink }}>{q.nom}</span>
                          <span className="tabular-nums" style={{ color: C.mute }}>{fcfa(q.val)}</span></div>
                        <div className="h-2 rounded" style={{ background: "#F0EEE4" }}>
                          <div className="h-2 rounded garder-couleur" style={{ width: pct + "%", background: C.gold }}></div></div>
                      </div>);
                  })}
                </div>}
          </div>
        </div>
      </div>

      {/* Synthèse commission vs charges */}
      <div className={card} style={{ borderColor: C.line }}>
        <div className="px-4 py-3 border-b" style={{ borderColor: C.line }}>
          <h3 className="text-sm font-semibold" style={{ color: C.ink }}>Résultat de l'agence — {annee}</h3></div>
        <div className="p-4">
          <table className="w-full text-sm">
            <tbody>
              <tr className="border-b" style={{ borderColor: C.line }}>
                <td className="py-2.5" style={{ color: C.mute }}>Commissions perçues (revenus d'agence)</td>
                <td className="py-2.5 text-right tabular-nums font-semibold" style={{ color: C.green }}>{fcfa(stats.totalCom)}</td></tr>
              <tr className="border-b" style={{ borderColor: C.line }}>
                <td className="py-2.5" style={{ color: C.mute }}>Charges et factures</td>
                <td className="py-2.5 text-right tabular-nums" style={{ color: C.clay }}>- {fcfa(stats.totalCharges)}</td></tr>
              <tr>
                <td className="py-3 font-bold" style={{ color: C.ink }}>Résultat net</td>
                <td className="py-3 text-right tabular-nums font-bold text-base" style={{ color: stats.resultat >= 0 ? C.green : C.clay }}>{fcfa(stats.resultat)}</td></tr>
            </tbody>
          </table>
          <p className="text-xs mt-3" style={{ color: C.mute }}>
            Analyse basée uniquement sur les encaissements validés. Les loyers en attente de validation ne sont pas comptés, pour refléter votre situation réelle.
          </p>
        </div>
      </div>
    </div>
  );
}

function StatFin({ label, value, tone, sub }) {
  const fg = { green: C.green, clay: C.clay, gold: C.gold, ink: C.ink }[tone] || C.ink;
  return (
    <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
      <div style={{ height: 4, background: fg }}></div>
      <div className="p-4">
        <Label>{label}</Label>
        <div className="text-lg font-bold tabular-nums leading-tight" style={{ color: fg }}>{value}</div>
        {sub && <div className="text-[10px] mt-0.5" style={{ color: C.mute }}>{sub}</div>}
      </div>
    </div>
  );
}

// Extrait un quartier/commune depuis une adresse (heuristique simple)
function extraireQuartier(adresse) {
  if (!adresse) return "";
  const communes = ["Cocody","Riviera","Angré","Plateau","Marcory","Treichville","Yopougon","Abobo","Adjamé",
    "Koumassi","Port-Bouët","Attécoubé","Bingerville","Bonoumin","Deux Plateaux","Zone 4","Palmeraie","Faya","Rosier","Bonoua","Grand-Bassam"];
  const found = communes.find((c) => adresse.toLowerCase().includes(c.toLowerCase()));
  if (found) return found;
  // sinon, premier segment avant une virgule
  const seg = adresse.split(",")[0].trim();
  return seg.length > 20 ? seg.slice(0, 20) + "…" : seg;
}

            <h3 className="text-sm font-semibold" style={{ color: C.ink }}>Loyers non encaissés</h3>
            {retards.length > 0 && <Tag tone="bad">{retards.length}</Tag>}</div>
          {retards.length === 0 ? <p className="p-4 text-sm" style={{ color: C.mute }}>Tous les loyers du mois sont encaissés.</p>
            : <ul className="divide-y" style={{ borderColor: C.line }}>
                {retards.slice(0, 6).map((r) => (
                  <li key={r.id} className="px-4 py-2.5 flex items-center justify-between text-sm gap-3">
                    <div><div style={{ color: C.ink }}>{r.nom}</div>
                      <div className="text-xs" style={{ color: C.mute }}>{r.bien.nom}</div></div>
                    <span className="font-semibold tabular-nums" style={{ color: C.clay }}>{fcfa(r.bien.loyer)}</span>
                  </li>))}
              </ul>}
          {retards.length > 0 && <div className="px-4 py-3 border-t" style={{ borderColor: C.line }}>
            <Btn variant="ghost" onClick={() => go("loyers")}>Encaisser un loyer →</Btn></div>}
        </div>
      </div>

      <div className={card} style={{ borderColor: C.line }}>
        <div className="px-4 py-3 border-b flex items-center justify-between" style={{ borderColor: C.line }}>
          <h3 className="text-sm font-semibold" style={{ color: C.ink }}>Dernières actions de l'équipe</h3>
          <button onClick={() => go("journal")} className="text-xs font-semibold" style={{ color: C.green }}>Tout voir</button>
        </div>
        {journal.length === 0 ? <p className="p-4 text-sm" style={{ color: C.mute }}>Aucune activité pour l'instant.</p>
          : <ul className="divide-y" style={{ borderColor: C.line }}>
              {journal.slice(0, 5).map((e) => (
                <li key={e.id} className="px-4 py-2.5 text-sm">
                  <span style={{ color: C.ink }}>{e.action}</span>
                  <span className="text-xs" style={{ color: C.mute }}> — {e.qui}, {dateHeure(e.le)}</span>
                </li>))}
            </ul>}
      </div>
    </div>
  );
}

// Stocke des fichiers (base64) dans la table photos, clé texte libre (etat_id).

function lireFichier(file, maxImg, q) {
  return new Promise((resolve, reject) => {
    const est_image = (file.type || "").startsWith("image/");
    const r = new FileReader();
    r.onerror = () => reject(new Error("x"));
    if (est_image) {
      r.onload = () => { const img = new Image();
        img.onload = () => resolve({ nom: file.name, type: file.type, taille: file.size, url: dessiner(img, img.naturalWidth, img.naturalHeight, maxImg || 1400, q || 0.7) });
        img.onerror = () => reject(new Error("x")); img.src = r.result; };
      r.readAsDataURL(file);
    } else {
      r.onload = () => resolve({ nom: file.name, type: file.type, taille: file.size, url: r.result });
      r.readAsDataURL(file);
    }
  });
}

function PiecesJointes({ cle, c, verrouille }) {
  const [fichiers, setFichiers] = useState([]);
  const [chargement, setChargement] = useState(true);
  const [erreur, setErreur] = useState(null);
  const [apercu, setApercu] = useState(null);

  // Chaque pièce jointe est stockée dans sa propre ligne (clé « cle#idFichier »).
  // Ancien format : une seule ligne « cle » contenant tout — migré automatiquement au chargement.
  useEffect(() => {
    (async () => {
      setChargement(true);
      try {
        const [{ data: ancien }, { data: lignes }] = await Promise.all([
          c.from("photos").select("data").eq("etat_id", cle).maybeSingle(),
          c.from("photos").select("etat_id, data").like("etat_id", cle + "#%"),
        ]);
        const individuels = (lignes || []).map((r) => r.data && r.data.fichier).filter(Boolean);
        const anciens = (ancien && ancien.data && ancien.data.fichiers) || [];
        setFichiers([...anciens, ...individuels]);
        // Migration silencieuse de l'ancien format vers une ligne par fichier
        if (anciens.length) {
          (async () => {
            try {
              for (const f of anciens) {
                await c.from("photos").upsert({ etat_id: cle + "#" + (f.id || uid()), data: { fichier: f } });
              }
              await c.from("photos").delete().eq("etat_id", cle);
            } catch (e) { /* la migration réessaiera au prochain chargement */ }
          })();
        }
      } catch (e) { setFichiers([]); }
      setChargement(false);
    })();
  }, [cle]);

  // Écrit un seul fichier : l'opération reste courte quel que soit le nombre de pièces déjà présentes
  const sauverUn = async (f) => {
    const { error } = await c.from("photos").upsert({ etat_id: cle + "#" + f.id, data: { fichier: f } });
    if (error) throw error;
  };

  const ajouter = async (fileList) => {
    // Capturer immédiatement les fichiers dans un tableau (avant tout re-render)
    const arr = [];
    if (fileList && fileList.length) { for (let i = 0; i < fileList.length; i++) arr.push(fileList[i]); }
    if (arr.length === 0) { setErreur("Aucun fichier reçu. Réessayez, et si le fichier vient d'iCloud, ouvrez-le une fois pour le télécharger."); return; }
    // Chaque fichier est enregistré séparément : un échec n'annule pas les autres
    let ajoutes = 0;
    for (let i = 0; i < arr.length; i++) {
      const file = arr[i];
      setErreur("Fichier " + (i + 1) + " sur " + arr.length + " — traitement…");
      if (!file || file.size === 0) { setErreur("Le fichier « " + (file ? file.name : "?") + " » est vide (peut-être pas téléchargé sur l'appareil). Ouvrez-le une fois puis réessayez."); return; }
      if (file.size > 4000000) {
        setErreur("« " + file.name + " » fait " + (file.size / 1000000).toFixed(1) + " Mo, au-delà de la limite de 4 Mo par pièce. "
          + "Compressez le PDF (outil « compresser PDF » en ligne) ou photographiez le document, puis réessayez.");
        return;
      }
      const estImg = (file.type || "").startsWith("image/");
      let f;
      try {
        if (estImg) { f = await lireFichier(file, 1100, 0.6); }
        else { f = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res({ nom: file.name, type: file.type || "application/octet-stream", taille: file.size, url: r.result }); r.onerror = () => rej(new Error("lecture")); r.readAsDataURL(file); }); }
      }
      catch (e) { setErreur("Le fichier « " + file.name + " » n'a pas pu être lu (" + (e && e.message ? e.message : "erreur") + ")."); return; }

      const rec = { id: uid(), ...f };
      setErreur("Fichier " + (i + 1) + " sur " + arr.length + " — enregistrement…");
      try {
        await sauverUn(rec);
        ajoutes++;
        setFichiers((prev) => [...prev, rec]);
      }
      catch (e) {
        const msg = String((e && e.message) || "erreur inconnue");
        setErreur(msg.indexOf("timeout") >= 0
          ? "« " + file.name + " » est trop volumineux pour être enregistré. Compressez-le puis réessayez."
            + (ajoutes ? " Les " + ajoutes + " fichier(s) précédent(s) ont bien été enregistrés." : "")
          : "Enregistrement impossible : " + msg + ".");
        return;
      }
    }
    setErreur(null);
  };

  const supprimer = async (id) => {
    try {
      await c.from("photos").delete().eq("etat_id", cle + "#" + id);
      setFichiers((prev) => prev.filter((x) => x.id !== id));
    } catch (e) { setErreur("Suppression impossible : " + ((e && e.message) || "erreur") + "."); }
  };

  const estImage = (f) => (f.type || "").startsWith("image/");
  const ko = (n) => n ? (n > 1000000 ? (n / 1000000).toFixed(1) + " Mo" : Math.round(n / 1000) + " Ko") : "";

  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <Label>Pièces jointes ({fichiers.length})</Label>
        {!verrouille && (
          <button type="button" onClick={() => { const el = document.getElementById("pj-input-" + cle); if (el) el.click(); }}
            className="text-xs font-semibold cursor-pointer sans-impression" style={{ color: C.green }}>
            + Ajouter un fichier
          </button>
        )}
      </div>
      <input id={"pj-input-" + cle} name={"pj-input-" + cle} type="file" multiple style={{ display: "none" }}
        accept="image/*,application/pdf"
        onChange={(e) => { const fl = e.target.files; ajouter(fl); e.target.value = ""; }} />
      {erreur && <div className="mb-2 px-3 py-2 rounded text-xs" style={{ background: C.claySoft, color: C.clay }}>{erreur}</div>}
      {chargement ? <p className="text-sm" style={{ color: C.mute }}>Chargement des fichiers…</p>
        : fichiers.length === 0 ? <p className="text-sm" style={{ color: C.mute }}>Aucun fichier. Ajoutez le titre foncier, le bail, l'attestation, des photos…</p>
        : <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
            {fichiers.map((f) => (
              <div key={f.id} className="relative border rounded overflow-hidden" style={{ borderColor: C.line }}>
                {estImage(f)
                  ? <img src={f.url} alt={f.nom} onClick={() => setApercu(f)} className="w-full h-24 object-cover cursor-pointer" />
                  : <a href={f.url} download={f.nom} className="flex flex-col items-center justify-center h-24 p-2 text-center" style={{ background: "#F5F4EE" }}>
                      <span className="text-2xl">📄</span>
                      <span className="text-[10px] mt-1 line-clamp-2" style={{ color: C.ink }}>{f.nom}</span>
                    </a>}
                <div className="px-1.5 py-1 flex items-center justify-between gap-1">
                  <span className="text-[10px] truncate" style={{ color: C.mute }}>{ko(f.taille)}</span>
                  <div className="flex gap-1.5 items-center">
                    <a href={f.url} download={f.nom} className="text-[10px] font-semibold" style={{ color: C.green }}>↓</a>
                    {!verrouille && <button onClick={() => supprimer(f.id)} className="text-[10px] font-semibold" style={{ color: C.clay }}>✕</button>}
                  </div>
                </div>
              </div>))}
          </div>}
      {apercu && <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sans-impression"
        style={{ background: "rgba(14,23,18,0.85)" }} onClick={() => setApercu(null)}>
        <img src={apercu.url} alt={apercu.nom} className="max-w-full max-h-full rounded" /></div>}
    </div>
  );
}

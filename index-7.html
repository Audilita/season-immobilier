        </div>
      )}

      {/* ===== MODALE AJOUT / ÉDITION ===== */}
      {open && (
        <Modal title={editId ? "Modifier le prospect" : "Nouveau prospect"} onClose={() => setOpen(false)} wide>
          <div className="space-y-4">
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Nom du client"><Input value={f.nom} onChange={(e) => setF({ ...f, nom: e.target.value })} /></Field>
              <Field label="Téléphone"><Input value={f.tel} onChange={(e) => setF({ ...f, tel: e.target.value })} /></Field>
              <Field label="Email"><Input value={f.email} onChange={(e) => setF({ ...f, email: e.target.value })} /></Field>
              <Field label="Recherche">
                <Select value={f.recherche} onChange={(e) => setF({ ...f, recherche: e.target.value })}>
                  {CRM_RECHERCHE.map((x) => <option key={x}>{x}</option>)}
                </Select>
              </Field>
              <Field label="Type de bien recherché">
                <Select value={f.typeBien} onChange={(e) => setF({ ...f, typeBien: e.target.value })}>
                  {CRM_TYPES_BIEN.map((x) => <option key={x}>{x}</option>)}
                </Select>
              </Field>
              <Field label="Budget (F CFA)"><Input type="number" value={f.budget} onChange={(e) => setF({ ...f, budget: e.target.value })} placeholder="Loyer ou prix visé" /></Field>
              <Field label={"Profession / activité" + (f.recherche === "Achat" ? " (obligatoire)" : "")}>
                <Input value={f.profession} onChange={(e) => setF({ ...f, profession: e.target.value })} placeholder="Commerçant, fonctionnaire, cadre…" /></Field>
              <Field label="Quartier / zone souhaitée"><Input value={f.quartier} onChange={(e) => setF({ ...f, quartier: e.target.value })} placeholder="Cocody, Riviera…" /></Field>
              <Field label="Bien de l'agence qui l'intéresse">
                <Select value={f.bienId} onChange={(e) => setF({ ...f, bienId: e.target.value })}>
                  <option value="">— Aucun / à définir —</option>
                  {data.biens.map((b) => <option key={b.id} value={b.id}>{b.unite || b.nom}</option>)}
                </Select>
              </Field>
              <Field label="Statut">
                <Select value={f.statut} onChange={(e) => setF({ ...f, statut: e.target.value })}>
                  {CRM_STATUTS.map(([k, lab]) => <option key={k} value={k}>{lab}</option>)}
                </Select>
              </Field>
              <Field label="Prochaine relance (date)"><Input type="date" value={f.prochaineRelance} onChange={(e) => setF({ ...f, prochaineRelance: e.target.value })} /></Field>
              <Field label="Heure de relance"><Input type="time" value={f.relanceHeure} onChange={(e) => setF({ ...f, relanceHeure: e.target.value })} /></Field>
            </div>
            {suisGerante && (
              <Field label="Nom de l'agent en charge"><Input value={f.agentNom} onChange={(e) => setF({ ...f, agentNom: e.target.value })} placeholder="KOUASSI Jean" /></Field>
              <Field label="Email de l'agent"><Input value={f.agent} onChange={(e) => setF({ ...f, agent: e.target.value })} placeholder="commercial@season-immobilier.com" /></Field>
              <Field label="Qualité du prospect">
                <Select value={f.qualite} onChange={(e) => setF({ ...f, qualite: e.target.value })}>
                  <option value="">À qualifier</option>
                  <option value="bon">Bon prospect</option>
                  <option value="mauvais">Mauvais prospect (écarté)</option>
                </Select></Field>
              {f.qualite === "mauvais" && (
                <Field label="Motif de l'écartement"><Input value={f.motifQualite} onChange={(e) => setF({ ...f, motifQualite: e.target.value })}
                  placeholder="Budget irréaliste, injoignable…" /></Field>
              )}
            )}
            <Field label="Note / besoin du client"><Textarea value={f.note} onChange={(e) => setF({ ...f, note: e.target.value })} placeholder="Ex : cherche 3 pièces avec parking, emménagement septembre…" /></Field>
            <div className="flex gap-2 pt-1">
              <Btn variant="accent" onClick={enregistrer}>{editId ? "Enregistrer" : "Ajouter le prospect"}</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}

      {/* ===== MODALE FICHE PROSPECT ===== */}
      {ficheId && (() => {
        const p = prospects.find((x) => x.id === ficheId);
        if (!p) return null;
        const j = joursDepuis(p.dateContact);
        return (
          <Modal title={p.nom} onClose={() => setFicheId(null)} wide>
            <div className="space-y-4">
              {ecarte(p) && (
                <div className="px-4 py-2.5 rounded text-sm garder-couleur" style={{ background: "#FDECEC", color: C.clay }}>
                  <b>Prospect écarté</b>{p.motifQualite ? " — " + p.motifQualite : ""}. Il n'apparaît plus dans le pipeline
                  ni dans les alertes, et ne compte pas dans le calcul des primes.
                </div>
              )}

              <div className="flex items-center gap-2 flex-wrap">
                <Tag tone={statutToneCRM(p.statut)}>{statutLabelCRM(p.statut)}</Tag>
                {p.qualite === "bon" && <Tag tone="ok">Bon prospect</Tag>}
                {ecarte(p) && <Tag tone="bad">Écarté</Tag>}
                <span className="text-xs" style={{ color: C.mute }}>{p.recherche}{p.typeBien ? " · " + p.typeBien : ""}</span>
                {j !== null && <span className="text-xs" style={{ color: j >= SEUIL_NON_TRAITE ? C.gold : C.mute }}>· dernier contact il y a {j} j</span>}
              </div>

              <div>
                <Label>Qualification</Label>
                <div className="flex gap-1.5 flex-wrap">
                  {[["", "À qualifier"], ["bon", "Bon prospect"], ["mauvais", "Mauvais prospect"]].map(([k, lab]) => (
                    <button key={k} onClick={() => qualifier(p, k)} className="px-2.5 py-1 rounded text-xs font-medium"
                      style={{ background: (p.qualite || "") === k ? (k === "mauvais" ? C.clay : k === "bon" ? C.green : C.ink) : "transparent",
                        color: (p.qualite || "") === k ? "#fff" : C.mute, border: "1px solid " + C.line }}>{lab}</button>))}
                </div>
              </div>

              <div className="grid sm:grid-cols-2 gap-3 text-sm">
                <div><Label>Téléphone</Label><span style={{ color: C.ink }}>{p.tel || "—"}</span></div>
                <div><Label>Email</Label><span style={{ color: C.ink }}>{p.email || "—"}</span></div>
                <div><Label>Profession</Label><span style={{ color: p.profession ? C.ink : (p.recherche === "Achat" ? C.clay : C.mute) }}>
                  {p.profession || (p.recherche === "Achat" ? "À renseigner (obligatoire)" : "—")}</span></div>
                <div><Label>Budget</Label><span style={{ color: C.ink }}>{p.budget ? fcfa(p.budget) : "—"}</span></div>
                <div><Label>Quartier</Label><span style={{ color: C.ink }}>{p.quartier || "—"}</span></div>
                <div><Label>Agent en charge</Label><span style={{ color: C.ink }}>{p.agentNom || nomAgent(p.agent)}</span>
                  {p.agent && <span className="block text-[11px]" style={{ color: C.mute }}>{p.agent}</span>}</div>
                <div><Label>Prochaine relance</Label><span style={{ color: C.ink }}>
                  {p.prochaineRelance ? dateLongue(p.prochaineRelance) + (p.relanceHeure ? " à " + p.relanceHeure : "") : "—"}</span></div>
                <div><Label>Bien lié</Label><span style={{ color: C.ink }}>{nomBien(p.bienId) || "—"}</span></div>
              </div>
              {p.note && <div><Label>Note</Label><p className="text-sm" style={{ color: C.ink }}>{p.note}</p></div>}

              {/* Changement rapide de statut */}
              <div>
                <Label>Faire évoluer le statut</Label>
                <div className="flex gap-1.5 flex-wrap">
                  {CRM_STATUTS.map(([k, lab]) => (
                    <button key={k} onClick={() => changerStatut(p, k)} className="px-2.5 py-1 rounded text-xs font-medium"
                      style={{ background: p.statut === k ? C.ink : "transparent", color: p.statut === k ? "#fff" : C.mute, border: "1px solid " + C.line }}>{lab}</button>))}
                </div>
              </div>

              {/* Actions */}
              <div className="flex gap-2 flex-wrap">
                <Btn variant="accent" onClick={() => ouvrirWhatsApp(p.tel, messageRelance(p))}>WhatsApp relance</Btn>
                {p.email && <Btn variant="ghost" onClick={() => ouvrirMail(p.email, "Votre recherche de bien", messageRelance(p))}>Email</Btn>}
                <Btn variant="ghost" onClick={() => setVisiteEnCours({ prospectId: p.id })}>+ Visite</Btn>
                <Btn variant="ghost" onClick={() => { setFicheId(null); modifier(p); }}>Modifier</Btn>
                <Btn variant="danger" onClick={() => { setFicheId(null); supprimer(p); }}>Supprimer</Btn>
              </div>

              {/* Visites */}
              <div>
                <div className="flex items-center justify-between">
                  <Label>Visites ({(p.visites || []).length})</Label>
                  <button onClick={() => setVisiteEnCours({ prospectId: p.id })} className="text-xs font-semibold" style={{ color: C.green }}>+ Enregistrer une visite</button>
                </div>
                {(p.visites || []).length === 0
                  ? <p className="text-xs" style={{ color: C.clay }}>Aucune visite effectuée.</p>
                  : <div className="space-y-2 mt-1">{[...(p.visites || [])].reverse().map((v) => {
                      const sat = v.satisfaction;
                      return (
                        <div key={v.id} className="rounded p-2.5" style={{ border: "1px solid " + (v.bonVisite ? C.line : C.clay), background: v.bonVisite ? "#fff" : "#FDECEC" }}>
                          <div className="flex items-start justify-between gap-2 flex-wrap">
                            <div className="text-xs" style={{ color: C.ink }}>
                              <b>{v.bien || "bien non précisé"}</b>
                              <div style={{ color: C.mute }}>{dateLongue(v.date)}{v.heureRdv ? " · rendez-vous à " + v.heureRdv : ""}</div>
                            </div>
                            {v.bonVisite
                              ? <Tag tone="ok">Bon de visite reçu</Tag>
                              : <Tag tone="bad">Bon de visite manquant</Tag>}
                          </div>

                          <div className="flex gap-2 flex-wrap mt-2">
                            <button onClick={() => marquerBonVisite(p, v.id, !v.bonVisite)} className="text-xs font-semibold"
                              style={{ color: v.bonVisite ? C.mute : C.green }}>
                              {v.bonVisite ? "Retirer le bon" : "Confirmer le bon de visite"}</button>
                            {p.tel && <button onClick={() => ouvrirWhatsApp(p.tel, messageSatisfaction(p, v))} className="text-xs font-semibold" style={{ color: C.green }}>
                              Demander son avis</button>}
                            <button onClick={() => setVisiteEnCours({ prospectId: p.id, visiteId: v.id, satisfaction: true })} className="text-xs font-semibold" style={{ color: C.ink }}>
                              {sat ? "Modifier l'avis" : "Saisir l'avis client"}</button>
                          </div>

                          <div className="mt-2 pt-2" style={{ borderTop: "1px dashed " + C.line }}>
                            <Label>Pièce jointe — bon de visite signé</Label>
                            <PiecesJointes cle={"visite:" + v.id} c={c} />
                          </div>

                          {sat && (
                            <div className="mt-2 pt-2 text-xs" style={{ borderTop: "1px dashed " + C.line, color: C.ink }}>
                              <b>Avis du client</b> — note {sat.note}/5 ·
                              {sat.ponctuel === "oui" ? " commercial à l'heure" : sat.ponctuel === "non" ? " commercial en retard" : " ponctualité non précisée"}
                              {sat.avis ? <div style={{ color: C.mute }}>{sat.avis}</div> : null}
                            </div>
                          )}
                        </div>);
                    })}</div>}
              </div>

              {/* Échanges / historique */}
              <div>
                <Label>Historique des échanges</Label>
                <AjoutEchange onAdd={(t) => ajouterEchange(p, t)} />
                {(p.echanges || []).length === 0 ? <p className="text-xs mt-2" style={{ color: C.mute }}>Aucun échange noté.</p>
                  : <div className="space-y-1.5 mt-2">{[...(p.echanges || [])].reverse().map((e) => (
                      <div key={e.id} className="text-xs border-l-2 pl-2" style={{ borderColor: C.line, color: C.ink }}>
                        <span style={{ color: C.mute }}>{dateLongue(e.date)} · {nomAgent(e.par)}</span><br />{e.texte}</div>))}</div>}
              </div>
            </div>
          </Modal>
        );
      })()}

      {visiteEnCours && (() => {
        const p = prospects.find((x) => x.id === visiteEnCours.prospectId);
        if (!p) return null;
        const v = visiteEnCours.visiteId ? (p.visites || []).find((x) => x.id === visiteEnCours.visiteId) : null;
        return <FormVisite prospect={p} visite={v} satisfaction={!!visiteEnCours.satisfaction} biens={data.biens || []}
          onClose={() => setVisiteEnCours(null)}
          onSave={(vals) => {
            if (visiteEnCours.satisfaction && v) noterSatisfaction(p, v.id, vals);
            else enregistrerVisite(p, vals);
            setVisiteEnCours(null);
          }} />;
      })()}

      <p className="text-xs mt-4 sans-impression" style={{ color: C.mute }}>
        Astuce : la vue « À traiter » vous montre qui relancer et qui n'a pas encore visité. Les boutons WhatsApp et Email ouvrent un message déjà rédigé — vous n'avez qu'à l'envoyer.
      </p>
    </div>
  );
}


/* ---------- Formulaire de visite et d'avis client ---------- */
function FormVisite({ prospect, visite, satisfaction, biens, onClose, onSave }) {
  const [f, setF] = useState(satisfaction
    ? { ponctuel: (visite && visite.satisfaction && visite.satisfaction.ponctuel) || "",
        avis: (visite && visite.satisfaction && visite.satisfaction.avis) || "",
        note: (visite && visite.satisfaction && visite.satisfaction.note) || "" }
    : { bien: "", heureRdv: "", bonVisite: false });
  const maj = (k, v) => setF((x) => ({ ...x, [k]: v }));

  if (satisfaction) {
    return (
      <Modal title={"Avis du client — " + prospect.nom} onClose={onClose}>
        <div className="space-y-3">
          <p className="text-xs" style={{ color: C.mute }}>
            Saisissez ici les réponses données par le client. Le bouton « Demander son avis » envoie les questions
            par WhatsApp ; vous reportez ensuite ses réponses.
          </p>
          <Field label="Le commercial était-il à l'heure ?">
            <Select value={f.ponctuel} onChange={(e) => maj("ponctuel", e.target.value)}>
              <option value="">—</option><option value="oui">Oui, à l'heure</option><option value="non">Non, en retard</option>
            </Select></Field>
          <Field label="Comment le client a-t-il trouvé la visite ?">
            <Textarea rows={3} value={f.avis} onChange={(e) => maj("avis", e.target.value)}
              placeholder="Bien présenté, correspond à l'annonce, accueil…" /></Field>
          <Field label="Note du commercial (sur 5)">
            <Select value={f.note} onChange={(e) => maj("note", e.target.value)}>
              <option value="">—</option>
              {[1, 2, 3, 4, 5].map((n) => <option key={n} value={n}>{n} / 5</option>)}
            </Select></Field>
          <div className="flex gap-2 pt-1">
            <Btn variant="accent" onClick={() => {
              if (!f.note) { window.alert("La note du commercial est nécessaire."); return; }
              onSave({ ...f, note: Number(f.note) });
            }}>Enregistrer l'avis</Btn>
            <Btn variant="ghost" onClick={onClose}>Annuler</Btn>
          </div>
        </div>
      </Modal>
    );
  }

  return (
    <Modal title={"Nouvelle visite — " + prospect.nom} onClose={onClose}>
      <div className="space-y-3">
        <Field label="Bien visité">
          <Select value={f.bien} onChange={(e) => maj("bien", e.target.value)}>
            <option value="">— Choisir —</option>
            {biens.map((b) => <option key={b.id} value={b.nom}>{b.nom}</option>)}

/* ========================= studios meublés ============================== */

const TARIF_NUITEE = 30000;       // tarif courte durée par nuit
const TARIF_LONG = 20000;         // tarif long séjour (>= 14 nuits) par nuit
const SEUIL_LONG = 14;            // nombre de nuits à partir duquel le tarif long s'applique
const COURANT_MOIS = 30000;       // courant prépayé par mois (longs séjours)
const CAUTION_LONG = 100000;      // caution pour longs séjours
const TAUX_ARRHES = 40;           // arrhes en % (valeur par défaut, modifiable par réservation)

// Nombre de nuits entre deux dates (arrivée, départ)
function nbNuits(arrivee, depart) {
  if (!arrivee || !depart) return 0;
  const a = new Date(arrivee + "T00:00:00");
  const d = new Date(depart + "T00:00:00");
  const n = Math.round((d - a) / (1000 * 60 * 60 * 24));
  return n > 0 ? n : 0;
}

// Calcule le détail tarifaire d'une réservation
function calcResa(r) {
  const nuits = nbNuits(r.arrivee, r.depart);
  const estLong = nuits >= SEUIL_LONG;
  // Tarif : personnalisé si saisi, sinon automatique (long séjour ou nuitée)
  const tarifAuto = estLong ? TARIF_LONG : TARIF_NUITEE;
  const tarifPerso = (r.tarifNuit !== undefined && r.tarifNuit !== "" && r.tarifNuit !== null && Number(r.tarifNuit) > 0);
  const tarif = tarifPerso ? Number(r.tarifNuit) : tarifAuto;
  const hebergement = nuits * tarif;
  // Courant prépayé : par mois entamé, uniquement si coché (long séjour)
  const mois = estLong ? Math.max(1, Math.ceil(nuits / 30)) : 0;
  const courant = (estLong && r.courant) ? mois * COURANT_MOIS : 0;
  const caution = estLong ? CAUTION_LONG : 0;
  // Dépassement : nuitées supplémentaires facturées manuellement (sortie après 13h)
  const depassement = Number(r.depassement || 0) * tarif;
  const total = hebergement + courant + caution + depassement;
  const tauxArrhes = (r.tauxArrhes !== undefined && r.tauxArrhes !== "" && r.tauxArrhes !== null) ? Number(r.tauxArrhes) : TAUX_ARRHES;
  // Arrhes : soit un montant fixe saisi manuellement, soit le pourcentage
  const arrhes = (r.arrhesFixe !== undefined && r.arrhesFixe !== "" && r.arrhesFixe !== null && Number(r.arrhesFixe) > 0)
    ? Number(r.arrhesFixe)
    : Math.round((hebergement + courant) * tauxArrhes / 100);
  const arrhesManuelle = (r.arrhesFixe !== undefined && r.arrhesFixe !== "" && r.arrhesFixe !== null && Number(r.arrhesFixe) > 0);
  return { nuits, estLong, tarif, tarifPerso, hebergement, mois, courant, caution, depassement, total, tauxArrhes, arrhes, arrhesManuelle };
}

function StudiosMeubles({ data, save, moi, c }) {
  const [vue, setVue] = useState("studios"); // studios, calendrier, reservations
  const [openStudio, setOpenStudio] = useState(false);
  const [editStudio, setEditStudio] = useState(null);
  const [openResa, setOpenResa] = useState(false);
  const [ficheResa, setFicheResa] = useState(null);
  const [factureResa, setFactureResa] = useState(null);
  const P = data.parametres || PARAMS_DEFAUT;
  const studios = data.studios || [];
  const resas = data.reservations || [];
  const emailGerante = (P.gerante || "aude.nioble@season-immobilier.com").trim().toLowerCase();
  const suisGerante = String(moi || "").trim().toLowerCase() === emailGerante;
  const emailsCommerciaux = (P.commerciaux || []).map((e) => String(e).trim().toLowerCase());
  const estCommercial = emailsCommerciaux.includes(String(moi || "").trim().toLowerCase());

  // ---- Studios ----
  const blankStudio = { nom: "", adresse: "", pieces: "", description: "", actif: true,
    proprietaireId: "", commission: "" }; // proprietaireId vide = bien propre de l'agence
  const [fs, setFs] = useState(blankStudio);
  const startStudio = (s) => { setEditStudio(s || null); setFs(s ? { ...s } : blankStudio); setOpenStudio(true); };
  const submitStudio = () => {
    if (!fs.nom.trim()) return;
    save({ ...data, studios: editStudio ? studios.map((x) => x.id === editStudio.id ? { ...fs, id: editStudio.id } : x)
      : [...studios, { ...fs, id: uid() }] }, (editStudio ? "a modifié le studio " : "a ajouté le studio ") + fs.nom);
    setOpenStudio(false);
  };
  const supprStudio = (s) => { if (window.confirm("Supprimer ce studio ?")) save({ ...data, studios: studios.filter((x) => x.id !== s.id) }, "a supprimé un studio meublé"); };

  // ---- Réservations ----
  const blankResa = { studioId: "", client: "", tel: "", email: "", arrivee: aujourdhui(), depart: "",
    courant: false, depassement: 0, tauxArrhes: TAUX_ARRHES, arrhesFixe: "", tarifNuit: "", statut: "a_valider",
    // fiche signalétique
    naissance: "", lieuNaissance: "", nationalite: "", typePiece: "CNI", numPiece: "", adresse: "", profession: "", contactUrgence: "",
    pourAutrui: false, benefNom: "", benefPiece: "", benefLien: "" };
  const [fr, setFr] = useState(blankResa);
  const [editResa, setEditResa] = useState(null);
  const startResa = (studioId) => { setEditResa(null); setFr({ ...blankResa, studioId: studioId || (studios[0] || {}).id || "" }); setOpenResa(true); };
  const modifierResa = (r) => { setEditResa(r); setFr({ ...blankResa, ...r }); setOpenResa(true); };
  const submitResa = () => {
    if (!fr.studioId || !fr.client.trim() || !fr.arrivee || !fr.depart) return;
    if (nbNuits(fr.arrivee, fr.depart) <= 0) { window.alert("La date de départ doit être après l'arrivée."); return; }
    // Modification d'une réservation existante : on conserve numéro, auteur et statut
    if (editResa) {
      save({ ...data, reservations: resas.map((x) => x.id === editResa.id
        ? { ...x, ...fr, id: editResa.id, numero: editResa.numero, saisiPar: editResa.saisiPar, cree: editResa.cree, statut: editResa.statut } : x) },
        "a modifié la réservation de " + fr.client);
      setEditResa(null); setOpenResa(false); return;
    }
    const doc = { ...fr, id: uid(), numero: "RES-" + new Date().getFullYear() + "-" + String(resas.length + 1).padStart(4, "0"),
      saisiPar: moi, cree: new Date().toISOString(), statut: suisGerante ? "validee" : "a_valider" };
    save({ ...data, reservations: [doc, ...resas] },
      "a enregistré une réservation meublée pour " + fr.client + (suisGerante ? "" : " [à valider]"));
    setOpenResa(false);
  };
  const validerResa = (r) => save({ ...data, reservations: resas.map((x) => x.id === r.id ? { ...x, statut: "validee", validePar: moi, valideLe: new Date().toISOString() } : x) }, "a validé la réservation de " + r.client);
  const marquerPayee = (r) => save({ ...data, reservations: resas.map((x) => x.id === r.id ? { ...x, statut: "payee", payeeLe: new Date().toISOString() } : x) }, "a marqué payée la réservation de " + r.client);
  const rejeterResa = (r) => { if (window.confirm("Rejeter cette réservation ?")) save({ ...data, reservations: resas.map((x) => x.id === r.id ? { ...x, statut: "rejetee" } : x) }, "a rejeté une réservation"); };
  const supprResa = (r) => { if (window.confirm("Supprimer cette réservation ?")) save({ ...data, reservations: resas.filter((x) => x.id !== r.id) }, "a supprimé une réservation"); };
  const majDepassement = (r) => {
    const v = window.prompt("Nombre de nuitées supplémentaires à facturer (sortie après 13h) :", String(r.depassement || 0));
    if (v === null) return;
    save({ ...data, reservations: resas.map((x) => x.id === r.id ? { ...x, depassement: Number(v) || 0 } : x) }, "a ajusté le dépassement d'une réservation");
  };

  const nomStudio = (id) => (studios.find((s) => s.id === id) || {}).nom || "—";

  // ---- Charges par studio ----
  const charges = data.chargesStudios || [];
  const [openCharge, setOpenCharge] = useState(false);
  const [editCharge, setEditCharge] = useState(null);
  const blankCharge = { studioId: "", date: aujourdhui(), categorie: CATEGORIES_CHARGE_STUDIO[0], libelle: "", montant: "" };
  const [fc, setFc] = useState(blankCharge);
  const startCharge = (ch, studioId) => {
    setEditCharge(ch || null);
    setFc(ch ? { ...blankCharge, ...ch } : { ...blankCharge, studioId: studioId || (studios[0] || {}).id || "" });
    setOpenCharge(true);
  };
  const submitCharge = () => {
    if (!fc.studioId || !fc.montant) return;
    const rec = { ...fc, montant: Number(fc.montant) || 0, saisiPar: moi };
    save({ ...data, chargesStudios: editCharge
      ? charges.map((x) => x.id === editCharge.id ? { ...rec, id: editCharge.id } : x)
      : [{ ...rec, id: uid() }, ...charges] },
      (editCharge ? "a modifié une charge studio " : "a enregistré une charge studio ") + fcfa(rec.montant) + " (" + fc.categorie + ")");
    setOpenCharge(false); setEditCharge(null);
  };
  const supprCharge = (ch) => { if (window.confirm("Supprimer cette charge ?")) save({ ...data, chargesStudios: charges.filter((x) => x.id !== ch.id) }, "a supprimé une charge studio"); };

  // ---- État financier ----
  const moisDebut = new Date(); moisDebut.setDate(1);
  const [finDebut, setFinDebut] = useState(moisDebut.toISOString().slice(0, 10));
  const [finFin, setFinFin] = useState(aujourdhui());

  const nuitsDansPeriode = (r, d1, d2) => {
    const a = r.arrivee > d1 ? r.arrivee : d1;
    const b = r.depart < d2 ? r.depart : d2;
    return Math.max(0, nbNuits(a, b));
  };

  const bilanStudios = useMemo(() => {
    const d1 = finDebut, d2 = finFin;
    const nbJours = Math.max(1, nbNuits(d1, d2) + 1);
    return studios.map((st) => {
      // Facturation : réservations dont l'arrivée tombe dans la période
      const resasFact = resas.filter((r) => r.studioId === st.id && (r.statut === "validee" || r.statut === "payee")
        && r.arrivee >= d1 && r.arrivee <= d2);
      const ca = resasFact.reduce((s2, r) => s2 + calcResa(r).total, 0);
      const arrhes = resasFact.reduce((s2, r) => s2 + calcResa(r).arrhes, 0);
      // Occupation : nuits réellement passées dans la période
      const resasOcc = resas.filter((r) => r.studioId === st.id && (r.statut === "validee" || r.statut === "payee"));
      const nuitees = resasOcc.reduce((s2, r) => s2 + nuitsDansPeriode(r, d1, d2), 0);
      const taux = Math.round((nuitees / nbJours) * 100);
      const chg = charges.filter((x) => x.studioId === st.id && x.date >= d1 && x.date <= d2);
      const totalCharges = chg.reduce((s2, x) => s2 + Number(x.montant || 0), 0);
      const estAgence = !st.proprietaireId;
      const tauxCom = Number(st.commission || 0);
      const com = estAgence ? 0 : Math.round(ca * tauxCom / 100);
      // Bien propre : tout le net revient à l'agence. Bien géré : net = CA - commission - charges
      const net = estAgence ? (ca - totalCharges) : (ca - com - totalCharges);
      const proprio = estAgence ? null : (data.proprietaires || []).find((pr) => pr.id === st.proprietaireId);
      return { st, ca, arrhes, nuitees, taux, nbJours, charges: chg, totalCharges, estAgence, tauxCom, com, net, proprio, nbResas: resasFact.length };
    });
  }, [studios, resas, charges, finDebut, finFin, data.proprietaires]);

  const totauxFin = bilanStudios.reduce((a, b) => ({
    ca: a.ca + b.ca, arrhes: a.arrhes + b.arrhes, nuitees: a.nuitees + b.nuitees,
    charges: a.charges + b.totalCharges, com: a.com + b.com,
    netAgence: a.netAgence + (b.estAgence ? b.net : b.com),
    netProprio: a.netProprio + (b.estAgence ? 0 : b.net),
  }), { ca: 0, arrhes: 0, nuitees: 0, charges: 0, com: 0, netAgence: 0, netProprio: 0 });

  // Réservations actives d'un studio (validées ou payées, non rejetées)
  const resasStudio = (id) => resas.filter((r) => r.studioId === id && r.statut !== "rejetee");

  // Studio libre aujourd'hui ?
  const auj = aujourdhui();
  const occupeAujourdhui = (id) => resasStudio(id).some((r) => r.arrivee <= auj && auj < r.depart);

  const statutTone = { a_valider: "warn", validee: "ok", payee: "neutral", rejetee: "bad" };
  const statutLib = { a_valider: "À valider", validee: "Confirmée", payee: "Payée", rejetee: "Rejetée" };

  return (
    <div>
      <Head title="Studios meublés" sub="Location meublée courte et longue durée : disponibilités, réservations, factures"
        action={<>
          {(vue === "studios") && <Btn variant="ghost" onClick={() => startStudio(null)}>+ Studio</Btn>}
          {(vue === "charges") && <Btn variant="ghost" onClick={() => startCharge(null, null)} disabled={studios.length === 0}>+ Charge</Btn>}
          <Btn variant="accent" onClick={() => startResa(null)} disabled={studios.length === 0}>+ Réservation</Btn>
        </>} />

      {studios.length === 0 && (
        <div className="mb-5 px-4 py-3 rounded text-sm" style={{ background: C.goldSoft, color: C.gold }}>
          Commencez par ajouter vos studios meublés avec le bouton « + Studio ».
        </div>
      )}

      {/* Sélecteur de vue */}
      <div className="flex gap-2 mb-5 sans-impression flex-wrap">
        {[["studios","Les studios"],["calendrier","Disponibilités"],["reservations","Réservations"],
          ...(estCommercial ? [] : [["charges","Charges"],["finances","États financiers"]])].map(([k, lab]) => (
          <button key={k} onClick={() => setVue(k)} className="px-3 py-1.5 rounded text-sm font-medium"
            style={{ background: vue === k ? C.ink : "transparent", color: vue === k ? "#fff" : C.mute, border: "1px solid " + (vue === k ? C.ink : C.line) }}>
            {lab}</button>))}
      </div>

      {/* Tarifs rappel */}
      {vue === "studios" && (
        <div className="mb-5 px-4 py-3 rounded text-xs grid sm:grid-cols-2 lg:grid-cols-4 gap-2" style={{ background: "#F5F4EE", color: C.mute }}>
          <div>Nuitée courte : <b style={{ color: C.ink }}>{fcfa(TARIF_NUITEE)}</b></div>
          <div>Long séjour (≥ 2 sem.) : <b style={{ color: C.ink }}>{fcfa(TARIF_LONG)}</b>/nuit</div>
          <div>Courant prépayé : <b style={{ color: C.ink }}>{fcfa(COURANT_MOIS)}</b>/mois</div>
          <div>Caution long séjour : <b style={{ color: C.ink }}>{fcfa(CAUTION_LONG)}</b></div>
        </div>
      )}

      {/* VUE STUDIOS */}
      {vue === "studios" && (
        studios.length === 0 ? <Empty text="Aucun studio meublé enregistré." />
          : <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
              {studios.map((s) => {
                const occ = occupeAujourdhui(s.id);
                return (
                  <div key={s.id} className={card} style={{ borderColor: C.line }}><div className="p-4">
                    <div className="flex justify-between items-start gap-2 mb-2">
                      <div><h3 className="font-semibold text-sm" style={{ color: C.ink }}>{s.nom}</h3>
                        <p className="text-xs" style={{ color: C.mute }}>{s.adresse || "—"}</p></div>
                      <Tag tone={occ ? "warn" : "ok"}>{occ ? "Occupé" : "Libre"}</Tag>
                    </div>
                    {s.pieces && <p className="text-xs mb-1" style={{ color: C.mute }}>{s.pieces}</p>}
                    {s.description && <p className="text-xs mb-3" style={{ color: C.mute }}>{s.description}</p>}
                    <div className="flex gap-2 flex-wrap">
                      <Btn variant="accent" onClick={() => startResa(s.id)}>Réserver</Btn>
                      <Btn variant="ghost" onClick={() => startStudio(s)}>Modifier</Btn>
                      <Btn variant="danger" onClick={() => supprStudio(s)}>Suppr.</Btn>
                    </div>
                  </div></div>);
              })}
            </div>
      )}

      {/* VUE CALENDRIER / DISPONIBILITÉS */}
      {vue === "calendrier" && (
        studios.length === 0 ? <Empty text="Ajoutez des studios pour voir leurs disponibilités." />
          : <CalendrierDispo studios={studios} resas={resas} statutLib={statutLib} />
      )}

      {vue === "charges" && !estCommercial && (
        <div>

          </div>
          {charges.length === 0
            ? <Empty text="Aucune charge enregistrée." action={<Btn variant="accent" onClick={() => startCharge(null, null)} disabled={studios.length === 0}>+ Charge</Btn>} />

            <Btn variant="solid" onClick={() => window.print()}>Imprimer</Btn>
          </div>

          <div className="zone-impression" id="doc-finstudios" style={{ background: "#fff" }}>
            <div className="p-2 sm:p-5">
              <div className="mb-4">
                <h3 className="text-lg font-bold" style={{ color: C.ink }}>États financiers — studios meublés</h3>
                <p className="text-xs" style={{ color: C.mute }}>
                  Période du {dateLongue(finDebut)} au {dateLongue(finFin)} · {P.societe || "Season Immobilier"}</p>
              </div>

              <div className="grid sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-5">
                {[["Chiffre d'affaires", fcfa(totauxFin.ca)], ["Nuitées vendues", String(totauxFin.nuitees)],
                  ["Charges déduites", fcfa(totauxFin.charges)], ["Revenu agence", fcfa(totauxFin.netAgence)],
                  ["Net propriétaires", fcfa(totauxFin.netProprio)]].map(([l, v]) => (
                  <div key={l} className={card + " p-3"} style={{ borderColor: C.line }}>
                    <div className="text-[11px] mb-1" style={{ color: C.mute }}>{l}</div>
                    <div className="font-bold tabular-nums" style={{ color: C.ink }}>{v}</div>
                  </div>))}
              </div>

              {studios.length === 0 ? <Empty text="Aucun studio enregistré." /> : (
                <div className="space-y-4">
                  {bilanStudios.map((b) => (
                    <div key={b.st.id} className={card + " p-4"} style={{ borderColor: C.line }}>
                      <div className="flex items-start justify-between gap-3 flex-wrap mb-3">
                        <div>
                          <div className="font-bold" style={{ color: C.ink }}>{b.st.nom}</div>
                          <div className="text-xs" style={{ color: C.mute }}>
                            {b.estAgence ? "Bien propre de l'agence" : "Propriétaire : " + (b.proprio ? b.proprio.nom : "—") + " · commission " + b.tauxCom + " %"}
                          </div>
                        </div>
                        <div className="text-right">
                          <div className="text-[11px]" style={{ color: C.mute }}>Taux d'occupation</div>
                          <div className="font-bold tabular-nums" style={{ color: b.taux >= 60 ? C.green : b.taux >= 30 ? C.gold : C.clay }}>{b.taux} %</div>
                        </div>
                      </div>

                      <table className="w-full text-sm">
                        <tbody>
                          <tr style={{ borderTop: "1px solid " + C.line }}>
                            <td className="py-2" style={{ color: C.mute }}>Chiffre d'affaires ({b.nbResas} réservation(s))</td>
                            <td className="py-2 text-right tabular-nums font-semibold" style={{ color: C.ink }}>{fcfa(b.ca)}</td>
                          </tr>
                          <tr style={{ borderTop: "1px solid " + C.line }}>
                            <td className="py-2" style={{ color: C.mute }}>Nuitées vendues sur la période ({b.nbJours} jour(s))</td>
                            <td className="py-2 text-right tabular-nums" style={{ color: C.ink }}>{b.nuitees}</td>
                          </tr>
                          <tr style={{ borderTop: "1px solid " + C.line }}>
                            <td className="py-2" style={{ color: C.mute }}>Arrhes encaissées</td>
                            <td className="py-2 text-right tabular-nums" style={{ color: C.ink }}>{fcfa(b.arrhes)}</td>
                          </tr>
                          {!b.estAgence && (
                            <tr style={{ borderTop: "1px solid " + C.line }}>
                              <td className="py-2" style={{ color: C.mute }}>Commission agence ({b.tauxCom} %)</td>
                              <td className="py-2 text-right tabular-nums" style={{ color: C.ink }}>− {fcfa(b.com)}</td>
                            </tr>
                          )}
                          <tr style={{ borderTop: "1px solid " + C.line }}>
                            <td className="py-2" style={{ color: C.mute }}>Charges déduites</td>
                            <td className="py-2 text-right tabular-nums" style={{ color: C.ink }}>− {fcfa(b.totalCharges)}</td>
                          </tr>
                          <tr style={{ borderTop: "2px solid " + C.ink }}>
                            <td className="py-2.5 font-bold" style={{ color: C.ink }}>
                              {b.estAgence ? "Net agence" : "Net à reverser au propriétaire"}</td>
                            <td className="py-2.5 text-right tabular-nums font-bold" style={{ color: b.net >= 0 ? C.green : C.clay }}>{fcfa(b.net)}</td>
                          </tr>
                        </tbody>
                      </table>

                      {b.charges.length > 0 && (
                        <div className="mt-3 pt-3" style={{ borderTop: "1px dashed " + C.line }}>
                          <div className="text-[11px] font-semibold mb-1.5" style={{ color: C.mute }}>DÉTAIL DES CHARGES</div>
                          {b.charges.map((ch) => (
                            <div key={ch.id} className="flex justify-between text-xs py-0.5" style={{ color: C.mute }}>
                              <span>{ch.date} · {ch.categorie}{ch.libelle ? " — " + ch.libelle : ""}</span>
                              <span className="tabular-nums">{fcfa(ch.montant)}</span>
                            </div>))}
                        </div>
                      )}
                    </div>))}
                </div>
              )}

              <p className="text-[10px] mt-4" style={{ color: C.mute }}>
                Chiffre d'affaires et arrhes : réservations confirmées ou payées dont l'arrivée tombe dans la période.
                Nuitées et taux d'occupation : nuits effectivement passées sur la période.
              </p>
            </div>
          </div>
        </div>
      )}

      {/* VUE RÉSERVATIONS */}
      {vue === "reservations" && (
        resas.length === 0 ? <Empty text="Aucune réservation. Créez-en une avec « + Réservation »." />
          : <div className="space-y-3">
              {suisGerante && resas.some((r) => r.statut === "a_valider") && (
                <div className="px-4 py-3 rounded text-sm font-semibold sans-impression garder-couleur" style={{ background: C.goldSoft, color: C.gold }}>
                  ⚠ {resas.filter((r) => r.statut === "a_valider").length} réservation(s) en attente de VOTRE validation.
                </div>
              )}
              {resas.map((r) => {
                const cr = calcResa(r);
                return (
                  <div key={r.id} className={card} style={{ borderColor: C.line }}><div className="p-4">
                    <div className="flex justify-between items-start gap-3 mb-3 flex-wrap">
                      <div>
                        <div className="flex items-center gap-2 flex-wrap">
                          <h3 className="font-semibold text-sm" style={{ color: C.ink }}>{r.client}</h3>
                          <Tag tone={statutTone[r.statut]}>{statutLib[r.statut]}</Tag>
                          {cr.estLong && <Tag tone="neutral">Long séjour</Tag>}
                          {Number(r.depassement) > 0 && <Tag tone="bad">Dépassement +{r.depassement}</Tag>}
                        </div>
                        <p className="text-xs mt-0.5" style={{ color: C.mute }}>
                          {nomStudio(r.studioId)} · {dateLongue(r.arrivee)} → {dateLongue(r.depart)} · {cr.nuits} nuit(s)</p>
                        <p className="text-xs" style={{ color: C.mute }}>{r.tel}{r.email ? " · " + r.email : ""}</p>
                      </div>
                      <div className="text-right">
                        <div className="font-bold tabular-nums" style={{ color: C.ink }}>{fcfa(cr.total)}</div>
                        <div className="text-[10px]" style={{ color: C.mute }}>arrhes {cr.arrhesManuelle ? "(montant fixé)" : cr.tauxArrhes + "%"} : {fcfa(cr.arrhes)}</div>
                      </div>
                    </div>
                    <div className="flex gap-3 flex-wrap sans-impression">
                      <button onClick={() => setFicheResa(r)} className="text-xs font-semibold" style={{ color: C.ink }}>Fiche signalétique</button>
                      {r.statut !== "rejetee" && <button onClick={() => setFactureResa({ r, definitive: false })} className="text-xs font-semibold" style={{ color: C.green }}>{r.statut === "a_valider" ? "Voir la facture" : "Facture de réservation"}</button>}
                      {r.statut === "a_valider" && <button onClick={() => modifierResa(r)} className="text-xs font-semibold" style={{ color: C.ink }}>Modifier</button>}
                      {r.statut !== "a_valider" && r.statut !== "rejetee" && suisGerante && <button onClick={() => modifierResa(r)} className="text-xs font-semibold" style={{ color: C.ink }}>Modifier</button>}
                      {r.statut === "payee" && <button onClick={() => setFactureResa({ r, definitive: true })} className="text-xs font-semibold" style={{ color: C.green }}>Facture définitive</button>}
                      <button onClick={() => majDepassement(r)} className="text-xs font-semibold" style={{ color: C.orange }}>Dépassement (sortie &gt; 13h)</button>
                      {r.statut === "a_valider" && suisGerante && <button onClick={() => validerResa(r)} className="text-xs font-semibold" style={{ color: C.green }}>Valider</button>}
                      {r.statut === "validee" && suisGerante && <button onClick={() => marquerPayee(r)} className="text-xs font-semibold" style={{ color: C.gold }}>Marquer payée</button>}
                      {r.statut === "a_valider" && suisGerante && <button onClick={() => rejeterResa(r)} className="text-xs font-semibold" style={{ color: C.clay }}>Rejeter</button>}
                      {(suisGerante || r.statut === "a_valider") && <button onClick={() => supprResa(r)} className="text-xs font-semibold" style={{ color: C.clay }}>Suppr.</button>}
                    </div>
                  </div></div>);
              })}
            </div>
      )}

      <p className="text-xs mt-4 sans-impression" style={{ color: C.mute }}>
        Entrée 13h, sortie 13h. Toute sortie après 13h entraîne une nuitée supplémentaire (bouton « Dépassement »). Le tarif long séjour s'applique automatiquement à partir de 2 semaines. Vous seule validez les réservations.
      </p>

      {/* MODALE STUDIO */}
      {openStudio && (
        <Modal title={editStudio ? "Modifier le studio" : "Nouveau studio meublé"} onClose={() => setOpenStudio(false)}>
          <div className="space-y-3">
            <Field label="Nom / désignation"><Input value={fs.nom} onChange={(e) => setFs({ ...fs, nom: e.target.value })} placeholder="Studio Riviera 1" /></Field>
            <Field label="Adresse"><Input value={fs.adresse} onChange={(e) => setFs({ ...fs, adresse: e.target.value })} /></Field>
            <Field label="Composition (facultatif)"><Input value={fs.pieces} onChange={(e) => setFs({ ...fs, pieces: e.target.value })} placeholder="1 chambre, salon, cuisine équipée" /></Field>
            <Field label="Description / équipements (facultatif)"><Textarea value={fs.description} onChange={(e) => setFs({ ...fs, description: e.target.value })} placeholder="Climatisation, wifi, TV…" /></Field>
            <Field label="Propriétaire">
              <Select value={fs.proprietaireId || ""} onChange={(e) => setFs({ ...fs, proprietaireId: e.target.value })}>
                <option value="">Bien propre de l'agence</option>
                {(data.proprietaires || []).map((pr) => <option key={pr.id} value={pr.id}>{pr.nom}</option>)}
              </Select>
            </Field>
            {fs.proprietaireId && (
              <Field label="Commission agence (%)">
                <Input type="number" value={fs.commission} onChange={(e) => setFs({ ...fs, commission: e.target.value })} placeholder="10" />
              </Field>
            )}
            <div className="flex gap-2 pt-1">
              <Btn variant="accent" onClick={submitStudio}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setOpenStudio(false)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}

      {/* MODALE CHARGE STUDIO */}
      {openCharge && (
        <Modal title={editCharge ? "Modifier la charge" : "Nouvelle charge studio"} onClose={() => { setOpenCharge(false); setEditCharge(null); }}>
          <div className="space-y-3">
            <Field label="Studio">
              <Select value={fc.studioId} onChange={(e) => setFc({ ...fc, studioId: e.target.value })}>
                <option value="">— Choisir —</option>
                {studios.map((st) => <option key={st.id} value={st.id}>{st.nom}</option>)}
              </Select>
            </Field>
            <Field label="Date"><Input type="date" value={fc.date} onChange={(e) => setFc({ ...fc, date: e.target.value })} /></Field>
            <Field label="Catégorie">
              <Select value={fc.categorie} onChange={(e) => setFc({ ...fc, categorie: e.target.value })}>
                {CATEGORIES_CHARGE_STUDIO.map((k) => <option key={k} value={k}>{k}</option>)}
              </Select>
            </Field>
            <Field label="Libellé (facultatif)"><Input value={fc.libelle} onChange={(e) => setFc({ ...fc, libelle: e.target.value })} placeholder="Ménage après départ MME MOULY" /></Field>
            <Field label="Montant (F CFA)"><Input type="number" value={fc.montant} onChange={(e) => setFc({ ...fc, montant: e.target.value })} /></Field>
            <div className="flex gap-2 pt-1">
              <Btn variant="accent" onClick={submitCharge}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => { setOpenCharge(false); setEditCharge(null); }}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}

      {/* MODALE RÉSERVATION */}
      {openResa && (() => {
        const cr = calcResa(fr);
        return (
        <Modal title={editResa ? "Modifier la réservation " + (editResa.numero || "") : "Nouvelle réservation"} onClose={() => { setOpenResa(false); setEditResa(null); }} wide>
          <div className="space-y-4">
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Studio">
                <Select value={fr.studioId} onChange={(e) => setFr({ ...fr, studioId: e.target.value })}>
                  <option value="">— Choisir —</option>
                  {studios.map((s) => <option key={s.id} value={s.id}>{s.nom}</option>)}
                </Select>
              </Field>
              <Field label="Nom du client"><Input value={fr.client} onChange={(e) => setFr({ ...fr, client: e.target.value })} /></Field>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Date d'arrivée (13h)"><Input type="date" value={fr.arrivee} onChange={(e) => setFr({ ...fr, arrivee: e.target.value })} /></Field>
              <Field label="Date de départ (13h)"><Input type="date" value={fr.depart} onChange={(e) => setFr({ ...fr, depart: e.target.value })} /></Field>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Téléphone"><Input value={fr.tel} onChange={(e) => setFr({ ...fr, tel: e.target.value })} /></Field>
              <Field label="Email"><Input value={fr.email} onChange={(e) => setFr({ ...fr, email: e.target.value })} /></Field>
            </div>

            {cr.estLong && (
              <label className="flex items-center gap-2 text-sm px-3 py-2 rounded" style={{ background: C.greenSoft, color: C.ink }}>
                <input type="checkbox" checked={fr.courant} onChange={(e) => setFr({ ...fr, courant: e.target.checked })} />
                Courant prépayé ({fcfa(COURANT_MOIS)}/mois × {cr.mois} mois = {fcfa(cr.mois * COURANT_MOIS)})
              </label>
            )}

            <Field label={"Tarif par nuit personnalisé (défaut : " + fcfa(cr.estLong ? TARIF_LONG : TARIF_NUITEE) + ")"}>
              <Input type="number" value={fr.tarifNuit} onChange={(e) => setFr({ ...fr, tarifNuit: e.target.value })} placeholder="Laisser vide pour le tarif automatique" />
            </Field>

            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Pourcentage d'arrhes (%)">
                <Input type="number" value={fr.tauxArrhes} onChange={(e) => setFr({ ...fr, tauxArrhes: e.target.value })} placeholder="40" disabled={fr.arrhesFixe && Number(fr.arrhesFixe) > 0} />
              </Field>
              <Field label="OU montant d'arrhes exact (F CFA)">
                <Input type="number" value={fr.arrhesFixe} onChange={(e) => setFr({ ...fr, arrhesFixe: e.target.value })} placeholder="Laisser vide pour utiliser le %" />
              </Field>
            </div>
            <p className="text-[11px] -mt-2" style={{ color: C.mute }}>
              Si vous saisissez un montant exact, il remplace le calcul par pourcentage.
            </p>

            {/* Aperçu tarifaire */}
            {cr.nuits > 0 && (
              <div className="rounded p-3 garder-couleur" style={{ background: "#F5F4EE" }}>
                <div className="flex justify-between text-sm"><span style={{ color: C.mute }}>{cr.nuits} nuit(s) × {fcfa(cr.tarif)}{cr.tarifPerso ? " (tarif personnalisé)" : cr.estLong ? " (long séjour)" : ""}</span><span className="tabular-nums" style={{ color: C.ink }}>{fmt(cr.hebergement)}</span></div>
                {cr.courant > 0 && <div className="flex justify-between text-sm"><span style={{ color: C.mute }}>Courant prépayé</span><span className="tabular-nums" style={{ color: C.ink }}>{fmt(cr.courant)}</span></div>}
                {cr.caution > 0 && <div className="flex justify-between text-sm"><span style={{ color: C.mute }}>Caution (long séjour)</span><span className="tabular-nums" style={{ color: C.ink }}>{fmt(cr.caution)}</span></div>}
                <div className="flex justify-between font-bold pt-1 mt-1 border-t" style={{ borderColor: C.line }}><span style={{ color: C.ink }}>Total</span><span className="tabular-nums" style={{ color: C.green }}>{fcfa(cr.total)}</span></div>
                <div className="flex justify-between text-xs mt-0.5"><span style={{ color: C.mute }}>Arrhes à verser {cr.arrhesManuelle ? "(montant fixé)" : "(" + cr.tauxArrhes + "%)"}</span><span className="tabular-nums" style={{ color: C.clay }}>{fcfa(cr.arrhes)}</span></div>
              </div>
            )}

            {/* Fiche signalétique */}
            <div className="pt-2 border-t" style={{ borderColor: C.line }}>
              <Label>Fiche signalétique du client</Label>
              <div className="grid sm:grid-cols-2 gap-3 mt-1">
                <Field label="Date de naissance"><Input type="date" value={fr.naissance} onChange={(e) => setFr({ ...fr, naissance: e.target.value })} /></Field>
                <Field label="Lieu de naissance"><Input value={fr.lieuNaissance} onChange={(e) => setFr({ ...fr, lieuNaissance: e.target.value })} /></Field>
                <Field label="Nationalité"><Input value={fr.nationalite} onChange={(e) => setFr({ ...fr, nationalite: e.target.value })} /></Field>
                <Field label="Profession"><Input value={fr.profession} onChange={(e) => setFr({ ...fr, profession: e.target.value })} /></Field>
                <Field label="Pièce d'identité">
                  <Select value={fr.typePiece} onChange={(e) => setFr({ ...fr, typePiece: e.target.value })}>
                    <option>CNI</option><option>Passeport</option>
                  </Select>
                </Field>
                <Field label="N° de la pièce"><Input value={fr.numPiece} onChange={(e) => setFr({ ...fr, numPiece: e.target.value })} /></Field>
              </div>
              <div className="mt-2"><Field label="Adresse / domicile"><Input value={fr.adresse} onChange={(e) => setFr({ ...fr, adresse: e.target.value })} /></Field></div>
              <div className="mt-2"><Field label="Personne à contacter en cas d'urgence"><Input value={fr.contactUrgence} onChange={(e) => setFr({ ...fr, contactUrgence: e.target.value })} /></Field></div>
            </div>

            {/* Bénéficiaire effectif */}
            <div className="pt-2 border-t" style={{ borderColor: C.line }}>
              <label className="flex items-center gap-2 text-sm mb-2" style={{ color: C.ink }}>
                <input type="checkbox" checked={fr.pourAutrui} onChange={(e) => setFr({ ...fr, pourAutrui: e.target.checked })} />
                Le client réserve pour un tiers (bénéficiaire effectif)
              </label>
              {fr.pourAutrui && (
                <div className="grid sm:grid-cols-3 gap-3">
                  <Field label="Nom du bénéficiaire"><Input value={fr.benefNom} onChange={(e) => setFr({ ...fr, benefNom: e.target.value })} /></Field>
                  <Field label="Pièce du bénéficiaire"><Input value={fr.benefPiece} onChange={(e) => setFr({ ...fr, benefPiece: e.target.value })} /></Field>
                  <Field label="Lien avec le client"><Input value={fr.benefLien} onChange={(e) => setFr({ ...fr, benefLien: e.target.value })} /></Field>
                </div>
              )}
            </div>

            <div className="flex gap-2 pt-1">
              <Btn variant="accent" onClick={submitResa}>{editResa ? "Enregistrer les corrections" : "Enregistrer la réservation"}</Btn>
              <Btn variant="ghost" onClick={() => { setOpenResa(false); setEditResa(null); }}>Annuler</Btn>
            </div>
            {!suisGerante && !editResa && <p className="text-xs" style={{ color: C.mute }}>La réservation sera « à valider » par la gérante.</p>}
          </div>
        </Modal>
        );
      })()}

      {/* MODALE FICHE SIGNALÉTIQUE (imprimable) */}
      {ficheResa && (
        <Modal title="Fiche signalétique" onClose={() => setFicheResa(null)} wide printable>
          <div id="doc-fiche" style={{ background: "#fff" }}>
            <FicheSignaletique r={ficheResa} studio={studios.find((s) => s.id === ficheResa.studioId)} p={P} />
          </div>
          <div className="flex gap-2 pt-4 sans-impression">
            <Btn variant="ghost" onClick={() => genererPdf(document.getElementById("doc-fiche"), "fiche-" + (ficheResa.client || "client") + ".pdf")}>Télécharger PDF</Btn>
            <Btn variant="solid" onClick={() => window.print()}>Imprimer</Btn>
            <Btn variant="ghost" onClick={() => setFicheResa(null)}>Fermer</Btn>
          </div>
        </Modal>
      )}

      {/* MODALE FACTURE RÉSERVATION (imprimable) */}
      {factureResa && (
        <Modal title={factureResa.definitive ? "Facture définitive" : "Facture de réservation"} onClose={() => setFactureResa(null)} wide printable>
          {factureResa.r.statut === "a_valider" && (
            <div className="mb-3 px-4 py-2.5 rounded text-sm font-semibold sans-impression garder-couleur" style={{ background: C.goldSoft, color: C.gold }}>
              {suisGerante ? "Réservation non validée : aperçu seulement. Corrigez si besoin (bouton « Modifier »), puis validez-la pour autoriser l'impression."
                : "Réservation en attente de validation par la gérante. Impression et envoi impossibles."}
            </div>
          )}
          <div id="doc-facresa" style={{ background: "#fff" }}>
            {factureResa.r.statut === "a_valider" && (
              <div className="garder-couleur" style={{ background: "#7f1d1d", color: "#fff", padding: "10px 16px",
                fontWeight: 700, fontSize: 13, letterSpacing: 1, textAlign: "center" }}>
                DOCUMENT NON VALIDÉ — NE PAS REMETTRE AU CLIENT
              </div>
            )}
            <FactureMeuble r={factureResa.r} studio={studios.find((s) => s.id === factureResa.r.studioId)} p={P} definitive={factureResa.definitive} />
          </div>
          <div className="flex gap-2 pt-4 flex-wrap sans-impression">
            {factureResa.r.statut !== "a_valider" && <>
            <Btn variant="ghost" onClick={() => genererPdf(document.getElementById("doc-facresa"), (factureResa.r.numero || "facture") + ".pdf")}>Télécharger PDF</Btn>
            <Btn variant="solid" onClick={() => window.print()}>Imprimer</Btn>
            <Btn variant="accent" onClick={async () => {
              await genererPdf(document.getElementById("doc-facresa"), (factureResa.r.numero || "facture") + ".pdf");
              const cr = calcResa(factureResa.r);
              ouvrirWhatsApp(factureResa.r.tel, "Bonjour " + factureResa.r.client + ",\n\nVoici votre facture" + (factureResa.definitive ? " définitive" : "") + " (" + nomStudio(factureResa.r.studioId) + ") d'un montant de " + fcfa(cr.total) + ".\n\n" + (P.societe || "Season Immobilier"));
            }}>WhatsApp</Btn></>}
            {factureResa.r.statut === "a_valider" && <Btn variant="ghost" onClick={() => { setFactureResa(null); modifierResa(factureResa.r); }}>Modifier la réservation</Btn>}
            {factureResa.r.statut === "a_valider" && suisGerante && <Btn variant="accent" onClick={() => { validerResa(factureResa.r); setFactureResa(null); }}>Valider la réservation</Btn>}
            <Btn variant="ghost" onClick={() => setFactureResa(null)}>Fermer</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

// Calendrier de disponibilité : lignes = studios, colonnes = 30 prochains jours
function CalendrierDispo({ studios, resas, statutLib }) {
  const [debut, setDebut] = useState(aujourdhui());
  const jours = [];
  const d0 = new Date(debut + "T00:00:00");
  for (let i = 0; i < 30; i++) { const d = new Date(d0); d.setDate(d0.getDate() + i); jours.push(d); }
  const iso = (d) => d.toISOString().slice(0, 10);
  const resaAt = (studioId, jourIso) => resas.find((r) => r.studioId === studioId && r.statut !== "rejetee" && r.arrivee <= jourIso && jourIso < r.depart);

  return (
    <div>
      <div className="flex items-center gap-2 mb-3 sans-impression">
        <Label>À partir du</Label>
        <input type="date" value={debut} onChange={(e) => setDebut(e.target.value)}
          className="px-3 py-2 text-sm rounded border bg-white outline-none" style={{ borderColor: C.line, color: C.ink }} />
        <span className="text-xs" style={{ color: C.mute }}>(30 jours affichés)</span>
      </div>
      <div className="overflow-x-auto">
        <table className="text-xs border-collapse">
          <thead><tr>
            <th className="sticky left-0 bg-white px-2 py-2 text-left" style={{ minWidth: 140, color: C.mute }}>Studio</th>
            {jours.map((d, i) => (
              <th key={i} className="px-1 py-2 text-center font-normal" style={{ minWidth: 26, color: d.getDay() === 0 || d.getDay() === 6 ? C.clay : C.mute }}>
                {d.getDate()}<div className="text-[8px]">{["D","L","M","M","J","V","S"][d.getDay()]}</div></th>))}
          </tr></thead>
          <tbody>
            {studios.map((s) => (
              <tr key={s.id}>
                <td className="sticky left-0 bg-white px-2 py-2 font-medium border-t" style={{ color: C.ink, borderColor: C.line }}>{s.nom}</td>
                {jours.map((d, i) => {
                  const r = resaAt(s.id, iso(d));
                  return (
                    <td key={i} className="px-0.5 py-2 text-center border-t garder-couleur" style={{ borderColor: C.line, background: r ? C.green : "#F0F5EA" }}
                      title={r ? r.client + " (" + statutLib[r.statut] + ")" : "Libre"}>
                      {r ? <span style={{ color: "#fff", fontSize: 9 }}>●</span> : ""}
                    </td>);
                })}
              </tr>))}
          </tbody>
        </table>
      </div>
      <div className="flex gap-4 mt-3 text-xs" style={{ color: C.mute }}>
        <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded garder-couleur" style={{ background: C.green }}></span> Occupé</span>
        <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded garder-couleur" style={{ background: "#F0F5EA" }}></span> Libre</span>
      </div>
    </div>
  );
}

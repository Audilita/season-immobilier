const CATEGORIES_CHARGE_STUDIO = [
  "Ménage / blanchisserie", "Eau et électricité", "Internet / abonnements", "Réparations et entretien",
  "Consommables (accueil, hygiène)", "Gardiennage / sécurité", "Petit équipement", "Taxes et redevances", "Autre charge",
];

const CATEGORIES_DEPENSE = [
  "Transport commerciaux", "Carburant", "Fournitures de bureau", "Entretien et ménage",
  "Eau et électricité", "Internet et téléphone", "Sortie / détente équipe", "Restauration / accueil clients",
  "Frais de mission / déplacement", "Publicité et communication", "Petit matériel", "Réparations bureau",
  "Frais bancaires", "Impôts et taxes", "Loyer du bureau", "Salaires / primes", "Autre",
];

function Caisse({ data, save, moi, c }) {
  const [open, setOpen] = useState(false);
  const [typeSaisie, setTypeSaisie] = useState("depense");
  const [periode, setPeriode] = useState("jour"); // jour, mois, tout
  const [justif, setJustif] = useState(null); // dépense dont on gère le justificatif
  const P = data.parametres || PARAMS_DEFAUT;
  const liste = data.caisse || [];
  const emailGerante = (P.gerante || "aude.nioble@season-immobilier.com").trim().toLowerCase();
  const suisGerante = String(moi || "").trim().toLowerCase() === emailGerante;

  const blank = { type: "depense", montant: "", rendu: "", categorie: CATEGORIES_DEPENSE[0], detail: "",
    beneficiaire: "", date: aujourdhui() };
  const [f, setF] = useState(blank);

  const ouvrir = (type) => { setTypeSaisie(type); setF({ ...blank, type }); setOpen(true); };

  const enregistrer = () => {
    if (!f.montant) return;
    // Une entrée (approvisionnement) saisie par la gérante est validée d'office ; sinon à valider
    const valide = suisGerante;
    const doc = { ...f, id: uid(), montant: Number(f.montant), rendu: Number(f.rendu) || 0, valide, validePar: valide ? moi : null,
      valideLe: valide ? new Date().toISOString() : null, saisiPar: moi, cree: new Date().toISOString() };
    save({ ...data, caisse: [doc, ...liste] },
      (f.type === "entree" ? "a approvisionné la caisse de " : "a enregistré une dépense de ") + fcfa(Number(f.montant) - (Number(f.rendu) || 0))
      + (f.type === "depense" ? " (" + f.categorie + ")" : "") + (valide ? "" : " [à valider]"));
    setOpen(false);
  };

  const valider = (m) => save({ ...data, caisse: liste.map((x) => x.id === m.id ? { ...x, valide: true, validePar: moi, valideLe: new Date().toISOString() } : x) },
    "a validé une opération de caisse de " + fcfa(m.montant));
  const supprimer = (m) => { if (window.confirm("Supprimer cette opération de caisse ?")) save({ ...data, caisse: liste.filter((x) => x.id !== m.id) }, "a supprimé une opération de caisse"); };

  // Solde global (toutes opérations validées) — une dépense retire (montant - rendu), le rendu revient en caisse
  const montantNet = (m) => Number(m.montant || 0) - (Number(m.rendu) || 0);
  const soldeGlobal = liste.filter((m) => m.valide).reduce((s, m) => s + (m.type === "entree" ? m.montant : -montantNet(m)), 0);
  const enAttente = liste.filter((m) => !m.valide);

  // Filtrage par période
  const auj = aujourdhui();
  const moisCour = auj.slice(0, 7);
  const filtrees = liste.filter((m) => {
    if (periode === "jour") return m.date === auj;
    if (periode === "mois") return (m.date || "").slice(0, 7) === moisCour;
    return true;
  }).sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.cree || "").localeCompare(a.cree || ""));

  const entrees = filtrees.filter((m) => m.type === "entree" && m.valide).reduce((s, m) => s + m.montant, 0);
  const sorties = filtrees.filter((m) => m.type === "depense" && m.valide).reduce((s, m) => s + montantNet(m), 0);

  // Répartition par catégorie sur la période
  const parCategorie = {};
  filtrees.filter((m) => m.type === "depense" && m.valide).forEach((m) => {
    parCategorie[m.categorie] = (parCategorie[m.categorie] || 0) + montantNet(m);
  });
  const cats = Object.entries(parCategorie).map(([nom, val]) => ({ nom, val })).sort((a, b) => b.val - a.val);

  const libPeriode = periode === "jour" ? "aujourd'hui" : periode === "mois" ? "ce mois" : "au total";

  return (
    <div>
      <Head title="Caisse & dépenses" sub="Suivi de la petite caisse : approvisionnements et dépenses"
        action={<>
          {suisGerante && <Btn variant="ghost" onClick={() => ouvrir("entree")}>+ Approvisionner</Btn>}
          <Btn variant="accent" onClick={() => ouvrir("depense")}>+ Dépense</Btn>
        </>} />

      {/* Solde et alerte */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: soldeGlobal >= 0 ? C.green : C.clay }}></div>
          <div className="p-4"><Label>Solde de caisse</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: soldeGlobal >= 0 ? C.green : C.clay }}>{fcfa(soldeGlobal)}</div>
            <div className="text-[10px] mt-0.5" style={{ color: C.mute }}>ce qui devrait rester</div></div></div>
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: C.green }}></div>
          <div className="p-4"><Label>Entrées {libPeriode}</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.green }}>{fcfa(entrees)}</div></div></div>
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: C.clay }}></div>
          <div className="p-4"><Label>Dépenses {libPeriode}</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.clay }}>{fcfa(sorties)}</div></div></div>
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: C.orange }}></div>
          <div className="p-4"><Label>À valider</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.orange }}>{enAttente.length}</div></div></div>
      </div>

      {suisGerante && enAttente.length > 0 && (
        <div className="mb-5 px-4 py-3 rounded text-sm font-semibold sans-impression garder-couleur" style={{ background: C.goldSoft, color: C.gold }}>
          ⚠ {enAttente.length} opération(s) de caisse en attente de VOTRE validation.
        </div>
      )}

      {/* Sélecteur de période */}
      <div className="flex gap-2 mb-4 sans-impression">
        {[["jour","Aujourd'hui"],["mois","Ce mois"],["tout","Tout"]].map(([k, lab]) => (
          <button key={k} onClick={() => setPeriode(k)} className="px-3 py-1.5 rounded text-sm font-medium"
            style={{ background: periode === k ? C.ink : "transparent", color: periode === k ? "#fff" : C.mute, border: "1px solid " + (periode === k ? C.ink : C.line) }}>
            {lab}</button>))}
      </div>

      <div className="grid lg:grid-cols-3 gap-6">
        {/* Liste des opérations */}
        <div className="lg:col-span-2">
          {filtrees.length === 0 ? <Empty text="Aucune opération sur cette période." />
            : <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead><tr style={{ background: "#F5F4EE" }}>
                    {["Date","Type / Catégorie","Détail","Montant","Statut",""].map((h) => (
                      <th key={h} className="text-left px-3 py-2.5 text-[10px] font-semibold uppercase tracking-[0.1em]" style={{ color: C.mute }}>{h}</th>))}
                  </tr></thead>
                  <tbody className="divide-y" style={{ borderColor: C.line }}>
                    {filtrees.map((m) => (
                      <tr key={m.id}>
                        <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{m.date}</td>
                        <td className="px-3 py-2.5">
                          {m.type === "entree" ? <Tag tone="ok">Approvisionnement</Tag>
                            : <span style={{ color: C.ink }}>{m.categorie}</span>}
                        </td>
                        <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>
                          {m.detail || "—"}
                          {m.beneficiaire && <div className="font-semibold" style={{ color: C.ink }}>👤 {m.beneficiaire}</div>}</td>
                        <td className="px-3 py-2.5 tabular-nums font-semibold" style={{ color: m.type === "entree" ? C.green : C.clay }}>
                          {m.type === "entree" ? "+ " : "- "}{fmt(m.type === "entree" ? m.montant : montantNet(m))}
                          {m.type === "depense" && Number(m.rendu) > 0 && <div className="text-[10px] font-normal" style={{ color: C.mute }}>donné {fmt(m.montant)} · rendu {fmt(m.rendu)}</div>}</td>
                        <td className="px-3 py-2.5">{m.valide ? <Tag tone="ok">Validé</Tag> : <Tag tone="warn">À valider</Tag>}</td>
                        <td className="px-3 py-2.5"><div className="flex gap-2 flex-wrap">
                          <button onClick={() => setJustif(m)} className="text-xs font-semibold" style={{ color: C.gold }}>Justificatif</button>
                          {!m.valide && suisGerante && <button onClick={() => valider(m)} className="text-xs font-semibold" style={{ color: C.green }}>Valider</button>}
                          {(suisGerante || !m.valide) && <button onClick={() => supprimer(m)} className="text-xs font-semibold" style={{ color: C.clay }}>Suppr.</button>}
                        </div></td>
                      </tr>))}
                  </tbody>
                </table>
              </div></div>}
        </div>

        {/* Point par catégorie */}
        <div>
          <div className={card} style={{ borderColor: C.line }}>
            <div className="px-4 py-3 border-b" style={{ borderColor: C.line }}>
              <h3 className="text-sm font-semibold" style={{ color: C.ink }}>Dépenses par poste ({libPeriode})</h3></div>
            <div className="p-4">
              {cats.length === 0 ? <p className="text-sm" style={{ color: C.mute }}>Aucune dépense.</p>
                : <div className="space-y-2.5">
                    {cats.map((c, i) => {
                      const pct = Math.round(c.val / cats[0].val * 100);
                      return (
                        <div key={i}>
                          <div className="flex justify-between text-xs mb-1">
                            <span style={{ color: C.ink }}>{c.nom}</span>
                            <span className="tabular-nums" style={{ color: C.mute }}>{fcfa(c.val)}</span></div>
                          <div className="h-2 rounded" style={{ background: "#F0EEE4" }}>
                            <div className="h-2 rounded garder-couleur" style={{ width: pct + "%", background: C.clay }}></div></div>
                        </div>);
                    })}
                    <div className="flex justify-between pt-2 border-t font-bold text-sm" style={{ borderColor: C.line }}>
                      <span style={{ color: C.ink }}>Total dépenses</span>
                      <span className="tabular-nums" style={{ color: C.clay }}>{fcfa(sorties)}</span></div>
                  </div>}
            </div>
          </div>
        </div>
      </div>

      <p className="text-xs mt-3 sans-impression" style={{ color: C.mute }}>
        L'assistante enregistre les dépenses. Toi seule valides (notamment les approvisionnements quand tu remets l'argent). Le solde ne compte que les opérations validées.
      </p>

      {open && (
        <Modal title={typeSaisie === "entree" ? "Approvisionner la caisse" : "Enregistrer une dépense"} onClose={() => setOpen(false)}>
          <div className="space-y-3">
            {typeSaisie === "depense" && (
              <Field label="Catégorie">
                <Select value={f.categorie} onChange={(e) => setF({ ...f, categorie: e.target.value })}>
                  {CATEGORIES_DEPENSE.map((c) => <option key={c} value={c}>{c}</option>)}
                </Select>
              </Field>
            )}
            <div className="grid grid-cols-2 gap-3">
              <Field label={typeSaisie === "depense" ? "Montant donné (F CFA)" : "Montant (F CFA)"}><Input type="number" value={f.montant} onChange={(e) => setF({ ...f, montant: e.target.value })} /></Field>
              <Field label="Date"><Input type="date" value={f.date} onChange={(e) => setF({ ...f, date: e.target.value })} /></Field>
            </div>
            {typeSaisie === "depense" && (
              <Field label="Monnaie rendue (F CFA) — si l'agent a rendu de l'argent">
                <Input type="number" value={f.rendu} onChange={(e) => setF({ ...f, rendu: e.target.value })} placeholder="0" />
              </Field>
            )}
            {typeSaisie === "depense" && Number(f.montant) > 0 && (
              <div className="px-3 py-2 rounded text-sm flex justify-between garder-couleur" style={{ background: C.greenSoft }}>
                <span style={{ color: C.mute }}>Dépense réelle (donné − rendu)</span>
                <span className="font-bold tabular-nums" style={{ color: C.green }}>{fcfa((Number(f.montant) || 0) - (Number(f.rendu) || 0))}</span>
              </div>
            )}
            <Field label={typeSaisie === "entree" ? "Provenance / note" : "Détail de la dépense"}>
              <Input value={f.detail} onChange={(e) => setF({ ...f, detail: e.target.value })}
                placeholder={typeSaisie === "entree" ? "Ex : remise par la gérante" : "Ex : taxi pour visite Cocody"} /></Field>
            {typeSaisie === "depense" && (
              <Field label="Bénéficiaire / commercial concerné (facultatif)">
                <Input value={f.beneficiaire} onChange={(e) => setF({ ...f, beneficiaire: e.target.value })} placeholder="Nom du commercial" /></Field>
            )}
            <div className="flex gap-2 pt-1">
              <Btn variant="accent" onClick={enregistrer}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
            {!suisGerante && <p className="text-xs" style={{ color: C.mute }}>Cette opération sera « à valider » par la gérante.</p>}
          </div>
        </Modal>
      )}

      {/* MODALE JUSTIFICATIF (photo du reçu) */}
      {justif && (
        <Modal title="Justificatif de la dépense" onClose={() => setJustif(null)}>
          <div className="space-y-3">
            <div className="text-sm" style={{ color: C.ink }}>
              <div className="font-semibold">{justif.categorie}{justif.beneficiaire ? " · " + justif.beneficiaire : ""}</div>
              <div className="text-xs" style={{ color: C.mute }}>{justif.detail} — {fcfa(montantNet(justif))} · {justif.date}</div>
            </div>
            <p className="text-xs" style={{ color: C.mute }}>Ajoutez la photo du reçu (transport, achat…). Le commercial peut vous l'envoyer par WhatsApp, vous l'ajoutez ici.</p>
            <PiecesJointes cle={"caisse:" + justif.id} c={c} verrouille={false} />
            <div className="flex justify-end pt-1">
              <Btn variant="ghost" onClick={() => setJustif(null)}>Fermer</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ============================ commissions =============================== */

// Barème d'agence (modifiable au cas par cas sur chaque opération)
const BAREME_VENTE = [
  { max: 50000000, simple: 10, exclusif: 20, agence: 5 },       // jusqu'à 50 M
  { max: 200000000, simple: 12, exclusif: 25, agence: 4 },      // 51 à 200 M
  { max: Infinity, simple: 15, exclusif: 30, agence: 3 },       // plus de 200 M
];
const TYPES_LOCATION = [
  { id: "hab0_2", label: "Habitation (0 à 2 M/an)", part: 15, base: "1 mois de loyer" },
  { id: "hab2plus", label: "Habitation (> 2 M/an)", part: 20, base: "1 mois de loyer" },
  { id: "meuble", label: "Location meublée (courte/longue durée)", part: 15, base: "10% du montant perçu" },
  { id: "bureau", label: "Bureaux ou commerces", part: 20, base: "1 mois de loyer TTC" },
  { id: "gestion", label: "Contrat de gestion locative", part: 15, base: "1 mois de loyer" },
];

function baremeVente(montant) {
  return BAREME_VENTE.find((t) => Number(montant || 0) <= t.max) || BAREME_VENTE[BAREME_VENTE.length - 1];
}

function Commissions({ data, save, moi }) {
  const [open, setOpen] = useState(false);
  const [filtre, setFiltre] = useState("tous");
  const P = data.parametres || PARAMS_DEFAUT;
  const liste = data.operations || [];
  const emailGerante = (P.gerante || "aude.nioble@season-immobilier.com").trim().toLowerCase();
  const suisGerante = String(moi || "").trim().toLowerCase() === emailGerante;
  const emailsCommerciaux = (P.commerciaux || []).map((e) => String(e).trim().toLowerCase());
  const estCommercial = emailsCommerciaux.includes(String(moi || "").trim().toLowerCase());
  const montrerMontants = !estCommercial; // les commerciaux ne voient ni les taux ni les montants de commission

  const blankVente = { type: "vente", bienId: "", ref: "", agentId: "", montant: "", mandat: "simple",
    tauxAgence: "", partCommercial: "", apporteur: "", tauxApporteur: 30, date: aujourdhui() };
  const blankLoc = { type: "location", bienId: "", ref: "", agentId: "", loyer: "", typeLoc: "hab0_2",
    commissionAgence: "", partCommercial: "", apporteur: "", tauxApporteur: 30, date: aujourdhui() };
  const [f, setF] = useState(blankVente);

  // Recalcule les montants d'une opération à partir de ses taux
  const calcOp = (o) => {
    if (o.type === "vente") {
      const b = baremeVente(o.montant);
      const tauxAgence = o.tauxAgence !== "" && o.tauxAgence != null ? Number(o.tauxAgence) : b.agence;
      const tauxComm = o.partCommercial !== "" && o.partCommercial != null ? Number(o.partCommercial) : b[o.mandat || "simple"];
      const commissionAgence = Math.round(Number(o.montant || 0) * tauxAgence / 100);
      const partApporteur = o.apporteur ? Math.round(commissionAgence * (Number(o.tauxApporteur) || 0) / 100) : 0;
      const base = commissionAgence - partApporteur;
      const commissionAgent = Math.round(base * tauxComm / 100);
      return { commissionAgence, partApporteur, base, commissionAgent, tauxAgence, tauxComm };
    } else {
      const t = TYPES_LOCATION.find((x) => x.id === o.typeLoc) || TYPES_LOCATION[0];
      const commissionAgence = Number(o.commissionAgence || 0);
      const tauxComm = o.partCommercial !== "" && o.partCommercial != null ? Number(o.partCommercial) : t.part;
      const partApporteur = o.apporteur ? Math.round(commissionAgence * (Number(o.tauxApporteur) || 0) / 100) : 0;
      const base = commissionAgence - partApporteur;
      const commissionAgent = Math.round(base * tauxComm / 100);
      return { commissionAgence, partApporteur, base, commissionAgent, tauxComm };
    }
  };

  const ouvrirVente = () => { setF({ ...blankVente, agentId: (data.agents[0] || {}).id || "" }); setOpen(true); };
  const ouvrirLoc = () => { setF({ ...blankLoc, agentId: (data.agents[0] || {}).id || "" }); setOpen(true); };

  const enregistrer = () => {
    if (!f.agentId || (f.type === "vente" ? !f.montant : !f.commissionAgence)) return;
    const doc = { ...f, id: uid(), statut: "a_valider", saisiPar: moi, cree: new Date().toISOString() };
    save({ ...data, operations: [doc, ...liste] },
      "a déclaré une opération " + (f.type === "vente" ? "de vente" : "de location") + " (commission à valider)");
    setOpen(false);
  };

  const valider = (o) => {
    save({ ...data, operations: liste.map((x) => x.id === o.id ? { ...x, statut: "validee", validePar: moi, valideLe: new Date().toISOString() } : x) },
      "a validé la commission d'une opération");
  };
  const marquerPayee = (o) => {
    save({ ...data, operations: liste.map((x) => x.id === o.id ? { ...x, statut: "payee", payeeLe: new Date().toISOString() } : x) },
      "a marqué une commission comme payée");
  };
  const rejeter = (o) => {
    if (!window.confirm("Rejeter cette opération ? La commission ne sera pas due.")) return;
    save({ ...data, operations: liste.map((x) => x.id === o.id ? { ...x, statut: "rejetee" } : x) }, "a rejeté une opération");
  };
  const supprimer = (o) => { if (window.confirm("Supprimer cette opération ?")) save({ ...data, operations: liste.filter((x) => x.id !== o.id) }, "a supprimé une opération"); };

  const nomAgent = (id) => (data.agents.find((a) => a.id === id) || {}).nom || "—";
  const nomBien = (id) => (data.biens.find((b) => b.id === id) || {}).nom || "";

  const visibles = liste.filter((o) => {
    if (filtre === "tous") return true;
    if (filtre === "a_valider") return o.statut === "a_valider";
    if (filtre === "a_payer") return o.statut === "validee";
    if (filtre === "payees") return o.statut === "payee";
    return true;
  });

  const totAValider = liste.filter((o) => o.statut === "a_valider").length;
  const totAPayer = liste.filter((o) => o.statut === "validee").reduce((s, o) => s + calcOp(o).commissionAgent, 0);
  const totPaye = liste.filter((o) => o.statut === "payee").reduce((s, o) => s + calcOp(o).commissionAgent, 0);

  const statutTone = { a_valider: "warn", validee: "ok", payee: "neutral", rejetee: "bad" };
  const statutLib = { a_valider: "À valider", validee: "À payer", payee: "Payée", rejetee: "Rejetée" };

  const apercu = calcOp(f);

  return (
    <div>
      <Head title="Commissions" sub="Déclaration, validation et paiement des commissions d'agents"
        action={<>
          <Btn variant="ghost" onClick={ouvrirLoc} disabled={data.agents.length === 0}>+ Location</Btn>
          <Btn variant="accent" onClick={ouvrirVente} disabled={data.agents.length === 0}>+ Vente</Btn>
        </>} />

      {data.agents.length === 0 && (
        <div className="mb-5 px-4 py-3 rounded text-sm" style={{ background: C.goldSoft, color: C.gold }}>
          Ajoutez d'abord vos agents dans l'onglet « Agents » pour pouvoir leur attribuer des commissions.
        </div>
      )}

      {montrerMontants ? (
      <div className="grid grid-cols-3 gap-3 mb-5">
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: C.orange }}></div>
          <div className="p-4"><Label>À valider</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.orange }}>{totAValider}</div></div></div>
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: C.green }}></div>
          <div className="p-4"><Label>À payer (validées)</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.green }}>{fcfa(totAPayer)}</div></div></div>
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: C.mute }}></div>
          <div className="p-4"><Label>Déjà payé</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.ink }}>{fcfa(totPaye)}</div></div></div>
      </div>
      ) : (
        <div className="mb-5 px-4 py-3 rounded text-sm" style={{ background: "#F5F4EE", color: C.mute }}>
          Déclarez vos ventes et locations ici. La gérante valide les commissions. Les montants restent confidentiels.
        </div>
      )}

      {suisGerante && totAValider > 0 && (
        <div className="mb-5 px-4 py-3 rounded text-sm font-semibold sans-impression garder-couleur" style={{ background: C.goldSoft, color: C.gold }}>
          ⚠ {totAValider} commission(s) en attente de VOTRE validation.
        </div>
      )}

      <div className="flex gap-2 mb-4 sans-impression flex-wrap">
        {(montrerMontants ? [["tous","Toutes"],["a_valider","À valider"],["a_payer","À payer"],["payees","Payées"]] : [["tous","Toutes"],["a_valider","En attente"]]).map(([k, lab]) => (
          <button key={k} onClick={() => setFiltre(k)} className="px-3 py-1.5 rounded text-sm font-medium"
            style={{ background: filtre === k ? C.ink : "transparent", color: filtre === k ? "#fff" : C.mute, border: "1px solid " + (filtre === k ? C.ink : C.line) }}>
            {lab}</button>))}
      </div>

      {visibles.length === 0 ? <Empty text="Aucune opération. Déclarez une vente ou une location pour calculer la commission de l'agent." />
        : <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr style={{ background: "#F5F4EE" }}>
                {(montrerMontants ? ["Type","Bien / Réf","Agent","Montant","Commission agent","Statut","Action"] : ["Type","Bien / Réf","Agent","Date","Statut","Action"]).map((h) => (
                  <th key={h} className="text-left px-4 py-2.5 text-[10px] font-semibold uppercase tracking-[0.12em]" style={{ color: C.mute }}>{h}</th>))}
              </tr></thead>
              <tbody className="divide-y" style={{ borderColor: C.line }}>
                {visibles.map((o) => {
                  const c = calcOp(o);
                  return (
                    <tr key={o.id}>
                      <td className="px-4 py-3"><Tag tone={o.type === "vente" ? "neutral" : "ok"}>{o.type === "vente" ? "Vente" : "Location"}</Tag></td>
                      <td className="px-4 py-3" style={{ color: C.ink }}>{nomBien(o.bienId) || o.ref || "—"}
                        {o.ref && nomBien(o.bienId) ? <div className="text-[10px]" style={{ color: C.mute }}>{o.ref}</div> : null}</td>
                      <td className="px-4 py-3" style={{ color: C.mute }}>{nomAgent(o.agentId)}</td>
                      {montrerMontants ? <>
                        <td className="px-4 py-3 tabular-nums" style={{ color: C.mute }}>{o.type === "vente" ? fcfa(o.montant) : fcfa(o.commissionAgence) + " comm."}</td>
                        <td className="px-4 py-3 tabular-nums font-semibold" style={{ color: C.ink }}>{fcfa(c.commissionAgent)}
                          {c.partApporteur > 0 && <div className="text-[10px]" style={{ color: C.mute }}>apporteur {fcfa(c.partApporteur)}</div>}</td>
                      </> : <td className="px-4 py-3" style={{ color: C.mute }}>{o.date}</td>}
                      <td className="px-4 py-3"><Tag tone={statutTone[o.statut]}>{statutLib[o.statut]}</Tag></td>
                      <td className="px-4 py-3"><div className="flex gap-3 flex-wrap">
                        {o.statut === "a_valider" && suisGerante && <button onClick={() => valider(o)} className="text-xs font-semibold" style={{ color: C.green }}>Valider</button>}
                        {o.statut === "validee" && suisGerante && <button onClick={() => marquerPayee(o)} className="text-xs font-semibold" style={{ color: C.gold }}>Marquer payée</button>}
                        {o.statut === "a_valider" && suisGerante && <button onClick={() => rejeter(o)} className="text-xs font-semibold" style={{ color: C.clay }}>Rejeter</button>}
                        {(suisGerante || o.statut === "a_valider") && <button onClick={() => supprimer(o)} className="text-xs font-semibold" style={{ color: C.clay }}>Suppr.</button>}
                      </div></td>
                    </tr>);
                })}
              </tbody>
            </table>
          </div></div>}

      <p className="text-xs mt-3 sans-impression" style={{ color: C.mute }}>
        {montrerMontants
          ? "Les commissions sont calculées selon le barème de l'agence. Toi seule les valides. Le paiement se fait en fin de mois, une fois l'opération encaissée."
          : "Déclarez ici vos ventes et locations. La gérante valide et calcule la commission. Les montants ne sont pas affichés."}
      </p>

      {open && (
        <Modal title={f.type === "vente" ? "Déclarer une vente" : "Déclarer une location"} onClose={() => setOpen(false)} wide>
          <div className="space-y-3">
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Bien concerné">
                <Select value={f.bienId} onChange={(e) => setF({ ...f, bienId: e.target.value })}>
                  <option value="">— Choisir ou saisir la référence —</option>
                  {data.biens.map((b) => <option key={b.id} value={b.id}>{b.nom}</option>)}
                </Select>
              </Field>
              <Field label="Référence libre (si bien absent)"><Input value={f.ref} onChange={(e) => setF({ ...f, ref: e.target.value })} placeholder="Réf. du bien" /></Field>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Agent commercial">
                <Select value={f.agentId} onChange={(e) => setF({ ...f, agentId: e.target.value })}>
                  <option value="">Sélectionner</option>
                  {data.agents.map((a) => <option key={a.id} value={a.id}>{a.nom}</option>)}
                </Select>
              </Field>
              <Field label="Date de l'opération"><Input type="date" value={f.date} onChange={(e) => setF({ ...f, date: e.target.value })} /></Field>
            </div>

            {f.type === "vente" ? <>
              <div className="grid sm:grid-cols-2 gap-3">
                <Field label="Montant de la vente (F CFA)"><Input type="number" value={f.montant} onChange={(e) => setF({ ...f, montant: e.target.value })} /></Field>
                <Field label="Type de mandat">
                  <Select value={f.mandat} onChange={(e) => setF({ ...f, mandat: e.target.value })}>
                    <option value="simple">Mandat simple</option>
                    <option value="exclusif">Mandat exclusif</option>
                  </Select>
                </Field>
              </div>
              {montrerMontants && f.montant && (
                <div className="px-3 py-2 rounded text-xs" style={{ background: "#F5F4EE", color: C.mute }}>
                  Barème appliqué : commission agence {baremeVente(f.montant).agence}% · part commercial {baremeVente(f.montant)[f.mandat]}%
                </div>
              )}
              {montrerMontants && (
              <div className="grid sm:grid-cols-2 gap-3">
                <Field label="Taux agence (%) — laisser vide pour le barème"><Input type="number" value={f.tauxAgence} onChange={(e) => setF({ ...f, tauxAgence: e.target.value })} placeholder={String(baremeVente(f.montant).agence)} /></Field>
                <Field label="Part commercial (%) — vide = barème"><Input type="number" value={f.partCommercial} onChange={(e) => setF({ ...f, partCommercial: e.target.value })} placeholder={String(baremeVente(f.montant)[f.mandat])} /></Field>
              </div>
              )}
            </> : <>
              <div className="grid sm:grid-cols-2 gap-3">
                <Field label="Type de location">
                  <Select value={f.typeLoc} onChange={(e) => setF({ ...f, typeLoc: e.target.value })}>
                    {TYPES_LOCATION.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}
                  </Select>
                </Field>
                <Field label="Commission agence encaissée (F CFA)"><Input type="number" value={f.commissionAgence} onChange={(e) => setF({ ...f, commissionAgence: e.target.value })} /></Field>
              </div>
              {montrerMontants && (
              <div className="px-3 py-2 rounded text-xs" style={{ background: "#F5F4EE", color: C.mute }}>
                Base : {(TYPES_LOCATION.find((t) => t.id === f.typeLoc) || {}).base} · part commercial {(TYPES_LOCATION.find((t) => t.id === f.typeLoc) || {}).part}%
              </div>
              )}
              {montrerMontants && (
              <Field label="Part commercial (%) — vide = barème"><Input type="number" value={f.partCommercial} onChange={(e) => setF({ ...f, partCommercial: e.target.value })} placeholder={String((TYPES_LOCATION.find((t) => t.id === f.typeLoc) || {}).part)} /></Field>
              )}
            </>}

            {montrerMontants && (
            <div className="pt-2 border-t" style={{ borderColor: C.line }}>
              <Label>Apporteur d'affaires (facultatif)</Label>
              <div className="grid sm:grid-cols-2 gap-3 mt-1">
                <Field label="Nom de l'apporteur"><Input value={f.apporteur} onChange={(e) => setF({ ...f, apporteur: e.target.value })} placeholder="Laisser vide si aucun" /></Field>
                <Field label="Part de l'apporteur (%)"><Input type="number" value={f.tauxApporteur} onChange={(e) => setF({ ...f, tauxApporteur: e.target.value })} /></Field>
              </div>
            </div>
            )}

            {montrerMontants ? (
            <div className="rounded p-3 garder-couleur" style={{ background: C.greenSoft }}>
              <div className="flex justify-between text-sm mb-1"><span style={{ color: C.mute }}>Commission agence</span>
                <span className="tabular-nums" style={{ color: C.ink }}>{fmt(apercu.commissionAgence)}</span></div>
              {apercu.partApporteur > 0 && <div className="flex justify-between text-sm mb-1"><span style={{ color: C.mute }}>Part apporteur ({f.tauxApporteur}%)</span>
                <span className="tabular-nums" style={{ color: C.clay }}>- {fmt(apercu.partApporteur)}</span></div>}
              <div className="flex justify-between font-bold pt-1 border-t" style={{ borderColor: "rgba(0,0,0,0.1)" }}>
                <span style={{ color: C.ink }}>Commission de l'agent</span>
                <span className="tabular-nums" style={{ color: C.green }}>{fcfa(apercu.commissionAgent)}</span></div>
            </div>
            ) : (
            <div className="rounded p-3" style={{ background: "#F5F4EE" }}>
              <p className="text-xs" style={{ color: C.mute }}>Votre déclaration sera transmise à la gérante pour validation. Le montant de la commission est calculé et validé par elle.</p>
            </div>
            )}

            <div className="flex gap-2 pt-1">
              <Btn variant="accent" onClick={enregistrer}>Enregistrer l'opération</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
            <p className="text-xs" style={{ color: C.mute }}>La commission sera « à valider ». Seule la gérante peut la valider, puis la marquer payée en fin de mois après encaissement.</p>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ======================= cagnotte des propriétaires ====================== */

function CagnotteProprietaires({ data }) {
  const anneeActuelle = new Date().getFullYear();
  const [annee, setAnnee] = useState(anneeActuelle);
  const [detail, setDetail] = useState(null);
  const P = data.parametres || PARAMS_DEFAUT;
  const MOIS_COURTS = ["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];

  // Liste unifiée des propriétaires : fiches + noms libres sur les biens
  const fiches = data.proprietaires || [];
  const nomsLibres = [...new Set(data.biens.map((b) => b.proprietaire).filter(Boolean))]
    .filter((nom) => !fiches.some((f) => f.nom === nom));
  const proprios = [...fiches.map((f) => ({ id: f.id, nom: f.nom, fiche: f })),
    ...nomsLibres.map((nom) => ({ id: "libre:" + nom, nom, fiche: null }))];

  const moisAnnee = Array.from({ length: 12 }, (_, i) => annee + "-" + String(i + 1).padStart(2, "0"));

  const calcProprio = (proprio) => {
    const biens = data.biens.filter((b) => (proprio.fiche && b.proprietaireId === proprio.fiche.id) || b.proprietaire === proprio.nom);
    const ids = new Set(biens.map((b) => b.id));
    // Par mois : loyers validés, commission, charges payées + travaux terminés
    const parMois = moisAnnee.map((m) => {
      const ps = data.paiements.filter((p) => p.valide && ids.has(p.bienId) && p.mois === m);
      const brut = ps.reduce((s, p) => s + Number(p.montant || 0), 0);
      const com = ps.reduce((s, p) => { const b = biens.find((x) => x.id === p.bienId);
        return s + commissionBien(b, p.montant); }, 0);
      // charges payées rattachées à un bien du propriétaire, datées de ce mois (échéance ou date)
      const charges = (data.factures || []).filter((fc) => fc.statut === "payee" && ids.has(fc.bienId) &&
        ((fc.echeance || fc.date || "").slice(0, 7) === m)).reduce((s, fc) => s + Number(fc.montant || 0), 0);
      // travaux DÉCAISSÉS et validés par la gérante, rattachés à un bien du propriétaire, datés de ce mois
      const travaux = (data.tickets || []).filter((t) => t.decaisse && ids.has(t.bienId) &&
        (((t.dateDecaisse || t.echeance) || "").slice(0, 7) === m)).reduce((s, t) => s + Number(t.montantDecaisse || t.cout || 0), 0);
      const deductions = charges + travaux;
      const net = brut - com - deductions;
      return { mois: m, brut, com, charges, travaux, deductions, net };
    });
    const tot = parMois.reduce((a, x) => ({
      brut: a.brut + x.brut, com: a.com + x.com, charges: a.charges + x.charges,
      travaux: a.travaux + x.travaux, deductions: a.deductions + x.deductions, net: a.net + x.net,
    }), { brut: 0, com: 0, charges: 0, travaux: 0, deductions: 0, net: 0 });
    return { biens, parMois, tot };
  };

  const lignes = useMemo(() => proprios.map((pr) => ({ pr, ...calcProprio(pr) }))
    .filter((l) => l.tot.brut > 0 || l.biens.length > 0)
    .sort((a, b) => b.tot.net - a.tot.net), [data, annee]);

  const totalGeneral = lignes.reduce((a, l) => ({
    brut: a.brut + l.tot.brut, com: a.com + l.tot.com, deductions: a.deductions + l.tot.deductions, net: a.net + l.tot.net,
  }), { brut: 0, com: 0, deductions: 0, net: 0 });

  // Vue détaillée d'un propriétaire
  if (detail) {
    const l = lignes.find((x) => x.pr.id === detail);
    if (!l) { setDetail(null); return null; }
    return (
      <div>
        <button onClick={() => setDetail(null)} className="text-sm mb-4 sans-impression" style={{ color: C.mute }}>← Retour aux reversements</button>
        <Head title={l.pr.nom} sub={"Détail des perceptions " + annee} />

        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
          <StatFin label="Loyers encaissés" value={fcfa(l.tot.brut)} tone="ink" sub="validés" />
          <StatFin label="Commission agence" value={fcfa(l.tot.com)} tone="clay" sub="déduite" />
          <StatFin label="Travaux & charges" value={fcfa(l.tot.deductions)} tone="clay" sub="déduits" />
          <StatFin label="Net perçu" value={fcfa(l.tot.net)} tone="green" sub="dans l'année" />
        </div>

        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr style={{ background: "#F5F4EE" }}>
              {["Mois","Loyers perçus","Commission","Travaux & charges","Net dû"].map((h) => (
                <th key={h} className="text-left px-4 py-2.5 text-[10px] font-semibold uppercase tracking-[0.12em]" style={{ color: C.mute }}>{h}</th>))}
            </tr></thead>
            <tbody className="divide-y" style={{ borderColor: C.line }}>
              {l.parMois.map((m, i) => (
                <tr key={i} style={{ opacity: m.brut || m.deductions ? 1 : 0.5 }}>
                  <td className="px-4 py-2.5 capitalize" style={{ color: C.ink }}>{moisLabel(m.mois)}</td>
                  <td className="px-4 py-2.5 tabular-nums" style={{ color: C.ink }}>{m.brut ? fmt(m.brut) : "—"}</td>
                  <td className="px-4 py-2.5 tabular-nums" style={{ color: C.mute }}>{m.com ? "- " + fmt(m.com) : "—"}</td>
                  <td className="px-4 py-2.5 tabular-nums" style={{ color: m.deductions ? C.clay : C.mute }}>{m.deductions ? "- " + fmt(m.deductions) : "—"}</td>
                  <td className="px-4 py-2.5 tabular-nums font-semibold" style={{ color: m.net >= 0 ? C.green : C.clay }}>{m.brut || m.deductions ? fmt(m.net) : "—"}</td>
                </tr>))}
              <tr className="garder-couleur" style={{ background: "#F5F4EE" }}>
                <td className="px-4 py-3 font-bold" style={{ color: C.ink }}>Total {annee}</td>
                <td className="px-4 py-3 tabular-nums font-bold" style={{ color: C.ink }}>{fmt(l.tot.brut)}</td>
                <td className="px-4 py-3 tabular-nums font-bold" style={{ color: C.clay }}>- {fmt(l.tot.com)}</td>
                <td className="px-4 py-3 tabular-nums font-bold" style={{ color: C.clay }}>- {fmt(l.tot.deductions)}</td>
                <td className="px-4 py-3 tabular-nums font-bold" style={{ color: C.green }}>{fmt(l.tot.net)}</td>
              </tr>
            </tbody>
          </table>
        </div></div>

        <p className="text-xs mt-3" style={{ color: C.mute }}>
          Biens gérés pour ce propriétaire : {l.biens.map((b) => b.nom).join(", ") || "—"}.
        </p>
      </div>
    );
  }

  return (
    <div>
      <Head title="Reversements propriétaires" sub="Ce que perçoit chaque propriétaire, par mois et au total"
        action={
          <div className="flex items-center gap-2">
            <button onClick={() => setAnnee(annee - 1)} className="px-2.5 py-1.5 rounded border text-sm" style={{ borderColor: C.line, color: C.ink }}>‹</button>
            <input type="number" value={annee} onChange={(e) => setAnnee(Number(e.target.value) || annee)} className="w-20 px-2 py-1.5 text-center font-bold tabular-nums rounded border bg-white outline-none" style={{ borderColor: C.line, color: C.ink }} />
            <button onClick={() => setAnnee(annee + 1)} className="px-2.5 py-1.5 rounded border text-sm" style={{ borderColor: C.line, color: C.ink }}>›</button>
          </div>
        } />

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
        <StatFin label="Loyers encaissés" value={fcfa(totalGeneral.brut)} tone="ink" sub="tous propriétaires" />
        <StatFin label="Revenus d'agence" value={fcfa(totalGeneral.com)} tone="green" sub="commissions" />
        <StatFin label="Travaux & charges" value={fcfa(totalGeneral.deductions)} tone="clay" sub="déduits" />
        <StatFin label="Net reversé" value={fcfa(totalGeneral.net)} tone="green" sub="aux propriétaires" />
      </div>

      {lignes.length === 0 ? <Empty text="Aucun propriétaire avec des loyers sur cette année. Rattachez vos biens à des propriétaires et validez les encaissements." />
        : <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr style={{ background: "#F5F4EE" }}>
                <th className="text-left px-4 py-2.5 text-[10px] font-semibold uppercase tracking-[0.1em] sticky left-0" style={{ color: C.mute, background: "#F5F4EE", minWidth: 140 }}>Propriétaire</th>
                {MOIS_COURTS.map((m, i) => (
                  <th key={i} className="px-1 py-2.5 text-[10px] font-semibold text-center" style={{ color: C.mute, minWidth: 44 }}>{m}</th>))}
                <th className="px-3 py-2.5 text-[10px] font-semibold uppercase tracking-[0.1em] text-right" style={{ color: C.mute, minWidth: 90 }}>Net total</th>
              </tr></thead>
              <tbody className="divide-y" style={{ borderColor: C.line }}>
                {lignes.map((l) => (
                  <tr key={l.pr.id} className="cursor-pointer hover:bg-black/[0.02]" onClick={() => setDetail(l.pr.id)}>
                    <td className="px-4 py-2.5 sticky left-0 bg-white" style={{ minWidth: 140 }}>
                      <div className="font-medium" style={{ color: C.green }}>{l.pr.nom}</div>
                      <div className="text-[10px]" style={{ color: C.mute }}>{l.biens.length} bien(s)</div>
                    </td>
                    {l.parMois.map((m, i) => (
                      <td key={i} className="px-1 py-2.5 text-center text-[10px] tabular-nums" style={{ color: m.net ? C.ink : C.mute }}>
                        {m.net ? Math.round(m.net / 1000) + "k" : "—"}
                      </td>))}
                    <td className="px-3 py-2.5 text-right tabular-nums font-bold" style={{ color: C.green }}>{fmt(l.tot.net)}</td>
                  </tr>))}
                <tr className="garder-couleur" style={{ background: "#F5F4EE" }}>
                  <td className="px-4 py-3 font-bold sticky left-0" style={{ color: C.ink, background: "#F5F4EE" }}>Total</td>
                  {moisAnnee.map((m, i) => {
                    const t = lignes.reduce((s, l) => s + l.parMois[i].net, 0);
                    return <td key={i} className="px-1 py-3 text-center text-[9px] tabular-nums font-semibold" style={{ color: t ? C.green : C.mute }}>{t ? Math.round(t / 1000) + "k" : "—"}</td>;
                  })}
                  <td className="px-3 py-3 text-right tabular-nums font-bold" style={{ color: C.green }}>{fmt(totalGeneral.net)}</td>
                </tr>
              </tbody>
            </table>
          </div></div>}

      <p className="text-xs mt-3 sans-impression" style={{ color: C.mute }}>
        Chaque montant est le net perçu par le propriétaire (loyers validés − commission − travaux et charges payés). Touchez une ligne pour le détail mois par mois. Montants en milliers (k) dans le tableau.
      </p>
    </div>
  );
}

function PointProprietaire({ data }) {
  const P = data.parametres || PARAMS_DEFAUT;
  const fiches = data.proprietaires || [];
  // Liste unifiée : fiches propriétaires + noms libres présents sur les biens
  const nomsLibres = [...new Set(data.biens.map((b) => b.proprietaire).filter(Boolean))]
    .filter((nom) => !fiches.some((f) => f.nom === nom));
  const options = [...fiches.map((f) => ({ id: f.id, nom: f.nom, fiche: f })),
    ...nomsLibres.map((nom) => ({ id: "libre:" + nom, nom, fiche: null }))];

  const [sel, setSel] = useState("");
  const [debut, setDebut] = useState(addMois(moisCourant(), -5));
  const [fin, setFin] = useState(moisCourant());
  const [info, setInfo] = useState(null);

  const choix = options.find((o) => o.id === sel);
  const fiche = choix ? choix.fiche : null;
  const nomProprio = choix ? choix.nom : "";

  const calc = useMemo(() => {
    if (!choix) return null;
    const biens = data.biens.filter((b) => (fiche && b.proprietaireId === fiche.id) || b.proprietaire === nomProprio);
    const ids = new Set(biens.map((b) => b.id));
    const ps = data.paiements.filter((p) => ids.has(p.bienId) && p.mois >= debut && p.mois <= fin && p.valide);
    const lignes = ps.map((p) => { const b = biens.find((x) => x.id === p.bienId);
      const com = commissionBien(b, p.montant);
      const loc = data.locataires.find((l) => l.id === p.locataireId || (l.bienId === (b || {}).id && l.actif !== false));
      return { bien: (b || {}).nom || "—", locataire: (loc || {}).nom || "", mois: p.mois,
        brut: Number(p.montant), taux: (b || {}).commission || 0, modeFixe: (b || {}).commissionMode === "fixe", com, net: Number(p.montant) - com };
    }).sort((a, b) => a.mois.localeCompare(b.mois) || a.bien.localeCompare(b.bien));
    // Charges PAYÉES et travaux DÉCAISSÉS sur la période, déduits du net (détaillés pour le propriétaire)
    const dansPeriode = (d) => { const m = (d || "").slice(0, 7); return m && m >= debut && m <= fin; };
    const chargesPayees = data.factures.filter((f) => ids.has(f.bienId) && f.statut === "payee" && dansPeriode(f.echeance || f.date))
      .map((f) => ({ libelle: f.libelle || f.type, montant: Number(f.montant || 0), date: f.echeance || f.date || "", type: "charge" }));
    const travauxDecaisses = (data.tickets || []).filter((t) => t.decaisse && ids.has(t.bienId) && dansPeriode(t.dateDecaisse || t.echeance))
      .map((t) => ({ libelle: t.titre, montant: Number(t.montantDecaisse || t.cout || 0), date: t.dateDecaisse || t.echeance || "", type: "travaux" }));
    const deductions = [...travauxDecaisses, ...chargesPayees].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
    // Charges à venir (non payées) — affichées à titre informatif, non déduites
    const charges = data.factures.filter((f) => ids.has(f.bienId) && f.statut !== "payee");
    const tb = lignes.reduce((s, l) => s + l.brut, 0), tc = lignes.reduce((s, l) => s + l.com, 0);
    const tn = lignes.reduce((s, l) => s + l.net, 0);
    const tded = deductions.reduce((s, d) => s + d.montant, 0);
    // Détail du parc
    const parc = biens.map((b) => {
      const loc = data.locataires.find((l) => l.bienId === b.id && l.actif !== false);
      return { nom: b.nom, adresse: b.adresse, loyer: Number(b.loyer || 0), loue: !!loc, locataire: (loc || {}).nom || "" };
    });
    const attendu = parc.filter((x) => x.loue).reduce((s, x) => s + x.loyer, 0);
    const nbMois = Math.max(1, (Number(fin.slice(0, 4)) * 12 + Number(fin.slice(5, 7))) - (Number(debut.slice(0, 4)) * 12 + Number(debut.slice(5, 7))) + 1);
    return { biens, parc, lignes, charges, deductions, tb, tc, tn, tded, net: tn - tded, attendu, nbMois,
      occ: parc.filter((x) => x.loue).length, vac: parc.filter((x) => !x.loue).length };
  }, [choix, fiche, nomProprio, debut, fin, data]);

  const periode = moisLabel(debut) + (debut !== fin ? " au " + moisLabel(fin) : "");

  const envoyerWhatsApp = async () => {
    await genererPdf(document.getElementById("doc-releve"), "Releve_" + nomProprio.replace(/\s+/g, "_") + ".pdf");
    const msg = "Bonjour " + nomProprio + ",\n\nVeuillez trouver votre relevé de gestion pour la période " + periode + ".\n" +
      "Montant net à reverser : " + fcfa(calc.net) + ".\n\n" + (P.societe || "Season Immobilier");
    ouvrirWhatsApp(fiche && fiche.tel, msg);
  };
  const envoyerMail = async () => {
    await genererPdf(document.getElementById("doc-releve"), "Releve_" + nomProprio.replace(/\s+/g, "_") + ".pdf");
    const sujet = "Relevé de gestion " + periode + " — " + (P.societe || "Season Immobilier");
    const corps = "Bonjour " + nomProprio + ",\n\nVeuillez trouver votre relevé de gestion pour la période " + periode + ".\n" +
      "Montant net à reverser : " + fcfa(calc.net) + ".\n\nLe document PDF est joint à ce message.\n\nCordialement,\n" + (P.societe || "Season Immobilier");
    ouvrirMail(fiche && fiche.email, sujet, corps);
  };

  return (
    <div>
      <Head title="Relevé propriétaire" sub="Synthèse complète des loyers, commissions, charges et net à reverser"
        action={calc && <>
          <Btn variant="ghost" onClick={() => genererPdf(document.getElementById("doc-releve"), "Releve_" + nomProprio.replace(/\s+/g, "_") + ".pdf")}>Télécharger PDF</Btn>
          <Btn variant="solid" onClick={() => window.print()}>Imprimer</Btn>
          <Btn variant="accent" onClick={envoyerWhatsApp}>WhatsApp</Btn>
          <Btn variant="accent" onClick={envoyerMail}>Email</Btn>
        </>} />

      <div className="flex flex-wrap gap-3 mb-6 sans-impression">
        <div className="min-w-[220px]"><Label>Propriétaire</Label>
          <Select value={sel} onChange={(e) => setSel(e.target.value)}>
            <option value="">Sélectionner</option>
            {options.map((o) => <option key={o.id} value={o.id}>{o.nom}</option>)}</Select></div>
        <div><Label>Du mois</Label><input type="month" value={debut} onChange={(e) => setDebut(e.target.value)}
          className="px-3 py-2 text-sm rounded border bg-white outline-none" style={{ borderColor: C.line, color: C.ink }} /></div>
        <div><Label>Au mois</Label><input type="month" value={fin} onChange={(e) => setFin(e.target.value)}
          className="px-3 py-2 text-sm rounded border bg-white outline-none" style={{ borderColor: C.line, color: C.ink }} /></div>
      </div>

      {!choix ? <Empty text="Sélectionnez un propriétaire pour générer son relevé complet." />
        : <div className="zone-impression" id="doc-releve" style={{ background: "#fff" }}><div className="p-2 sm:p-6">

            <EnTete p={P} droite={<div>
              <div className="text-[10px] uppercase tracking-[0.14em]" style={{ color: C.mute }}>Relevé de gestion</div>
              <div className="font-bold text-sm" style={{ color: C.ink }}>{periode}</div>
              <div className="text-[10px] mt-1" style={{ color: C.mute }}>Édité le {dateLongue(aujourdhui())}</div></div>} />

            {/* Bloc propriétaire */}
            <div className="grid sm:grid-cols-2 gap-4 mb-6">
              <div>
                <Label>Propriétaire</Label>
                <div className="text-sm font-bold" style={{ color: C.ink }}>{nomProprio}</div>
                {fiche && <div className="text-xs mt-0.5 leading-relaxed" style={{ color: C.mute }}>
                  {fiche.type && <div>{fiche.type}</div>}
                  {fiche.tel && <div>{fiche.tel}{fiche.tel2 ? " · " + fiche.tel2 : ""}</div>}
                  {fiche.email && <div>{fiche.email}</div>}
                  {fiche.adresse && <div>{fiche.adresse}</div>}
                </div>}
              </div>
              <div className="grid grid-cols-3 gap-2">
                <div className="rounded p-2.5 garder-couleur" style={{ background: C.greenSoft }}>
                  <div className="text-[9px] uppercase tracking-wide" style={{ color: C.mute }}>Biens</div>
                  <div className="text-base font-bold" style={{ color: C.ink }}>{calc.parc.length}</div></div>
                <div className="rounded p-2.5 garder-couleur" style={{ background: C.greenSoft }}>
                  <div className="text-[9px] uppercase tracking-wide" style={{ color: C.mute }}>Occupés</div>
                  <div className="text-base font-bold" style={{ color: C.green }}>{calc.occ}</div></div>
                <div className="rounded p-2.5 garder-couleur" style={{ background: C.goldSoft }}>
                  <div className="text-[9px] uppercase tracking-wide" style={{ color: C.mute }}>Vacants</div>
                  <div className="text-base font-bold" style={{ color: C.gold }}>{calc.vac}</div></div>
              </div>
            </div>

            {/* Parc immobilier */}
            <Label>Patrimoine géré</Label>
            <div className="overflow-x-auto mb-6"><table className="w-full text-sm">
              <thead><tr className="border-b" style={{ borderColor: C.line }}>
                {["Bien","Adresse","Loyer mensuel","Situation"].map((h) => (
                  <th key={h} className="text-left py-2 text-[10px] font-semibold uppercase tracking-[0.12em]" style={{ color: C.mute }}>{h}</th>))}
              </tr></thead>
              <tbody>
                {calc.parc.map((x, i) => (
                  <tr key={i} className="border-b" style={{ borderColor: C.line }}>
                    <td className="py-2.5" style={{ color: C.ink }}>{x.nom}</td>
                    <td className="py-2.5 text-xs" style={{ color: C.mute }}>{x.adresse || "—"}</td>

                  </tr>))}
              </tbody>
            </table></div>

            {/* Loyers encaissés */}
            <Label>Loyers encaissés sur la période</Label>
            {calc.lignes.length === 0 ? <p className="text-sm mb-6 mt-1" style={{ color: C.mute }}>Aucun loyer encaissé sur cette période.</p>
              : <div className="overflow-x-auto mb-6 mt-1"><table className="w-full text-sm">
                  <thead><tr className="border-b" style={{ borderColor: C.line }}>
                    {["Bien","Locataire","Mois","Loyer perçu","Commission","À reverser"].map((h) => (
                      <th key={h} className="text-left py-2 text-[10px] font-semibold uppercase tracking-[0.12em]" style={{ color: C.mute }}>{h}</th>))}
                  </tr></thead>
                  <tbody>
                    {calc.lignes.map((l, i) => (
                      <tr key={i} className="border-b" style={{ borderColor: C.line }}>
                        <td className="py-2.5" style={{ color: C.ink }}>{l.bien}</td>
                        <td className="py-2.5 text-xs" style={{ color: C.mute }}>{l.locataire}</td>
                        <td className="py-2.5 capitalize text-xs" style={{ color: C.mute }}>{moisLabel(l.mois)}</td>
                        <td className="py-2.5 tabular-nums" style={{ color: C.ink }}>{fmt(l.brut)}</td>
                        <td className="py-2.5 tabular-nums" style={{ color: C.mute }}>{fmt(l.com)} ({l.modeFixe ? "fixe" : l.taux + "%"})</td>
                        <td className="py-2.5 tabular-nums font-semibold" style={{ color: C.ink }}>{fmt(l.net)}</td>
                      </tr>))}
                    <tr className="garder-couleur" style={{ background: "#F5F4EE" }}>
                      <td className="py-2.5 px-1 font-semibold" colSpan={3} style={{ color: C.ink }}>Totaux</td>
                      <td className="py-2.5 tabular-nums font-semibold" style={{ color: C.ink }}>{fmt(calc.tb)}</td>
                      <td className="py-2.5 tabular-nums font-semibold" style={{ color: C.ink }}>{fmt(calc.tc)}</td>
                      <td className="py-2.5 tabular-nums font-semibold" style={{ color: C.ink }}>{fmt(calc.tn)}</td>
                    </tr>
                  </tbody></table></div>}

            {/* Travaux et charges déduits */}
            <Label>Travaux et charges déduits sur la période</Label>
            {calc.deductions.length === 0 ? <p className="text-sm mb-6 mt-1" style={{ color: C.mute }}>Aucun travail ni charge déduit sur cette période.</p>
              : <table className="w-full text-sm mb-6 mt-1"><tbody>
                  {calc.deductions.map((d, i) => (
                    <tr key={i} className="border-b" style={{ borderColor: C.line }}>
                      <td className="py-2.5" style={{ color: C.ink }}>{d.libelle}
                        <span className="text-xs" style={{ color: C.mute }}> · {d.type === "travaux" ? "travaux" : "charge"}{d.date ? " · " + d.date : ""}</span></td>
                      <td className="py-2.5 text-right tabular-nums" style={{ color: C.clay }}>- {fmt(d.montant)}</td>
                    </tr>))}
                  <tr className="garder-couleur" style={{ background: "#F5F4EE" }}>
                    <td className="py-2.5 px-1 font-semibold" style={{ color: C.ink }}>Total déduit</td>
                    <td className="py-2.5 text-right tabular-nums font-semibold" style={{ color: C.clay }}>- {fmt(calc.tded)}</td>
                  </tr></tbody></table>}

            {calc.charges.length > 0 && (
              <p className="text-xs mb-6" style={{ color: C.mute }}>
                À noter : {calc.charges.length} charge(s) en attente de règlement ne sont pas encore déduites de ce relevé.
              </p>
            )}

            {/* Synthèse */}
            <Label>Synthèse du décompte</Label>
            <div className="rounded border mb-4 mt-1 overflow-hidden garder-couleur" style={{ borderColor: C.line }}>
              <table className="w-full text-sm">
                <tbody>
                  <tr className="border-b" style={{ borderColor: C.line }}>
                    <td className="py-2.5 px-3" style={{ color: C.mute }}>Total des loyers encaissés</td>
                    <td className="py-2.5 px-3 text-right tabular-nums" style={{ color: C.ink }}>{fmt(calc.tb)}</td></tr>
                  <tr className="border-b" style={{ borderColor: C.line }}>
                    <td className="py-2.5 px-3" style={{ color: C.mute }}>Commission d'agence</td>
                    <td className="py-2.5 px-3 text-right tabular-nums" style={{ color: C.clay }}>- {fmt(calc.tc)}</td></tr>
                  <tr className="border-b" style={{ borderColor: C.line }}>
                    <td className="py-2.5 px-3" style={{ color: C.mute }}>Travaux et charges déduits</td>
                    <td className="py-2.5 px-3 text-right tabular-nums" style={{ color: C.clay }}>- {fmt(calc.tded)}</td></tr>
                </tbody>
              </table>
            </div>
            <div className="flex items-center justify-between px-4 py-3.5 rounded gap-3 garder-couleur" style={{ background: C.greenSoft }}>
              <span className="font-bold text-sm" style={{ color: C.ink }}>Montant net à reverser</span>
              <span className="font-bold text-lg tabular-nums" style={{ color: C.green }}>{fcfa(calc.net)}</span>
            </div>
            <p className="text-sm italic mt-2" style={{ color: C.mute }}>
              Soit {enLettres(calc.net)} francs CFA.
            </p>

            {P.banque && <p className="text-xs mt-4" style={{ color: C.mute }}>Règlement par virement — {P.banque}</p>}

            <div className="mt-6 flex justify-end">
              <div className="text-center">
                <div className="text-xs mb-10" style={{ color: C.mute }}>Pour {P.societe || "l'agence"}</div>
                <div className="border-t pt-1.5 text-xs w-44" style={{ borderColor: C.line, color: C.mute }}>Signature et cachet</div>
              </div>
            </div>
            <PiedPage p={P} />
          </div></div>}
    </div>
  );
}

/* ================================= export ================================= */

function Export({ data, save }) {
  const [msg, setMsg] = useState(null);
  const [confirmation, setConfirmation] = useState("");
  const [aRestaurer, setARestaurer] = useState(null);
  const P = data.parametres || PARAMS_DEFAUT;

  /* ---------------- Sauvegarde intégrale ---------------- */
  const derniereSauvegarde = P.derniereSauvegarde || null;
  const joursDepuisSauvegarde = derniereSauvegarde ? joursDepuis(derniereSauvegarde) : null;

  const compterTout = (d) => {
    const cles = Object.keys(d).filter((k) => Array.isArray(d[k]));
    return cles.reduce((s, k) => s + d[k].length, 0);
  };

  const sauvegarder = () => {
    try {
      const paquet = {
        format: "season-immobilier-sauvegarde",
        version: 1,
        genereLe: new Date().toISOString(),
        societe: P.societe || "Season Immobilier",
        donnees: data,
      };
      const blob = new Blob([JSON.stringify(paquet)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Sauvegarde_Season_" + aujourdhui() + ".json";
      a.click();
      URL.revokeObjectURL(url);
      save({ ...data, parametres: { ...P, derniereSauvegarde: new Date().toISOString() } },
        "a téléchargé une sauvegarde intégrale");
      setMsg({ t: "ok", m: "Sauvegarde téléchargée. Conservez-la hors de cet appareil : messagerie, clé USB ou espace de stockage en ligne." });
    } catch (e) { setMsg({ t: "bad", m: "La sauvegarde n'a pas abouti : " + ((e && e.message) || "erreur") + "." }); }
  };

  const choisirSauvegarde = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const paquet = JSON.parse(r.result);
        const d = paquet && paquet.donnees ? paquet.donnees : paquet;
        if (!d || !Array.isArray(d.biens)) throw new Error("fichier non reconnu");
        setARestaurer({ paquet, d });
        setConfirmation("");
        setMsg(null);
      } catch (err) {
        setMsg({ t: "bad", m: "Ce fichier n'est pas une sauvegarde valide de l'application." });
      }
    };
    r.onerror = () => setMsg({ t: "bad", m: "Le fichier n'a pas pu être lu." });
    r.readAsText(file);
  };

  const restaurer = () => {
    if (!aRestaurer) return;
    save(aRestaurer.d, "a restauré une sauvegarde du " + String(aRestaurer.paquet.genereLe || "").slice(0, 10));
    setARestaurer(null);
    setMsg({ t: "ok", m: "Sauvegarde restaurée. Vérifiez vos données onglet par onglet." });
  };

  const nomBien = (id) => (data.biens.find((b) => b.id === id) || {}).nom || "";
  const nomAgent = (id) => (data.agents.find((a) => a.id === id) || {}).nom || "";

  const exporter = () => {
    try {
      const wb = XLSX.utils.book_new();
      const biens = data.biens.map((b) => ({ "Bien": b.nom, "Adresse": b.adresse, "Type": b.type,
        "Loyer mensuel (F CFA)": Number(b.loyer) || 0, "Commission (%)": Number(b.commission) || 0,
        "Propriétaire": b.proprietaire, "Agent": nomAgent(b.agentId),
        "Statut": data.locataires.some((l) => l.bienId === b.id && l.actif !== false) ? "Occupé" : "Vacant" }));
      const locataires = data.locataires.map((l) => ({ "Locataire": l.nom, "Téléphone": l.tel, "Email": l.email,
        "Bien": nomBien(l.bienId), "Date d'entrée": l.entree, "Jour d'échéance": l.jour || 5,
        "Caution (mois)": l.caution, "Avance (mois)": l.avance, "Statut": l.actif !== false ? "Actif" : "Sorti" }));
      const paiements = [...data.paiements].sort((a, b) => (a.mois || "").localeCompare(b.mois || "")).map((p) => {
        const b = data.biens.find((x) => x.id === p.bienId);
        const com = commissionBien(b, p.montant);
        return { "N° quittance": p.numero || "", "Mois": moisLabel(p.mois), "Bien": nomBien(p.bienId),
          "Locataire": (data.locataires.find((l) => l.id === p.locataireId) || {}).nom || "",
          "Montant reçu (F CFA)": Number(p.montant) || 0, "Commission agence (F CFA)": com,
          "Net propriétaire (F CFA)": (Number(p.montant) || 0) - com, "Date": p.date, "Mode": p.mode }; });
      const factures = data.factures.map((f) => ({ "Désignation": f.libelle || f.type, "Type": f.type,
        "Bien": nomBien(f.bienId), "Montant (F CFA)": Number(f.montant) || 0, "Échéance": f.echeance,
        "Statut": f.statut === "payee" ? "Payée" : "En cours" }));
      const agents = data.agents.map((a) => {
        const bs = data.biens.filter((b) => b.agentId === a.id);
        const ids = new Set(bs.map((b) => b.id));
        const com = data.paiements.filter((p) => ids.has(p.bienId)).reduce((s, p) => {
          const b = bs.find((x) => x.id === p.bienId);
          return s + commissionBien(b, p.montant); }, 0);
        return { "Agent": a.nom, "Téléphone": a.tel, "Email": a.email, "Biens gérés": bs.length,
          "Part commission (%)": a.part, "Commission agence générée (F CFA)": com,
          "Part agent (F CFA)": Math.round(com * Number(a.part || 0) / 100) }; });
      const lib = { bon: "Bon état", moyen: "État moyen", mauvais: "Mauvais état" };
      const etats = [];
      data.etats.forEach((e) => {
        const b = nomBien(e.bienId);
        const l = (data.locataires.find((x) => x.id === e.locataireId) || {}).nom || "";
        const base = { "Type": e.type === "entree" ? "Entrée" : "Sortie", "Date": e.date, "Bien": b, "Locataire": l,
          "Statut": e.cloture ? "Clôturé" : "En cours" };
        if (e.pieces.length === 0) etats.push({ ...base, "Pièce": "", "État": "", "Observations": e.observations || "", "Photos": 0 });
        e.pieces.forEach((p) => etats.push({ ...base, "Pièce": p.nom, "État": lib[p.etat] || "",
          "Observations": p.obs || "", "Photos": (p.photos || []).length }));
      });

      let vide = true;
      [["Biens", biens],["Locataires", locataires],["Paiements", paiements],
       ["Charges", factures],["Agents", agents],["États des lieux", etats]].forEach(([nom, rows]) => {
        if (!rows.length) return;
        vide = false;
        const ws = XLSX.utils.json_to_sheet(rows);
        ws["!cols"] = Object.keys(rows[0]).map((k) => ({
          wch: Math.min(46, Math.max(k.length + 2, ...rows.map((r) => String(r[k] == null ? "" : r[k]).length + 2))) }));
        XLSX.utils.book_append_sheet(wb, ws, nom);
      });
      if (vide) { setMsg({ t: "warn", m: "Aucune donnée à exporter." }); return; }
      XLSX.writeFile(wb, "Season_Gestion_" + aujourdhui() + ".xlsx");
      setMsg({ t: "ok", m: "Fichier Excel téléchargé." });
    } catch (e) { setMsg({ t: "bad", m: "Export impossible. Réessayez." }); }
  };

  const compte = [["Biens", data.biens.length],["Locataires", data.locataires.length],
    ["Paiements enregistrés", data.paiements.length],["Charges & factures", data.factures.length],
    ["Agents", data.agents.length],["États des lieux", data.etats.length]];

  return (
    <div>
      <Head title="Export et sauvegarde" sub="Classeur comptable et sauvegarde intégrale du dossier" />

      {/* ---------- Sauvegarde ---------- */}
      {joursDepuisSauvegarde === null && (
        <div className="mb-4 px-4 py-3 rounded text-sm garder-couleur" style={{ background: "#FDECEC", color: C.clay }}>
          <b>Aucune sauvegarde n'a jamais été téléchargée.</b> Toutes vos données reposent sur un seul serveur.
          Téléchargez une sauvegarde dès maintenant et conservez-la ailleurs.
        </div>
      )}
      {joursDepuisSauvegarde !== null && joursDepuisSauvegarde > 30 && (
        <div className="mb-4 px-4 py-3 rounded text-sm garder-couleur" style={{ background: C.goldSoft, color: C.gold }}>
          Votre dernière sauvegarde date de {joursDepuisSauvegarde} jours. Une sauvegarde mensuelle est recommandée.
        </div>
      )}

      <div className={card + " max-w-lg mb-5"} style={{ borderColor: C.line }}><div className="p-5">
        <h3 className="font-semibold text-sm mb-1" style={{ color: C.ink }}>Sauvegarde intégrale</h3>
        <p className="text-sm mb-3" style={{ color: C.mute }}>
          Un fichier unique contenant l'ensemble du dossier : biens, propriétaires, locataires, loyers, factures,
          reçus, contrats, mandats, prospects, studios et paramètres. Il permet de tout remettre en place en cas
          d'incident.
        </p>
        <div className="space-y-1.5 text-sm mb-4">
          <Row k="Enregistrements au total" v={compterTout(data)} />
          <Row k="Dernière sauvegarde" v={derniereSauvegarde
            ? dateLongue(derniereSauvegarde.slice(0, 10)) + (joursDepuisSauvegarde ? " (il y a " + joursDepuisSauvegarde + " j)" : " (aujourd'hui)")
            : "jamais"} />
        </div>
        <div className="flex gap-2 flex-wrap">
          <Btn variant="accent" onClick={sauvegarder}>Télécharger la sauvegarde</Btn>
          <label className="px-3.5 py-2 rounded text-sm font-medium cursor-pointer" style={{ border: "1px solid " + C.line, color: C.ink }}>
            Restaurer un fichier
            <input type="file" accept=".json,application/json" onChange={choisirSauvegarde} style={{ display: "none" }} />
          </label>
        </div>
        <p className="text-[11px] mt-3" style={{ color: C.mute }}>
          <b>Ce que la sauvegarde ne contient pas :</b> les pièces jointes et les photos d'états des lieux, stockées
          séparément. Elles restent en place tant que le projet Supabase existe, mais ne seraient pas restaurées
          par ce fichier.
        </p>
      </div></div>

      {/* ---------- Confirmation de restauration ---------- */}
      {aRestaurer && (
        <Modal title="Restaurer une sauvegarde" onClose={() => setARestaurer(null)}>
          <div className="space-y-3">
            <div className="px-4 py-3 rounded text-sm garder-couleur" style={{ background: "#FDECEC", color: C.clay }}>
              <b>Cette opération remplace l'intégralité du dossier actuel.</b> Tout ce qui a été saisi depuis cette
              sauvegarde sera perdu, pour vous comme pour vos collaborateurs.
            </div>
            <div className="space-y-1.5 text-sm">
              <Row k="Sauvegarde du" v={aRestaurer.paquet.genereLe ? dateLongue(String(aRestaurer.paquet.genereLe).slice(0, 10)) : "date inconnue"} />
              <Row k="Enregistrements dans le fichier" v={compterTout(aRestaurer.d)} />
              <Row k="Enregistrements actuels" v={compterTout(data)} />
              <Row k="Biens" v={(aRestaurer.d.biens || []).length + " (actuellement " + (data.biens || []).length + ")"} />
              <Row k="Locataires" v={(aRestaurer.d.locataires || []).length + " (actuellement " + (data.locataires || []).length + ")"} />
            </div>
            <Field label="Pour confirmer, saisissez RESTAURER en majuscules">
              <Input value={confirmation} onChange={(e) => setConfirmation(e.target.value)} placeholder="RESTAURER" /></Field>
            <div className="flex gap-2 pt-1">
              <Btn variant="danger" onClick={restaurer} disabled={confirmation !== "RESTAURER"}>Restaurer maintenant</Btn>
              <Btn variant="ghost" onClick={() => setARestaurer(null)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}

      <div className={card + " max-w-lg"} style={{ borderColor: C.line }}><div className="p-5">
        <h3 className="font-semibold text-sm mb-1" style={{ color: C.ink }}>Classeur Excel</h3>
        <p className="text-sm mb-4" style={{ color: C.mute }}>
          Une feuille par catégorie, avec commissions et montants nets calculés à l'export.
        </p>
        <div className="space-y-2 text-sm mb-5">{compte.map(([k, v]) => <Row key={k} k={k} v={v} />)}</div>
        <Btn variant="accent" onClick={exporter}>Télécharger le classeur</Btn>
        {msg && <div className="mt-4 px-3 py-2 rounded text-sm"
          style={{ background: msg.t === "ok" ? C.greenSoft : msg.t === "warn" ? C.goldSoft : C.claySoft,
            color: msg.t === "ok" ? C.green : msg.t === "warn" ? C.gold : C.clay }}>{msg.m}</div>}
      </div></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("racine")).render(<Racine />);
</script>

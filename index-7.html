                        {d.loc.email && <Btn variant="ghost" onClick={() => envoyer(d, niv.n, "Email")}>Email</Btn>}
                        {niv.n === 3 && <Btn variant="ghost" onClick={() => setCourrier(d.loc.id)}>Courrier de mise en demeure</Btn>}
                      </div>
                    </div>);
                })}
              </div>
        )}

        {vue === "historique" && (
          relances.length === 0 ? <Empty text="Aucune relance envoyée pour l'instant." />
            : <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead><tr style={{ background: "#F5F4EE" }}>
                    {["Date", "Locataire", "Niveau", "Montant", "Canal", "Par"].map((h) => (
                      <th key={h} className="px-3 py-2.5 text-left text-xs font-semibold" style={{ color: C.mute }}>{h}</th>))}
                  </tr></thead>
                  <tbody>
                    {relances.slice(0, 60).map((r) => {
                      const l = (data.locataires || []).find((x) => x.id === r.locataireId);
                      const niv = NIVEAUX_RELANCE.find((x) => x.n === Number(r.niveau));
                      return (
                        <tr key={r.id} style={{ borderTop: "1px solid " + C.line }}>
                          <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{dateLongue(r.date.slice(0, 10))}</td>
                          <td className="px-3 py-2.5" style={{ color: C.ink }}>{(l || {}).nom || "—"}</td>
                          <td className="px-3 py-2.5"><Tag tone={niv ? niv.tone : "neutral"}>{niv ? niv.libelle : r.niveau}</Tag></td>
                          <td className="px-3 py-2.5 tabular-nums text-xs" style={{ color: C.ink }}>{fcfa(r.montant)}</td>
                          <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{r.canal}</td>
                          <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{String(r.par || "").split("@")[0]}</td>
                        </tr>);
                    })}
                  </tbody>
                </table>
              </div></div>
        )}
      </>}

      <p className="text-xs mt-4 sans-impression" style={{ color: C.mute }}>
        Le retard se calcule à partir du jour d'échéance défini sur la fiche du locataire. Seuls les mois échus sont
        comptés. Un paiement partiel laisse le solde en impayé.
      </p>
    </div>
  );
}

/* ============================== Mandats ============================== */

const MANDAT_OBJETS = [["vente", "Vente"], ["location", "Location"]];
const MANDAT_TYPES = [
  ["exclusif", "Exclusif", "ok"],
  ["semi", "Semi-exclusif", "gold"],
  ["simple", "Simple", "neutral"],
];
const MANDAT_STATUTS = [["actif", "En cours"], ["resilie", "Résilié"], ["abouti", "Abouti"]];

function libelleMandat(m) {
  const t = MANDAT_TYPES.find((x) => x[0] === m.type);
  const o = MANDAT_OBJETS.find((x) => x[0] === m.objet);
  return "Mandat " + (t ? t[1].toLowerCase() : m.type) + " de " + (o ? o[1].toLowerCase() : m.objet);
}
function toneMandat(k) { const t = MANDAT_TYPES.find((x) => x[0] === k); return t ? t[2] : "neutral"; }

// Date de fin = signature + durée en mois
function finMandat(m) {
  if (m.dateFin) return m.dateFin;
  if (!m.dateSignature || !m.duree) return "";
  const d = new Date(m.dateSignature);
  if (isNaN(d)) return "";
  const jour = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + Number(m.duree));
  // Ramène au dernier jour du mois si le quantième n'existe pas (31 janvier + 1 mois = 28 février)
  const dernier = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(jour, dernier));
  return d.toISOString().slice(0, 10);
}

function Mandats({ data, save, moi, c }) {
  const P = data.parametres || PARAMS_DEFAUT;
  const liste = data.mandats || [];
  const agents = data.agents || [];
  const emailGerante = (P.gerante || "aude.nioble@season-immobilier.com").trim().toLowerCase();
  const suisGerante = String(moi || "").trim().toLowerCase() === emailGerante;

  const [open, setOpen] = useState(false);
  const [editId, setEditId] = useState(null);
  const [fiche, setFiche] = useState(null);
  const [fObjet, setFObjet] = useState("tous");
  const [fType, setFType] = useState("tous");
  const [fStatut, setFStatut] = useState("actif");

  const blank = {
    bienId: "", proprietaireId: "", objet: "vente", type: "exclusif",
    dateSignature: aujourdhui(), duree: 3, dateFin: "", agentId: "",
    ref: "", honoraires: "", notes: "", statut: "actif",
  };
  const [f, setF] = useState(blank);

  const nomBien = (id) => { const b = (data.biens || []).find((x) => x.id === id); return b ? b.nom : "—"; };
  const nomProprio = (id) => { const p = (data.proprietaires || []).find((x) => x.id === id); return p ? p.nom : "—"; };
  const nomAgent = (id) => { const a = agents.find((x) => x.id === id); return a ? a.nom : "—"; };

  const joursRestants = (m) => {
    const fin = finMandat(m);
    if (!fin) return null;
    return Math.ceil((new Date(fin).getTime() - Date.now()) / 86400000);
  };

  const ouvrirNouveau = (bienId) => {
    const b = (data.biens || []).find((x) => x.id === bienId);
    setEditId(null);
    setF({ ...blank, bienId: bienId || "", proprietaireId: b ? (b.proprietaireId || "") : "", agentId: b ? (b.agentId || "") : "" });
    setOpen(true);
  };
  const modifier = (m) => { setEditId(m.id); setF({ ...blank, ...m }); setOpen(true); };

  const enregistrer = () => {
    if (!f.bienId) { window.alert("Choisissez le bien concerné par ce mandat."); return; }
    if (!f.dateSignature) { window.alert("La date de signature est obligatoire."); return; }
    // Un bien ne peut porter deux mandats exclusifs en cours pour le même objet
    if (f.type === "exclusif" && f.statut === "actif") {
      const conflit = liste.find((m) => m.id !== editId && m.bienId === f.bienId && m.objet === f.objet
        && m.type === "exclusif" && m.statut === "actif");
      if (conflit && !window.confirm("Ce bien porte déjà un mandat exclusif de " + f.objet
        + " en cours. Enregistrer quand même ?")) return;
    }
    const doc = editId ? { ...f, id: editId, majPar: moi } : { ...f, id: uid(), creePar: moi, cree: new Date().toISOString() };
    save({ ...data, mandats: editId ? liste.map((x) => x.id === editId ? doc : x) : [doc, ...liste] },
      (editId ? "a modifié le " : "a enregistré un ") + libelleMandat(doc) + " — " + nomBien(doc.bienId));
    setOpen(false); setEditId(null);
  };

  const changerStatut = (m, statut) =>
    save({ ...data, mandats: liste.map((x) => x.id === m.id ? { ...x, statut } : x) },
      "a passé le mandat " + nomBien(m.bienId) + " en « " + (MANDAT_STATUTS.find((s) => s[0] === statut) || [])[1] + " »");

  const supprimer = (m) => {
    if (!window.confirm("Supprimer ce mandat ?")) return;
    save({ ...data, mandats: liste.filter((x) => x.id !== m.id) }, "a supprimé un mandat");
  };

  const visibles = liste
    .filter((m) => fObjet === "tous" || m.objet === fObjet)
    .filter((m) => fType === "tous" || m.type === fType)
    .filter((m) => fStatut === "tous" || m.statut === fStatut)
    .sort((a, b) => (b.dateSignature || "").localeCompare(a.dateSignature || ""));

  const actifs = liste.filter((m) => m.statut === "actif");
  const expirent = actifs.filter((m) => { const j = joursRestants(m); return j !== null && j >= 0 && j <= 30; });
  const expires = actifs.filter((m) => { const j = joursRestants(m); return j !== null && j < 0; });

  /* ---------- Fiche ---------- */
  if (fiche) {
    const m = liste.find((x) => x.id === fiche);
    if (!m) { setFiche(null); return null; }
    const j = joursRestants(m);
    return (
      <div>
        <button onClick={() => setFiche(null)} className="text-sm mb-4 sans-impression" style={{ color: C.mute }}>← Retour aux mandats</button>
        <Head title={libelleMandat(m)} sub={nomBien(m.bienId)}
          action={<>
            <Btn variant="ghost" onClick={() => modifier(m)}>Modifier</Btn>
            {suisGerante && <Btn variant="danger" onClick={() => { setFiche(null); supprimer(m); }}>Supprimer</Btn>}
          </>} />

        {j !== null && j < 0 && (
          <div className="mb-4 px-4 py-2.5 rounded text-sm garder-couleur" style={{ background: "#FDECEC", color: C.clay }}>
            Ce mandat est arrivé à échéance il y a {Math.abs(j)} jour(s). Renouvelez-le ou changez son statut.
          </div>
        )}
        {j !== null && j >= 0 && j <= 30 && (
          <div className="mb-4 px-4 py-2.5 rounded text-sm garder-couleur" style={{ background: C.goldSoft, color: C.gold }}>
            Ce mandat expire dans {j} jour(s).
          </div>
        )}

        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
          {[["Type", (MANDAT_TYPES.find((x) => x[0] === m.type) || [])[1]],
            ["Objet", (MANDAT_OBJETS.find((x) => x[0] === m.objet) || [])[1]],
            ["Signé le", m.dateSignature ? dateLongue(m.dateSignature) : "—"],
            ["Échéance", finMandat(m) ? dateLongue(finMandat(m)) : "—"]].map(([l, v]) => (
            <div key={l} className={card + " p-3"} style={{ borderColor: C.line }}>
              <div className="text-[11px] mb-1" style={{ color: C.mute }}>{l}</div>
              <div className="font-semibold text-sm" style={{ color: C.ink }}>{v || "—"}</div>
            </div>))}
        </div>

        <div className={card + " p-4 mb-5"} style={{ borderColor: C.line }}>
          <div className="space-y-1.5 text-sm">
            <Row k="Bien" v={nomBien(m.bienId)} />
            <Row k="Propriétaire" v={nomProprio(m.proprietaireId)} />
            <Row k="Agent en charge" v={nomAgent(m.agentId)} />
            <Row k="Durée" v={m.duree ? m.duree + " mois" : "—"} />
            <Row k="Référence" v={m.ref || "—"} />
            <Row k="Honoraires convenus" v={m.honoraires ? fcfa(m.honoraires) : "—"} />
          </div>
          {m.notes && <p className="text-sm mt-3 pt-3 whitespace-pre-wrap" style={{ borderTop: "1px solid " + C.line, color: C.ink }}>{m.notes}</p>}
        </div>

        <div className="mb-5">
          <Label>Statut du mandat</Label>
          <div className="flex gap-1.5 flex-wrap">
            {MANDAT_STATUTS.map(([k, lab]) => (
              <button key={k} onClick={() => changerStatut(m, k)} className="px-2.5 py-1 rounded text-xs font-medium"
                style={{ background: m.statut === k ? C.ink : "transparent", color: m.statut === k ? "#fff" : C.mute, border: "1px solid " + C.line }}>{lab}</button>))}
          </div>
        </div>

        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div className="px-4 pt-4"><Label>Mandat signé et pièces annexes</Label></div>
          <div className="p-4 pt-2"><PiecesJointes cle={"mandat:" + m.id} c={c} /></div>
        </div>
      </div>
    );
  }

  /* ---------- Liste ---------- */
  return (
    <div>
      <Head title="Mandats" sub={actifs.length + " en cours" + (expirent.length ? " · " + expirent.length + " à renouveler" : "")}
        action={<Btn variant="accent" onClick={() => ouvrirNouveau(null)}>+ Mandat</Btn>} />

      {(expires.length > 0 || expirent.length > 0) && (
        <div className="mb-4 px-4 py-3 rounded text-sm garder-couleur sans-impression" style={{ background: C.goldSoft, color: C.gold }}>
          {expires.length > 0 && <div>⚠ {expires.length} mandat(s) arrivé(s) à échéance et toujours marqué(s) en cours.</div>}
          {expirent.length > 0 && <div>🔔 {expirent.length} mandat(s) expire(nt) dans les 30 jours.</div>}
        </div>
      )}

      <div className="flex gap-2 mb-4 flex-wrap sans-impression items-center">
        <Select value={fObjet} onChange={(e) => setFObjet(e.target.value)}>
          <option value="tous">Vente et location</option>
          {MANDAT_OBJETS.map(([k, l]) => <option key={k} value={k}>{l}</option>)}
        </Select>
        <Select value={fType} onChange={(e) => setFType(e.target.value)}>
          <option value="tous">Tous les types</option>
          {MANDAT_TYPES.map(([k, l]) => <option key={k} value={k}>{l}</option>)}
        </Select>
        <Select value={fStatut} onChange={(e) => setFStatut(e.target.value)}>
          <option value="actif">En cours</option>
          <option value="abouti">Aboutis</option>
          <option value="resilie">Résiliés</option>
          <option value="tous">Tous statuts</option>
        </Select>
      </div>

      {visibles.length === 0
        ? <Empty text="Aucun mandat pour ces critères." action={<Btn variant="accent" onClick={() => ouvrirNouveau(null)}>+ Mandat</Btn>} />
        : <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr style={{ background: "#F5F4EE" }}>
                {["Bien", "Mandat", "Propriétaire", "Agent", "Signé le", "Échéance", "Statut"].map((h) => (
                  <th key={h} className="px-3 py-2.5 text-left text-xs font-semibold" style={{ color: C.mute }}>{h}</th>))}
              </tr></thead>
              <tbody>
                {visibles.map((m) => {
                  const j = joursRestants(m);
                  const urgent = m.statut === "actif" && j !== null && j <= 30;
                  return (
                    <tr key={m.id} className="cursor-pointer" onClick={() => setFiche(m.id)} style={{ borderTop: "1px solid " + C.line }}>
                      <td className="px-3 py-2.5 font-medium" style={{ color: C.ink }}>{nomBien(m.bienId)}</td>
                      <td className="px-3 py-2.5">
                        <Tag tone={toneMandat(m.type)}>{(MANDAT_TYPES.find((x) => x[0] === m.type) || [])[1]}</Tag>
                        <span className="text-[11px] ml-1" style={{ color: C.mute }}>{(MANDAT_OBJETS.find((x) => x[0] === m.objet) || [])[1]}</span>
                      </td>
                      <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{nomProprio(m.proprietaireId)}</td>
                      <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{nomAgent(m.agentId)}</td>
                      <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{m.dateSignature || "—"}</td>
                      <td className="px-3 py-2.5 text-xs" style={{ color: urgent ? (j < 0 ? C.clay : C.gold) : C.mute }}>
                        {finMandat(m) || "—"}{urgent ? (j < 0 ? " (échu)" : " (" + j + " j)") : ""}</td>
                      <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{(MANDAT_STATUTS.find((x) => x[0] === m.statut) || [])[1]}</td>
                    </tr>);
                })}
              </tbody>
            </table>
          </div></div>}

      {open && (
        <Modal title={editId ? "Modifier le mandat" : "Nouveau mandat"} onClose={() => { setOpen(false); setEditId(null); }} wide>
          <div className="space-y-3">
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Bien concerné">
                <Select value={f.bienId} onChange={(e) => {
                  const b = (data.biens || []).find((x) => x.id === e.target.value);
                  setF({ ...f, bienId: e.target.value,
                    proprietaireId: b ? (b.proprietaireId || f.proprietaireId) : f.proprietaireId,
                    agentId: b && b.agentId ? b.agentId : f.agentId });
                }}>
                  <option value="">— Choisir —</option>
                  {(data.biens || []).map((b) => <option key={b.id} value={b.id}>{b.nom}</option>)}
                </Select></Field>
              <Field label="Propriétaire">
                <Select value={f.proprietaireId} onChange={(e) => setF({ ...f, proprietaireId: e.target.value })}>
                  <option value="">— Choisir —</option>
                  {(data.proprietaires || []).map((p) => <option key={p.id} value={p.id}>{p.nom}</option>)}
                </Select></Field>
            </div>

            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Objet du mandat">
                <Select value={f.objet} onChange={(e) => setF({ ...f, objet: e.target.value })}>
                  {MANDAT_OBJETS.map(([k, l]) => <option key={k} value={k}>{l}</option>)}
                </Select></Field>
              <Field label="Type de mandat">
                <Select value={f.type} onChange={(e) => setF({ ...f, type: e.target.value })}>
                  {MANDAT_TYPES.map(([k, l]) => <option key={k} value={k}>{l}</option>)}
                </Select></Field>
            </div>

            <div className="px-3 py-2 rounded text-[11px]" style={{ background: "#F5F4EE", color: C.mute }}>
              {f.type === "exclusif" && "Exclusif : l'agence est seule habilitée à commercialiser le bien pendant la durée du mandat."}
              {f.type === "semi" && "Semi-exclusif : le propriétaire conserve le droit de vendre ou louer par lui-même, mais ne peut confier le bien à une autre agence."}
              {f.type === "simple" && "Simple : le propriétaire peut confier le bien à d'autres agences et traiter directement."}
            </div>

            <div className="grid sm:grid-cols-3 gap-3">
              <Field label="Date de signature"><Input type="date" value={f.dateSignature} onChange={(e) => setF({ ...f, dateSignature: e.target.value })} /></Field>
              <Field label="Durée (mois)"><Input type="number" value={f.duree} onChange={(e) => setF({ ...f, duree: e.target.value, dateFin: "" })} placeholder="3" /></Field>
              <Field label="Échéance">
                <Input type="date" value={f.dateFin || finMandat(f)} onChange={(e) => setF({ ...f, dateFin: e.target.value })} /></Field>
            </div>

            <div className="grid sm:grid-cols-3 gap-3">
              <Field label="Agent en charge">
                <Select value={f.agentId} onChange={(e) => setF({ ...f, agentId: e.target.value })}>
                  <option value="">— Aucun —</option>
                  {agents.map((a) => <option key={a.id} value={a.id}>{a.nom}</option>)}
                </Select></Field>
              <Field label="Référence"><Input value={f.ref} onChange={(e) => setF({ ...f, ref: e.target.value })} placeholder="MDT-2026-001" /></Field>
              <Field label="Honoraires convenus (F CFA)"><Input type="number" value={f.honoraires} onChange={(e) => setF({ ...f, honoraires: e.target.value })} /></Field>
            </div>

            <Field label="Notes"><Textarea rows={2} value={f.notes} onChange={(e) => setF({ ...f, notes: e.target.value })} /></Field>

            <div className="flex gap-2 pt-1">
              <Btn variant="accent" onClick={enregistrer}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => { setOpen(false); setEditId(null); }}>Annuler</Btn>
            </div>
            {!editId && <p className="text-xs" style={{ color: C.mute }}>
              Le mandat signé se joint depuis sa fiche, après enregistrement.</p>}
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ============================== Catalogue des biens ============================== */

function Catalogue({ data, save, moi, c }) {
  const P = data.parametres || PARAMS_DEFAUT;
  const [fiche, setFiche] = useState(null);
  const [q, setQ] = useState("");
  const [filtre, setFiltre] = useState("vitrine");
  const [editVitrine, setEditVitrine] = useState(null);
  const [erreur, setErreur] = useState(null);

  const biens = data.biens || [];
  const occupe = (b) => (data.locataires || []).some((l) => l.bienId === b.id && l.actif !== false);

  const visibles = biens
    .filter((b) => filtre === "tous" || (filtre === "vitrine" ? b.enVitrine : !occupe(b)))
    .filter((b) => (b.nom + " " + (b.adresse || "") + " " + (b.type || "")).toLowerCase().includes(q.toLowerCase()));

  const nbVitrine = biens.filter((b) => b.enVitrine).length;
  const nbLibres = biens.filter((b) => !occupe(b)).length;

  const majBien = (id, champs, action) =>
    save({ ...data, biens: biens.map((b) => b.id === id ? { ...b, ...champs } : b) }, action);

  /* ---------- Fiche détaillée ---------- */
  if (fiche) {
    const b = biens.find((x) => x.id === fiche);
    if (!b) { setFiche(null); return null; }
    const videos = b.videos || [];
    const prix = b.aVendre ? Number(b.prixVente || 0) : Number(b.loyer || 0);
    const messagePartage = [
      (b.type || "Bien") + (b.pieces ? " " + b.pieces + " pièces" : "") + (b.surface ? " · " + b.surface + " m²" : ""),
      b.adresse ? "📍 " + b.adresse : "",
      prix ? (b.aVendre ? "💰 " + fcfa(prix) : "💰 " + fcfa(prix) + " / mois"
        + (Number(b.charges) > 0 ? " + " + fcfa(b.charges) + " de charges" : "")) : "",
      b.descriptionCommerciale ? "\n" + b.descriptionCommerciale : "",
      videos.length ? "\nVidéo : " + videos[0].url : "",
      "\n" + (P.societe || "Season Immobilier") + (P.tel ? " · " + P.tel : ""),
    ].filter(Boolean).join("\n");

    return (
      <div>
        <button onClick={() => setFiche(null)} className="text-sm mb-4 sans-impression" style={{ color: C.mute }}>← Retour au catalogue</button>
        <Head title={b.nom} sub={[b.type, b.pieces ? b.pieces + " pièces" : "", b.surface ? b.surface + " m²" : "", b.adresse].filter(Boolean).join(" · ")}
          action={<>
            <Btn variant="accent" onClick={() => ouvrirWhatsApp("", messagePartage)}>Partager sur WhatsApp</Btn>
            <Btn variant="ghost" onClick={() => { navigator.clipboard && navigator.clipboard.writeText(messagePartage); setErreur("Fiche copiée."); setTimeout(() => setErreur(null), 2500); }}>Copier la fiche</Btn>
          </>} />

        {erreur && <div className="mb-3 px-4 py-2 rounded text-sm" style={{ background: C.greenSoft, color: C.green }}>{erreur}</div>}

        <div className="grid md:grid-cols-3 gap-4 mb-5">
          <div className={card + " p-4"} style={{ borderColor: C.line }}>
            <Label>{b.aVendre ? "Prix de vente" : "Loyer mensuel"}</Label>
            <div className="text-xl font-bold tabular-nums" style={{ color: C.ink }}>{prix ? fcfa(prix) : "—"}</div>
            {!b.aVendre && Number(b.charges) > 0 && <div className="text-xs mt-0.5" style={{ color: C.mute }}>+ {fcfa(b.charges)} de charges</div>}
          </div>
          <div className={card + " p-4"} style={{ borderColor: C.line }}>
            <Label>Disponibilité</Label>
            <div className="mt-1">{occupe(b) ? <Tag tone="warn">Occupé</Tag> : <Tag tone="ok">Disponible</Tag>}</div>
          </div>
          <div className={card + " p-4"} style={{ borderColor: C.line }}>
            <Label>Type de mandat</Label>
            <div className="text-sm mt-1" style={{ color: C.ink }}>{b.horsGestion ? "Mise en location" : "Gestion locative"}</div>
          </div>
        </div>

        {b.descriptionCommerciale && (
          <div className={card + " p-4 mb-5"} style={{ borderColor: C.line }}>
            <Label>Descriptif</Label>
            <p className="text-sm whitespace-pre-wrap mt-1" style={{ color: C.ink }}>{b.descriptionCommerciale}</p>
          </div>
        )}

        {videos.length > 0 && (
          <div className={card + " p-4 mb-5"} style={{ borderColor: C.line }}>
            <Label>Vidéos ({videos.length})</Label>
            <div className="space-y-2 mt-2">
              {videos.map((v, i) => (
                <a key={i} href={v.url} target="_blank" rel="noreferrer"
                  className="flex items-center gap-2 text-sm px-3 py-2 rounded" style={{ background: "#F5F4EE", color: C.green }}>
                  ▶ {v.titre || "Visite vidéo " + (i + 1)}
                </a>))}
            </div>
          </div>
        )}

        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div className="px-4 pt-4"><Label>Photos du bien</Label></div>
          <div className="p-4 pt-2"><PiecesJointes cle={"catalogue:" + b.id} c={c} /></div>
        </div>
      </div>
    );
  }

  /* ---------- Grille ---------- */
  return (
    <div>
      <Head title="Catalogue des biens" sub={nbVitrine + " en vitrine · " + nbLibres + " disponible(s)"} />

      <div className="mb-4 flex gap-2 flex-wrap items-center sans-impression">
        {[["vitrine", "En vitrine (" + nbVitrine + ")"], ["libres", "Disponibles (" + nbLibres + ")"], ["tous", "Tous (" + biens.length + ")"]].map(([k, lab]) => (
          <button key={k} onClick={() => setFiltre(k)} className="px-3 py-1.5 rounded text-sm font-medium"
            style={{ background: filtre === k ? C.ink : "transparent", color: filtre === k ? "#fff" : C.mute,
              border: "1px solid " + (filtre === k ? C.ink : C.line) }}>{lab}</button>))}
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Rechercher…"
          className={inputCls + " max-w-[220px]"} style={{ borderColor: C.line, color: C.ink }} />
      </div>

      {visibles.length === 0
        ? <Empty text={filtre === "vitrine"
            ? "Aucun bien en vitrine. Ouvrez un bien et activez « Mettre en vitrine » pour l'ajouter au catalogue."
            : "Aucun bien ne correspond."} />
        : <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {visibles.map((b) => {
              const prix = b.aVendre ? Number(b.prixVente || 0) : Number(b.loyer || 0);
              return (
                <div key={b.id} className={card + " overflow-hidden flex flex-col"} style={{ borderColor: C.line }}>
                  <button onClick={() => setFiche(b.id)} className="block w-full text-left">
                    <div className="w-full flex items-center justify-center" style={{ height: 150, background: "#F5F4EE" }}>
                      {b.photoPrincipale
                        ? <img src={b.photoPrincipale} alt="" className="w-full h-full object-cover" />
                        : <span className="text-xs" style={{ color: C.mute }}>Pas de photo</span>}
                    </div>
                  </button>
                  <div className="p-3 flex-1 flex flex-col">
                    <button onClick={() => setFiche(b.id)} className="text-left">
                      <div className="font-semibold text-sm leading-tight" style={{ color: C.ink }}>{b.nom}</div>
                      <div className="text-xs mt-0.5" style={{ color: C.mute }}>
                        {[b.type, b.pieces ? b.pieces + " p." : "", b.surface ? b.surface + " m²" : ""].filter(Boolean).join(" · ")}
                      </div>
                      {b.adresse && <div className="text-xs" style={{ color: C.mute }}>{b.adresse}</div>}
                    </button>
                    <div className="flex items-center justify-between gap-2 mt-2 pt-2" style={{ borderTop: "1px solid " + C.line }}>
                      <span className="font-bold text-sm tabular-nums" style={{ color: C.ink }}>
                        {prix ? fcfa(prix) + (b.aVendre ? "" : "/mois") : "—"}</span>
                      <div className="flex gap-1.5 items-center">
                        {occupe(b) ? <Tag tone="warn">Occupé</Tag> : <Tag tone="ok">Libre</Tag>}
                        <button onClick={() => setEditVitrine(b.id)} className="text-xs font-semibold" style={{ color: C.mute }}>Modifier</button>
                      </div>
                    </div>
                  </div>
                </div>);
            })}
          </div>}

      {editVitrine && (() => {
        const b = biens.find((x) => x.id === editVitrine);
        if (!b) return null;
        return <FormVitrine bien={b} onClose={() => setEditVitrine(null)}
          onSave={(champs) => { majBien(b.id, champs, "a mis à jour la fiche catalogue de " + b.nom); setEditVitrine(null); }} />;
      })()}
    </div>
  );
}

/* ---------- Formulaire vitrine ---------- */
function FormVitrine({ bien, onClose, onSave }) {
  const [f, setF] = useState({
    enVitrine: !!bien.enVitrine,
    aVendre: !!bien.aVendre,
    prixVente: bien.prixVente || "",
    descriptionCommerciale: bien.descriptionCommerciale || "",
    photoPrincipale: bien.photoPrincipale || "",
    videos: bien.videos || [],
  });
  const [msg, setMsg] = useState(null);
  const maj = (k, v) => setF((x) => ({ ...x, [k]: v }));

  const choisirPhoto = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    if (!(file.type || "").startsWith("image/")) { setMsg("Choisissez une image."); return; }
    setMsg("Traitement…");
    try {
      const r = await lireFichier(file, 700, 0.65);
      maj("photoPrincipale", r.url);
      setMsg(null);
    } catch (err) { setMsg("Cette image n'a pas pu être lue."); }
  };

  const ajouterVideo = () => setF((x) => ({ ...x, videos: [...x.videos, { titre: "", url: "" }] }));
  const majVideo = (i, k, v) => setF((x) => ({ ...x, videos: x.videos.map((y, j) => j === i ? { ...y, [k]: v } : y) }));
  const suprVideo = (i) => setF((x) => ({ ...x, videos: x.videos.filter((y, j) => j !== i) }));

  return (
    <Modal title={"Fiche catalogue — " + bien.nom} onClose={onClose} wide>
      <div className="space-y-3">
        <label className="flex items-start gap-2 px-3 py-2.5 rounded cursor-pointer" style={{ background: f.enVitrine ? C.greenSoft : "#F5F4EE" }}>
          <input type="checkbox" className="mt-0.5" checked={f.enVitrine} onChange={(e) => maj("enVitrine", e.target.checked)} />
          <span className="text-sm" style={{ color: f.enVitrine ? C.green : C.ink }}>
            <b>Mettre en vitrine</b>
            <span className="block text-[11px] mt-0.5" style={{ color: C.mute }}>
              Le bien apparaît dans le catalogue consultable par l'équipe.
            </span>
          </span>
        </label>

        <div className="grid sm:grid-cols-2 gap-3">
          <Field label="Nature de l'offre">
            <Select value={f.aVendre ? "vente" : "location"} onChange={(e) => maj("aVendre", e.target.value === "vente")}>
              <option value="location">Location</option>
              <option value="vente">Vente</option>
            </Select>
          </Field>
          {f.aVendre && (
            <Field label="Prix de vente (F CFA)">
              <Input type="number" value={f.prixVente} onChange={(e) => maj("prixVente", e.target.value)} /></Field>
          )}
        </div>

        <Field label="Descriptif commercial">
          <Textarea rows={5} value={f.descriptionCommerciale} onChange={(e) => maj("descriptionCommerciale", e.target.value)}
            placeholder="Villa moderne dans résidence sécurisée, cuisine équipée, jardin, parking deux véhicules…" />
        </Field>

        <div>
          <Label>Photo de couverture</Label>
          <div className="flex items-center gap-3 mt-1 flex-wrap">
            {f.photoPrincipale && <img src={f.photoPrincipale} alt="" style={{ height: 80, borderRadius: 4 }} />}
            <label className="px-3 py-2 rounded text-sm cursor-pointer" style={{ border: "1px solid " + C.line, color: C.ink }}>
              {f.photoPrincipale ? "Remplacer" : "Choisir une image"}
              <input type="file" accept="image/*" onChange={choisirPhoto} style={{ display: "none" }} />
            </label>
            {f.photoPrincipale && <button onClick={() => maj("photoPrincipale", "")} className="text-xs font-semibold" style={{ color: C.clay }}>Retirer</button>}
          </div>
          <p className="text-[11px] mt-1" style={{ color: C.mute }}>
            Image réduite automatiquement. Les autres photos s'ajoutent dans la fiche du bien.
          </p>
        </div>

        <div>
          <div className="flex items-center justify-between">
            <Label>Vidéos</Label>
            <button onClick={ajouterVideo} className="text-xs font-semibold" style={{ color: C.green }}>+ Ajouter</button>
          </div>
          <p className="text-[11px] mb-2" style={{ color: C.mute }}>
            Collez un lien YouTube, Google Drive ou WeTransfer. Les fichiers vidéo sont trop volumineux pour être
            hébergés directement dans l'application.
          </p>
          {f.videos.length === 0 && <p className="text-xs" style={{ color: C.mute }}>Aucune vidéo.</p>}
          {f.videos.map((v, i) => (
            <div key={i} className="grid sm:grid-cols-[1fr_2fr_auto] gap-2 mb-2 items-center">
              <Input value={v.titre} onChange={(e) => majVideo(i, "titre", e.target.value)} placeholder="Visite du salon" />
              <Input value={v.url} onChange={(e) => majVideo(i, "url", e.target.value)} placeholder="https://…" />
              <button onClick={() => suprVideo(i)} className="text-xs font-semibold" style={{ color: C.clay }}>Retirer</button>
            </div>))}
        </div>

        {msg && <p className="text-sm" style={{ color: C.gold }}>{msg}</p>}

        <div className="flex gap-2 pt-1">
          <Btn variant="accent" onClick={() => onSave({ ...f, prixVente: Number(f.prixVente) || 0,
            videos: f.videos.filter((v) => String(v.url || "").trim()) })}>Enregistrer</Btn>
          <Btn variant="ghost" onClick={onClose}>Annuler</Btn>
        </div>
      </div>
    </Modal>
  );
}

/* ============================== Diffusion des offres ============================== */

function Diffusion({ data, save, moi }) {
  const P = data.parametres || PARAMS_DEFAUT;
  const prospects = data.prospects || [];
  const envois = data.envoisOffres || [];
  const [bienId, setBienId] = useState("");
  const [strict, setStrict] = useState(true);
  const [marge, setMarge] = useState(20);
  const [message, setMessage] = useState("");
  const [selection, setSelection] = useState([]);

  // Un prospect reste démarchable tant qu'il n'est ni conclu ni perdu
  const actifs = prospects.filter((p) => p.statut !== "conclu" && p.statut !== "perdu");
  const biensDispo = (data.biens || []).filter((b) => !(data.locataires || []).some((l) => l.bienId === b.id && l.actif !== false));
  const bien = (data.biens || []).find((b) => b.id === bienId);

  const dejaRecu = (prospectId) => envois.filter((e) => e.prospectId === prospectId && e.bienId === bienId);

  // Rapprochement : type de bien, budget et quartier
  const score = (p) => {
    if (!bien) return { ok: false, raisons: [] };
    const raisons = [];
    let ok = true;
    const typeB = String(bien.type || "").toLowerCase();
    const typeP = String(p.typeBien || "").toLowerCase();
    if (typeP && typeB && typeP !== typeB) { ok = false; } else if (typeP) { raisons.push("type " + p.typeBien); }
    const budget = Number(p.budget) || 0;
    const prix = Number(bien.loyer) || 0;
    if (budget && prix) {
      const plafond = budget * (1 + marge / 100);
      if (prix > plafond) ok = false; else raisons.push("budget " + fcfa(budget));
    }
    const q = String(p.quartier || "").toLowerCase().trim();
    const adr = String(bien.adresse || "").toLowerCase() + " " + String(bien.ensemble || "").toLowerCase();
    if (q) { if (adr.includes(q)) raisons.push("quartier " + p.quartier); else if (strict) ok = false; }
    return { ok, raisons };
  };

  const candidats = bien ? actifs.map((p) => ({ p, ...score(p) })).filter((x) => x.ok) : [];
  const ecartes = bien ? actifs.map((p) => ({ p, ...score(p) })).filter((x) => !x.ok) : [];

  const messageDefaut = () => {
    if (!bien) return "";
    const lignes = [
      "Bonjour,",
      "",
      "Nous avons une nouvelle offre qui pourrait vous intéresser :",
      "",
      (bien.type || "Bien") + (bien.pieces ? " " + bien.pieces + " pièces" : "") + (bien.surface ? " · " + bien.surface + " m²" : ""),
      bien.adresse ? "📍 " + bien.adresse : "",
      bien.loyer ? "💰 " + fcfa(bien.loyer) + " / mois" + (Number(bien.charges) > 0 ? " + " + fcfa(bien.charges) + " de charges" : "") : "",
      "",
      "Souhaitez-vous organiser une visite ?",
      "",
      P.societe || "Season Immobilier",
      P.tel || "",
    ];
    return lignes.filter((l) => l !== "").join("\n");
  };

  const texte = message || messageDefaut();

  const noter = (p, canal) => {
    save({ ...data, envoisOffres: [{ id: uid(), prospectId: p.id, bienId, canal,
      date: new Date().toISOString(), par: moi }, ...envois] },
      "a proposé « " + (bien || {}).nom + " » à " + p.nom + " (" + canal + ")");
  };

  const envoyerWhatsApp = (p) => { ouvrirWhatsApp(p.tel, texte); noter(p, "WhatsApp"); };
  const envoyerMail = (p) => {
    ouvrirMail(p.email, "Nouvelle offre — " + ((bien || {}).type || "bien") + (bien && bien.adresse ? " à " + bien.adresse : ""), texte);
    noter(p, "Email");
  };

  const basculer = (id) => setSelection((s) => s.includes(id) ? s.filter((x) => x !== id) : [...s, id]);
  const toutSelectionner = () => setSelection(candidats.map((x) => x.p.id));

  return (
    <div>
      <Head title="Diffusion des offres" sub="Proposer un bien aux clients dont la recherche correspond" />

      <div className="mb-5 px-4 py-3 rounded text-xs" style={{ background: "#F5F4EE", color: C.mute }}>
        L'envoi se fait contact par contact : vous cliquez, WhatsApp s'ouvre avec le message prêt, vous validez.
        L'envoi automatique en masse n'est pas possible depuis un compte WhatsApp ordinaire et exposerait votre
        numéro à un blocage définitif. Chaque envoi est enregistré pour éviter de recontacter deux fois la même personne.
      </div>

      <div className={card + " p-4 mb-5"} style={{ borderColor: C.line }}>
        <div className="grid sm:grid-cols-3 gap-3">
          <Field label="Bien à proposer">
            <Select value={bienId} onChange={(e) => { setBienId(e.target.value); setMessage(""); setSelection([]); }}>
              <option value="">— Choisir un bien —</option>
              {biensDispo.map((b) => <option key={b.id} value={b.id}>{b.nom}{b.loyer ? " — " + fcfa(b.loyer) : ""}</option>)}
            </Select>
          </Field>
          <Field label="Tolérance sur le budget">
            <Select value={marge} onChange={(e) => setMarge(Number(e.target.value))}>
              <option value={0}>Budget respecté strictement</option>
              <option value={10}>+ 10 %</option>
              <option value={20}>+ 20 %</option>
              <option value={50}>+ 50 %</option>
            </Select>
          </Field>
          <Field label="Quartier">
            <Select value={strict ? "oui" : "non"} onChange={(e) => setStrict(e.target.value === "oui")}>
              <option value="oui">Doit correspondre</option>
              <option value="non">Ignorer le quartier</option>
            </Select>
          </Field>
        </div>
        {biensDispo.length === 0 && (
          <p className="text-xs mt-2" style={{ color: C.gold }}>
            Tous vos biens sont occupés. Seuls les biens vacants sont proposés à la diffusion.
          </p>
        )}
      </div>

      {!bien ? <Empty text="Choisissez un bien pour voir les clients dont la recherche correspond." /> : (
        <>
          <div className={card + " p-4 mb-5"} style={{ borderColor: C.line }}>
            <Label>Message envoyé</Label>
            <Textarea value={texte} onChange={(e) => setMessage(e.target.value)} rows={9} />
            <p className="text-[11px] mt-1" style={{ color: C.mute }}>
              Modifiable. Le même texte part à tous les contacts sélectionnés.
            </p>
          </div>

          <div className="flex items-center justify-between gap-3 flex-wrap mb-3">
            <h3 className="text-sm font-semibold" style={{ color: C.ink }}>
              {candidats.length} client(s) correspondant(s)</h3>
            {candidats.length > 0 && (
              <div className="flex gap-2">
                <Btn variant="ghost" onClick={toutSelectionner}>Tout cocher</Btn>
                <Btn variant="ghost" onClick={() => setSelection([])}>Tout décocher</Btn>
              </div>
            )}
          </div>

          {candidats.length === 0
            ? <Empty text="Aucun client ne correspond. Élargissez la tolérance de budget ou ignorez le quartier." />
            : <div className="space-y-2 mb-6">
                {candidats.map(({ p, raisons }) => {
                  const recus = dejaRecu(p.id);
                  return (
                    <div key={p.id} className={card + " p-3 flex items-start gap-3 flex-wrap"}
                      style={{ borderColor: recus.length ? C.line : C.ink, background: recus.length ? "#FAFAF7" : "#fff" }}>
                      <input type="checkbox" className="mt-1" checked={selection.includes(p.id)} onChange={() => basculer(p.id)} />
                      <div className="flex-1 min-w-[180px]">
                        <div className="font-semibold text-sm" style={{ color: C.ink }}>{p.nom}</div>
                        <div className="text-xs" style={{ color: C.mute }}>
                          {p.recherche}{p.typeBien ? " · " + p.typeBien : ""}{p.budget ? " · " + fcfa(p.budget) : ""}
                          {p.quartier ? " · " + p.quartier : ""}
                        </div>
                        {raisons.length > 0 && (
                          <div className="text-[11px] mt-0.5" style={{ color: C.green }}>Correspond sur : {raisons.join(", ")}</div>
                        )}
                        {recus.length > 0 && (
                          <div className="text-[11px] mt-0.5" style={{ color: C.gold }}>
                            Déjà contacté le {dateLongue(recus[0].date.slice(0, 10))} ({recus[0].canal})
                          </div>
                        )}
                      </div>
                      <div className="flex gap-2">
                        {p.tel && <Btn variant="accent" onClick={() => envoyerWhatsApp(p)}>WhatsApp</Btn>}
                        {p.email && <Btn variant="ghost" onClick={() => envoyerMail(p)}>Email</Btn>}
                      </div>
                    </div>);
                })}
              </div>}

          {selection.length > 0 && (
            <div className={card + " p-4 mb-6"} style={{ borderColor: C.ink }}>
              <div className="text-sm font-semibold mb-2" style={{ color: C.ink }}>
                {selection.length} contact(s) coché(s)</div>
              <p className="text-xs mb-3" style={{ color: C.mute }}>
                Les fenêtres WhatsApp s'ouvrent une par une : validez chaque envoi, puis revenez à cet onglet.
                Votre navigateur peut demander l'autorisation d'ouvrir plusieurs fenêtres — acceptez-la.
              </p>
              <Btn variant="accent" onClick={() => {
                const cibles = candidats.filter((x) => selection.includes(x.p.id) && x.p.tel);
                if (!cibles.length) { window.alert("Aucun des contacts cochés n'a de numéro de téléphone."); return; }
                if (!window.confirm("Ouvrir " + cibles.length + " fenêtre(s) WhatsApp ?")) return;
                cibles.forEach(({ p }, i) => setTimeout(() => envoyerWhatsApp(p), i * 1200));
                setSelection([]);
              }}>Ouvrir les conversations WhatsApp</Btn>
            </div>
          )}

          {ecartes.length > 0 && (
            <details className="mb-6">
              <summary className="text-sm cursor-pointer" style={{ color: C.mute }}>
                {ecartes.length} client(s) écarté(s) par les critères</summary>
              <div className="mt-2 space-y-1.5">
                {ecartes.map(({ p }) => (
                  <div key={p.id} className="flex items-center justify-between gap-3 text-xs px-3 py-2 rounded" style={{ background: "#F5F4EE" }}>
                    <span style={{ color: C.mute }}>
                      <b style={{ color: C.ink }}>{p.nom}</b> — {p.recherche}
                      {p.typeBien ? " · " + p.typeBien : ""}{p.budget ? " · " + fcfa(p.budget) : ""}{p.quartier ? " · " + p.quartier : ""}
                    </span>
                    {p.tel && <button onClick={() => envoyerWhatsApp(p)} className="font-semibold" style={{ color: C.green }}>Envoyer quand même</button>}
                  </div>))}
              </div>
            </details>
          )}
        </>
      )}

      {envois.length > 0 && (
        <div>
          <h3 className="text-sm font-semibold mb-2" style={{ color: C.ink }}>Derniers envois</h3>
          <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr style={{ background: "#F5F4EE" }}>
                {["Date", "Client", "Bien proposé", "Canal"].map((h) => (
                  <th key={h} className="px-4 py-2.5 text-left text-xs font-semibold" style={{ color: C.mute }}>{h}</th>))}
              </tr></thead>
              <tbody>
                {envois.slice(0, 30).map((e) => {
                  const pr = prospects.find((x) => x.id === e.prospectId);
                  const bi = (data.biens || []).find((x) => x.id === e.bienId);
                  return (
                    <tr key={e.id} style={{ borderTop: "1px solid " + C.line }}>
                      <td className="px-4 py-2.5 text-xs" style={{ color: C.mute }}>{dateLongue(e.date.slice(0, 10))}</td>
                      <td className="px-4 py-2.5" style={{ color: C.ink }}>{(pr || {}).nom || "—"}</td>
                      <td className="px-4 py-2.5 text-xs" style={{ color: C.mute }}>{(bi || {}).nom || "—"}</td>
                      <td className="px-4 py-2.5 text-xs" style={{ color: C.mute }}>{e.canal}</td>
                    </tr>);
                })}
              </tbody>
            </table>
          </div></div>
        </div>
      )}
    </div>
  );
}

/* ============================== CRM · prospects ============================== */

const CRM_STATUTS = [
  ["nouveau", "Nouveau", "warn"],
  ["a_rappeler", "À rappeler", "gold"],
  ["rappel_auto", "Rappel automatique", "gold"],
  ["visite", "Visite prévue", "neutral"],
  ["negociation", "En négociation", "neutral"],
  ["conclu", "Conclu", "ok"],
  ["perdu", "Perdu", "bad"],
];
const CRM_RECHERCHE = ["Location", "Achat"];
const CRM_TYPES_BIEN = ["Studio", "Appartement", "Villa", "Duplex", "Magasin/Local", "Bureau", "Terrain", "Autre"];

function statutLabelCRM(k) { const s = CRM_STATUTS.find((x) => x[0] === k); return s ? s[1] : k; }
function statutToneCRM(k) { const s = CRM_STATUTS.find((x) => x[0] === k); return s ? s[2] : "neutral"; }

// Jours écoulés depuis une date ISO
function joursDepuis(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return Math.floor((Date.now() - d.getTime()) / (1000 * 60 * 60 * 24));
}

function CRM({ data, save, moi, c }) {
  const P = data.parametres || PARAMS_DEFAUT;
  const prospects = data.prospects || [];
  const emailGerante = (P.gerante || "aude.nioble@season-immobilier.com").trim().toLowerCase();
  const suisGerante = String(moi || "").trim().toLowerCase() === emailGerante;

  const [vue, setVue] = useState("pipeline"); // pipeline, liste, alertes, point
  const [open, setOpen] = useState(false);
  const [editId, setEditId] = useState(null);
  const [filtreStatut, setFiltreStatut] = useState("tous");
  const [ficheId, setFicheId] = useState(null);

  const SEUIL_NON_TRAITE = 7; // jours sans contact = à relancer

  const blank = {
    nom: "", tel: "", email: "", profession: "", recherche: "Location", typeBien: "Appartement",
    budget: "", quartier: "", bienId: "", agent: moi || "", agentNom: "", statut: "nouveau",
    note: "", dateContact: aujourdhui(), prochaineRelance: "", relanceHeure: "", visites: [], echanges: [],
    qualite: "", motifQualite: "",
  };
  const [f, setF] = useState(blank);

  const ouvrirNouveau = () => { setEditId(null); setF({ ...blank, agent: moi || "" }); setOpen(true); };
  const modifier = (p) => { setEditId(p.id); setF({ ...blank, ...p }); setOpen(true); };

  const enregistrer = () => {
    if (!f.nom.trim()) return;
    // Obligation d'identification : la profession est requise pour un client acheteur
    if (f.recherche === "Achat" && !String(f.profession || "").trim()) {
      window.alert("La profession est obligatoire pour un client acheteur (obligation d'identification). Merci de la renseigner.");
      return;
    }
    if (f.qualite === "mauvais" && !String(f.motifQualite || "").trim()) {
      window.alert("Précisez le motif pour lequel ce prospect est écarté."); return;
    }
    const doc = editId
      ? { ...f, id: editId }
      : { ...f, id: uid(), creePar: moi, cree: new Date().toISOString(), echanges: [], visites: [] };
    save({
      ...data,
      prospects: editId ? prospects.map((x) => x.id === editId ? doc : x) : [doc, ...prospects],
    }, (editId ? "a modifié le prospect " : "a ajouté le prospect ") + f.nom);
    setOpen(false);
  };

  const supprimer = (p) => {
    if (!window.confirm("Supprimer ce prospect ?")) return;
    save({ ...data, prospects: prospects.filter((x) => x.id !== p.id) }, "a supprimé un prospect");
  };

  const changerStatut = (p, statut) => {
    save({ ...data, prospects: prospects.map((x) => x.id === p.id ? { ...x, statut } : x) },
      "a passé " + p.nom + " au statut « " + statutLabelCRM(statut) + " »");
  };

  // Le compte rendu d'échange est obligatoire : sans contenu, rien n'est enregistré
  const ajouterEchange = (p, texte, options) => {
    const t = String(texte || "").trim();
    if (t.length < 10) { window.alert("Le compte rendu de l'appel est obligatoire : décrivez en quelques mots ce qui s'est dit."); return false; }
    const o = options || {};
    const echanges = [...(p.echanges || []), { id: uid(), date: new Date().toISOString(), par: moi, texte: t, canal: o.canal || "Appel" }];
    const maj = { echanges, dateContact: aujourdhui() };
    // Rappel automatique : replanifie la relance dans 2 heures
    if (o.rappel2h) {
      const d = new Date(Date.now() + 2 * 60 * 60 * 1000);
      maj.prochaineRelance = d.toISOString().slice(0, 10);
      maj.relanceHeure = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      maj.statut = "rappel_auto";
    }
    save({ ...data, prospects: prospects.map((x) => x.id === p.id ? { ...x, ...maj } : x) },
      "a noté un échange avec " + p.nom + (o.rappel2h ? " (rappel dans 2 h)" : ""));
    return true;
  };

  // Qualification du prospect : un mauvais prospect sort du pipeline actif
  const qualifier = (p, qualite) => {
    let motif = p.motifQualite || "";
    if (qualite === "mauvais") {
      motif = window.prompt("Pourquoi ce prospect est-il écarté ? (budget irréaliste, injoignable, non sérieux…)", motif) || "";
      if (!motif.trim()) { window.alert("Un motif est nécessaire pour écarter un prospect."); return; }
    }
    save({ ...data, prospects: prospects.map((x) => x.id === p.id ? { ...x, qualite, motifQualite: motif } : x) },
      qualite === "mauvais" ? "a écarté le prospect " + p.nom + " (" + motif + ")" : "a qualifié " + p.nom + " comme bon prospect");
  };

  // Visite : le bon de visite signé est exigé pour ouvrir droit à la prime
  const [visiteEnCours, setVisiteEnCours] = useState(null);
  const enregistrerVisite = (p, v) => {
    const visites = [...(p.visites || []), { id: uid(), date: new Date().toISOString(), par: moi, ...v }];
    save({ ...data, prospects: prospects.map((x) => x.id === p.id ? { ...x, visites, dateContact: aujourdhui() } : x) },
      "a enregistré une visite pour " + p.nom);
  };
  const marquerBonVisite = (p, visiteId, ok) => {
    const visites = (p.visites || []).map((v) => v.id === visiteId ? { ...v, bonVisite: ok, bonVisitePar: moi, bonVisiteLe: new Date().toISOString() } : v);
    save({ ...data, prospects: prospects.map((x) => x.id === p.id ? { ...x, visites } : x) },
      (ok ? "a confirmé le bon de visite de " : "a retiré le bon de visite de ") + p.nom);
  };
  const noterSatisfaction = (p, visiteId, sat) => {
    const visites = (p.visites || []).map((v) => v.id === visiteId ? { ...v, satisfaction: { ...sat, saisiLe: new Date().toISOString(), saisiPar: moi } } : v);
    save({ ...data, prospects: prospects.map((x) => x.id === p.id ? { ...x, visites } : x) },
      "a enregistré l'avis de " + p.nom + " sur la visite");
  };

  const nomBien = (id) => { const b = data.biens.find((x) => x.id === id); return b ? (b.unite || b.nom) : ""; };
  const nomAgent = (email) => {
    if (!email) return "—";
    const a = (data.agents || []).find((x) => String(x.email || "").trim().toLowerCase() === String(email).trim().toLowerCase());
    if (a && a.nom) return a.nom;
    const parProspect = prospects.find((x) => x.agent === email && x.agentNom);
    if (parProspect) return parProspect.agentNom;
    if (email === emailGerante) return "Gérante";
    return email.split("@")[0];
  };

  // Un prospect écarté sort du pipeline actif mais reste consultable
  const ecarte = (p) => p.qualite === "mauvais";

  /* -------- Éligibilité à la prime --------
     Deux règles : au plus 2 prospects laissés sans contact, et aucune visite sans bon signé. */
  const SEUIL_NON_CONTACTES = 2;
  const MIN_MANDATS_EXCLUSIFS = 1;
  const MIN_LOCATIONS = 2;
  const MIN_VENTES = 1;

  const [moisPrime, setMoisPrime] = useState(moisCourant());
  const dansLeMois = (d) => String(d || "").slice(0, 7) === moisPrime;

  // Un agent est identifié par son email dans le CRM, par son id dans les opérations
  const agentParEmail = (email) => (data.agents || []).find((a) =>
    String(a.email || "").trim().toLowerCase() === String(email || "").trim().toLowerCase());

  const bilanAgent = (email, list) => {
    const enCours = list.filter((p) => !ecarte(p) && p.statut !== "conclu" && p.statut !== "perdu");
    const nonContactes = enCours.filter((p) => { const j = joursDepuis(p.dateContact); return j !== null && j >= SEUIL_NON_TRAITE; });
    const visites = list.flatMap((p) => (p.visites || []).map((v) => ({ ...v, prospect: p })));
    const sansBon = visites.filter((v) => !v.bonVisite);
    const notes = visites.map((v) => v.satisfaction && Number(v.satisfaction.note)).filter((n) => n > 0);
    const moyenne = notes.length ? (notes.reduce((a, b) => a + b, 0) / notes.length) : null;
    const retards = visites.filter((v) => v.satisfaction && v.satisfaction.ponctuel === "non").length;

    // Objectifs du mois, mesurés sur les opérations enregistrées et les mandats signés
    const ag = agentParEmail(email);
    const ops = (data.operations || []).filter((o) => ag && o.agentId === ag.id && dansLeMois(o.date));
    const ventes = ops.filter((o) => o.type === "vente");
    const locations = ops.filter((o) => o.type === "location");
    // Mandats exclusifs signés dans le mois — le semi-exclusif ne compte pas
    const exclusifs = (data.mandats || []).filter((m) => ag && m.agentId === ag.id
      && m.type === "exclusif" && dansLeMois(m.dateSignature));
    const semiExclusifs = (data.mandats || []).filter((m) => ag && m.agentId === ag.id
      && m.type === "semi" && dansLeMois(m.dateSignature));

    const motifs = [];
    if (nonContactes.length > SEUIL_NON_CONTACTES) motifs.push(nonContactes.length + " prospects non contactés (maximum " + SEUIL_NON_CONTACTES + ")");
    if (sansBon.length > 0) motifs.push(sansBon.length + " visite(s) sans bon de visite");
    if (!ag) motifs.push("agent non rattaché à une fiche (impossible de mesurer ses objectifs)");
    else {
      if (exclusifs.length < MIN_MANDATS_EXCLUSIFS) motifs.push(exclusifs.length + " mandat exclusif (minimum " + MIN_MANDATS_EXCLUSIFS + ")");
      if (locations.length < MIN_LOCATIONS) motifs.push(locations.length + " location(s) (minimum " + MIN_LOCATIONS + ")");
      if (ventes.length < MIN_VENTES) motifs.push(ventes.length + " vente(s) (minimum " + MIN_VENTES + ")");
    }
    return { enCours, nonContactes, visites, sansBon, moyenne, retards,
      ventes, locations, exclusifs, semiExclusifs, prime: motifs.length === 0, motifs };
  };

  // Prospects visibles : la gérante voit tout ; un commercial voit les siens + non attribués
  const visibles = suisGerante ? prospects : prospects.filter((p) => !p.agent || p.agent === moi || p.creePar === moi);

  // Filtrage par statut
  const filtres = filtreStatut === "tous" ? visibles : visibles.filter((p) => p.statut === filtreStatut);

  // Prospects actifs (non conclus, non perdus)
  const actifs = (list) => list.filter((p) => p.statut !== "conclu" && p.statut !== "perdu" && !ecarte(p));

  // Alertes : non traités (dernier contact > seuil) et sans visite
  const nonTraites = actifs(visibles).filter((p) => { const j = joursDepuis(p.dateContact); return j !== null && j >= SEUIL_NON_TRAITE; });
  const sansVisite = actifs(visibles).filter((p) => !(p.visites && p.visites.length > 0));
  const relancesDues = actifs(visibles).filter((p) => p.prochaineRelance && p.prochaineRelance <= aujourdhui());

  // Regroupement par agent pour le point hebdomadaire
  const parAgent = {};
  actifs(visibles).forEach((p) => { const a = p.agent || "(non attribué)"; (parAgent[a] = parAgent[a] || []).push(p); });

  const messageRelance = (p) =>
    "Bonjour " + p.nom + ",\n\nJe me permets de revenir vers vous concernant votre recherche " +
    (p.recherche === "Achat" ? "d'achat" : "de location") + (p.typeBien ? " (" + p.typeBien + ")" : "") +
    ". Êtes-vous toujours intéressé(e) ? Je reste à votre disposition.\n\nCordialement,\n" + (P.societe || "Season Immobilier");

  const messageSatisfaction = (p, v) =>
    "Bonjour " + p.nom + ",\n\nVous avez visité " + (v.bien || "un bien") + " avec " +
    (p.agentNom || nomAgent(p.agent)) + ". Merci de nous consacrer un instant :\n\n" +
    "1. Le commercial était-il à l'heure ? (oui / non)\n" +
    "2. Comment avez-vous trouvé la visite ?\n" +
    "3. Quelle note donnez-vous au commercial, de 1 à 5 ?\n\n" +
    "Votre retour nous aide à mieux vous servir.\n\n" + (P.societe || "Season Immobilier");

  const messageAgent = (agentEmail, list) =>
    "Bonjour,\n\nPoint hebdomadaire sur vos prospects (" + list.length + ") :\n" +
    list.map((p) => "• " + p.nom + " — " + statutLabelCRM(p.statut) +
      (joursDepuis(p.dateContact) !== null ? " (dernier contact il y a " + joursDepuis(p.dateContact) + " j)" : "")).join("\n") +
    "\n\nMerci de me faire un retour sur chacun.\n" + (P.societe || "Season Immobilier");

  return (
    <div>
      <Head title="CRM · Prospects" sub="Suivi des clients à la recherche d'un bien (location et achat)"
        action={<Btn variant="accent" onClick={ouvrirNouveau}>+ Prospect</Btn>} />

      {/* Bandeau d'alerte pour la gérante */}
      {(nonTraites.length > 0 || relancesDues.length > 0) && (
        <div className="mb-4 px-4 py-3 rounded text-sm garder-couleur sans-impression" style={{ background: C.goldSoft, color: C.gold }}>
          {relancesDues.length > 0 && <div>🔔 {relancesDues.length} relance(s) prévue(s) aujourd'hui ou en retard.</div>}
          {nonTraites.length > 0 && <div>⚠ {nonTraites.length} client(s) pas recontacté(s) depuis plus de {SEUIL_NON_TRAITE} jours.</div>}
        </div>
      )}

      {/* Sélecteur de vue */}
      <div className="flex gap-2 mb-4 sans-impression flex-wrap">
        {[["pipeline","Pipeline"],["liste","Liste"],["alertes","À traiter"],["point","Point hebdo"]].map(([k, lab]) => (
          <button key={k} onClick={() => setVue(k)} className="px-3 py-1.5 rounded text-sm font-medium"
            style={{ background: vue === k ? C.ink : "transparent", color: vue === k ? "#fff" : C.mute, border: "1px solid " + (vue === k ? C.ink : C.line) }}>
            {lab}{k === "alertes" && (nonTraites.length + sansVisite.length) > 0 ? " (" + (nonTraites.length) + ")" : ""}</button>))}
      </div>

      {prospects.length === 0 && (
        <div className="mb-5 px-4 py-3 rounded text-sm" style={{ background: C.greenSoft, color: C.ink }}>
          Aucun prospect pour l'instant. Cliquez sur « + Prospect » pour enregistrer votre premier client à la recherche d'un bien.
        </div>
      )}

      {/* ===== VUE PIPELINE (colonnes par statut) ===== */}
      {vue === "pipeline" && prospects.length > 0 && (
        <div className="overflow-x-auto sans-impression">
          <div className="flex gap-3" style={{ minWidth: "min-content" }}>
            {CRM_STATUTS.map(([k, lab, tone]) => {
              const col = visibles.filter((p) => p.statut === k);
              return (
                <div key={k} className="rounded-lg p-2" style={{ background: "#F5F4EE", minWidth: 230, width: 230 }}>
                  <div className="flex items-center justify-between px-1 mb-2">
                    <span className="text-xs font-semibold uppercase tracking-wide" style={{ color: C.ink }}>{lab}</span>
                    <span className="text-xs" style={{ color: C.mute }}>{col.length}</span>
                  </div>
                  <div className="space-y-2">
                    {col.map((p) => {
                      const j = joursDepuis(p.dateContact);
                      const alerte = j !== null && j >= SEUIL_NON_TRAITE && k !== "conclu" && k !== "perdu";
                      return (
                        <div key={p.id} onClick={() => setFicheId(p.id)} className={card + " p-2.5 cursor-pointer"}
                          style={{ borderColor: alerte ? C.gold : C.line, borderWidth: alerte ? 2 : 1 }}>
                          <div className="font-semibold text-sm" style={{ color: C.ink }}>{p.nom}</div>
                          <div className="text-[11px] mb-1" style={{ color: C.mute }}>
                            {p.recherche}{p.typeBien ? " · " + p.typeBien : ""}{p.budget ? " · " + fcfa(p.budget) : ""}</div>
                          <div className="flex items-center justify-between">
                            <span className="text-[10px]" style={{ color: C.mute }}>{nomAgent(p.agent)}</span>
                            {alerte && <span className="text-[10px] font-semibold garder-couleur" style={{ color: C.gold }}>⚠ {j}j</span>}
                            {!(p.visites && p.visites.length) && k !== "conclu" && k !== "perdu" &&
                              <span className="text-[10px] garder-couleur" style={{ color: C.clay }}>· 0 visite</span>}
                          </div>
                        </div>);
                    })}
                    {col.length === 0 && <div className="text-[11px] text-center py-2" style={{ color: C.mute }}>—</div>}
                  </div>
                </div>);
            })}
          </div>
        </div>
      )}

      {/* ===== VUE LISTE ===== */}
      {vue === "liste" && prospects.length > 0 && (
        <div>
          <div className="flex gap-2 mb-3 flex-wrap sans-impression">
            <button onClick={() => setFiltreStatut("tous")} className="px-2.5 py-1 rounded text-xs font-medium"
              style={{ background: filtreStatut === "tous" ? C.ink : "transparent", color: filtreStatut === "tous" ? "#fff" : C.mute, border: "1px solid " + C.line }}>Tous ({visibles.length})</button>
            {CRM_STATUTS.map(([k, lab]) => {
              const n = visibles.filter((p) => p.statut === k).length;
              return <button key={k} onClick={() => setFiltreStatut(k)} className="px-2.5 py-1 rounded text-xs font-medium"
                style={{ background: filtreStatut === k ? C.ink : "transparent", color: filtreStatut === k ? "#fff" : C.mute, border: "1px solid " + C.line }}>{lab} ({n})</button>;
            })}
          </div>
          <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead><tr style={{ background: "#F5F4EE" }}>
                  {["Client","Recherche","Budget","Agent","Statut","Dernier contact","Visites",""].map((h) => (
                    <th key={h} className="text-left px-3 py-2.5 text-[10px] font-semibold uppercase tracking-[0.1em]" style={{ color: C.mute }}>{h}</th>))}
                </tr></thead>
                <tbody className="divide-y" style={{ borderColor: C.line }}>
                  {filtres.map((p) => {
                    const j = joursDepuis(p.dateContact);
                    const alerte = j !== null && j >= SEUIL_NON_TRAITE && p.statut !== "conclu" && p.statut !== "perdu";
                    return (
                      <tr key={p.id} className="cursor-pointer" onClick={() => setFicheId(p.id)}>
                        <td className="px-3 py-2.5 font-medium" style={{ color: C.ink }}>{p.nom}<div className="text-[11px] font-normal" style={{ color: C.mute }}>{p.tel}</div></td>
                        <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{p.recherche}{p.typeBien ? " · " + p.typeBien : ""}{p.quartier ? " · " + p.quartier : ""}</td>
                        <td className="px-3 py-2.5 tabular-nums text-xs" style={{ color: C.ink }}>{p.budget ? fcfa(p.budget) : "—"}</td>
                        <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{nomAgent(p.agent)}</td>
                        <td className="px-3 py-2.5"><Tag tone={statutToneCRM(p.statut)}>{statutLabelCRM(p.statut)}</Tag></td>
                        <td className="px-3 py-2.5 text-xs" style={{ color: alerte ? C.gold : C.mute }}>{j !== null ? "il y a " + j + " j" : "—"}{alerte ? " ⚠" : ""}</td>
                        <td className="px-3 py-2.5 text-xs" style={{ color: (p.visites && p.visites.length) ? C.ink : C.clay }}>{(p.visites && p.visites.length) || 0}</td>
                        <td className="px-3 py-2.5 text-right" onClick={(e) => e.stopPropagation()}>
                          <button onClick={() => ouvrirWhatsApp(p.tel, messageRelance(p))} className="text-xs font-semibold" style={{ color: C.green }}>WhatsApp</button>
                        </td>
                      </tr>);
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {/* ===== VUE ALERTES / À TRAITER ===== */}
      {vue === "alertes" && (

              : <div className="space-y-2">{nonTraites.map((p) => <LigneAlerte key={p.id} p={p} onFiche={() => setFicheId(p.id)} messageRelance={messageRelance} nomAgent={nomAgent} />)}</div>}
          </div>
          <div>
            <h3 className="text-sm font-semibold mb-2 flex items-center gap-2" style={{ color: C.clay }}>
              🚪 Clients sans aucune visite <span className="text-xs font-normal" style={{ color: C.mute }}>({sansVisite.length})</span></h3>
            {sansVisite.length === 0 ? <p className="text-xs" style={{ color: C.mute }}>Tous les clients actifs ont au moins une visite.</p>
              : <div className="space-y-2">{sansVisite.map((p) => <LigneAlerte key={p.id} p={p} onFiche={() => setFicheId(p.id)} messageRelance={messageRelance} nomAgent={nomAgent} />)}</div>}
          </div>
        </div>
      )}

      {/* ===== VUE POINT HEBDOMADAIRE ===== */}
      {vue === "point" && (
        <div className="space-y-4">
          <div className="px-4 py-3 rounded text-sm" style={{ background: C.greenSoft, color: C.ink }}>

          </div>
          <div className="px-4 py-3 rounded text-xs" style={{ background: "#F5F4EE", color: C.mute }}>
            <div className="flex items-center justify-between gap-3 flex-wrap mb-2">
              <b style={{ color: C.ink }}>Conditions d'attribution de la prime</b>
              <div className="flex items-center gap-2 sans-impression">
                <span>Mois évalué</span>
                <input type="month" value={moisPrime} onChange={(e) => setMoisPrime(e.target.value)}

            </div>
            <ul className="space-y-0.5">
              <li>• Au moins {MIN_MANDATS_EXCLUSIFS} mandat exclusif signé dans le mois</li>
              <li>• Au moins {MIN_LOCATIONS} locations conclues dans le mois</li>
              <li>• Au moins {MIN_VENTES} vente conclue dans le mois</li>
              <li>• Au plus {SEUIL_NON_CONTACTES} prospects laissés sans contact depuis {SEUIL_NON_TRAITE} jours</li>
              <li>• Aucune visite sans bon de visite confirmé</li>
            </ul>
            <p className="mt-2">
              Ventes et locations proviennent de l'onglet Commissions ; les mandats exclusifs de l'onglet Mandats,
              d'après leur date de signature. Seul le mandat exclusif compte : le semi-exclusif est affiché à titre
              indicatif. Les prospects écartés ne sont pas comptabilisés.
              La note donnée par les clients est indicative et n'entre pas dans le calcul.
            </p>
          </div>
          {Object.keys(parAgent).length === 0 ? <Empty text="Aucun prospect actif à suivre." />
            : Object.entries(parAgent).map(([agent, list]) => (
              <div key={agent} className={card + " p-4"} style={{ borderColor: C.line }}>
                <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
                  <div>
                    <h3 className="font-semibold text-sm" style={{ color: C.ink }}>{nomAgent(agent)}</h3>
                    <p className="text-xs" style={{ color: C.mute }}>{list.length} client(s) actif(s)</p>
                  </div>
                  {(() => {
                    const b = bilanAgent(agent, (suisGerante ? prospects : visibles).filter((x) => (x.agent || "(non attribué)") === agent));
                    return (
                      <div className="text-right">
                        <Tag tone={b.prime ? "ok" : "bad"}>{b.prime ? "Prime acquise" : "Prime non acquise"}</Tag>
                        <div className="text-[11px] mt-1 flex gap-2 justify-end flex-wrap">
                          {[["Exclusifs", b.exclusifs.length, MIN_MANDATS_EXCLUSIFS],

                            <span key={lab} style={{ color: n >= min ? C.green : C.clay }}>

                        </div>
                        {b.moyenne !== null && (
                          <div className="text-[11px] mt-0.5" style={{ color: b.moyenne >= 4 ? C.green : b.moyenne >= 3 ? C.gold : C.clay }}>

                      </div>);
                  })()}
                  <div className="flex gap-2 sans-impression">
                    {agent.includes("@") && <button onClick={() => ouvrirMail(agent, "Point hebdomadaire — vos prospects", messageAgent(agent, list))} className="text-xs font-semibold" style={{ color: C.green }}>Email le point</button>}
                    <button onClick={() => { navigator.clipboard && navigator.clipboard.writeText(messageAgent(agent, list)); window.alert("Le point a été copié. Collez-le dans WhatsApp."); }} className="text-xs font-semibold" style={{ color: C.ink }}>Copier</button>
                  </div>
                </div>
                {(() => {
                  const b = bilanAgent(agent, (suisGerante ? prospects : visibles).filter((x) => (x.agent || "(non attribué)") === agent));
                  if (b.prime) return null;
                  return (
                    <div className="mb-3 px-3 py-2 rounded text-xs garder-couleur" style={{ background: "#FDECEC", color: C.clay }}>
                      <b>Conditions de prime non remplies :</b> {b.motifs.join(" · ")}.
                    </div>);

                <div className="space-y-1">
                  {list.map((p) => {

                    return (

                      </div>);

                </Select></Field>
              <Field label="Exercice"><Input type="number" value={fi.annee} onChange={(e) => setFi({ ...fi, annee: e.target.value })} /></Field>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Commune"><Input value={fi.commune} onChange={(e) => setFi({ ...fi, commune: e.target.value })} placeholder="Cocody" /></Field>
              <Field label="Montant (F CFA)"><Input type="number" value={fi.montant} onChange={(e) => setFi({ ...fi, montant: e.target.value })} /></Field>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Date limite de paiement"><Input type="date" value={fi.dateLimite} onChange={(e) => setFi({ ...fi, dateLimite: e.target.value })} /></Field>
              <Field label="Date de règlement"><Input type="date" value={fi.datePaiement} onChange={(e) => setFi({ ...fi, datePaiement: e.target.value })} /></Field>
            </div>
            <Field label="Référence de l'avis"><Input value={fi.reference} onChange={(e) => setFi({ ...fi, reference: e.target.value })} /></Field>
            <Field label="Notes"><Textarea rows={2} value={fi.notes} onChange={(e) => setFi({ ...fi, notes: e.target.value })} /></Field>
            {editImp && (
              <div>
                <Label>Avis d'imposition et quittance</Label>
                <PiecesJointes cle={"impot:" + editImp.id} c={c} />
              </div>
            )}
            <div className="flex gap-2 pt-1">
              <Btn variant="accent" onClick={enregistrerImpot}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => { setOpenImp(false); setEditImp(null); }}>Annuler</Btn>
            </div>
            {!editImp && <p className="text-xs" style={{ color: C.mute }}>
              L'avis d'imposition se joint après enregistrement, en rouvrant la ligne.</p>}
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ---------- Formulaire d'attestation d'assurance ---------- */
function FormAssurance({ loc, c, onClose, onSave }) {
  const a = loc.assurance || {};
  const [f, setF] = useState({ assureur: a.assureur || "", police: a.police || "", debut: a.debut || "", fin: a.fin || "" });
  const maj = (k, v) => setF((x) => ({ ...x, [k]: v }));

  // Une police court en général sur douze mois
  const majDebut = (v) => {
    setF((x) => {
      if (!v) return { ...x, debut: v };
      const d = new Date(v);
      d.setFullYear(d.getFullYear() + 1);
      d.setDate(d.getDate() - 1);
      return { ...x, debut: v, fin: x.fin || d.toISOString().slice(0, 10) };
    });
  };

  return (
    <Modal title={"Attestation d'assurance — " + loc.nom} onClose={onClose}>
      <div className="space-y-3">
        <div className="grid sm:grid-cols-2 gap-3">
          <Field label="Compagnie d'assurance"><Input value={f.assureur} onChange={(e) => maj("assureur", e.target.value)} placeholder="NSIA, SUNU, Allianz…" /></Field>
          <Field label="N° de police"><Input value={f.police} onChange={(e) => maj("police", e.target.value)} /></Field>
        </div>
        <div className="grid sm:grid-cols-2 gap-3">
          <Field label="Début de couverture"><Input type="date" value={f.debut} onChange={(e) => majDebut(e.target.value)} /></Field>
          <Field label="Fin de couverture"><Input type="date" value={f.fin} onChange={(e) => maj("fin", e.target.value)} /></Field>
        </div>
        <p className="text-[11px]" style={{ color: C.mute }}>
          La date de fin est proposée à un an moins un jour après le début ; corrigez-la si la police diffère.
        </p>
        <div>
          <Label>Attestation scannée</Label>
          <PiecesJointes cle={"assurance:" + loc.id} c={c} />
        </div>
        <div className="flex gap-2 pt-1">
          <Btn variant="accent" onClick={() => onSave(f)}>Enregistrer</Btn>
          <Btn variant="ghost" onClick={onClose}>Annuler</Btn>
        </div>
      </div>
    </Modal>
  );
}

/* ============================== Impayés et relances ============================== */

const NIVEAUX_RELANCE = [
  { n: 1, jours: 5, libelle: "Rappel amiable", tone: "neutral" },
  { n: 2, jours: 15, libelle: "Relance", tone: "warn" },
  { n: 3, jours: 30, libelle: "Mise en demeure", tone: "bad" },
];

function Impayes({ data, save, moi }) {
  const P = data.parametres || PARAMS_DEFAUT;
  const relances = data.relances || [];
  const [vue, setVue] = useState("balance"); // balance, relances, courrier
  const [courrier, setCourrier] = useState(null);
  const today = aujourdhui();

  /* ---------- Calcul des impayés, mois par mois ---------- */
  const dettes = useMemo(() => {
    const out = [];
    const actifs = (data.locataires || []).filter((l) => l.actif !== false);
    actifs.forEach((l) => {
      const b = (data.biens || []).find((x) => x.id === l.bienId);
      if (!b || !l.entree) return;
      const loyer = Number(b.loyer) || 0;
      if (loyer <= 0) return;
      let m = l.entree.slice(0, 7);
      const fin = moisCourant();
      const lignes = [];
      let garde = 0;
      while (m <= fin && garde < 240) {
        const ech = m + "-" + String(l.jour || 5).padStart(2, "0");
        if (ech <= today) {
          const p = (data.paiements || []).find((x) => x.bienId === b.id && x.mois === m);
          const paye = Number((p || {}).montant || 0);
          const reste = loyer - paye;
          if (reste > 0) {
            const retard = Math.floor((new Date(today) - new Date(ech)) / 86400000);
            lignes.push({ mois: m, ech, du: loyer, paye, reste, retard });
          }
        }
        m = addMois(m, 1);
        garde++;
      }
      if (lignes.length === 0) return;
      const total = lignes.reduce((s, x) => s + x.reste, 0);
      const plusAncien = lignes[0];
      const tranche = (min, max) => lignes.filter((x) => x.retard >= min && (max === null || x.retard <= max))
        .reduce((s, x) => s + x.reste, 0);
      const relancesLoc = relances.filter((r) => r.locataireId === l.id);
      const derniere = relancesLoc.length ? relancesLoc.slice().sort((a, b) => b.date.localeCompare(a.date))[0] : null;
      // Niveau attendu au vu de l'ancienneté de la plus vieille échéance impayée
      const attendu = NIVEAUX_RELANCE.slice().reverse().find((x) => plusAncien.retard >= x.jours);
      const fait = derniere ? Number(derniere.niveau) : 0;
      out.push({
        loc: l, bien: b, lignes, total, plusAncien,
        t30: tranche(0, 30), t60: tranche(31, 60), t90: tranche(61, 90), t90p: tranche(91, null),
        moisDus: lignes.length, derniere, niveauAttendu: attendu ? attendu.n : 0, niveauFait: fait,
        aRelancer: attendu ? fait < attendu.n : false,
      });
    });
    return out.sort((a, b) => b.plusAncien.retard - a.plusAncien.retard);
  }, [data, relances, today]);

  const totaux = dettes.reduce((a, d) => ({
    total: a.total + d.total, t30: a.t30 + d.t30, t60: a.t60 + d.t60, t90: a.t90 + d.t90, t90p: a.t90p + d.t90p,
  }), { total: 0, t30: 0, t60: 0, t90: 0, t90p: 0 });

  const aRelancer = dettes.filter((d) => d.aRelancer);

  /* ---------- Courriers types ---------- */
  const texteRelance = (d, niveau) => {
    const nom = d.loc.nom;
    const detail = d.lignes.map((x) => "• " + moisLabel(x.mois) + " : " + fcfa(x.reste) + " (échéance du " + dateLongue(x.ech) + ")").join("\n");
    const societe = P.societe || "Season Immobilier";
    if (niveau === 1) {
      return "Bonjour " + nom + ",\n\nSauf erreur de notre part, le règlement suivant ne nous est pas encore parvenu :\n\n"
        + detail + "\n\nTotal : " + fcfa(d.total) + "\n\n"
        + "Si le règlement a été effectué entre-temps, merci de ne pas tenir compte de ce message et de nous transmettre la preuve de paiement.\n\n"
        + "Cordialement,\n" + societe + (P.tel ? "\n" + P.tel : "");
    }
    if (niveau === 2) {
      return "Bonjour " + nom + ",\n\nMalgré notre précédent rappel, nous constatons que les loyers suivants restent impayés :\n\n"
        + detail + "\n\nTotal dû : " + fcfa(d.total) + "\n\n"
        + "Nous vous remercions de régulariser votre situation sous huitaine, ou de nous contacter pour convenir d'un échéancier.\n\n"
        + "Cordialement,\n" + societe + (P.tel ? "\n" + P.tel : "");
    }
    return "Bonjour " + nom + ",\n\nVos loyers demeurent impayés malgré nos relances. Une mise en demeure vous est adressée ce jour :\n\n"
      + detail + "\n\nTotal dû : " + fcfa(d.total) + "\n\n"
      + "Nous vous invitons à prendre contact avec nous sans délai.\n\n"
      + societe + (P.tel ? "\n" + P.tel : "");
  };

  const enregistrerRelance = (d, niveau, canal) => {
    save({ ...data, relances: [{ id: uid(), locataireId: d.loc.id, bienId: d.bien.id,
      niveau, canal, montant: d.total, moisDus: d.moisDus,
      date: new Date().toISOString(), par: moi }, ...relances] },
      "a envoyé une relance niveau " + niveau + " à " + d.loc.nom + " (" + fcfa(d.total) + ")");
  };

  const envoyer = (d, niveau, canal) => {
    const t = texteRelance(d, niveau);
    if (canal === "WhatsApp") ouvrirWhatsApp(d.loc.tel, t);
    else ouvrirMail(d.loc.email, "Régularisation de loyer — " + (P.societe || "Season Immobilier"), t);
    enregistrerRelance(d, niveau, canal);
  };

  /* ---------- Courrier de mise en demeure imprimable ---------- */
  if (courrier) {
    const d = dettes.find((x) => x.loc.id === courrier);
    if (!d) { setCourrier(null); return null; }
    return (
      <div>
        <button onClick={() => setCourrier(null)} className="text-sm mb-4 sans-impression" style={{ color: C.mute }}>← Retour aux impayés</button>
        <Head title="Mise en demeure" sub={d.loc.nom}
          action={<>
            <Btn variant="ghost" onClick={() => genererPdf(document.getElementById("doc-mad"), "Mise_en_demeure_" + d.loc.nom.replace(/\s+/g, "_") + ".pdf")}>Télécharger PDF</Btn>
            <Btn variant="solid" onClick={() => window.print()}>Imprimer</Btn>
            <Btn variant="accent" onClick={() => enregistrerRelance(d, 3, "Courrier")}>Marquer comme remise</Btn>
          </>} />
        <div className="zone-impression" id="doc-mad" style={{ background: "#fff" }}>
          <div className="p-3 sm:p-6 text-sm" style={{ color: C.ink }}>
            <EnTete p={P} droite={<div>
              <div className="text-[10px] uppercase tracking-[0.14em]" style={{ color: C.mute }}>Mise en demeure</div>
              <div className="font-bold text-sm" style={{ color: C.ink }}>{dateLongue(today)}</div></div>} />

            <div className="mb-6">
              <div className="text-[10px] uppercase tracking-[0.14em] mb-1" style={{ color: C.mute }}>Destinataire</div>
              <div className="font-semibold">{d.loc.nom}</div>
              {d.bien.adresse && <div style={{ color: C.mute }}>{d.bien.adresse}</div>}
              {d.loc.tel && <div style={{ color: C.mute }}>{d.loc.tel}</div>}
            </div>

            <h2 className="text-lg font-bold mb-3">Mise en demeure de payer</h2>

            <p className="mb-3">Madame, Monsieur,</p>
            <p className="mb-3">
              Vous occupez le bien désigné ci-après : <b>{d.bien.nom}</b>
              {d.bien.adresse ? ", sis " + d.bien.adresse : ""}, en vertu du bail conclu avec notre agence.
            </p>
            <p className="mb-3">
              À la date du {dateLongue(today)}, nous constatons que les loyers suivants demeurent impayés :
            </p>

            <table className="w-full text-sm mb-4">
              <thead><tr style={{ borderBottom: "1px solid " + C.line }}>
                {["Période", "Échéance", "Montant dû", "Réglé", "Reste dû", "Retard"].map((h) => (
                  <th key={h} className="py-2 text-left text-xs font-semibold" style={{ color: C.mute }}>{h}</th>))}
              </tr></thead>
              <tbody>
                {d.lignes.map((x) => (
                  <tr key={x.mois} style={{ borderBottom: "1px solid " + C.line }}>
                    <td className="py-2">{moisLabel(x.mois)}</td>
                    <td className="py-2 text-xs">{dateLongue(x.ech)}</td>
                    <td className="py-2 tabular-nums">{fcfa(x.du)}</td>
                    <td className="py-2 tabular-nums">{fcfa(x.paye)}</td>
                    <td className="py-2 tabular-nums font-semibold">{fcfa(x.reste)}</td>
                    <td className="py-2 text-xs">{x.retard} j</td>
                  </tr>))}
                <tr style={{ borderTop: "2px solid " + C.ink }}>
                  <td className="py-2.5 font-bold" colSpan={4}>TOTAL DÛ</td>
                  <td className="py-2.5 tabular-nums font-bold">{fcfa(d.total)}</td>
                  <td></td>
                </tr>
              </tbody>
            </table>

            <p className="mb-3">
              Par la présente, nous vous mettons en demeure de régler la somme de <b>{fcfa(d.total)}</b>
              {" "}({enLettres(d.total)} francs CFA) dans un délai de <b>huit (08) jours</b>
              {" "}à compter de la réception du présent courrier.
            </p>
            <p className="mb-3">
              À défaut de règlement dans ce délai, nous nous réservons le droit d'engager toute procédure utile
              au recouvrement de notre créance et à la résiliation du bail, sans nouvel avis de notre part.
            </p>
            <p className="mb-3">
              Si vous rencontrez une difficulté passagère, nous vous invitons à prendre contact avec nous sans
              délai afin d'examiner ensemble un échéancier de règlement.
            </p>
            <p className="mb-5">Nous vous prions d'agréer, Madame, Monsieur, l'expression de nos salutations distinguées.</p>

            <div className="text-right">
              <div style={{ borderTop: "1px solid " + C.ink, display: "inline-block", paddingTop: 4, minWidth: 220 }}>
                Pour {P.societe || "Season Immobilier"}<br />
                <span style={{ color: C.mute }}>La Gérance</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* ---------- Écran principal ---------- */
  return (
    <div>
      <Head title="Impayés" sub={dettes.length + " locataire(s) en retard · " + fcfa(totaux.total) + " à recouvrer"} />

      {aRelancer.length > 0 && (
        <div className="mb-4 px-4 py-3 rounded text-sm garder-couleur sans-impression" style={{ background: C.goldSoft, color: C.gold }}>
          🔔 {aRelancer.length} locataire(s) à relancer selon le circuit : rappel à 5 jours, relance à 15 jours,
          mise en demeure à 30 jours.
        </div>
      )}

      <div className="flex gap-2 mb-4 sans-impression flex-wrap">
        {[["balance", "Balance âgée"], ["relances", "À relancer (" + aRelancer.length + ")"], ["historique", "Historique"]].map(([k, lab]) => (
          <button key={k} onClick={() => setVue(k)} className="px-3 py-1.5 rounded text-sm font-medium"
            style={{ background: vue === k ? C.ink : "transparent", color: vue === k ? "#fff" : C.mute,
              border: "1px solid " + (vue === k ? C.ink : C.line) }}>{lab}</button>))}
      </div>

      {dettes.length === 0 ? <Empty text="Aucun impayé. Tous les loyers échus sont réglés." /> : <>

        {vue === "balance" && (
          <div>
            <div className="grid sm:grid-cols-2 lg:grid-cols-5 gap-3 mb-5">
              {[["Total dû", totaux.total, C.ink], ["Moins de 30 j", totaux.t30, C.mute],
                ["31 à 60 j", totaux.t60, C.gold], ["61 à 90 j", totaux.t90, C.gold],
                ["Plus de 90 j", totaux.t90p, C.clay]].map(([l, v, col]) => (
                <div key={l} className={card + " p-3"} style={{ borderColor: C.line }}>
                  <div className="text-[11px] mb-1" style={{ color: C.mute }}>{l}</div>
                  <div className="font-bold tabular-nums" style={{ color: col }}>{fcfa(v)}</div>
                </div>))}
            </div>

            <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead><tr style={{ background: "#F5F4EE" }}>
                  {["Locataire", "Bien", "Mois dus", "≤30 j", "31-60 j", "61-90 j", ">90 j", "Total", "Retard max"].map((h) => (
                    <th key={h} className="px-3 py-2.5 text-left text-xs font-semibold" style={{ color: C.mute }}>{h}</th>))}
                </tr></thead>
                <tbody>
                  {dettes.map((d) => (
                    <tr key={d.loc.id} style={{ borderTop: "1px solid " + C.line }}>
                      <td className="px-3 py-2.5 font-medium" style={{ color: C.ink }}>{d.loc.nom}
                        <div className="text-[11px] font-normal" style={{ color: C.mute }}>{d.loc.tel}</div></td>
                      <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{d.bien.nom}</td>
                      <td className="px-3 py-2.5 text-xs" style={{ color: C.ink }}>{d.moisDus}</td>
                      <td className="px-3 py-2.5 tabular-nums text-xs" style={{ color: C.mute }}>{d.t30 ? fcfa(d.t30) : "—"}</td>
                      <td className="px-3 py-2.5 tabular-nums text-xs" style={{ color: d.t60 ? C.gold : C.mute }}>{d.t60 ? fcfa(d.t60) : "—"}</td>
                      <td className="px-3 py-2.5 tabular-nums text-xs" style={{ color: d.t90 ? C.gold : C.mute }}>{d.t90 ? fcfa(d.t90) : "—"}</td>
                      <td className="px-3 py-2.5 tabular-nums text-xs" style={{ color: d.t90p ? C.clay : C.mute }}>{d.t90p ? fcfa(d.t90p) : "—"}</td>

        {vue === "relances" && (

                            <div className="text-[11px] mt-0.5" style={{ color: C.mute }}>

                        <div className="text-right">
                          <div className="font-bold tabular-nums" style={{ color: C.ink }}>{fcfa(d.total)}</div>

                      <div className="flex gap-2 flex-wrap pt-2" style={{ borderTop: "1px solid " + C.line }}>

/* ============================ prestataires =============================== */

const METIERS = ["Plombier","Électricien","Maçon","Peintre","Menuisier","Carreleur","Climatisation / Froid",
  "Serrurier","Vitrier","Étanchéité","Jardinier / Espaces verts","Nettoyage","Piscine","Ébéniste",
  "Antenniste","Domotique / Sécurité","Déménageur","Géomètre","Notaire","Huissier","Autre"];

function Prestataires({ data, save }) {
  const [open, setOpen] = useState(false);
  const [edit, setEdit] = useState(null);
  const [q, setQ] = useState("");
  const [filtreMetier, setFiltreMetier] = useState("");
  const liste = data.prestataires || [];

  const blank = { nom: "", metier: METIERS[0], tel: "", tel2: "", email: "", zone: "", adresse: "",
    tarif: "", note: 0, actif: true, remarques: "" };
  const [f, setF] = useState(blank);

  const start = (p) => { setEdit(p || null); setF(p ? { ...blank, ...p } : blank); setOpen(true); };
  const submit = () => {
    if (!f.nom.trim()) return;
    save({ ...data, prestataires: edit ? liste.map((x) => x.id === edit.id ? { ...f, id: edit.id } : x)
      : [...liste, { ...f, id: uid() }] }, (edit ? "a modifié le prestataire " : "a ajouté le prestataire ") + f.nom);
    setOpen(false);
  };
  const supprimer = (p) => save({ ...data, prestataires: liste.filter((x) => x.id !== p.id) }, "a supprimé le prestataire " + p.nom);

  const metiersPresents = [...new Set(liste.map((p) => p.metier))].sort();
  const visibles = liste.filter((p) =>
    (!q || p.nom.toLowerCase().includes(q.toLowerCase()) || (p.metier || "").toLowerCase().includes(q.toLowerCase()) || (p.zone || "").toLowerCase().includes(q.toLowerCase())) &&
    (!filtreMetier || p.metier === filtreMetier))
    .sort((a, b) => (a.metier || "").localeCompare(b.metier || "") || (a.nom || "").localeCompare(b.nom || ""));

  const Etoiles = ({ note, onSet }) => (
    <div className="flex gap-0.5">
      {[1, 2, 3, 4, 5].map((n) => (
        <button key={n} onClick={onSet ? () => onSet(n) : undefined} disabled={!onSet}
          style={{ color: n <= note ? C.gold : C.line, cursor: onSet ? "pointer" : "default", fontSize: 16, lineHeight: 1 }}>★</button>))}
    </div>
  );

  return (
    <div>
      <Head title="Artisans & prestataires" sub={liste.length + " contact(s) dans le carnet"}
        action={<Btn variant="accent" onClick={() => start(null)}>+ Ajouter</Btn>} />

      {liste.length === 0 ? <Empty text="Aucun prestataire enregistré. Constituez votre carnet d'artisans de confiance : plombier, électricien, maçon…"
          action={<Btn variant="accent" onClick={() => start(null)}>+ Ajouter un prestataire</Btn>} />
        : <>
            <div className="flex flex-wrap gap-2 mb-4 sans-impression">
              <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Rechercher (nom, métier, zone)"
                className="flex-1 min-w-[200px] px-3 py-2 text-sm rounded border bg-white outline-none" style={{ borderColor: C.line, color: C.ink }} />
              <Select value={filtreMetier} onChange={(e) => setFiltreMetier(e.target.value)}>
                <option value="">Tous les métiers</option>
                {metiersPresents.map((m) => <option key={m} value={m}>{m}</option>)}
              </Select>
            </div>

            <div className="grid md:grid-cols-2 gap-3">
              {visibles.map((p) => (
                <div key={p.id} className={card} style={{ borderColor: C.line, opacity: p.actif === false ? 0.55 : 1 }}>
                  <div className="p-4">
                    <div className="flex justify-between items-start gap-3 mb-2">
                      <div>
                        <h3 className="font-semibold text-sm" style={{ color: C.ink }}>{p.nom}</h3>
                        <div className="flex items-center gap-2 mt-0.5">
                          <Tag tone="neutral">{p.metier}</Tag>
                          {p.note > 0 && <Etoiles note={p.note} />}
                        </div>
                      </div>
                      {p.actif === false && <Tag tone="bad">Inactif</Tag>}
                    </div>
                    <div className="space-y-1 text-sm mb-3">
                      {p.tel && <Row k="Téléphone" v={p.tel} />}
                      {p.zone && <Row k="Zone" v={p.zone} />}
                      {p.tarif && <Row k="Tarif indicatif" v={p.tarif} />}
                    </div>
                    {p.remarques && <p className="text-xs mb-3 p-2 rounded" style={{ background: "#F5F4EE", color: C.mute }}>{p.remarques}</p>}
                    <div className="flex gap-2 flex-wrap">
                      {p.tel && <>
                        <a href={"tel:" + p.tel.replace(/\s/g, "")} className="inline-flex items-center px-3 py-2 rounded text-sm font-medium" style={{ background: C.ink, color: "#fff" }}>Appeler</a>
                        <button onClick={() => ouvrirWhatsApp(p.tel, "Bonjour " + p.nom + ",")} className="inline-flex items-center px-3 py-2 rounded text-sm font-medium" style={{ background: C.green, color: "#fff" }}>WhatsApp</button>
                      </>}
                      <Btn variant="ghost" onClick={() => start(p)}>Modifier</Btn>
                      <Btn variant="danger" onClick={() => supprimer(p)}>Supprimer</Btn>
                    </div>
                  </div>
                </div>))}
            </div>
          </>}

      {open && (
        <Modal title={edit ? "Modifier le prestataire" : "Nouveau prestataire"} onClose={() => setOpen(false)} wide>
          <div className="space-y-3">
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Nom / Entreprise"><Input value={f.nom} onChange={(e) => setF({ ...f, nom: e.target.value })} placeholder="Koffi Plomberie" /></Field>
              <Field label="Métier"><Select value={f.metier} onChange={(e) => setF({ ...f, metier: e.target.value })}>
                {METIERS.map((m) => <option key={m} value={m}>{m}</option>)}</Select></Field>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Téléphone"><Input value={f.tel} onChange={(e) => setF({ ...f, tel: e.target.value })} /></Field>
              <Field label="Téléphone 2"><Input value={f.tel2} onChange={(e) => setF({ ...f, tel2: e.target.value })} /></Field>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Email"><Input value={f.email} onChange={(e) => setF({ ...f, email: e.target.value })} /></Field>
              <Field label="Zone d'intervention"><Input value={f.zone} onChange={(e) => setF({ ...f, zone: e.target.value })} placeholder="Cocody, Riviera, Angré" /></Field>
            </div>
            <Field label="Adresse / Atelier"><Input value={f.adresse} onChange={(e) => setF({ ...f, adresse: e.target.value })} /></Field>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Tarif indicatif"><Input value={f.tarif} onChange={(e) => setF({ ...f, tarif: e.target.value })} placeholder="15 000 F/intervention" /></Field>
              <Field label="Statut"><Select value={f.actif !== false ? "1" : "0"} onChange={(e) => setF({ ...f, actif: e.target.value === "1" })}>
                <option value="1">Actif</option><option value="0">Inactif</option></Select></Field>
            </div>
            <Field label="Évaluation">
              <Etoiles note={f.note} onSet={(n) => setF({ ...f, note: n === f.note ? 0 : n })} />
            </Field>
            <Field label="Remarques"><Textarea value={f.remarques} onChange={(e) => setF({ ...f, remarques: e.target.value })}
              placeholder="Ponctuel, travail soigné, à rappeler pour les urgences…" /></Field>
            <div className="flex gap-2 pt-2">
              <Btn variant="accent" onClick={submit}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ============================== travaux ================================== */




function Travaux({ data, save, moi }) {
  const [open, setOpen] = useState(false);
  const [edit, setEdit] = useState(null);
  const [filtre, setFiltre] = useState("actifs");
  const liste = data.tickets || [];
  const P = data.parametres || PARAMS_DEFAUT;
  const emailGerante = (P.gerante || "aude.nioble@season-immobilier.com").trim().toLowerCase();
  const suisGerante = String(moi || "").trim().toLowerCase() === emailGerante;

  const decaisser = (t) => {
    const montant = window.prompt("Montant réellement décaissé pour « " + t.titre + " » (F CFA) :", String(t.cout || ""));
    if (montant === null) return;
    const d = window.prompt("Date du décaissement :", aujourdhui());
    if (d === null) return;
    save({ ...data, tickets: liste.map((x) => x.id === t.id
      ? { ...x, decaisse: true, montantDecaisse: Number(montant) || Number(t.cout) || 0, dateDecaisse: d || aujourdhui(), decaissePar: moi } : x) },
      "a validé le décaissement de " + fcfa(Number(montant) || t.cout || 0) + " pour « " + t.titre + " »");
  };
  const annulerDecaissement = (t) => {
    save({ ...data, tickets: liste.map((x) => x.id === t.id ? { ...x, decaisse: false, dateDecaisse: "", decaissePar: null } : x) },
      "a annulé le décaissement de « " + t.titre + " »");
  };

  const blank = { titre: "", bienId: "", priorite: "normale", statut: "a_faire",
    description: "", intervenant: "", cout: "", echeance: aujourdhui() };
  const [f, setF] = useState(blank);

  const start = (t) => { setEdit(t || null); setF(t ? { ...t } : { ...blank, bienId: (data.biens[0] || {}).id || "" }); setOpen(true); };

  const submit = () => {
    if (!f.titre.trim()) return;
    const rec = { ...f, cout: Number(f.cout) || 0 };
    const b = data.biens.find((x) => x.id === f.bienId);
    save({ ...data, tickets: edit ? liste.map((t) => t.id === edit.id ? { ...rec, id: edit.id } : t)
      : [{ ...rec, id: uid(), cree: new Date().toISOString() }, ...liste] },
      (edit ? "a modifié le ticket travaux " : "a créé un ticket travaux ") + rec.titre + ((b && b.nom) ? " — " + b.nom : ""));
    setOpen(false);
  };

  const avancer = (t) => {
    const suite = { a_faire: "en_cours", en_cours: "termine", termine: "a_faire" };
    const b = data.biens.find((x) => x.id === t.bienId);
    save({ ...data, tickets: liste.map((x) => x.id === t.id ? { ...x, statut: suite[x.statut] } : x) },
      "a fait passer le ticket « " + t.titre + " »" + ((b && b.nom) ? " (" + b.nom + ")" : "") + " en " +
      ({ a_faire: "à faire", en_cours: "en cours", termine: "terminé" }[suite[t.statut]]));
  };

  const supprimer = (t) => save({ ...data, tickets: liste.filter((x) => x.id !== t.id) }, "a supprimé le ticket « " + t.titre + " »");

  const tonePrio = { basse: "neutral", normale: "warn", urgente: "bad" };
  const libPrio = { basse: "Basse", normale: "Normale", urgente: "Urgente" };
  const toneStat = { a_faire: "bad", en_cours: "warn", termine: "ok" };
  const libStat = { a_faire: "À faire", en_cours: "En cours", termine: "Terminé" };

  const visibles = liste.filter((t) => filtre === "tous" ? true : filtre === "termines" ? t.statut === "termine" : t.statut !== "termine")
    .sort((a, b) => {
      const p = { urgente: 0, normale: 1, basse: 2 };
      if (a.statut === "termine" && b.statut !== "termine") return 1;
      if (b.statut === "termine" && a.statut !== "termine") return -1;
      if (p[a.priorite] !== p[b.priorite]) return p[a.priorite] - p[b.priorite];
      return (a.echeance || "").localeCompare(b.echeance || "");
    });

  const nbActifs = liste.filter((t) => t.statut !== "termine").length;
  const nbUrgents = liste.filter((t) => t.statut !== "termine" && t.priorite === "urgente").length;

  return (
    <div>
      <Head title="Travaux & rappels" sub={nbActifs + " en cours" + (nbUrgents ? " · " + nbUrgents + " urgent(s)" : "")}
        action={<Btn variant="accent" onClick={() => start(null)}>+ Nouveau ticket</Btn>} />

      <div className="flex gap-2 mb-4 sans-impression">
        {[["actifs", "En cours"], ["termines", "Terminés"], ["tous", "Tous"]].map(([k, lab]) => (
          <button key={k} onClick={() => setFiltre(k)}
            className="px-3 py-1.5 rounded text-sm font-medium"
            style={{ background: filtre === k ? C.ink : "transparent", color: filtre === k ? "#fff" : C.mute,
              border: "1px solid " + (filtre === k ? C.ink : C.line) }}>
            {lab}
          </button>))}
      </div>

      {visibles.length === 0
        ? <Empty text="Aucun ticket. Créez un rappel pour un travail à réaliser chez un client : plomberie, peinture, entretien…"
            action={<Btn variant="accent" onClick={() => start(null)}>+ Nouveau ticket</Btn>} />
        : <div className="grid md:grid-cols-2 gap-3">
            {visibles.map((t) => {
              const b = data.biens.find((x) => x.id === t.bienId);
              const retard = t.statut !== "termine" && t.echeance && t.echeance < aujourdhui();
              return (
                <div key={t.id} className={card} style={{ borderColor: retard ? C.clay : C.line,
                  borderLeft: "4px solid " + (t.statut === "termine" ? C.green : t.priorite === "urgente" ? C.clay : C.orange) }}>
                  <div className="p-4">
                    <div className="flex justify-between items-start gap-3 mb-2">
                      <h3 className="font-semibold text-sm" style={{ color: C.ink }}>{t.titre}</h3>
                      <Tag tone={toneStat[t.statut]}>{libStat[t.statut]}</Tag>
                    </div>
                    <div className="flex gap-2 mb-2">
                      <Tag tone={tonePrio[t.priorite]}>{libPrio[t.priorite]}</Tag>
                      {retard && <Tag tone="bad">En retard</Tag>}
                    </div>
                    <div className="space-y-1.5 text-sm mb-3">
                      {b && <Row k="Bien" v={b.nom} />}
                      {t.intervenant && <Row k="Intervenant" v={t.intervenant} />}
                      {t.echeance && <Row k="Échéance" v={t.echeance} />}
                      {t.cout > 0 && <Row k="Coût estimé" v={fcfa(t.cout)} />}
                      {t.decaisse && <Row k="Décaissé" v={fcfa(t.montantDecaisse || t.cout) + (t.dateDecaisse ? " le " + t.dateDecaisse : "")} />}
                    </div>
                    {t.description && <p className="text-xs mb-3 p-2 rounded" style={{ background: "#F5F4EE", color: C.mute }}>{t.description}</p>}
                    {t.statut === "termine" && (
                      <div className="mb-3">
                        {t.decaisse
                          ? <Tag tone="ok">Décaissement validé</Tag>
                          : <Tag tone="warn">{suisGerante ? "Décaissement à valider" : "En attente de validation du décaissement"}</Tag>}
                      </div>
                    )}
                    <div className="flex gap-2 flex-wrap">
                      <Btn variant={t.statut === "termine" ? "ghost" : "accent"} onClick={() => avancer(t)}>
                        {t.statut === "a_faire" ? "Démarrer" : t.statut === "en_cours" ? "Marquer terminé" : "Rouvrir"}
                      </Btn>
                      {t.statut === "termine" && suisGerante && !t.decaisse && (
                        <Btn variant="accent" onClick={() => decaisser(t)}>Valider le décaissement</Btn>
                      )}
                      {t.statut === "termine" && suisGerante && t.decaisse && (
                        <Btn variant="ghost" onClick={() => annulerDecaissement(t)}>Annuler le décaissement</Btn>
                      )}
                      <Btn variant="ghost" onClick={() => start(t)}>Modifier</Btn>
                      <Btn variant="danger" onClick={() => supprimer(t)}>Supprimer</Btn>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>}

      {open && (
        <Modal title={edit ? "Modifier le ticket" : "Nouveau ticket de travaux"} onClose={() => setOpen(false)}>
          <div className="space-y-3">
            <Field label="Intitulé du travail">
              <Input value={f.titre} onChange={(e) => setF({ ...f, titre: e.target.value })} placeholder="Réparer fuite robinet cuisine" />
            </Field>
            <Field label="Bien concerné">
              <Select value={f.bienId} onChange={(e) => setF({ ...f, bienId: e.target.value })}>
                <option value="">Aucun / général</option>
                {data.biens.map((b) => <option key={b.id} value={b.id}>{b.nom}</option>)}
              </Select>
            </Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Priorité">
                <Select value={f.priorite} onChange={(e) => setF({ ...f, priorite: e.target.value })}>
                  <option value="basse">Basse</option><option value="normale">Normale</option><option value="urgente">Urgente</option>
                </Select>
              </Field>
              <Field label="Statut">
                <Select value={f.statut} onChange={(e) => setF({ ...f, statut: e.target.value })}>
                  <option value="a_faire">À faire</option><option value="en_cours">En cours</option><option value="termine">Terminé</option>
                </Select>
              </Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Intervenant / artisan">
                <Input value={f.intervenant} onChange={(e) => setF({ ...f, intervenant: e.target.value })} placeholder="Plombier Koffi" />
              </Field>
              <Field label="Date prévue">
                <Input type="date" value={f.echeance} onChange={(e) => setF({ ...f, echeance: e.target.value })} />
              </Field>
            </div>
            <Field label="Coût estimé (F CFA)">
              <Input type="number" value={f.cout} onChange={(e) => setF({ ...f, cout: e.target.value })} />
            </Field>
            <Field label="Description / notes">
              <Textarea value={f.description} onChange={(e) => setF({ ...f, description: e.target.value })}
                placeholder="Détails de l'intervention, pièces à prévoir…" />
            </Field>
            <div className="flex gap-2 pt-2">
              <Btn variant="accent" onClick={submit}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================================ factures ================================ */


function Factures({ data, save }) {
  const [open, setOpen] = useState(false);
  const blank = { bienId: "", type: "SODECI", libelle: "", montant: "", echeance: "", statut: "encours" };
  const [f, setF] = useState(blank);

  const submit = () => {
    if (!f.bienId || !f.montant) return;
    const b = data.biens.find((x) => x.id === f.bienId);
    save({ ...data, factures: [...data.factures, { ...f, montant: Number(f.montant), id: uid() }] },
      "a ajouté une charge " + f.type + " de " + fcfa(f.montant) + " — " + ((b || {}).nom || ""));
    setOpen(false);
  };

  const toggle = (x) => save({ ...data, factures: data.factures.map((y) => y.id === x.id
    ? { ...y, statut: y.statut === "payee" ? "encours" : "payee" } : y) },
    (x.statut === "payee" ? "a rouvert" : "a réglé") + " la charge " + (x.libelle || x.type));

  const total = data.factures.filter((x) => x.statut !== "payee").reduce((s, x) => s + x.montant, 0);

  return (
    <div>
      <Head title="Charges & factures" sub={fcfa(total) + " en attente de règlement"}
        action={<Btn variant="accent" onClick={() => { setF({ ...blank, bienId: (data.biens[0] || {}).id || "" }); setOpen(true); }}
          disabled={data.biens.length === 0}>+ Ajouter</Btn>} />

      {data.factures.length === 0 ? <Empty text="Aucune facture enregistrée." />
        : <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr style={{ background: "#F5F4EE" }}>
                {["Désignation","Bien","Type","Échéance","Montant","Statut",""].map((h) => (
                  <th key={h} className="text-left px-4 py-2.5 text-[10px] font-semibold uppercase tracking-[0.12em]" style={{ color: C.mute }}>{h}</th>))}
              </tr></thead>
              <tbody className="divide-y" style={{ borderColor: C.line }}>
                {data.factures.map((x) => {
                  const b = data.biens.find((y) => y.id === x.bienId);
                  const retard = x.statut !== "payee" && x.echeance && x.echeance < aujourdhui();
                  return (
                    <tr key={x.id}>
                      <td className="px-4 py-3" style={{ color: C.ink }}>{x.libelle || x.type}</td>
                      <td className="px-4 py-3" style={{ color: C.mute }}>{(b || {}).nom || "—"}</td>
                      <td className="px-4 py-3" style={{ color: C.mute }}>{x.type}</td>
                      <td className="px-4 py-3" style={{ color: retard ? C.clay : C.mute }}>{x.echeance || "—"}</td>
                      <td className="px-4 py-3 tabular-nums font-semibold" style={{ color: C.ink }}>{fcfa(x.montant)}</td>
                      <td className="px-4 py-3"><Tag tone={x.statut === "payee" ? "ok" : retard ? "bad" : "warn"}>
                        {x.statut === "payee" ? "Payée" : retard ? "En retard" : "En cours"}</Tag></td>
                      <td className="px-4 py-3"><div className="flex gap-3">
                        <button onClick={() => toggle(x)} className="text-xs font-semibold whitespace-nowrap" style={{ color: C.green }}>
                          {x.statut === "payee" ? "Rouvrir" : "Marquer payée"}</button>
                        <button onClick={() => save({ ...data, factures: data.factures.filter((y) => y.id !== x.id) },
                          "a supprimé la charge " + (x.libelle || x.type))}
                          className="text-xs font-semibold" style={{ color: C.clay }}>Supprimer</button>
                      </div></td>
                    </tr>);
                })}
              </tbody>
            </table>
          </div></div>}

      {open && (
        <Modal title="Nouvelle charge" onClose={() => setOpen(false)}>
          <div className="space-y-3">
            <Field label="Bien concerné"><Select value={f.bienId} onChange={(e) => setF({ ...f, bienId: e.target.value })}>
              <option value="">Sélectionner</option>
              {data.biens.map((b) => <option key={b.id} value={b.id}>{b.nom}</option>)}</Select></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Type"><Select value={f.type} onChange={(e) => setF({ ...f, type: e.target.value })}>
                <option>SODECI</option><option>CIE</option><option>Travaux</option>
                <option>Entretien</option><option>Impôts</option><option>Autre</option></Select></Field>
              <Field label="Montant (F CFA)"><Input type="number" value={f.montant} onChange={(e) => setF({ ...f, montant: e.target.value })} /></Field>
            </div>
            <Field label="Libellé"><Input value={f.libelle} onChange={(e) => setF({ ...f, libelle: e.target.value })} /></Field>
            <Field label="Date limite de règlement"><Input type="date" value={f.echeance} onChange={(e) => setF({ ...f, echeance: e.target.value })} /></Field>
            <div className="flex gap-2 pt-2">
              <Btn variant="accent" onClick={submit}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================================= agents ================================= */

function Agents({ data, save }) {
  const [open, setOpen] = useState(false);
  const [edit, setEdit] = useState(null);
  const blank = { nom: "", tel: "", email: "" };
  const [f, setF] = useState(blank);

  const start = (a) => { setEdit(a || null); setF(a ? { ...a } : blank); setOpen(true); };
  const submit = () => {
    if (!f.nom.trim()) return;
    const rec = { ...f };
    save({ ...data, agents: edit ? data.agents.map((a) => a.id === edit.id ? { ...rec, id: edit.id } : a)
      : [...data.agents, { ...rec, id: uid() }] }, (edit ? "a modifié l'agent " : "a ajouté l'agent ") + rec.nom);
    setOpen(false);
  };

  // Pour chaque agent : liste des biens dont il est responsable
  const infos = data.agents.map((a) => {
    const biens = data.biens.filter((b) => b.agentId === a.id);
    return { ...a, biens, nbBiens: biens.length };
  });

  return (
    <div>
      <Head title="Agents" sub="Les commerciaux responsables de chaque bien"
        action={<Btn variant="accent" onClick={() => start(null)}>+ Ajouter</Btn>} />

      {data.agents.length === 0 ? <Empty text="Aucun agent enregistré. Ajoutez vos commerciaux pour les rattacher aux biens." action={<Btn variant="accent" onClick={() => start(null)}>+ Ajouter un agent</Btn>} />
        : <div className="grid md:grid-cols-2 gap-3">
            {infos.map((a) => (
              <div key={a.id} className={card} style={{ borderColor: C.line }}><div className="p-4">
                <div className="flex justify-between items-start gap-3 mb-3">
                  <div><h3 className="font-semibold text-sm" style={{ color: C.ink }}>{a.nom}</h3>
                    <p className="text-xs" style={{ color: C.mute }}>{a.tel || "—"}{a.email ? " · " + a.email : ""}</p></div>
                  <Tag tone="neutral">{a.nbBiens} bien(s)</Tag>
                </div>
                {a.biens.length > 0 && (
                  <div className="mb-3 text-xs" style={{ color: C.mute }}>
                    Biens gérés : {a.biens.map((b) => b.nom).join(", ")}
                  </div>
                )}
                <div className="flex gap-2 flex-wrap">
                  {a.tel && <Btn variant="ghost" onClick={() => ouvrirWhatsApp(a.tel, "Bonjour " + a.nom)}>WhatsApp</Btn>}
                  <Btn variant="ghost" onClick={() => start(a)}>Modifier</Btn>
                  <Btn variant="danger" onClick={() => save({ ...data,
                    agents: data.agents.filter((x) => x.id !== a.id),
                    biens: data.biens.map((b) => b.agentId === a.id ? { ...b, agentId: "" } : b) },
                    "a supprimé l'agent " + a.nom)}>Supprimer</Btn>
                </div>
              </div></div>))}
          </div>}

      {open && (
        <Modal title={edit ? "Modifier l'agent" : "Nouvel agent"} onClose={() => setOpen(false)}>
          <div className="space-y-3">
            <Field label="Nom complet"><Input value={f.nom} onChange={(e) => setF({ ...f, nom: e.target.value })} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Téléphone"><Input value={f.tel} onChange={(e) => setF({ ...f, tel: e.target.value })} /></Field>
              <Field label="Email"><Input value={f.email} onChange={(e) => setF({ ...f, email: e.target.value })} /></Field>
            </div>
            <p className="text-xs" style={{ color: C.mute }}>
              L'agent se rattache à un bien via le champ « Agent en charge » dans la fiche du bien. Ses commissions se gèrent dans l'onglet Commissions.
            </p>
            <div className="flex gap-2 pt-2">
              <Btn variant="accent" onClick={submit}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* =========================== point propriétaire =========================== */

/* ========================= Conformité LBC/FT (CAPPI) ========================= */

const NATURES_CLIENT = ["Personne Physique", "Personne Morale", "Association", "Indivision"];
const NATURES_OPERATION = ["Vente Immobilière", "Gestion Immobilière", "Autre"];
const FONCTIONS_MANDATAIRE = ["PDG", "DG", "DGA", "Administrateur Général", "Président", "Gérant", "Mandataire", "Autre"];
const PROVENANCES_FONDS = ["De votre activité", "Des associés", "De la vente d'un immeuble", "Bancaire", "Autres"];
const ANCIENNETES = ["Inférieure à un an", "De 1 à 10 ans", "Plus de 10 ans"];

const blankFiche = {
  date: "", typeRelation: "Relation initiale",
  natureClient: "Personne Physique", natureOperation: "Vente Immobilière", natureOperationAutre: "",
  // 1. Renseignements client
  nom: "", nomJeuneFille: "", nomPere: "", nomMere: "", naissanceDate: "", naissanceLieu: "",
  adresseGeo: "", adressePostale: "", telephone: "", naturePiece: "", numPiece: "",
  numContribuable: "", email: "", whatsapp: "", nonResident: false, paysResidence: "",
  statutMatrimonial: "", nationalite: "", autresNationalites: "",
  professionActuelle: "", professions5ans: "", employeur: "", secteurActivite: "",
  // 2. Mandataire
  mandNom: "", mandPiece: "", mandNaissance: "", mandNationalite: "", mandPaysResidence: "",
  mandFonction: "", mandFonctionAutre: "",
  // 3. PPE
  ppe: "", ppePrecision: "",
  // 4. Opération
  operationAchat: false, operationGestion: false, operationAutre: "",
  descriptionOperation: "",
  // 5. Fonds
  provenanceFonds: [], provenanceAutre: "",
  proprieteFonds: "Propriété des intervenants", interetTiers: "",
  fondsIvoiriens: "", paysProvenance: "",
  anciennete: "",
  // Clôture
  lieuSignature: "ABIDJAN", dateSignature: "", nomSignataire: "",
  clientId: "", clientType: "",
};

function Conformite({ data, save, moi }) {
  const [open, setOpen] = useState(false);
  const [editId, setEditId] = useState(null);
  const [vue, setVue] = useState(null);
  const [etape, setEtape] = useState(1);
  const P = data.parametres || PARAMS_DEFAUT;
  const liste = data.fichesLbc || [];
  const emailGerante = (P.gerante || "aude.nioble@season-immobilier.com").trim().toLowerCase();
  const suisGerante = String(moi || "").trim().toLowerCase() === emailGerante;
  const [f, setF] = useState(blankFiche);

  const maj = (k, v) => setF((x) => ({ ...x, [k]: v }));
  const togglePro = (v) => setF((x) => ({ ...x,
    provenanceFonds: (x.provenanceFonds || []).includes(v)
      ? x.provenanceFonds.filter((y) => y !== v) : [...(x.provenanceFonds || []), v] }));

  const ouvrirNouveau = () => { setEditId(null); setEtape(1); setF({ ...blankFiche, date: aujourdhui(), dateSignature: aujourdhui() }); setOpen(true); };
  const modifier = (d) => { setEditId(d.id); setEtape(1); setF({ ...blankFiche, ...d }); setOpen(true); };

  // Champs indispensables pour qu'une fiche soit exploitable
  const manquants = (d) => {
    const req = [["nom", "Nom et prénoms"], ["naissanceDate", "Date de naissance"], ["naissanceLieu", "Lieu de naissance"],
      ["adresseGeo", "Adresse géographique"], ["telephone", "Téléphone"], ["naturePiece", "Nature de la pièce"],
      ["numPiece", "N° de pièce"], ["nationalite", "Nationalité"], ["professionActuelle", "Profession actuelle"],
      ["descriptionOperation", "Description de l'opération"], ["anciennete", "Ancienneté professionnelle"]];
    const out = req.filter(([k]) => !String(d[k] || "").trim()).map(([, lab]) => lab);
    if (!d.ppe) out.push("Statut PPE");
    if (!(d.provenanceFonds || []).length) out.push("Provenance des fonds");
    if (!d.fondsIvoiriens) out.push("Origine territoriale des fonds");
    if (d.natureClient !== "Personne Physique" && !String(d.mandNom || "").trim()) out.push("Identité du mandataire");
    return out;
  };

  const enregistrer = () => {
    if (!String(f.nom || "").trim()) { window.alert("Le nom et les prénoms du client sont obligatoires."); return; }
    const doc = editId ? { ...f, id: editId, majPar: moi, majLe: new Date().toISOString() }
      : { ...f, id: uid(), creePar: moi, cree: new Date().toISOString() };
    save({ ...data, fichesLbc: editId ? liste.map((x) => x.id === editId ? doc : x) : [doc, ...liste] },
      (editId ? "a modifié la fiche d'identification LBC/FT de " : "a créé la fiche d'identification LBC/FT de ") + f.nom);
    setOpen(false); setEditId(null);
    setVue(doc.id);
  };

  const supprimer = (d) => { if (window.confirm("Supprimer cette fiche d'identification ?"))
    save({ ...data, fichesLbc: liste.filter((x) => x.id !== d.id) }, "a supprimé une fiche d'identification LBC/FT"); };

  /* ---------------------- Vue détail (imprimable) ---------------------- */
  const docVu = liste.find((d) => d.id === vue);
  if (docVu) {
    const mq = manquants(docVu);
    return (
      <div>
        <button onClick={() => setVue(null)} className="text-sm mb-4 sans-impression" style={{ color: C.mute }}>← Retour aux fiches</button>
        <Head title="Fiche d'identification du client" sub={docVu.nom}
          action={<>
            <Btn variant="ghost" onClick={() => modifier(docVu)}>Modifier</Btn>
            <Btn variant="ghost" onClick={() => genererPdf(document.getElementById("doc-lbc"), "Identification_" + (docVu.nom || "client").replace(/\s+/g, "_") + ".pdf")}>Télécharger PDF</Btn>
            <Btn variant="solid" onClick={() => window.print()}>Imprimer</Btn>
            {suisGerante && <Btn variant="ghost" onClick={() => supprimer(docVu)}>Supprimer</Btn>}
          </>} />

        {mq.length > 0 && (
          <div className="mb-4 px-4 py-3 rounded text-sm sans-impression garder-couleur" style={{ background: C.goldSoft, color: C.gold }}>
            <b>Dossier incomplet — {mq.length} élément(s) manquant(s) :</b> {mq.join(", ")}.
          </div>
        )}

        <div className="zone-impression" id="doc-lbc" style={{ background: "#fff" }}>
          <div className="p-3 sm:p-6 text-sm" style={{ color: C.ink }}>
            <FicheLbcImprimable d={docVu} p={P} />
          </div>
        </div>
      </div>
    );
  }

  /* ---------------------- Formulaire ---------------------- */
  const estPM = f.natureClient !== "Personne Physique";
  const etapes = [[1, "Client"], [2, "Mandataire & PPE"], [3, "Opération"], [4, "Fonds"]];

  return (
    <div>
      <Head title="Conformité LBC/FT" sub="Fiches d'identification client — ordonnance du 23 novembre 2023, loi n°2024-363 du 11 juin 2024"
        action={<Btn variant="accent" onClick={ouvrirNouveau}>+ Nouvelle fiche</Btn>} />

      <div className="mb-5 px-4 py-3 rounded text-xs" style={{ background: "#F5F4EE", color: C.mute }}>
        En tant qu'agent immobilier assujetti, l'agence est tenue d'identifier et vérifier l'identité de ses clients,
        d'identifier les bénéficiaires effectifs des transactions, et de comprendre le propos et la nature de la relation d'affaires.
        Une fiche est requise pour toute vente ou gestion de biens immeubles.
      </div>

      {liste.length === 0
        ? <Empty text="Aucune fiche d'identification. Créez-en une pour chaque client confirmé (vente ou gestion)."
            action={<Btn variant="accent" onClick={ouvrirNouveau}>+ Nouvelle fiche</Btn>} />
        : <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr style={{ background: "#F5F4EE" }}>
                {["Client", "Nature", "Opération", "Date", "Complétude", ""].map((h) => (
                  <th key={h} className="px-4 py-2.5 text-left text-xs font-semibold" style={{ color: C.mute }}>{h}</th>))}
              </tr></thead>
              <tbody>
                {liste.map((d) => {
                  const mq = manquants(d);
                  return (
                    <tr key={d.id} style={{ borderTop: "1px solid " + C.line }}>
                      <td className="px-4 py-3 font-semibold" style={{ color: C.ink }}>{d.nom || "—"}</td>
                      <td className="px-4 py-3 text-xs" style={{ color: C.mute }}>{d.natureClient}</td>
                      <td className="px-4 py-3 text-xs" style={{ color: C.mute }}>{d.natureOperation === "Autre" ? (d.natureOperationAutre || "Autre") : d.natureOperation}</td>
                      <td className="px-4 py-3 text-xs" style={{ color: C.mute }}>{d.date || "—"}</td>
                      <td className="px-4 py-3">
                        {mq.length === 0 ? <Tag tone="ok">Complète</Tag> : <Tag tone="warn">{mq.length} manquant(s)</Tag>}
                      </td>
                      <td className="px-4 py-3">
                        <div className="flex gap-2">
                          <button onClick={() => setVue(d.id)} className="text-xs font-semibold" style={{ color: C.ink }}>Ouvrir</button>
                          <button onClick={() => modifier(d)} className="text-xs font-semibold" style={{ color: C.mute }}>Modifier</button>
                        </div>
                      </td>
                    </tr>);
                })}
              </tbody>
            </table>
          </div></div>}

      {open && (
        <Modal title={editId ? "Modifier la fiche d'identification" : "Nouvelle fiche d'identification"} onClose={() => { setOpen(false); setEditId(null); }} wide>
          <div className="space-y-4">
            <div className="flex gap-2 flex-wrap">
              {etapes.map(([n, lab]) => (
                <button key={n} onClick={() => setEtape(n)} className="px-3 py-1.5 rounded text-xs font-medium"
                  style={{ background: etape === n ? C.ink : "transparent", color: etape === n ? "#fff" : C.mute, border: "1px solid " + (etape === n ? C.ink : C.line) }}>
                  {n}. {lab}</button>))}
            </div>

            {etape === 1 && (
              <div className="space-y-3">
                <div className="grid sm:grid-cols-3 gap-3">
                  <Field label="Date"><Input type="date" value={f.date} onChange={(e) => maj("date", e.target.value)} /></Field>
                  <Field label="Type de relation"><Select value={f.typeRelation} onChange={(e) => maj("typeRelation", e.target.value)}>
                    <option>Relation initiale</option><option>Actualisation / révision</option></Select></Field>
                  <Field label="Nature du client"><Select value={f.natureClient} onChange={(e) => maj("natureClient", e.target.value)}>
                    {NATURES_CLIENT.map((k) => <option key={k}>{k}</option>)}</Select></Field>
                </div>
                <div className="grid sm:grid-cols-2 gap-3">
                  <Field label="Nature de l'opération"><Select value={f.natureOperation} onChange={(e) => maj("natureOperation", e.target.value)}>
                    {NATURES_OPERATION.map((k) => <option key={k}>{k}</option>)}</Select></Field>
                  {f.natureOperation === "Autre" && <Field label="Préciser"><Input value={f.natureOperationAutre} onChange={(e) => maj("natureOperationAutre", e.target.value)} /></Field>}
                </div>

                <div className="pt-2 text-xs font-semibold" style={{ color: C.mute }}>RENSEIGNEMENTS CLIENT</div>
                <Field label="Nom et prénoms *"><Input value={f.nom} onChange={(e) => maj("nom", e.target.value)} /></Field>
                <div className="grid sm:grid-cols-3 gap-3">
                  <Field label="Nom de jeune fille"><Input value={f.nomJeuneFille} onChange={(e) => maj("nomJeuneFille", e.target.value)} /></Field>
                  <Field label="Nom et prénoms du père"><Input value={f.nomPere} onChange={(e) => maj("nomPere", e.target.value)} /></Field>
                  <Field label="Nom et prénoms de la mère"><Input value={f.nomMere} onChange={(e) => maj("nomMere", e.target.value)} /></Field>
                </div>
                <div className="grid sm:grid-cols-2 gap-3">
                  <Field label="Date de naissance *"><Input type="date" value={f.naissanceDate} onChange={(e) => maj("naissanceDate", e.target.value)} /></Field>
                  <Field label="Lieu de naissance *"><Input value={f.naissanceLieu} onChange={(e) => maj("naissanceLieu", e.target.value)} /></Field>
                </div>
                <div className="grid sm:grid-cols-2 gap-3">
                  <Field label="Adresse géographique *"><Input value={f.adresseGeo} onChange={(e) => maj("adresseGeo", e.target.value)} placeholder="Cocody Riviera Bonoumin, rue…" /></Field>
                  <Field label="Adresse postale"><Input value={f.adressePostale} onChange={(e) => maj("adressePostale", e.target.value)} placeholder="06 BP 1680 Abidjan 06" /></Field>
                </div>
                <div className="grid sm:grid-cols-3 gap-3">
                  <Field label="Téléphone *"><Input value={f.telephone} onChange={(e) => maj("telephone", e.target.value)} /></Field>
                  <Field label="N° WhatsApp"><Input value={f.whatsapp} onChange={(e) => maj("whatsapp", e.target.value)} /></Field>
                  <Field label="E-mail"><Input value={f.email} onChange={(e) => maj("email", e.target.value)} /></Field>
                </div>
                <div className="grid sm:grid-cols-3 gap-3">
                  <Field label="Nature de la pièce d'identité *"><Select value={f.naturePiece} onChange={(e) => maj("naturePiece", e.target.value)}>
                    <option value="">—</option><option>CNI</option><option>Passeport</option><option>Attestation d'identité</option>
                    <option>Carte de séjour</option><option>Permis de conduire</option></Select></Field>
                  <Field label="N° de la pièce *"><Input value={f.numPiece} onChange={(e) => maj("numPiece", e.target.value)} /></Field>
                  <Field label="N° compte contribuable / identité fiscale"><Input value={f.numContribuable} onChange={(e) => maj("numContribuable", e.target.value)} /></Field>
                </div>
                <div className="grid sm:grid-cols-3 gap-3">
                  <Field label="Non résident"><Select value={f.nonResident ? "Oui" : "Non"} onChange={(e) => maj("nonResident", e.target.value === "Oui")}>
                    <option>Non</option><option>Oui</option></Select></Field>
                  <Field label="Pays de résidence"><Input value={f.paysResidence} onChange={(e) => maj("paysResidence", e.target.value)} placeholder="Côte d'Ivoire" /></Field>
                  <Field label="Statut matrimonial"><Input value={f.statutMatrimonial} onChange={(e) => maj("statutMatrimonial", e.target.value)} placeholder="Marié(e), concubinage, célibataire…" /></Field>
                </div>
                <div className="grid sm:grid-cols-2 gap-3">
                  <Field label="Nationalité actuelle *"><Input value={f.nationalite} onChange={(e) => maj("nationalite", e.target.value)} /></Field>
                  <Field label="Autres nationalités"><Input value={f.autresNationalites} onChange={(e) => maj("autresNationalites", e.target.value)} /></Field>
                </div>
                <Field label="Profession actuellement exercée *"><Input value={f.professionActuelle} onChange={(e) => maj("professionActuelle", e.target.value)} /></Field>
                <Field label="Professions exercées durant les cinq (05) dernières années">
                  <Textarea value={f.professions5ans} onChange={(e) => maj("professions5ans", e.target.value)} /></Field>
                <div className="grid sm:grid-cols-2 gap-3">
                  <Field label="Employeur"><Input value={f.employeur} onChange={(e) => maj("employeur", e.target.value)} /></Field>
                  <Field label="Secteur d'activité"><Input value={f.secteurActivite} onChange={(e) => maj("secteurActivite", e.target.value)} /></Field>
                </div>
              </div>
            )}

            {etape === 2 && (
              <div className="space-y-3">
                <div className="text-xs font-semibold" style={{ color: C.mute }}>
                  DONNÉES DU MANDATAIRE QUI TRAITE L'OPÉRATION {estPM ? "(obligatoire)" : "(si applicable)"}</div>
                <Field label="Prénoms et noms"><Input value={f.mandNom} onChange={(e) => maj("mandNom", e.target.value)} /></Field>
                <div className="grid sm:grid-cols-2 gap-3">
                  <Field label="Passeport ou CNI"><Input value={f.mandPiece} onChange={(e) => maj("mandPiece", e.target.value)} /></Field>
                  <Field label="Date de naissance"><Input type="date" value={f.mandNaissance} onChange={(e) => maj("mandNaissance", e.target.value)} /></Field>
                </div>
                <div className="grid sm:grid-cols-2 gap-3">
                  <Field label="Nationalité"><Input value={f.mandNationalite} onChange={(e) => maj("mandNationalite", e.target.value)} /></Field>
                  <Field label="Pays de résidence"><Input value={f.mandPaysResidence} onChange={(e) => maj("mandPaysResidence", e.target.value)} /></Field>
                </div>
                <div className="grid sm:grid-cols-2 gap-3">
                  <Field label="Fonction"><Select value={f.mandFonction} onChange={(e) => maj("mandFonction", e.target.value)}>
                    <option value="">—</option>{FONCTIONS_MANDATAIRE.map((k) => <option key={k}>{k}</option>)}</Select></Field>
                  {f.mandFonction === "Autre" && <Field label="Préciser"><Input value={f.mandFonctionAutre} onChange={(e) => maj("mandFonctionAutre", e.target.value)} /></Field>}
                </div>

                <div className="pt-3 text-xs font-semibold" style={{ color: C.mute }}>PERSONNE POLITIQUEMENT EXPOSÉE (PPE)</div>
                <div className="px-3 py-2 rounded text-xs" style={{ background: "#F5F4EE", color: C.mute }}>
                  Sont concernées les personnes exerçant ou ayant exercé d'importantes fonctions publiques (nationales,
                  étrangères ou au sein d'organisations internationales), les membres de leur famille et les personnes
                  qui leur sont étroitement associées. La définition complète figure en annexe de la fiche imprimée.
                </div>
                <Field label="Êtes-vous une personne politiquement exposée ? *">
                  <Select value={f.ppe} onChange={(e) => maj("ppe", e.target.value)}>
                    <option value="">—</option>
                    <option>Non</option>
                    <option>Oui — PPE nationale</option>
                    <option>Oui — PPE étrangère</option>
                    <option>Oui — PPE d'organisation internationale</option>
                    <option>Oui — membre de la famille ou proche associé d'une PPE</option>
                  </Select>
                </Field>
                {String(f.ppe || "").startsWith("Oui") && (
                  <Field label="Préciser la fonction, l'organisme et la période">
                    <Textarea value={f.ppePrecision} onChange={(e) => maj("ppePrecision", e.target.value)} /></Field>
                )}
              </div>
            )}

            {etape === 3 && (
              <div className="space-y-3">
                <div className="text-xs font-semibold" style={{ color: C.mute }}>NATURE DE L'OPÉRATION</div>
                <label className="flex items-center gap-2 text-sm" style={{ color: C.ink }}>
                  <input type="checkbox" checked={!!f.operationAchat} onChange={(e) => maj("operationAchat", e.target.checked)} />
                  Achat de biens immeubles</label>
                <label className="flex items-center gap-2 text-sm" style={{ color: C.ink }}>
                  <input type="checkbox" checked={!!f.operationGestion} onChange={(e) => maj("operationGestion", e.target.checked)} />
                  Gestion de biens immeubles</label>
                <Field label="Autres (préciser)"><Input value={f.operationAutre} onChange={(e) => maj("operationAutre", e.target.value)} /></Field>
                <Field label="Description détaillée de l'opération (immeuble acquis, montant, etc.) *">
                  <Textarea value={f.descriptionOperation} onChange={(e) => maj("descriptionOperation", e.target.value)}
                    placeholder="Nature et localisation du bien, superficie, prix ou loyer, modalités de paiement…" /></Field>
              </div>
            )}

            {etape === 4 && (
              <div className="space-y-3">
                <div className="text-xs font-semibold" style={{ color: C.mute }}>PROVENANCE DES FONDS *</div>
                <div className="grid sm:grid-cols-2 gap-1.5">
                  {PROVENANCES_FONDS.map((k) => (
                    <label key={k} className="flex items-center gap-2 text-sm" style={{ color: C.ink }}>
                      <input type="checkbox" checked={(f.provenanceFonds || []).includes(k)} onChange={() => togglePro(k)} />
                      {k}</label>))}
                </div>
                {(f.provenanceFonds || []).includes("Autres") && (
                  <Field label="Préciser"><Input value={f.provenanceAutre} onChange={(e) => maj("provenanceAutre", e.target.value)} /></Field>)}

                <Field label="Les fonds propres investis sont-ils la propriété des intervenants ou de tiers ?">
                  <Select value={f.proprieteFonds} onChange={(e) => maj("proprieteFonds", e.target.value)}>
                    <option>Propriété des intervenants</option><option>Propriété de tiers</option></Select></Field>
                {f.proprieteFonds === "Propriété de tiers" && (
                  <Field label="Identité du tiers et intérêt de celui-ci dans l'opération (bénéficiaire effectif)">
                    <Textarea value={f.interetTiers} onChange={(e) => maj("interetTiers", e.target.value)} /></Field>)}

                <div className="grid sm:grid-cols-2 gap-3">
                  <Field label="Les fonds proviennent-ils du territoire ivoirien ? *">
                    <Select value={f.fondsIvoiriens} onChange={(e) => maj("fondsIvoiriens", e.target.value)}>
                      <option value="">—</option><option>Oui</option><option>Non</option></Select></Field>
                  {f.fondsIvoiriens === "Non" && <Field label="Pays de provenance"><Input value={f.paysProvenance} onChange={(e) => maj("paysProvenance", e.target.value)} /></Field>}
                </div>

                <Field label="Ancienneté professionnelle *"><Select value={f.anciennete} onChange={(e) => maj("anciennete", e.target.value)}>
                  <option value="">—</option>{ANCIENNETES.map((k) => <option key={k}>{k}</option>)}</Select></Field>

                <div className="pt-2 grid sm:grid-cols-3 gap-3">
                  <Field label="Fait à"><Input value={f.lieuSignature} onChange={(e) => maj("lieuSignature", e.target.value)} /></Field>
                  <Field label="Le"><Input type="date" value={f.dateSignature} onChange={(e) => maj("dateSignature", e.target.value)} /></Field>
                  <Field label="Nom du signataire"><Input value={f.nomSignataire} onChange={(e) => maj("nomSignataire", e.target.value)} /></Field>
                </div>
              </div>
            )}

            <div className="flex gap-2 pt-2 flex-wrap">
              {etape > 1 && <Btn variant="ghost" onClick={() => setEtape(etape - 1)}>Précédent</Btn>}
              {etape < 4 && <Btn variant="ghost" onClick={() => setEtape(etape + 1)}>Suivant</Btn>}
              <Btn variant="accent" onClick={enregistrer}>Enregistrer la fiche</Btn>
              <Btn variant="ghost" onClick={() => { setOpen(false); setEditId(null); }}>Annuler</Btn>
            </div>
            <p className="text-xs" style={{ color: C.mute }}>
              Vous pouvez enregistrer une fiche incomplète et la compléter plus tard : les éléments manquants sont signalés.
            </p>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ---------------------- Rendu imprimable de la fiche ---------------------- */
function FicheLbcImprimable({ d, p }) {
  const L = ({ k, v }) => (
    <tr style={{ borderTop: "1px solid #E5E2DA" }}>
      <td className="py-1.5 pr-3 align-top" style={{ width: "42%", fontWeight: 600 }}>{k}</td>

      <table className="w-full text-xs"><tbody>

        <L k="Nom de jeune fille" v={d.nomJeuneFille} />
        <L k="Nom et prénoms du père" v={d.nomPere} />
        <L k="Nom et prénoms de la mère" v={d.nomMere} />

        <L k="Adresse géographique" v={d.adresseGeo} />

        <L k="Nature et n° pièce d'identité" v={(d.naturePiece || "—") + (d.numPiece ? " — " + d.numPiece : "")} />
        <L k="N° compte contribuable / identité fiscale" v={d.numContribuable} />
        <L k="Non résident" v={oui(d.nonResident)} />
        <L k="Pays de résidence" v={d.paysResidence} />
        <L k="Statut matrimonial" v={d.statutMatrimonial} />
        <L k="Nationalité actuelle" v={d.nationalite} />
        <L k="Autres nationalités" v={d.autresNationalites} />

      {(d.mandNom || d.natureClient !== "Personne Physique") && (<>

        <L k="Êtes-vous une personne politiquement exposée ?" v={d.ppe} />

        <L k="Propriété des fonds propres investis" v={d.proprieteFonds} />

        <L k="Fonds provenant du territoire ivoirien" v={d.fondsIvoiriens + (d.fondsIvoiriens === "Non" && d.paysProvenance ? " — pays : " + d.paysProvenance : "")} />
        <L k="Ancienneté professionnelle" v={d.anciennete} />
      </tbody></table>

      <div className="mt-5 text-xs" style={{ lineHeight: 1.6 }}>
        <p className="font-semibold mb-1">Je soussigné(e), déclare :</p>
        <p>— Que toutes les informations fournies dans le présent formulaire sont vraies et véridiques ; j'autorise
          également à vérifier et, le cas échéant, à compléter les données ci-dessus.</p>
        <p>— Que les fonds que je serais susceptible d'utiliser pour compléter une quelconque transaction, ainsi que

      <div className="mt-6 flex justify-between items-end text-xs">
        <div>À {d.lieuSignature || "ABIDJAN"}, le {d.dateSignature ? dateLongue(d.dateSignature) : "……………………"}</div>
        <div className="text-right">
          <div style={{ borderTop: "1px solid #1a1a1a", paddingTop: 4, minWidth: 200 }}>

      <div style={{ pageBreakBefore: "always" }} className="mt-8 pt-4">
        <div className="font-bold text-xs mb-2">ANNEXE — PERSONNES POLITIQUEMENT EXPOSÉES (PPE)</div>
        <div className="text-[10px]" style={{ lineHeight: 1.7, color: "#333" }}>
          <p className="font-semibold mt-2">a) PPE étrangères</p>

            membre ou un État tiers, notamment :</p>
          <p>i. Les Chefs d'État ou de Gouvernement, les Ministres, les Ministres délégués et les Secrétaires d'État ;<br />
            ii. Les membres de familles royales ;<br />
            iii. Les Secrétaires Généraux de la Présidence de la République, du Gouvernement ou des Ministères ainsi que
              les Directeurs Généraux des Ministères ;<br />
            iv. Les Parlementaires ;<br />
            v. Les membres des Cours Suprêmes, des Cours Constitutionnelles ou d'autres hautes juridictions dont les
              décisions ne sont pas susceptibles de recours, sauf circonstances exceptionnelles ;<br />
            vi. Les membres des Cours des Comptes ou des Conseils supérieurs des Forces Armées ;<br />
            vii. Les Ambassadeurs, les Chargés d'Affaires et les Officiers Supérieurs des Forces Armées ;<br />
            viii. Les membres des organes d'administration, de direction ou de surveillance des entreprises publiques ;<br />
            ix. Les hauts responsables des partis politiques ;<br />
            x. Les membres de la famille d'une PPE, à savoir : le conjoint ; les enfants et leurs conjoints ou
              partenaires ; les autres parents ;<br />
            xi. Les personnes connues pour être étroitement associées à une PPE ;<br />
            xii. Toute autre personne désignée par la personne assujettie sur la base de l'analyse de son profil de risque.</p>
          <p className="font-semibold mt-2">b) PPE nationales</p>
          <p>Les personnes physiques qui exercent ou qui ont exercé d'importantes fonctions publiques en Côte d'Ivoire,

          <p className="font-semibold mt-3">AVERTISSEMENT LÉGAL</p>

            Financement du Terrorisme (LBC/FT/FP), ratifiée par la loi n°2024-363 du 11 juin 2024, les promoteurs
            immobiliers et agents immobiliers sont tenus, en tant qu'assujettis à ladite réglementation, lorsqu'ils font

/* ============================== Obligations et échéances ============================== */

function Obligations({ data, save, moi, c }) {
  const P = data.parametres || PARAMS_DEFAUT;
  const [vue, setVue] = useState("assurances");
  const [openAss, setOpenAss] = useState(null);
  const [openImp, setOpenImp] = useState(null);
  const [editImp, setEditImp] = useState(null);
  const today = aujourdhui();
  const impots = data.imposFonciers || [];

  const nomBien = (id) => ((data.biens || []).find((b) => b.id === id) || {}).nom || "—";
  const jusquA = (d) => d ? Math.ceil((new Date(d).getTime() - new Date(today).getTime()) / 86400000) : null;

  /* ---------------- Assurances des locataires ---------------- */
  const actifs = (data.locataires || []).filter((l) => l.actif !== false);
  const exiges = actifs.filter((l) => l.assuranceExigee !== false);
  const dispenses = actifs.filter((l) => l.assuranceExigee === false);
  const assurances = exiges.map((l) => {
    const a = l.assurance || {};
    const j = jusquA(a.fin);
    const etat = !a.fin ? "absente" : j < 0 ? "expiree" : j <= 45 ? "bientot" : "valide";
    return { loc: l, a, j, etat };
  }).sort((x, y) => {
    const ordre = { absente: 0, expiree: 1, bientot: 2, valide: 3 };
    return ordre[x.etat] - ordre[y.etat] || (x.j || 0) - (y.j || 0);
  });

  const nbAssPb = assurances.filter((x) => x.etat !== "valide").length;

  const basculerExigence = (loc, val) =>
    save({ ...data, locataires: (data.locataires || []).map((l) => l.id === loc.id ? { ...l, assuranceExigee: val } : l) },
      val ? "a rendu l'assurance exigible pour " + loc.nom : "a dispensé " + loc.nom + " d'attestation d'assurance");

  const enregistrerAssurance = (loc, a) => {
    save({ ...data, locataires: (data.locataires || []).map((l) => l.id === loc.id ? { ...l, assurance: a } : l) },
      "a mis à jour l'attestation d'assurance de " + loc.nom);
    setOpenAss(null);
  };

  const relanceAssurance = (x) => {
    const t = "Bonjour " + x.loc.nom + ",\n\n"
      + (x.etat === "absente"
        ? "Nous n'avons pas encore reçu votre attestation d'assurance habitation. Elle est obligatoire pour l'occupation du logement."
        : x.etat === "expiree"
          ? "Votre attestation d'assurance habitation est arrivée à échéance le " + dateLongue(x.a.fin) + "."
          : "Votre attestation d'assurance habitation arrive à échéance le " + dateLongue(x.a.fin) + ".")
      + "\n\nMerci de nous faire parvenir votre nouvelle attestation dans les meilleurs délais.\n\n"
      + (P.societe || "Season Immobilier") + (P.tel ? "\n" + P.tel : "");
    ouvrirWhatsApp(x.loc.tel, t);
  };

  /* ---------------- Impôt foncier ---------------- */
  const anneeCourante = new Date().getFullYear();
  const blankImp = { bienId: "", annee: anneeCourante, commune: "", montant: "", dateLimite: anneeCourante + "-03-31",
    datePaiement: "", reference: "", notes: "" };
  const [fi, setFi] = useState(blankImp);

  const ouvrirImpot = (im, bienId) => {
    setEditImp(im || null);
    setFi(im ? { ...blankImp, ...im } : { ...blankImp, bienId: bienId || "" });
    setOpenImp(true);
  };

  const enregistrerImpot = () => {
    if (!fi.bienId) { window.alert("Choisissez le bien concerné."); return; }
    const rec = { ...fi, montant: Number(fi.montant) || 0, annee: Number(fi.annee) || anneeCourante };
    save({ ...data, imposFonciers: editImp
      ? impots.map((x) => x.id === editImp.id ? { ...rec, id: editImp.id } : x)
      : [{ ...rec, id: uid(), saisiPar: moi }, ...impots] },
      (editImp ? "a modifié " : "a enregistré ") + "l'impôt foncier " + rec.annee + " de " + nomBien(rec.bienId));
    setOpenImp(false); setEditImp(null);
  };

  const supprimerImpot = (im) => {
    if (!window.confirm("Supprimer cette ligne d'impôt foncier ?")) return;
    save({ ...data, imposFonciers: impots.filter((x) => x.id !== im.id) }, "a supprimé une ligne d'impôt foncier");
  };

  const [anneeVue, setAnneeVue] = useState(anneeCourante);
  const annees = Array.from(new Set([...impots.map((x) => Number(x.annee)), anneeCourante])).sort((a, b) => b - a);

  const impotsAnnee = impots.filter((x) => Number(x.annee) === Number(anneeVue));
  const biensSuivis = (data.biens || []).filter((b) => (b.chargeImpot || "agence") === "agence");
  const biensProprio = (data.biens || []).filter((b) => b.chargeImpot === "proprietaire");
  const biensSansImpot = biensSuivis.filter((b) => !impotsAnnee.some((x) => x.bienId === b.id));
  const impayesImp = impotsAnnee.filter((x) => !x.datePaiement);
  const totalImp = impotsAnnee.reduce((s, x) => s + Number(x.montant || 0), 0);
  const totalRegle = impotsAnnee.filter((x) => x.datePaiement).reduce((s, x) => s + Number(x.montant || 0), 0);
  const suivi = (bienId) => { const b = (data.biens || []).find((x) => x.id === bienId); return !b || (b.chargeImpot || "agence") === "agence"; };
  const enRetard = impayesImp.filter((x) => x.dateLimite && x.dateLimite < today && suivi(x.bienId));

  return (
    <div>
      <Head title="Obligations" sub="Attestations d'assurance des locataires et impôt foncier des biens" />

      <div className="flex gap-2 mb-4 sans-impression flex-wrap">
        {[["assurances", "Assurances (" + nbAssPb + " à traiter)"], ["impots", "Impôt foncier"]].map(([k, lab]) => (
          <button key={k} onClick={() => setVue(k)} className="px-3 py-1.5 rounded text-sm font-medium"
            style={{ background: vue === k ? C.ink : "transparent", color: vue === k ? "#fff" : C.mute,
              border: "1px solid " + (vue === k ? C.ink : C.line) }}>{lab}</button>))}
      </div>

      {/* ===================== ASSURANCES ===================== */}
      {vue === "assurances" && (
        <div>
          {nbAssPb > 0 && (
            <div className="mb-4 px-4 py-3 rounded text-sm garder-couleur sans-impression" style={{ background: C.goldSoft, color: C.gold }}>
              {assurances.filter((x) => x.etat === "absente").length > 0 &&
                <div>⚠ {assurances.filter((x) => x.etat === "absente").length} locataire(s) sans attestation d'assurance.</div>}
              {assurances.filter((x) => x.etat === "expiree").length > 0 &&
                <div>⚠ {assurances.filter((x) => x.etat === "expiree").length} attestation(s) expirée(s).</div>}
              {assurances.filter((x) => x.etat === "bientot").length > 0 &&
                <div>🔔 {assurances.filter((x) => x.etat === "bientot").length} attestation(s) à renouveler sous 45 jours.</div>}
            </div>
          )}

          {actifs.length === 0 ? <Empty text="Aucun locataire actif." />
            : <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead><tr style={{ background: "#F5F4EE" }}>
                    {["Locataire", "Bien", "Assureur", "N° police", "Échéance", "État", ""].map((h) => (
                      <th key={h} className="px-3 py-2.5 text-left text-xs font-semibold" style={{ color: C.mute }}>{h}</th>))}
                  </tr></thead>
                  <tbody>
                    {assurances.map((x) => (
                      <tr key={x.loc.id} style={{ borderTop: "1px solid " + C.line,
                        background: x.etat === "absente" || x.etat === "expiree" ? "#FDECEC" : "transparent" }}>
                        <td className="px-3 py-2.5 font-medium" style={{ color: C.ink }}>{x.loc.nom}</td>
                        <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{nomBien(x.loc.bienId)}</td>
                        <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{x.a.assureur || "—"}</td>
                        <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{x.a.police || "—"}</td>
                        <td className="px-3 py-2.5 text-xs" style={{ color: C.ink }}>{x.a.fin ? dateLongue(x.a.fin) : "—"}</td>
                        <td className="px-3 py-2.5">
                          {x.etat === "absente" && <Tag tone="bad">Absente</Tag>}
                          {x.etat === "expiree" && <Tag tone="bad">Expirée ({Math.abs(x.j)} j)</Tag>}
                          {x.etat === "bientot" && <Tag tone="warn">Dans {x.j} j</Tag>}
                          {x.etat === "valide" && <Tag tone="ok">Valide</Tag>}
                        </td>
                        <td className="px-3 py-2.5 text-right">
                          <div className="flex gap-2 justify-end">
                            <button onClick={() => setOpenAss(x.loc.id)} className="text-xs font-semibold" style={{ color: C.ink }}>Saisir</button>
                            {x.etat !== "valide" && x.loc.tel &&
                              <button onClick={() => relanceAssurance(x)} className="text-xs font-semibold" style={{ color: C.green }}>Relancer</button>}
                            <button onClick={() => basculerExigence(x.loc, false)} className="text-xs font-semibold" style={{ color: C.mute }}>Dispenser</button>
                          </div>
                        </td>
                      </tr>))}
                  </tbody>
                </table>
              </div></div>}

          {dispenses.length > 0 && (
            <details className="mt-4">
              <summary className="text-sm cursor-pointer" style={{ color: C.mute }}>
                {dispenses.length} locataire(s) dispensé(s) d'attestation</summary>
              <div className="mt-2 space-y-1.5">
                {dispenses.map((l) => (
                  <div key={l.id} className="flex items-center justify-between gap-3 text-xs px-3 py-2 rounded" style={{ background: "#F5F4EE" }}>
                    <span style={{ color: C.ink }}>{l.nom}<span style={{ color: C.mute }}> · {nomBien(l.bienId)}</span></span>
                    <button onClick={() => basculerExigence(l, true)} className="font-semibold" style={{ color: C.green }}>Rendre exigible</button>
                  </div>))}
              </div>
            </details>
          )}

          <p className="text-xs mt-3" style={{ color: C.mute }}>
            L'attestation d'assurance habitation est exigible chaque année. Une alerte apparaît 45 jours avant
            l'échéance. Les locataires dispensés n'apparaissent ni dans le tableau ni dans les alertes.
          </p>
        </div>
      )}

      {/* ===================== IMPÔT FONCIER ===================== */}
      {vue === "impots" && (
        <div>
          <div className="flex items-center justify-between gap-3 flex-wrap mb-4 sans-impression">
            <div className="flex items-center gap-2">
              <span className="text-xs font-semibold" style={{ color: C.mute }}>Exercice</span>
              <Select value={anneeVue} onChange={(e) => setAnneeVue(Number(e.target.value))}>
                {annees.map((a) => <option key={a} value={a}>{a}</option>)}
              </Select>
            </div>
            <Btn variant="accent" onClick={() => ouvrirImpot(null, null)}>+ Ligne d'impôt</Btn>
          </div>

          {enRetard.length > 0 && (
            <div className="mb-4 px-4 py-3 rounded text-sm garder-couleur sans-impression" style={{ background: "#FDECEC", color: C.clay }}>
              ⚠ {enRetard.length} impôt(s) foncier(s) non réglé(s) au-delà de la date limite — risque de pénalités.
            </div>
          )}

          <div className="grid sm:grid-cols-4 gap-3 mb-5">
            {[["Total exercice", fcfa(totalImp)], ["Réglé", fcfa(totalRegle)],
              ["Restant dû", fcfa(totalImp - totalRegle)], ["À saisir", String(biensSansImpot.length)]].map(([l, v]) => (
              <div key={l} className={card + " p-3"} style={{ borderColor: C.line }}>
                <div className="text-[11px] mb-1" style={{ color: C.mute }}>{l}</div>
                <div className="font-bold tabular-nums" style={{ color: C.ink }}>{v}</div>
              </div>))}
          </div>

          {impotsAnnee.length === 0
            ? <Empty text={"Aucun impôt foncier saisi pour " + anneeVue + "."}
                action={<Btn variant="accent" onClick={() => ouvrirImpot(null, null)}>+ Ligne d'impôt</Btn>} />
            : <div className={card + " overflow-hidden mb-4"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead><tr style={{ background: "#F5F4EE" }}>
                    {["Bien", "Commune", "Montant", "Date limite", "Réglé le", "État", ""].map((h) => (
                      <th key={h} className="px-3 py-2.5 text-left text-xs font-semibold" style={{ color: C.mute }}>{h}</th>))}
                  </tr></thead>
                  <tbody>
                    {impotsAnnee.map((im) => {
                      const retard = !im.datePaiement && im.dateLimite && im.dateLimite < today;
                      const j = !im.datePaiement ? jusquA(im.dateLimite) : null;
                      return (
                        <tr key={im.id} style={{ borderTop: "1px solid " + C.line, background: retard ? "#FDECEC" : "transparent" }}>
                          <td className="px-3 py-2.5 font-medium" style={{ color: C.ink }}>{nomBien(im.bienId)}</td>
                          <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{im.commune || "—"}</td>
                          <td className="px-3 py-2.5 tabular-nums" style={{ color: C.ink }}>{fcfa(im.montant)}</td>
                          <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{im.dateLimite ? dateLongue(im.dateLimite) : "—"}</td>
                          <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{im.datePaiement ? dateLongue(im.datePaiement) : "—"}</td>
                          <td className="px-3 py-2.5">
                            {im.datePaiement ? <Tag tone="ok">Réglé</Tag>
                              : retard ? <Tag tone="bad">En retard</Tag>
                              : j !== null && j <= 30 ? <Tag tone="warn">Dans {j} j</Tag>
                              : <Tag tone="neutral">À régler</Tag>}
                          </td>
                          <td className="px-3 py-2.5 text-right">
                            <div className="flex gap-2 justify-end">
                              <button onClick={() => ouvrirImpot(im, null)} className="text-xs font-semibold" style={{ color: C.ink }}>Modifier</button>
                              <button onClick={() => supprimerImpot(im)} className="text-xs font-semibold" style={{ color: C.clay }}>Suppr.</button>
                            </div>
                          </td>
                        </tr>);
                    })}
                  </tbody>
                </table>
              </div></div>}

          {biensProprio.length > 0 && (
            <details className="mb-3">
              <summary className="text-sm cursor-pointer" style={{ color: C.mute }}>
                {biensProprio.length} bien(s) dont l'impôt est pris en charge par le propriétaire</summary>
              <div className="mt-2 space-y-1.5">
                {biensProprio.map((b) => (
                  <div key={b.id} className="flex items-center justify-between gap-3 text-xs px-3 py-2 rounded" style={{ background: "#F5F4EE" }}>
                    <span style={{ color: C.ink }}>{b.nom}</span>
                    <button onClick={() => ouvrirImpot(null, b.id)} className="font-semibold" style={{ color: C.green }}>Saisir malgré tout</button>
                  </div>))}
              </div>
              <p className="text-[11px] mt-2" style={{ color: C.mute }}>
                Ces biens ne déclenchent aucune alerte. Vous pouvez tout de même enregistrer une ligne à titre de suivi.
              </p>
            </details>
          )}

          {biensSansImpot.length > 0 && (
            <details>
              <summary className="text-sm cursor-pointer" style={{ color: C.mute }}>
                {biensSansImpot.length} bien(s) suivi(s) par l'agence sans impôt saisi pour {anneeVue}</summary>
              <div className="mt-2 space-y-1.5">
                {biensSansImpot.map((b) => (
                  <div key={b.id} className="flex items-center justify-between gap-3 text-xs px-3 py-2 rounded" style={{ background: "#F5F4EE" }}>
                    <span style={{ color: C.ink }}>{b.nom}<span style={{ color: C.mute }}>{b.adresse ? " · " + b.adresse : ""}</span></span>
                    <button onClick={() => ouvrirImpot(null, b.id)} className="font-semibold" style={{ color: C.green }}>Saisir</button>
                  </div>))}
              </div>
            </details>
          )}
        </div>
      )}

      {/* ---------- Modale assurance ---------- */}
      {openAss && (() => {
        const loc = (data.locataires || []).find((l) => l.id === openAss);
        if (!loc) return null;
        return <FormAssurance loc={loc} c={c} onClose={() => setOpenAss(null)}
          onSave={(a) => enregistrerAssurance(loc, a)} />;
      })()}

      {/* ---------- Modale impôt ---------- */}
      {openImp && (
        <Modal title={editImp ? "Modifier l'impôt foncier" : "Nouvel impôt foncier"} onClose={() => { setOpenImp(false); setEditImp(null); }}>
          <div className="space-y-3">

              <Field label="Bien">
                <Select value={fi.bienId} onChange={(e) => setFi({ ...fi, bienId: e.target.value })}>

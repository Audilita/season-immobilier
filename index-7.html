        <Modal title={editId ? "Modifier la facture" : "Nouvelle facture"} onClose={() => { setOpen(false); setEditId(null); }} wide>
          <div className="space-y-3">
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Type de document">
                {estCommercial
                  ? <div>
                      <div className="px-3 py-2 text-sm rounded border" style={{ borderColor: C.line, color: C.mute, background: "#F5F4EE" }}>
                        Facture proforma
                      </div>
                      <p className="text-[11px] mt-1" style={{ color: C.mute }}>
                        Vous préparez des proformas. Seule la gérante les valide en factures définitives.
                      </p>
                    </div>
                  : <Select value={f.type} onChange={(e) => majType(e.target.value)}>
                      <option value="proforma">Facture proforma</option>
                      <option value="definitive">Facture définitive</option>
                    </Select>}
              </Field>
              <Field label="Numéro">
                <Input value={f.numero} onChange={(e) => setF({ ...f, numero: e.target.value })} />
              </Field>
            </div>

            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Client (locataire enregistré)">
                <Select value={f.locataireId} onChange={(e) => setF({ ...f, locataireId: e.target.value })}>
                  <option value="">— Saisir un nom libre —</option>
                  {data.locataires.map((l) => <option key={l.id} value={l.id}>{l.nom}</option>)}
                </Select>
              </Field>
              <Field label="Ou nom du client">

                const autresBiens = data.biens.filter((x) => x.id !== f.bienId && bienActuel && x.ensemble && x.ensemble === bienActuel.ensemble);

                return (
                  <div className="mb-3 px-3 py-2.5 rounded" style={{ background: C.greenSoft }}>
                    <div className="text-xs font-semibold mb-1.5" style={{ color: C.ink }}>
                      Locataire à plusieurs unités de « {bienActuel.ensemble} » ? Cochez les autres unités à inclure :
                    </div>
                    <div className="space-y-1">
                      {autresBiens.map((x) => (
                        <label key={x.id} className="flex items-center gap-2 text-sm" style={{ color: C.ink }}>
                          <input type="checkbox" checked={biensSup.includes(x.id)}
                            onChange={(e) => setBiensSup(e.target.checked ? [...biensSup, x.id] : biensSup.filter((id) => id !== x.id))} />
                          {x.unite || x.nom} — loyer {fcfa(x.loyer)}{Number(x.pasDePorte) > 0 ? " · pas-de-porte " + fcfa(x.pasDePorte) : ""}

                  <div className="text-[11px] font-semibold uppercase tracking-wide mb-2" style={{ color: C.mute }}>Articles à générer (cochez et ajustez)</div>
                  <div className="space-y-2">
                    <label className="flex items-center gap-2 text-sm flex-wrap" style={{ color: C.ink }}>
                      <input type="checkbox" checked={f.inclureCaution !== false} onChange={(e) => setF({ ...f, inclureCaution: e.target.checked })} />

                      <input type="number" value={f.moisCaution} onChange={(e) => setF({ ...f, moisCaution: e.target.value })}

                      <input type="number" value={f.moisAvance} onChange={(e) => setF({ ...f, moisAvance: e.target.value })}

                    </label>
                    <label className="flex items-center gap-2 text-sm flex-wrap" style={{ color: C.ink }}>
                      <input type="checkbox" checked={f.inclureHonoraires !== false} onChange={(e) => setF({ ...f, inclureHonoraires: e.target.checked })} />
                      Honoraires d'agence —
                      <input type="number" value={f.moisHonoraires} onChange={(e) => setF({ ...f, moisHonoraires: e.target.value })}

                    </label>
                    <label className="flex items-center gap-2 text-sm flex-wrap" style={{ color: C.ink }}>
                      <input type="checkbox" checked={f.inclureEnreg !== false} onChange={(e) => setF({ ...f, inclureEnreg: e.target.checked })} />
                      Droits d'enregistrement — timbres
                      <input type="number" value={f.timbres} onChange={(e) => setF({ ...f, timbres: e.target.value })}
                        className="w-24 px-2 py-1 text-sm rounded border bg-white outline-none tabular-nums" style={{ borderColor: C.line, color: C.ink }} /> F
                    </label>
                    <label className="flex items-center gap-2 text-sm flex-wrap" style={{ color: C.ink }}>
                      <input type="checkbox" checked={f.inclureDossier !== false} onChange={(e) => setF({ ...f, inclureDossier: e.target.checked })} />
                      Frais de dossier —
                      <input type="number" value={f.tauxDossier} onChange={(e) => setF({ ...f, tauxDossier: e.target.value })}

                    </label>
                    {(() => { const b = data.biens.find((x) => x.id === f.bienId); return b && Number(b.pasDePorte) > 0 ? (
                      <div className="text-sm flex items-center gap-2" style={{ color: C.mute }}>

                  {f.bienId && <button onClick={modeleEntree} className="mt-3 text-xs font-semibold" style={{ color: C.orange }}>

                          <td className="px-3 py-2 text-right tabular-nums text-xs" style={{ color: C.mute }}>{l.quantite}</td>
                          <td className="px-3 py-2 text-right tabular-nums" style={{ color: C.ink }}>{fmt(l.montant)}</td>

                          </td>

                    </tbody>
                  </table>
                </div>
              )}

              <div className="grid sm:grid-cols-2 gap-2 mb-2">
                <Input value={ligne.libelle} placeholder="Désignation de l'article"
                  onChange={(e) => setLigne({ ...ligne, libelle: e.target.value })} />
                <Input value={ligne.detail} placeholder="Détail du calcul (facultatif)"
                  onChange={(e) => setLigne({ ...ligne, detail: e.target.value })} />
              </div>
              <div className="flex gap-2 items-end flex-wrap">
                <div className="w-24"><Label>Quantité</Label>
                  <Input type="number" value={ligne.quantite} onChange={(e) => setLigne({ ...ligne, quantite: e.target.value })} /></div>
                <div className="w-40"><Label>Prix unitaire</Label>
                  <Input type="number" value={ligne.pu} onChange={(e) => setLigne({ ...ligne, pu: e.target.value })} /></div>
                <label className="flex items-center gap-1.5 text-sm pb-2" style={{ color: C.mute }}>
                  <input type="checkbox" checked={!!ligne.nonRemb}
                    onChange={(e) => setLigne({ ...ligne, nonRemb: e.target.checked })} />
                  Non remboursable
                </label>
                <Btn variant="ghost" onClick={ajouterLigne}>Ajouter l'article</Btn>
              </div>
            </div>

            <Field label="Avance / acompte déjà versé (F CFA)">
              <Input type="number" value={f.avance} onChange={(e) => setF({ ...f, avance: e.target.value })}
                placeholder="Laisser vide si aucun acompte" />
            </Field>

            <Field label="Message de fin de document">
              <Input value={f.message} onChange={(e) => setF({ ...f, message: e.target.value })} />
            </Field>

            {f.lignes.length > 0 && (
              <div className="flex items-center justify-between px-4 py-3 rounded" style={{ background: C.greenSoft }}>
                <span className="text-sm font-semibold" style={{ color: C.ink }}>Total du document</span>
                <span className="font-bold tabular-nums" style={{ color: C.green }}>{fcfa(totalApercu)}</span>
              </div>
            )}

            <div className="flex gap-2 pt-2">
              <Btn variant="accent" onClick={emettre}>Émettre le document</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

function DocumentLoyer({ d, bien, loc, p, sansLogo }) {
  const pro = d.type === "proforma";
  const lignes = d.lignes || [];
  const total = lignes.reduce((s, l) => s + l.montant, 0);
  const avance = Number(d.avance) || 0;
  const reste = Math.max(total - avance, 0);
  const client = d.clientLibre || (loc || {}).nom || "—";

  return (
    <div>
      {/* En-tête */}
      <div className="flex justify-between items-start gap-6 mb-8">
        <div>
          {p.logo && !sansLogo && <img src={p.logo} alt="" className="h-14 w-auto object-contain mb-2" />}
          <div className="text-[11px] leading-snug" style={{ color: C.mute }}>
            <div className="font-bold text-xs" style={{ color: C.ink }}>{p.societe}</div>
            {p.adresse && <div>{p.adresse}</div>}
            {(p.tel || p.email) && <div>{[p.tel, p.email].filter(Boolean).join(" · ")}</div>}
          </div>
        </div>
        <div className="text-right shrink-0">
          <div className="text-3xl font-light tracking-tight" style={{ color: C.orange }}>
            {pro ? "Proforma" : "Facture"}
          </div>
          <div className="text-xs font-bold mt-0.5" style={{ color: C.ink }}>{d.numero}</div>
          <div className="mt-5">
            <div className="text-[10px] uppercase tracking-[0.14em]" style={{ color: C.mute }}>{avance > 0 ? "Reste dû" : "Solde dû"}</div>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.ink }}>XOF {fmt(avance > 0 ? reste : total)}</div>
          </div>
        </div>
      </div>

      {/* Client et dates */}
      <div className="flex justify-between gap-6 mb-6 flex-wrap">
        <div>
          <div className="text-xs mb-1" style={{ color: C.mute }}>Facturé à</div>
          <div className="text-sm font-bold" style={{ color: C.ink }}>{client}</div>
          {(loc || {}).tel && <div className="text-xs" style={{ color: C.mute }}>{loc.tel}</div>}
        </div>
        <div className="text-sm">
          <div className="flex justify-between gap-8 mb-1">
            <span style={{ color: C.mute }}>Date de facture :</span>
            <span style={{ color: C.ink }}>{dateLongue(d.date)}</span>
          </div>
          {d.conditions && <div className="flex justify-between gap-8 mb-1">
            <span style={{ color: C.mute }}>Conditions :</span>
            <span style={{ color: C.ink }}>{d.conditions}</span>
          </div>}
          {d.echeance && <div className="flex justify-between gap-8">
            <span style={{ color: C.mute }}>Date d'échéance :</span>
            <span style={{ color: C.ink }}>{dateLongue(d.echeance)}</span>
          </div>}
        </div>
      </div>

      {/* Objet */}
      {d.objet && (
        <div className="mb-5">
          <div className="text-xs mb-1" style={{ color: C.mute }}>Objet :</div>
          <div className="text-sm font-semibold uppercase leading-snug" style={{ color: C.ink }}>
            {(pro ? "FACTURE PROFORMA — " : "") + d.objet}
          </div>
        </div>
      )}

      {/* Articles */}
      <table className="w-full text-sm mb-5">
        <thead>
          <tr style={{ background: C.orange }}>
            <th className="text-left px-3 py-2 text-[11px] font-semibold uppercase tracking-[0.1em] text-white">Article &amp; Description</th>
            <th className="text-right px-3 py-2 text-[11px] font-semibold uppercase tracking-[0.1em] text-white w-24">Quantité</th>
            <th className="text-right px-3 py-2 text-[11px] font-semibold uppercase tracking-[0.1em] text-white w-32">Montant</th>
          </tr>
        </thead>
        <tbody>
          {lignes.map((l) => (
            <tr key={l.id} className="border-b" style={{ borderColor: C.line }}>
              <td className="px-3 py-3 align-top">
                <div style={{ color: C.ink }}>{l.libelle}</div>
                {l.detail && <div className="text-xs mt-0.5" style={{ color: C.mute }}>({l.detail})</div>}
              </td>
              <td className="px-3 py-3 text-right tabular-nums align-top" style={{ color: C.mute }}>
                {Number(l.quantite).toFixed(2)}
              </td>
              <td className="px-3 py-3 text-right tabular-nums align-top" style={{ color: C.ink }}>
                {fmt(l.montant)}
              </td>
            </tr>))}
        </tbody>
      </table>

      {/* Totaux */}
      <div className="flex justify-end mb-5">
        <div className="w-full max-w-sm text-sm">
          <div className="flex justify-between py-2 border-b" style={{ borderColor: C.line }}>
            <span style={{ color: C.mute }}>Sous-total</span>
            <span className="tabular-nums" style={{ color: C.ink }}>{fmt(total)}</span>
          </div>
          <div className="flex justify-between py-2.5 px-3 rounded mt-1 garder-couleur" style={{ background: C.greenSoft }}>
            <span className="font-bold" style={{ color: C.ink }}>Total</span>
            <span className="font-bold tabular-nums" style={{ color: C.ink }}>XOF {fmt(total)}</span>
          </div>
          {avance > 0 && (
            <>
              <div className="flex justify-between py-2 border-b mt-1" style={{ borderColor: C.line }}>
                <span style={{ color: C.mute }}>Avance versée</span>
                <span className="tabular-nums" style={{ color: C.ink }}>- {fmt(avance)}</span>
              </div>
              <div className="flex justify-between py-2.5 px-3 rounded mt-1 garder-couleur" style={{ background: C.goldSoft }}>
                <span className="font-bold" style={{ color: C.clay }}>Reste à payer</span>
                <span className="font-bold tabular-nums" style={{ color: C.clay }}>XOF {fmt(reste)}</span>
              </div>
            </>
          )}
        </div>
      </div>

      <div className="flex justify-end mb-8">
        <div className="w-full max-w-sm flex justify-between gap-4 text-sm">
          <span style={{ color: C.mute }}>{avance > 0 ? "Reste en lettres :" : "Total en lettres :"}</span>
          <span className="italic text-right" style={{ color: C.ink }}>{enLettres(avance > 0 ? reste : total)} francs CFA</span>
        </div>
      </div>

      <p className="text-xs font-semibold mb-4 garder-couleur" style={{ color: C.clay }}>
        Après paiement, les honoraires d'agence ainsi que les frais de dossier ne sont pas remboursables en cas de désistement du client.
      </p>

      {pro && (
        <p className="text-xs mb-5" style={{ color: C.mute }}>
          Document proforma — ne vaut pas facture. Une facture définitive sera établie après encaissement.
        </p>
      )}

      {p.banque && (
        <div className="mb-6 text-sm">
          <div className="text-xs" style={{ color: C.mute }}>Règlement par virement</div>
          <div style={{ color: C.ink }}>{p.banque}</div>
        </div>
      )}

      {d.message && (
        <p className="text-sm uppercase tracking-wide mb-6" style={{ color: C.ink }}>{d.message}</p>
      )}

      <PiedPage p={p} />
    </div>
  );
}

/* ======================= tableau annuel des loyers ======================= */

function TableauAnnuel({ data, annee, setAnnee }) {
  const moisAnnee = Array.from({ length: 12 }, (_, i) => annee + "-" + String(i + 1).padStart(2, "0"));

  const lignes = useMemo(() => {
    return data.locataires.filter((l) => l.actif !== false).map((loc) => {
      const bien = data.biens.find((b) => b.id === loc.bienId);
      if (!bien) return null;
      const cellules = moisAnnee.map((m) => {
        const p = data.paiements.find((x) => x.bienId === bien.id && x.mois === m);
        if (!p) return { etat: "vide", montant: 0 };
        const solde = Number(p.montant) >= Number(bien.loyer);
        return { etat: p.rejet ? "rejet" : !p.valide ? "attente" : solde ? "paye" : "partiel", montant: Number(p.montant) };
      });
      const total = cellules.reduce((s, c) => s + c.montant, 0);
      return { loc, bien, cellules, total };
    }).filter(Boolean);
  }, [data, annee]);

  const totalParMois = moisAnnee.map((m, i) => lignes.reduce((s, l) => s + l.cellules[i].montant, 0));
  const totalGeneral = totalParMois.reduce((s, x) => s + x, 0);
  const attenduAnnuel = lignes.reduce((s, l) => s + Number(l.bien.loyer || 0) * 12, 0);

  const couleur = { paye: C.green, partiel: C.gold, attente: C.orange, rejet: C.clay, vide: "transparent" };
  const fondClair = { paye: C.greenSoft, partiel: C.goldSoft, attente: "#FCE4CC", rejet: C.claySoft, vide: "#FAFAF7" };
  const symbole = { paye: "✓", partiel: "≈", attente: "?", rejet: "✕", vide: "" };

  return (
    <div>
      <div className="flex flex-wrap gap-3 items-center justify-between mb-4 sans-impression">
        <div className="flex items-center gap-2">
          <button onClick={() => setAnnee(annee - 1)} className="px-2.5 py-1.5 rounded border text-sm" style={{ borderColor: C.line, color: C.ink }}>‹</button>
          <input type="number" value={annee} onChange={(e) => setAnnee(Number(e.target.value) || annee)} className="w-20 px-2 py-1.5 text-center font-bold tabular-nums rounded border bg-white outline-none" style={{ borderColor: C.line, color: C.ink }} />
          <button onClick={() => setAnnee(annee + 1)} className="px-2.5 py-1.5 rounded border text-sm" style={{ borderColor: C.line, color: C.ink }}>›</button>
        </div>
        <div className="flex gap-4">
          <div className="text-right"><Label>Attendu sur l'année</Label>
            <div className="font-bold tabular-nums text-sm" style={{ color: C.ink }}>{fcfa(attenduAnnuel)}</div></div>
          <div className="text-right"><Label>Encaissé sur l'année</Label>
            <div className="font-bold tabular-nums text-sm" style={{ color: C.green }}>{fcfa(totalGeneral)}</div></div>
          <div className="text-right"><Label>Taux</Label>
            <div className="font-bold tabular-nums text-sm" style={{ color: C.gold }}>{attenduAnnuel ? Math.round(totalGeneral / attenduAnnuel * 100) : 0} %</div></div>
        </div>
      </div>

      {/* Légende */}
      <div className="flex flex-wrap gap-3 mb-3 text-xs sans-impression" style={{ color: C.mute }}>
        {[["paye","Payé & validé"],["attente","En attente de validation"],["partiel","Partiel"],["rejet","Rejeté"],["vide","Non encaissé"]].map(([k, lab]) => (
          <span key={k} className="inline-flex items-center gap-1.5">
            <span className="inline-block rounded" style={{ width: 12, height: 12, background: fondClair[k], border: "1px solid " + (couleur[k] === "transparent" ? C.line : couleur[k]) }}></span>
            {lab}
          </span>))}
      </div>

      {lignes.length === 0 ? <Empty text="Aucun locataire actif dans le portefeuille." />
        : <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
            <div className="overflow-x-auto">
              <table className="w-full text-sm" style={{ minWidth: 900 }}>
                <thead>
                  <tr style={{ background: "#F5F4EE" }}>
                    <th className="text-left px-3 py-2.5 text-[10px] font-semibold uppercase tracking-[0.1em] sticky left-0" style={{ color: C.mute, background: "#F5F4EE", minWidth: 150 }}>Locataire / Bien</th>
                    {["J","F","M","A","M","J","J","A","S","O","N","D"].map((m, i) => (
                      <th key={i} className="px-1 py-2.5 text-[10px] font-semibold text-center" style={{ color: C.mute, minWidth: 42 }}>{m}</th>))}
                    <th className="px-3 py-2.5 text-[10px] font-semibold uppercase tracking-[0.1em] text-right" style={{ color: C.mute, minWidth: 90 }}>Total</th>
                  </tr>
                </thead>
                <tbody className="divide-y" style={{ borderColor: C.line }}>
                  {lignes.map((l) => (
                    <tr key={l.loc.id}>
                      <td className="px-3 py-2 sticky left-0 bg-white" style={{ minWidth: 150 }}>
                        <div style={{ color: C.ink }}>{l.loc.nom}</div>
                        <div className="text-[10px]" style={{ color: C.mute }}>{l.bien.nom} · {fcfa(l.bien.loyer)}</div>
                      </td>
                      {l.cellules.map((c, i) => (
                        <td key={i} className="px-0.5 py-1 text-center">
                          <div className="mx-auto rounded flex items-center justify-center garder-couleur"
                            title={c.montant ? fmt(c.montant) : "Non encaissé"}
                            style={{ width: 34, height: 30, background: fondClair[c.etat],
                              border: "1px solid " + (couleur[c.etat] === "transparent" ? C.line : couleur[c.etat]),
                              color: couleur[c.etat] === "transparent" ? C.mute : couleur[c.etat], fontWeight: 700, fontSize: 13 }}>
                            {symbole[c.etat]}
                          </div>
                        </td>))}
                      <td className="px-3 py-2 text-right tabular-nums font-semibold" style={{ color: C.ink }}>{fmt(l.total)}</td>
                    </tr>))}
                  <tr className="garder-couleur" style={{ background: "#F5F4EE" }}>
                    <td className="px-3 py-2.5 font-bold sticky left-0" style={{ color: C.ink, background: "#F5F4EE" }}>Total encaissé</td>
                    {totalParMois.map((t, i) => (
                      <td key={i} className="px-0.5 py-2.5 text-center text-[9px] tabular-nums font-semibold" style={{ color: t ? C.green : C.mute }}>
                        {t ? Math.round(t / 1000) + "k" : "—"}
                      </td>))}
                    <td className="px-3 py-2.5 text-right tabular-nums font-bold" style={{ color: C.green }}>{fmt(totalGeneral)}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>}

      <p className="text-xs mt-3 sans-impression" style={{ color: C.mute }}>
        Chaque case représente un mois. Survolez une case pour voir le montant. Passez en vue mensuelle pour encaisser, valider ou éditer les quittances.
      </p>
    </div>
  );
}

/* ========================== loyers & quittances =========================== */


function Loyers({ data, save, moi }) {
  const [mois, setMois] = useState(moisCourant());
  const [vue, setVue] = useState("mois");
  const [annee, setAnnee] = useState(new Date().getFullYear());
  const [open, setOpen] = useState(false);
  const [quittance, setQuittance] = useState(null);
  const [combinerQuittance, setCombinerQuittance] = useState(false);
  const blank = { bienId: "", montant: "", mois: moisCourant(), date: aujourdhui(), mode: "Virement" };
  const [f, setF] = useState(blank);

  const P = data.parametres || PARAMS_DEFAUT;
  const emailGerante = (P.gerante || "aude.nioble@season-immobilier.com").trim().toLowerCase();
  const suisGerante = String(moi || "").trim().toLowerCase() === emailGerante;

  const valider = (paie) => {
    save({ ...data, paiements: data.paiements.map((p) => p.id === paie.id
      ? { ...p, valide: true, validePar: moi, valideLe: new Date().toISOString(), rejet: null } : p) },
      "a VALIDÉ l'encaissement de " + fcfa(paie.montant) + " (" + moisLabel(paie.mois) + ")");
  };
  const rejeter = (paie) => {
    const motif = window.prompt("Motif du rejet de cet encaissement (visible dans le journal) :", "");
    if (motif === null) return;
    save({ ...data, paiements: data.paiements.map((p) => p.id === paie.id
      ? { ...p, valide: false, rejet: motif || "Non précisé", rejeteLe: new Date().toISOString() } : p) },
      "a REJETÉ un encaissement de " + fcfa(paie.montant) + (motif ? " — " + motif : ""));
  };
  const validerToutLeMois = () => {
    const aValider = data.paiements.filter((p) => p.mois === mois && !p.valide && !p.rejet);
    if (aValider.length === 0) return;
    if (!window.confirm("Valider les " + aValider.length + " encaissement(s) de " + moisLabel(mois) + " ?\n\nÀ n'utiliser que si vous avez vérifié ces encaissements (utile pour saisir un historique déjà encaissé).")) return;
    const ids = new Set(aValider.map((p) => p.id));
    save({ ...data, paiements: data.paiements.map((p) => ids.has(p.id)
      ? { ...p, valide: true, validePar: moi, valideLe: new Date().toISOString(), rejet: null } : p) },
      "a validé " + aValider.length + " encaissement(s) de " + moisLabel(mois));
  };

  // Locataires présents durant le mois consulté (entrée <= mois <= sortie), pour saisir aussi l'historique de locataires partis
  const presentAuMois = (l) => {
    const entree = (l.entree || "").slice(0, 7);
    const sortie = (l.sortie || "").slice(0, 7);
    if (entree && entree > mois) return false;      // pas encore entré
    if (sortie && sortie < mois) return false;      // déjà parti avant ce mois
    if (!entree && l.actif === false) return false; // parti sans date d'entrée connue
    return true;
  };
  const actifs = data.locataires.filter((l) => presentAuMois(l) || (l.actif !== false && !l.entree));
  const lignes = actifs.map((l) => ({ loc: l, bien: data.biens.find((x) => x.id === l.bienId),
    paie: data.paiements.find((p) => p.bienId === l.bienId && p.mois === mois) })).filter((x) => x.bien);
  const totalDu = lignes.reduce((s, x) => s + Number(x.bien.loyer || 0), 0);
  const totalPaye = lignes.reduce((s, x) => s + Number((x.paie || {}).montant || 0), 0);

  const submit = () => {
    if (!f.bienId || !f.montant) return;
    const loc = actifs.find((l) => l.bienId === f.bienId);
    const bien = data.biens.find((b) => b.id === f.bienId);
    const autres = data.paiements.filter((p) => !(p.bienId === f.bienId && p.mois === f.mois));
    const compteur = (data.compteur || 0) + 1;
    const numero = "QT-" + f.mois.replace("-", "") + "-" + String(compteur).padStart(4, "0");
    const dejaValide = suisGerante; // si c'est la gérante qui saisit, c'est validé d'office
    save({ ...data, compteur, paiements: [...autres, { ...f, montant: Number(f.montant), locataireId: (loc || {}).id, numero, id: uid(),
      valide: dejaValide, validePar: dejaValide ? moi : null, valideLe: dejaValide ? new Date().toISOString() : null, saisiPar: moi }] },
      "a encaissé " + fcfa(f.montant) + " — " + ((bien || {}).nom || "") + " (" + moisLabel(f.mois) + ")" + (dejaValide ? " [validé]" : " [à valider]"));
    setOpen(false);
  };

  return (
    <div>
      <Head title="Loyers & quittances" sub="Encaissements, quittances et pilotage du portefeuille"
        action={
          <div className="flex gap-1 p-0.5 rounded" style={{ background: "#F5F4EE" }}>
            {[["mois","Vue mensuelle"],["annee","Tableau annuel"],["tout","Tout"]].map(([k, lab]) => (
              <button key={k} onClick={() => setVue(k)} className="px-3 py-1.5 rounded text-sm font-medium"
                style={{ background: vue === k ? C.ink : "transparent", color: vue === k ? "#fff" : C.mute }}>
                {lab}
              </button>))}
          </div>
        } />

      {vue === "annee" && <TableauAnnuel data={data} annee={annee} setAnnee={setAnnee} />}

      {vue === "tout" && (() => {
        const tous = [...data.paiements].sort((a, b) => (b.mois || "").localeCompare(a.mois || "") || (b.date || "").localeCompare(a.date || ""));
        const nomLoc = (p) => { const l = data.locataires.find((x) => x.bienId === p.bienId); return l ? l.nom : "—"; };
        const nomB = (p) => { const b = data.biens.find((x) => x.id === p.bienId); return b ? (b.unite || b.nom) : "—"; };
        const totalTout = tous.filter((p) => p.valide).reduce((s, p) => s + Number(p.montant || 0), 0);
        return (
          <div>
            <div className="mb-4 px-4 py-3 rounded flex justify-between items-center garder-couleur" style={{ background: C.greenSoft }}>
              <span className="text-sm" style={{ color: C.ink }}>Total encaissé (validé), toutes périodes</span>
              <span className="font-bold tabular-nums" style={{ color: C.green }}>{fcfa(totalTout)}</span>
            </div>
            {tous.length === 0 ? <Empty text="Aucun encaissement enregistré." />
              : <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead><tr style={{ background: "#F5F4EE" }}>
                      {["Mois","Locataire","Bien","Montant","Statut","Quittance"].map((h) => (
                        <th key={h} className="text-left px-3 py-2.5 text-[10px] font-semibold uppercase tracking-[0.1em]" style={{ color: C.mute }}>{h}</th>))}
                    </tr></thead>
                    <tbody className="divide-y" style={{ borderColor: C.line }}>
                      {tous.map((p) => {
                        const loc = data.locataires.find((x) => x.bienId === p.bienId);
                        const bien = data.biens.find((x) => x.id === p.bienId);
                        return (
                          <tr key={p.id}>
                            <td className="px-3 py-2.5" style={{ color: C.ink }}>{moisLabel(p.mois)}</td>
                            <td className="px-3 py-2.5" style={{ color: C.ink }}>{nomLoc(p)}</td>
                            <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{nomB(p)}</td>
                            <td className="px-3 py-2.5 tabular-nums font-semibold" style={{ color: C.ink }}>{fcfa(p.montant)}</td>
                            <td className="px-3 py-2.5">{p.valide ? <Tag tone="ok">Validé</Tag> : p.rejet ? <Tag tone="bad">Rejeté</Tag> : <Tag tone="warn">À valider</Tag>}</td>
                            <td className="px-3 py-2.5">
                              {p.valide && loc && bien && <button onClick={() => setQuittance({ paie: p, loc, bien })} className="text-xs font-semibold" style={{ color: C.ink }}>Quittance</button>}
                            </td>
                          </tr>);
                      })}
                    </tbody>
                  </table>
                </div></div>}
          </div>
        );
      })()}

      {vue === "mois" && <>
      <div className="flex flex-wrap gap-3 items-end mb-5 sans-impression">
        <div><Label>Mois</Label><input type="month" value={mois} onChange={(e) => setMois(e.target.value)}
          className="px-3 py-2 text-sm rounded border bg-white outline-none" style={{ borderColor: C.line, color: C.ink }} /></div>
        {suisGerante && lignes.some((x) => x.paie && !x.paie.valide && !x.paie.rejet) && (
          <Btn variant="ghost" onClick={validerToutLeMois}>Valider tout le mois</Btn>
        )}
        <div className="flex gap-4 ml-auto">
          <div className="text-right"><Label>Attendu</Label>
            <div className="font-bold tabular-nums text-sm" style={{ color: C.ink }}>{fcfa(totalDu)}</div></div>
          <div className="text-right"><Label>Encaissé</Label>
            <div className="font-bold tabular-nums text-sm" style={{ color: C.green }}>{fcfa(totalPaye)}</div></div>
        </div>
      </div>

      {(() => {
        const enAttente = lignes.filter((x) => x.paie && !x.paie.valide && !x.paie.rejet);
        const rejetes = lignes.filter((x) => x.paie && x.paie.rejet);
        const totalAValider = enAttente.reduce((s, x) => s + Number(x.paie.montant), 0);
        if (enAttente.length === 0 && rejetes.length === 0) return null;
        return (
          <div className="mb-5 space-y-2 sans-impression">
            {enAttente.length > 0 && (
              <div className="px-4 py-3 rounded flex items-center justify-between gap-3 flex-wrap"
                style={{ background: C.goldSoft, color: C.gold }}>
                <span className="text-sm font-semibold">
                  {enAttente.length} encaissement(s) en attente de validation · {fcfa(totalAValider)}
                  {suisGerante ? " — cliquez sur « Valider » après vérification sur votre compte." : " — en attente de validation par la gérante."}
                </span>
              </div>
            )}
            {rejetes.length > 0 && (
              <div className="px-4 py-3 rounded text-sm" style={{ background: C.claySoft, color: C.clay }}>
                {rejetes.length} encaissement(s) rejeté(s) à revoir.
              </div>
            )}
          </div>
        );
      })()}

      {lignes.length === 0 ? <Empty text="Aucun locataire actif." />
        : <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr style={{ background: "#F5F4EE" }}>
                {["Bien","Locataire","Loyer dû","Encaissé","Statut","Validation","Action"].map((h) => (
                  <th key={h} className="text-left px-4 py-2.5 text-[10px] font-semibold uppercase tracking-[0.12em]" style={{ color: C.mute }}>{h}</th>))}
              </tr></thead>
              <tbody className="divide-y" style={{ borderColor: C.line }}>
                {lignes.map(({ loc, bien, paie }) => (
                  <tr key={loc.id}>
                    <td className="px-4 py-3" style={{ color: C.ink }}>{bien.nom}</td>
                    <td className="px-4 py-3" style={{ color: C.mute }}>{loc.nom}</td>
                    <td className="px-4 py-3 tabular-nums" style={{ color: C.ink }}>{fcfa(bien.loyer)}</td>
                    <td className="px-4 py-3 tabular-nums" style={{ color: paie ? C.green : C.mute }}>{paie ? fcfa(paie.montant) : "—"}</td>
                    <td className="px-4 py-3">{paie
                      ? <Tag tone={paie.montant >= bien.loyer ? "ok" : "warn"}>{paie.montant >= bien.loyer ? "Payé" : "Partiel"}</Tag>
                      : <Tag tone="bad">Impayé</Tag>}</td>
                    <td className="px-4 py-3">
                      {!paie ? <span className="text-xs" style={{ color: C.mute }}>—</span>
                        : paie.valide ? <Tag tone="ok">Validé</Tag>
                        : paie.rejet ? <Tag tone="bad">Rejeté</Tag>
                        : <Tag tone="warn">À valider</Tag>}
                    </td>
                    <td className="px-4 py-3"><div className="flex gap-3 flex-wrap">
                      <button onClick={() => { setF({ ...blank, bienId: bien.id, montant: String(bien.loyer), mois }); setOpen(true); }}
                        className="text-xs font-semibold" style={{ color: C.green }}>{paie ? "Modifier" : "Encaisser"}</button>
                      {paie && paie.valide && <button onClick={() => setQuittance({ paie, loc, bien })} className="text-xs font-semibold" style={{ color: C.ink }}>Quittance</button>}
                      {paie && !paie.valide && !paie.rejet && <span className="text-[11px]" style={{ color: C.mute }}>Quittance après validation</span>}
                      {paie && !paie.valide && suisGerante && (
                        <button onClick={() => valider(paie)} className="text-xs font-semibold" style={{ color: C.green }}>Valider</button>
                      )}
                      {paie && paie.valide && suisGerante && (
                        <button onClick={() => rejeter(paie)} className="text-xs font-semibold" style={{ color: C.clay }}>Annuler validation</button>
                      )}
                      {(!paie || paie.montant < bien.loyer) && (
                        <button onClick={() => {
                          const reste = paie ? (Number(bien.loyer) - Number(paie.montant)) : Number(bien.loyer);
                          const msg = "Bonjour " + loc.nom + ",\n\nNous vous rappelons que votre loyer de " + moisLabel(mois) +
                            " pour " + bien.nom + (paie ? ", dont il reste " + fcfa(reste) + " à régler," : " d'un montant de " + fcfa(bien.loyer)) +
                            " est attendu.\n\nMerci de bien vouloir procéder au règlement.\n\n" + (P.societe || "Season Immobilier");
                          ouvrirWhatsApp(loc.tel, msg);
                        }} className="text-xs font-semibold" style={{ color: C.orange }}>Rappel</button>
                      )}
                    </div></td>
                  </tr>))}
              </tbody>
            </table>
          </div></div>}
      </>}

      {open && (
        <Modal title="Encaisser un loyer" onClose={() => setOpen(false)}>
          <div className="space-y-3">
            <Field label="Bien"><Select value={f.bienId} onChange={(e) => setF({ ...f, bienId: e.target.value })}>
              <option value="">Sélectionner</option>
              {lignes.map(({ bien }) => <option key={bien.id} value={bien.id}>{bien.nom}</option>)}</Select></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Montant reçu (F CFA)"><Input type="number" value={f.montant} onChange={(e) => setF({ ...f, montant: e.target.value })} /></Field>
              <Field label="Mois concerné"><Input type="month" value={f.mois} onChange={(e) => setF({ ...f, mois: e.target.value })} /></Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Date de réception"><Input type="date" value={f.date} onChange={(e) => setF({ ...f, date: e.target.value })} /></Field>
              <Field label="Mode de règlement"><Select value={f.mode} onChange={(e) => setF({ ...f, mode: e.target.value })}>
                <option>Virement</option><option>Espèces</option><option>Mobile Money</option><option>Chèque</option></Select></Field>
            </div>
            <div className="flex gap-2 pt-2">
              <Btn variant="accent" onClick={submit}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}

      {quittance && (() => {
        const P = data.parametres || PARAMS_DEFAUT;
        // Autres biens du MÊME locataire (même nom) avec un paiement validé le même mois
        const memesNom = data.locataires.filter((l) => l.nom.trim().toLowerCase() === quittance.loc.nom.trim().toLowerCase());
        const idsBiens = new Set(memesNom.map((l) => l.bienId));
        const lignesCombinables = data.paiements
          .filter((pp) => pp.valide && pp.mois === quittance.paie.mois && idsBiens.has(pp.bienId))
          .map((pp) => ({ paie: pp, bien: data.biens.find((b) => b.id === pp.bienId) }))
          .filter((x) => x.bien);
        const peutCombiner = lignesCombinables.length > 1;
        const lignesQ = combinerQuittance && peutCombiner ? lignesCombinables : [{ paie: quittance.paie, bien: quittance.bien }];
        const totalQ = lignesQ.reduce((s, x) => s + Number(x.paie.montant || 0), 0);

        return (
        <Modal title="Quittance de loyer" onClose={() => { setQuittance(null); setCombinerQuittance(false); }} wide printable>
          {peutCombiner && (
            <label className="flex items-center gap-2 text-sm mb-3 sans-impression px-3 py-2 rounded" style={{ background: C.goldSoft, color: C.gold }}>
              <input type="checkbox" checked={combinerQuittance} onChange={(e) => setCombinerQuittance(e.target.checked)} />
              Ce locataire occupe {lignesCombinables.length} biens ce mois-ci. Combiner leurs loyers sur une seule quittance ?
            </label>
          )}
          <div id="doc-quittance" style={{ background: "#fff" }}>
            <Quittance lignes={lignesQ} total={totalQ} loc={quittance.loc} mois={quittance.paie.mois} date={quittance.paie.date} numero={quittance.paie.numero} mode={quittance.paie.mode} p={P}
              sansLogo={lignesQ.every((x) => x.bien && x.bien.horsGestion)} />
          </div>
          <div className="flex gap-2 pt-5 flex-wrap sans-impression">
            <Btn variant="ghost" onClick={() => genererPdf(document.getElementById("doc-quittance"), (quittance.paie.numero || "quittance") + ".pdf")}>Télécharger PDF</Btn>
            <Btn variant="solid" onClick={() => window.print()}>Imprimer</Btn>
            <Btn variant="accent" onClick={async () => {
              await genererPdf(document.getElementById("doc-quittance"), (quittance.paie.numero || "quittance") + ".pdf");
              const msg = "Bonjour " + quittance.loc.nom + ",\n\nVeuillez trouver votre quittance de loyer pour " + moisLabel(quittance.paie.mois) +
                ", d'un montant de " + fcfa(totalQ) + ".\n\n" + (P.societe || "Season Immobilier");
              ouvrirWhatsApp(quittance.loc.tel, msg);
            }}>WhatsApp</Btn>
            <Btn variant="accent" onClick={async () => {
              await genererPdf(document.getElementById("doc-quittance"), (quittance.paie.numero || "quittance") + ".pdf");
              const sujet = "Quittance de loyer " + moisLabel(quittance.paie.mois) + " — " + (P.societe || "Season Immobilier");
              const corps = "Bonjour " + quittance.loc.nom + ",\n\nVeuillez trouver votre quittance de loyer pour " + moisLabel(quittance.paie.mois) +
                ", d'un montant de " + fcfa(totalQ) + ".\n\nLe document PDF est joint à ce message.\n\nCordialement,\n" + (P.societe || "Season Immobilier");
              ouvrirMail(quittance.loc.email, sujet, corps);
            }}>Email</Btn>
            <Btn variant="ghost" onClick={() => { setQuittance(null); setCombinerQuittance(false); }}>Fermer</Btn>
          </div>
          <p className="text-xs pt-2 sans-impression" style={{ color: C.mute }}>
            Le PDF est téléchargé automatiquement sur votre appareil. Sur WhatsApp ou dans l'email, joignez-le au message déjà rédigé.
          </p>
        </Modal>
        );
      })()}
    </div>
  );
}

function Quittance({ lignes, total, loc, mois, date, numero, mode, p, sansLogo }) {
  const combinee = lignes.length > 1;
  const totalLoyer = lignes.reduce((s, x) => s + Number(x.bien.loyer || 0), 0);
  const solde = total >= totalLoyer;
  return (
    <div>
      <EnTete p={p} sansLogo={sansLogo} droite={<div>
        <div className="text-[10px] uppercase tracking-[0.14em]" style={{ color: C.mute }}>Quittance n°</div>
        <div className="font-bold text-sm tabular-nums" style={{ color: C.ink }}>{numero || "—"}</div></div>} />
      <h2 className="text-lg font-bold mb-1" style={{ color: C.ink }}>Quittance de loyer — {moisLabel(mois)}</h2>
      <p className="text-sm mb-5" style={{ color: C.mute }}>Délivrée le {dateLongue(date)}</p>
      <div className="grid sm:grid-cols-2 gap-5 mb-5">
        <div><Label>Locataire</Label><div className="text-sm" style={{ color: C.ink }}>{loc.nom}</div>
          {loc.tel && <div className="text-xs" style={{ color: C.mute }}>{loc.tel}</div>}</div>
        <div><Label>{combinee ? "Biens loués" : "Bien loué"}</Label>
          {lignes.map((x, i) => (
            <div key={i}><div className="text-sm" style={{ color: C.ink }}>{x.bien.ensemble ? x.bien.ensemble + " · " : ""}{x.bien.unite || x.bien.nom}</div>
              <div className="text-xs" style={{ color: C.mute }}>{x.bien.adresse || ""}</div></div>
          ))}</div>
      </div>
      <table className="w-full text-sm mb-5"><tbody>
        {combinee && lignes.map((x, i) => (
          <tr key={i} className="border-b" style={{ borderColor: C.line }}>
            <td className="py-2.5" style={{ color: C.mute }}>{x.bien.unite || x.bien.nom} — loyer</td>
            <td className="py-2.5 text-right tabular-nums" style={{ color: C.ink }}>{fcfa(x.paie.montant)}</td></tr>
        ))}
        {!combinee && <tr className="border-b" style={{ borderColor: C.line }}><td className="py-2.5" style={{ color: C.mute }}>Loyer mensuel</td>
          <td className="py-2.5 text-right tabular-nums" style={{ color: C.ink }}>{fcfa(lignes[0].bien.loyer)}</td></tr>}
        <tr className="border-b" style={{ borderColor: C.line }}><td className="py-2.5 font-semibold" style={{ color: C.ink }}>{combinee ? "Total reçu" : "Montant reçu"}</td>

/* =============================== échéancier =============================== */

function Echeancier({ data }) {
  const [horizon, setHorizon] = useState(6);
  const m0 = moisCourant(), today = aujourdhui();

  const lignes = useMemo(() => {
    const out = [];
    const actifs = data.locataires.filter((l) => l.actif !== false);
    for (let i = 0; i < horizon; i++) {
      const m = addMois(m0, i);
      actifs.forEach((l) => {
        const b = data.biens.find((x) => x.id === l.bienId);
        if (!b) return;
        if (l.entree && l.entree.slice(0, 7) > m) return;
        const p = data.paiements.find((p) => p.bienId === b.id && p.mois === m);
        const ech = m + "-" + String(l.jour || 5).padStart(2, "0");
        let st = "avenir";
        if (p && Number(p.montant) >= Number(b.loyer)) st = "paye";
        else if (p) st = "partiel";
        else if (ech < today) st = "retard";
        out.push({ key: l.id + "-" + m, mois: m, ech, loc: l, bien: b, du: Number(b.loyer), recu: Number((p || {}).montant || 0), statut: st });
      });
    }
    return out.sort((a, b) => a.ech.localeCompare(b.ech));
  }, [data, horizon, m0, today]);

  const parMois = useMemo(() => { const g = {}; lignes.forEach((l) => { (g[l.mois] = g[l.mois] || []).push(l); }); return g; }, [lignes]);
  const tone = { paye: "ok", partiel: "warn", retard: "bad", avenir: "neutral" };
  const lib = { paye: "Payé", partiel: "Partiel", retard: "En retard", avenir: "À échoir" };

  return (
    <div>
      <Head title="Échéancier" sub="Prévision des loyers à échoir"
        action={<Select value={horizon} onChange={(e) => setHorizon(Number(e.target.value))}>
          <option value={3}>3 mois</option><option value={6}>6 mois</option><option value={12}>12 mois</option></Select>} />
      {lignes.length === 0 ? <Empty text="Aucun bail actif." />
        : <div className="space-y-4">
            {Object.entries(parMois).map(([m, items]) => {
              const total = items.reduce((s, x) => s + x.du, 0), recu = items.reduce((s, x) => s + x.recu, 0);
              return (
                <div key={m} className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
                  <div className="px-4 py-3 border-b flex items-center justify-between gap-3 flex-wrap" style={{ borderColor: C.line }}>
                    <h3 className="text-sm font-semibold capitalize" style={{ color: C.ink }}>{moisLabel(m)}</h3>
                    <div className="text-xs tabular-nums" style={{ color: C.mute }}>
                      <span style={{ color: C.green }}>{fmt(recu)}</span> / {fcfa(total)}</div>
                  </div>
                  <div className="overflow-x-auto"><table className="w-full text-sm">
                    <tbody className="divide-y" style={{ borderColor: C.line }}>
                      {items.map((x) => (
                        <tr key={x.key}>
                          <td className="px-4 py-2.5 tabular-nums whitespace-nowrap" style={{ color: C.mute }}>{x.ech.slice(8)}/{x.ech.slice(5,7)}</td>
                          <td className="px-4 py-2.5" style={{ color: C.ink }}>{x.loc.nom}</td>
                          <td className="px-4 py-2.5" style={{ color: C.mute }}>{x.bien.nom}</td>
                          <td className="px-4 py-2.5 tabular-nums text-right" style={{ color: C.ink }}>{fcfa(x.du)}</td>
                          <td className="px-4 py-2.5 text-right"><Tag tone={tone[x.statut]}>{lib[x.statut]}</Tag></td>
                        </tr>))}
                    </tbody></table></div>
                </div>
              );
            })}
          </div>}
    </div>
  );
}

function AppareilPhoto({ onPhoto, onClose }) {
  const videoRef = useRef(null), streamRef = useRef(null);
  const [pret, setPret] = useState(false);
  const [erreur, setErreur] = useState(null);
  const [face, setFace] = useState("environment");

  useEffect(() => {
    let annule = false;
    (async () => {
      setPret(false); setErreur(null);
      if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("x");
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: face }, width: { ideal: 1280 } }, audio: false });
        if (annule) { s.getTracks().forEach((t) => t.stop()); return; }
        streamRef.current = s;
        if (videoRef.current) { videoRef.current.srcObject = s; await videoRef.current.play(); }
        setPret(true);
      } catch (e) { if (!annule) setErreur("L'appareil photo n'est pas accessible. Utilisez le bouton d'import — sur mobile il ouvre la caméra."); }
    })();
    return () => { annule = true; if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop()); };
  }, [face]);

  const capturer = () => { const v = videoRef.current; if (!v || !v.videoWidth) return;
    onPhoto(dessiner(v, v.videoWidth, v.videoHeight)); };

  return (
    <div>
      <div className="rounded overflow-hidden mb-3 flex items-center justify-center" style={{ background: C.ink, minHeight: 220 }}>
        {erreur ? <p className="text-sm p-6 text-center" style={{ color: "rgba(255,255,255,0.75)" }}>{erreur}</p>
          : <video ref={videoRef} muted playsInline className="w-full max-h-[55vh] object-contain" />}
      </div>
      <div className="flex flex-wrap gap-2">
        {!erreur && <>
          <Btn variant="accent" onClick={capturer} disabled={!pret}>Prendre la photo</Btn>
          <Btn variant="ghost" onClick={() => setFace(face === "environment" ? "user" : "environment")}>Changer d'objectif</Btn></>}
        <label className="inline-flex items-center px-3 py-2 rounded text-sm font-medium cursor-pointer"
          style={erreur ? { background: C.green, color: "#fff" } : { color: C.ink, border: "1px solid " + C.line }}>
          {erreur ? "Ouvrir la caméra" : "Importer"}
          <input type="file" accept="image/*" capture="environment" className="hidden"
            onChange={async (e) => { const x = e.target.files && e.target.files[0]; e.target.value = "";
              if (!x) return; try { onPhoto(await fichierVersDataUrl(x)); } catch (y) { setErreur("Image illisible."); } }} />
        </label>
        <Btn variant="ghost" onClick={onClose}>Fermer</Btn>
      </div>
    </div>
  );
}

        : <div className="grid md:grid-cols-2 gap-3">
            {data.etats.map((e) => {
              const b = data.biens.find((x) => x.id === e.bienId);

                      <div className="flex gap-2 items-center sans-impression">

                          <option value="bon">Bon état</option><option value="moyen">État moyen</option><option value="mauvais">Mauvais état</option></Select>
                        <button onClick={() => supprimerPiece(p.id)} className="text-xs font-semibold" style={{ color: C.clay }}>Supprimer</button>
                      </div>)}
                    {p.enregistree && !verrouille && (
                      <button onClick={() => majPiece(p.id, { enregistree: false }, "a rouvert la pièce " + p.nom + " pour modification")}
                        className="text-xs font-semibold sans-impression" style={{ color: C.gold }}>Modifier cette pièce</button>
                    )}
                  </div>
                  <div className="p-4">
                    <Label>Détail des éléments</Label>
                    <div className="border rounded overflow-hidden mb-4 garder-couleur" style={{ borderColor: C.line }}>
                      <table className="w-full text-sm">
                        <thead><tr style={{ background: "#F5F4EE" }}>
                          <th className="text-left px-3 py-2 text-[10px] font-semibold uppercase tracking-[0.1em]" style={{ color: C.mute }}>Élément</th>
                          <th className="px-2 py-2 text-[10px] font-semibold uppercase tracking-[0.1em] text-center" style={{ color: C.green, width: 70 }}>Bon</th>
                          <th className="px-2 py-2 text-[10px] font-semibold uppercase tracking-[0.1em] text-center" style={{ color: C.gold, width: 70 }}>Moyen</th>
                          <th className="px-2 py-2 text-[10px] font-semibold uppercase tracking-[0.1em] text-center" style={{ color: C.clay, width: 70 }}>Mauvais</th>
                        </tr></thead>
                        <tbody className="divide-y" style={{ borderColor: C.line }}>
                          {(p.elements || []).map((el) => (
                            <tr key={el.id}>
                              <td className="px-3 py-2" style={{ color: C.ink }}>{el.nom}</td>
                              {["bon","moyen","mauvais"].map((v) => {
                                const actif = el.note === v;
                                const coul = { bon: C.green, moyen: C.gold, mauvais: C.clay }[v];
                                return (
                                  <td key={v} className="px-2 py-2 text-center">
                                    <button
                                      onClick={() => !figee && majPiece(p.id, { elements: p.elements.map((x) => x.id === el.id ? { ...x, note: v } : x) })}
                                      disabled={figee}
                                      className="inline-flex items-center justify-center rounded-full garder-couleur"
                                      style={{ width: 22, height: 22, border: "2px solid " + (actif ? coul : C.line),
                                        background: actif ? coul : "transparent", color: "#fff",
                                        cursor: figee ? "default" : "pointer", fontSize: 13, lineHeight: 1 }}>
                                      {actif ? "✓" : ""}
                                    </button>
                                  </td>);
                              })}
                            </tr>))}
                        </tbody>
                      </table>
                    </div>
                    <Field label="Observations">
                      {figee ? <p className="text-sm" style={{ color: p.obs ? C.ink : C.mute }}>{p.obs || "Aucune observation."}</p>
                        : <Textarea value={p.obs} placeholder="Peinture écaillée, robinet qui goutte…"
                            onChange={(e) => majPiece(p.id, { obs: e.target.value })} />}
                    </Field>
                    <div className="mt-4">
                      <div className="flex items-center justify-between mb-2">
                        <Label>Photos ({(p.photos || []).length})</Label>
                        {!figee && <button onClick={() => setCamera(p.id)} className="text-xs font-semibold sans-impression" style={{ color: C.green }}>Prendre une photo</button>}
                      </div>
                      {chargement ? <p className="text-sm" style={{ color: C.mute }}>Chargement des photos…</p>
                        : (p.photos || []).length === 0 ? <p className="text-sm" style={{ color: C.mute }}>Aucune photo pour cette pièce.</p>
                        : <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
                            {p.photos.map((k) => (
                              <div key={k} className="relative">
                                <img src={photos[k]} alt={p.nom} onClick={() => setApercu(photos[k])}
                                  className="w-full aspect-square object-cover rounded border cursor-pointer" style={{ borderColor: C.line }} />
                                {!figee && <button onClick={() => supprimerPhoto(p.id, k)}
                                  className="absolute top-1 right-1 rounded-full w-5 h-5 text-xs sans-impression"
                                  style={{ background: "rgba(22,33,26,0.7)", color: "#fff" }}>✕</button>}
                              </div>))}
                          </div>}
                    </div>
                    {!verrouille && !p.enregistree && (
                      <div className="mt-4 pt-3 border-t sans-impression" style={{ borderColor: C.line }}>
                        <Btn variant="accent" onClick={() => majPiece(p.id, { enregistree: true }, "a enregistré la pièce " + p.nom + " — " + ((bien || {}).nom || ""))}>
                          Enregistrer cette pièce
                        </Btn>
                      </div>
                    )}
                  </div>
                </div>);
              })}
            </div>}

        <div className={card + " mt-4 saut-page"} style={{ borderColor: C.line }}>
          <div className="px-4 py-3 border-b" style={{ borderColor: C.line }}>
            <h3 className="text-sm font-semibold" style={{ color: C.ink }}>Observations générales</h3></div>
          <div className="p-4">
            {verrouille ? <p className="text-sm mb-6" style={{ color: etat.observations ? C.ink : C.mute }}>{etat.observations || "Aucune observation générale."}</p>
              : <Textarea rows={3} value={etat.observations} className="mb-6" onChange={(e) => majEtat({ observations: e.target.value })} />}
            <div className="grid sm:grid-cols-2 gap-8 mt-6">
              <div className="text-center"><div className="text-xs mb-10" style={{ color: C.mute }}>Le locataire</div>
                <div className="border-t pt-1.5 text-xs" style={{ borderColor: C.line, color: C.mute }}>{(loc || {}).nom || "Nom et signature"}</div></div>
              <div className="text-center"><div className="text-xs mb-10" style={{ color: C.mute }}>Pour {P.societe || "l'agence"}</div>
                <div className="border-t pt-1.5 text-xs" style={{ borderColor: C.line, color: C.mute }}>Signature et cachet</div></div>
            </div>
            <PiedPage p={P} />
          </div>
        </div>

        <p className="text-xs mt-4 sans-impression" style={{ color: C.mute }}>{nbPhotos} photo(s) sur cet état des lieux</p>
      </div>

      {camera && <Modal title="Photographier la pièce" onClose={() => setCamera(null)} wide>
        <AppareilPhoto onPhoto={async (d) => { await ajouterPhoto(camera, d); setCamera(null); }} onClose={() => setCamera(null)} />
      </Modal>}

      {apercu && <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sans-impression"
        style={{ background: "rgba(22,33,26,0.85)" }} onClick={() => setApercu(null)}>
        <img src={apercu} alt="Photo" className="max-w-full max-h-full rounded" /></div>}
    </div>
  );
}

function remplirMarques(texte, ctx) {
  const rempl = {
    "[BAILLEUR]": ctx.bailleur, "[BAILLEUR_DETAIL]": ctx.bailleurDetail,
    "[PRENEUR]": ctx.preneur, "[PRENEUR_DETAIL]": ctx.preneurDetail,
    "[BIEN]": ctx.bien, "[TYPE_BIEN]": ctx.typeBien, "[ADRESSE]": ctx.adresse, "[SURFACE]": ctx.surface,
    "[LOYER]": ctx.loyer, "[LOYER_LETTRES]": ctx.loyerLettres,
    "[CAUTION]": ctx.caution, "[CAUTION_LETTRES]": ctx.cautionLettres,
    "[AVANCE]": ctx.avance, "[AVANCE_LETTRES]": ctx.avanceLettres,
    "[DUREE]": ctx.duree, "[DATE_ENTREE]": ctx.dateEntree, "[JOUR_ECHEANCE]": ctx.jour,
    "[DATE_DU_JOUR]": ctx.dateJour, "[AGENCE]": ctx.agence, "[VILLE]": ctx.ville,
  };
  let out = texte;
  Object.keys(rempl).forEach((k) => { out = out.split(k).join(rempl[k] == null ? "" : rempl[k]); });
  return out;
}

// Met en forme le corps du bail : intitulés d'articles en gras, puces, paragraphes justifiés
// Frais d'enregistrement d'un bail : 2,5% du loyer annuel × durée (années) + timbres
function fraisEnregistrement(bail, bien, loc) {
  const loyer = Number((bien || {}).loyer || 0);
  const loyerAnnuel = loyer * 12;
  // durée en années : depuis dureeMois du locataire, sinon 1 an
  const mois = Number((loc || {}).dureeMois) || 12;
  const annees = Math.max(1, Math.round(mois / 12));
  const droits = Math.round(loyerAnnuel * annees * 0.025);
  const exemplaires = 3;
  const pagesEstimees = 4;
  const timbres = 1000 * pagesEstimees * exemplaires;
  return { droits, timbres, total: droits + timbres, annees, exemplaires, pagesEstimees };
}

function CorpsBail({ texte }) {
  const blocs = texte.split("\n");
  const out = [];
  let puces = [];
  const viderPuces = (key) => {
    if (puces.length) {
      out.push(<ul key={"u" + key} style={{ margin: "6px 0 14px 0", paddingLeft: 26, listStyleType: "'—  '" }}>
        {puces.map((p, i) => <li key={i} style={{ marginBottom: 4, paddingLeft: 4 }}>{p}</li>)}</ul>);
      puces = [];
    }
  };
  blocs.forEach((ligne, idx) => {
    const l = ligne.trim();
    if (!l) { viderPuces(idx); return; }
    if (/^[-•]\s?/.test(l)) { puces.push(l.replace(/^[-•]\s?/, "")); return; }
    viderPuces(idx);
    const estArticle = /^article\s+\d+\s*[:–-]/i.test(l);
    const estConvenu = /^il a [ée]t[ée] (convenu|arr[êe]t[ée])/i.test(l);
    const estSoussignes = /^entre les soussign[ée]s/i.test(l);
    const estMention = /^(ci-apr[èe]s d[ée]nomm)/i.test(l);
    const estEt = /^et\s*$/i.test(l);
    const estCloture = /^fait à /i.test(l) || /^en (deux|trois|quatre) \(/i.test(l);

    if (estArticle) {
      // Sépare "Article N :" du titre pour un rendu soigné
      const m = l.match(/^(article\s+\d+\s*[:–-])\s*(.*)$/i);
      out.push(
        <p key={idx} style={{ margin: "20px 0 6px 0", fontFamily: "'Cormorant Garamond', serif",
          fontWeight: 700, fontSize: "14.5pt", color: "#1a1a1a", letterSpacing: "0.01em" }}>
          {m ? <>{m[1].replace(/[–-]\s*$/, "").replace(/:\s*$/, "")}{m[2] ? <span style={{ fontWeight: 600 }}> — {m[2]}</span> : null}</> : l}
        </p>);
    } else if (estSoussignes || estConvenu) {
      out.push(<p key={idx} style={{ margin: estConvenu ? "18px 0 12px" : "0 0 12px", fontWeight: 600, textAlign: estConvenu ? "center" : "left",
        letterSpacing: estConvenu ? "0.04em" : "0", fontSize: estConvenu ? "13.5pt" : "13pt" }}>{l}</p>);
    } else if (estEt) {
      out.push(<p key={idx} style={{ margin: "10px 0", textAlign: "center", fontWeight: 600, fontStyle: "italic" }}>{l}</p>);
    } else if (estMention) {
      out.push(<p key={idx} style={{ margin: "4px 0 10px", textAlign: "right", fontWeight: 600, fontStyle: "italic" }}>{l}</p>);
    } else if (estCloture) {
      out.push(<p key={idx} style={{ margin: "4px 0 0", textAlign: "left" }}>{l}</p>);
    } else {
      out.push(<p key={idx} style={{ margin: "0 0 10px 0", textAlign: "justify", textJustify: "inter-word" }}>{l}</p>);
    }
  });
  viderPuces("fin");
  return <div>{out}</div>;
}

function Baux({ data, save }) {
  const [open, setOpen] = useState(false);
  const [vue, setVue] = useState(null);
  const [gestionModeles, setGestionModeles] = useState(false);
  const [avecLogo, setAvecLogo] = useState(false);
  const [editionBail, setEditionBail] = useState(false);
  const [brouillon, setBrouillon] = useState("");
  const P = data.parametres || PARAMS_DEFAUT;
  const liste = data.baux || [];
  const modeles = (data.modelesBail && data.modelesBail.length) ? data.modelesBail : MODELES_BAIL_DEFAUT;

  const blank = { modeleId: modeles[0] ? modeles[0].id : "", bienId: "", locataireId: "",
    duree: "un (1) an", dateEntree: aujourdhui(), clausesSup: "", date: aujourdhui() };
  const [f, setF] = useState(blank);

  const contexte = (bail) => {
    const bien = data.biens.find((b) => b.id === bail.bienId);
    const loc = data.locataires.find((l) => l.id === bail.locataireId);
    const proprio = bien && (data.proprietaires || []).find((p) => p.id === bien.proprietaireId);
    const loyer = Number((bien || {}).loyer || 0);
    const caution = loyer * (Number((loc || {}).caution) || 2);
    const avance = loyer * (Number((loc || {}).avance) || 0);
    const bailleurDetail = "La " + (P.societe || "SEASON IMMOBILIER") +
      (P.rccm ? ", immatriculée au RCCM sous le n° " + P.rccm : "") +
      (P.adresse ? ", ayant son siège à " + P.adresse : "") +
      (P.tel ? " ; Tél : " + P.tel : "") + (P.email ? " ; Email : " + P.email : "") +
      (proprio ? ", agissant pour le compte de " + proprio.nom + (proprio.adresse ? " demeurant à " + proprio.adresse : "") : "") + ".";
    const preneurDetail = loc
      ? loc.nom + (loc.tel ? ", Tél : " + loc.tel : "") + (loc.email ? ", Email : " + loc.email : "") +
        (loc.adresse ? ", demeurant à " + loc.adresse : "") + "."
      : "……………………………………";
    return {
      bailleur: P.societe || "SEASON IMMOBILIER", bailleurDetail,
      preneur: (loc || {}).nom || "……", preneurDetail,
      bien: (bien || {}).nom || "……", typeBien: (bien || {}).type ? ((bien || {}).type + ((bien || {}).pieces ? " de " + bien.pieces + " pièces" : "") + ((bien || {}).surface ? " d'une superficie de " + bien.surface + " m²" : "")) : "le bien",
      adresse: (bien || {}).adresse || "……", surface: (bien || {}).surface || "",
      loyer: fmt(loyer), loyerLettres: enLettres(loyer).toLowerCase(),
      caution: fmt(caution), cautionLettres: enLettres(caution).toLowerCase(),
      avance: fmt(avance), avanceLettres: enLettres(avance).toLowerCase(),
      duree: bail.duree, dateEntree: bail.dateEntree ? dateLongue(bail.dateEntree) : "……",
      jour: cardinalJour((loc || {}).jour || 5), dateJour: dateLongue(bail.date || aujourdhui()),
      agence: P.societe || "SEASON IMMOBILIER", ville: "Abidjan",
    };
  };

  const creer = () => {
    if (!f.bienId || !f.locataireId) return;
    const modele = modeles.find((m) => m.id === f.modeleId) || modeles[0];
    const bail = { ...f, id: uid(), titre: modele.titre, corps: modele.corps, cree: new Date().toISOString() };
    save({ ...data, baux: [bail, ...liste] }, "a généré un contrat de bail — " + (data.locataires.find((l) => l.id === f.locataireId) || {}).nom);
    setOpen(false); setVue(bail.id);
  };

  const supprimer = (b) => save({ ...data, baux: liste.filter((x) => x.id !== b.id) }, "a supprimé un contrat de bail");

  if (gestionModeles) return <ModelesBail data={data} save={save} retour={() => setGestionModeles(false)} />;

  const bailVu = liste.find((b) => b.id === vue);
  if (bailVu) {
    const ctx = contexte(bailVu);
    const bien = data.biens.find((b) => b.id === bailVu.bienId);
    const loc = data.locataires.find((l) => l.id === bailVu.locataireId);
    // Formule de clôture, éditable avec le corps (les cases de signature restent un gabarit fixe en dessous)
    const blocCloture = "\n\nFait à Abidjan, le " + dateLongue(bailVu.date || aujourdhui()) + ".\nEn trois (3) exemplaires originaux.";
    // Texte complet du contrat = corps rempli + clôture. Si corpsFinal existe, il contient déjà tout.
    const texteComplet = bailVu.corpsFinal != null ? bailVu.corpsFinal
      : remplirMarques(bailVu.corps, ctx) +
        (bailVu.clausesSup && bailVu.clausesSup.trim() ? "\n\n" + bailVu.clausesSup.trim() : "") +
        blocCloture;

    const activerEdition = () => { setBrouillon(texteComplet); setEditionBail(true); };
    const enregistrerEdition = () => {
      save({ ...data, baux: liste.map((b) => b.id === bailVu.id ? { ...b, corpsFinal: brouillon } : b) },
        "a modifié le texte du contrat de " + ctx.preneur);
      setEditionBail(false);
    };
    const reinitialiser = () => {
      if (!window.confirm("Réinitialiser ce contrat à partir du modèle ? Vos modifications sur ce bail seront perdues.")) return;
      save({ ...data, baux: liste.map((b) => b.id === bailVu.id ? { ...b, corpsFinal: null } : b) },
        "a réinitialisé le contrat de " + ctx.preneur);
      setEditionBail(false);
    };

    return (
      <div>
        <button onClick={() => { setEditionBail(false); setVue(null); }} className="text-sm mb-4 sans-impression" style={{ color: C.mute }}>← Retour aux contrats</button>
        <Head title={bailVu.titre} sub={ctx.preneur}
          action={<>
            {!editionBail && <>
              <label className="flex items-center gap-1.5 text-sm mr-2 sans-impression" style={{ color: C.mute }}>
                <input type="checkbox" checked={avecLogo} onChange={(e) => setAvecLogo(e.target.checked)} /> Avec logo
              </label>
              <Btn variant="ghost" onClick={activerEdition}>Modifier le texte</Btn>
              <Btn variant="ghost" onClick={() => genererPdf(document.getElementById("doc-bail"), "Bail_" + ctx.preneur.replace(/\s+/g, "_") + ".pdf")}>Télécharger PDF</Btn>
              <Btn variant="solid" onClick={() => window.print()}>Imprimer</Btn>
              <Btn variant="accent" onClick={async () => {
                await genererPdf(document.getElementById("doc-bail"), "Bail_" + ctx.preneur.replace(/\s+/g, "_") + ".pdf");
                const msg = "Bonjour " + ctx.preneur + ",\n\nVeuillez trouver votre contrat de bail pour " + ctx.bien + ".\n\n" + (P.societe || "Season Immobilier");
                ouvrirWhatsApp((loc || {}).tel, msg);
              }}>WhatsApp</Btn>
            </>}
            {editionBail && <>
              <Btn variant="accent" onClick={enregistrerEdition}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setEditionBail(false)}>Annuler</Btn>
              {bailVu.corpsFinal != null && <Btn variant="danger" onClick={reinitialiser}>Repartir du modèle</Btn>}
            </>}
          </>} />
        <div className="zone-impression" id="doc-bail"
          style={{ background: "#fff", fontFamily: "'EB Garamond', Georgia, 'Times New Roman', serif", color: "#1a1a1a" }}>
          <div className="px-5 py-8 sm:px-14 sm:py-12" style={{ fontSize: "13pt", lineHeight: 1.7 }}>

            {/* En-tête : logo à gauche, agent agréé à droite */}
            {avecLogo && (
              <div className="flex justify-between items-start mb-8">
                {P.logo ? <img src={P.logo} alt="" style={{ height: 56, width: "auto", objectFit: "contain" }} />
                  : <div style={{ fontWeight: 700, fontSize: "15pt", color: C.clay, fontFamily: "'Cormorant Garamond', serif" }}>{P.societe}</div>}
                <div style={{ textAlign: "center", border: "1px solid #999", borderRadius: 4, padding: "5px 12px", fontSize: "8.5pt", letterSpacing: "0.05em", color: "#555" }}>
                  AGENT<br />IMMOBILIER<br />AGRÉÉ
                </div>
              </div>
            )}

            {/* Titre : filets décoratifs au-dessus et en-dessous */}
            <div style={{ textAlign: "center", marginBottom: 32 }}>
              <div style={{ borderTop: "2px solid #1a1a1a", width: 60, margin: "0 auto 14px" }}></div>
              <h1 style={{ fontFamily: "'Cormorant Garamond', serif", fontWeight: 700, fontSize: "22pt",
                letterSpacing: "0.08em", textTransform: "uppercase", margin: 0, lineHeight: 1.25 }}>{bailVu.titre}</h1>
              <div style={{ borderBottom: "1px solid #999", width: 120, margin: "14px auto 0" }}></div>
            </div>

            {/* Corps + clôture : éditable en mode édition, mis en forme sinon */}
            {editionBail
              ? <div className="sans-impression">
                  <div className="mb-2 px-3 py-2 rounded text-xs" style={{ background: C.goldSoft, color: C.gold, fontFamily: "system-ui, sans-serif" }}>
                    Vous modifiez tout le texte de CE contrat, jusqu'à la formule de clôture. Le modèle d'origine n'est pas touché. Les intitulés « Article N : … » restent en gras, les lignes commençant par « - » deviennent des puces. Les cases de signature en bas s'ajoutent automatiquement.
                  </div>
                  <textarea value={brouillon} onChange={(e) => setBrouillon(e.target.value)} rows={28}
                    className="w-full px-3 py-2 rounded border outline-none" style={{ borderColor: C.line, color: C.ink, fontFamily: "monospace", fontSize: 12, lineHeight: 1.5 }} />
                </div>
              : <CorpsBail texte={texteComplet} />}

            {/* Signatures (gabarit fixe, toujours en bas) */}
            <div className="grid grid-cols-2 gap-10" style={{ marginTop: 48 }}>
              <div style={{ textAlign: "center" }}>
                <div style={{ fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.06em", fontSize: "11pt", marginBottom: 6 }}>Le Bailleur</div>
                <div style={{ fontSize: "11pt", fontStyle: "italic", color: "#444" }}>{P.societe}</div>
                <div style={{ borderBottom: "1px dotted #999", margin: "44px 12px 6px" }}></div>
                <div style={{ fontSize: "9.5pt", color: "#777" }}>Signature et cachet</div>
              </div>
              <div style={{ textAlign: "center" }}>
                <div style={{ fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.06em", fontSize: "11pt", marginBottom: 6 }}>Le Preneur</div>
                <div style={{ fontSize: "11pt", fontStyle: "italic", color: "#444" }}>{ctx.preneur}</div>
                <div style={{ borderBottom: "1px dotted #999", margin: "44px 12px 6px" }}></div>
                <div style={{ fontSize: "9.5pt", color: "#777" }}>Signature et cachet</div>
              </div>
            </div>

            {P.pied && <div style={{ marginTop: 36, paddingTop: 10, borderTop: "1px solid #ddd", fontSize: "9pt", color: "#888", textAlign: "center", fontFamily: "system-ui, sans-serif" }}>{P.pied}</div>}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <Head title="Contrats de bail" sub="Génération automatique à partir de vos modèles"
        action={<>
          <Btn variant="ghost" onClick={() => setGestionModeles(true)}>Gérer les modèles</Btn>
          <Btn variant="accent" onClick={() => { setF({ ...blank }); setOpen(true); }} disabled={data.biens.length === 0 || data.locataires.length === 0}>+ Nouveau bail</Btn>
        </>} />

      {(() => {
        const aEnregistrer = liste.filter((b) => !b.enregistre);
        if (aEnregistrer.length === 0) return null;
        return (
          <div className="mb-5 px-4 py-3 rounded flex items-center gap-2 flex-wrap sans-impression garder-couleur"
            style={{ background: C.goldSoft, color: C.gold }}>

            </span>
          </div>
        );
      })()}

              <thead><tr style={{ background: "#F5F4EE" }}>

                {liste.map((b) => {
                  const loc = data.locataires.find((x) => x.id === b.locataireId);

                    const ref = window.prompt("Référence ou date d'enregistrement aux impôts (facultatif) :", aujourdhui());
                    if (ref === null) return;
                    save({ ...data, baux: liste.map((x) => x.id === b.id ? { ...x, enregistre: true, refEnregistrement: ref || aujourdhui() } : x) },

                    <tr key={b.id}>
                      <td className="px-4 py-3" style={{ color: C.ink }}>{(loc || {}).nom || "—"}</td>

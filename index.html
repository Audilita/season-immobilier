                          ? <button onClick={annulerEnregistre} className="text-xs font-semibold" style={{ color: C.mute }}>Annuler</button>
                          : <button onClick={marquerEnregistre} className="text-xs font-semibold" style={{ color: C.gold }}>Marquer enregistré</button>}
                        <button onClick={() => supprimer(b)} className="text-xs font-semibold" style={{ color: C.clay }}>Supprimer</button>
                      </div></td>
                    </tr>);
                })}
              </tbody>
            </table>
          </div></div>}

      {open && (
        <Modal title="Générer un contrat de bail" onClose={() => setOpen(false)} wide>
          <div className="space-y-3">
            <Field label="Modèle de bail">
              <Select value={f.modeleId} onChange={(e) => setF({ ...f, modeleId: e.target.value })}>
                {modeles.map((m) => <option key={m.id} value={m.id}>{m.nom}</option>)}
              </Select>
            </Field>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Bien">
                <Select value={f.bienId} onChange={(e) => setF({ ...f, bienId: e.target.value })}>
                  <option value="">Sélectionner</option>
                  {data.biens.map((b) => <option key={b.id} value={b.id}>{b.nom}</option>)}
                </Select>
              </Field>
              <Field label="Locataire">
                <Select value={f.locataireId} onChange={(e) => setF({ ...f, locataireId: e.target.value })}>
                  <option value="">Sélectionner</option>
                  {data.locataires.map((l) => <option key={l.id} value={l.id}>{l.nom}</option>)}
                </Select>
              </Field>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Durée"><Input value={f.duree} onChange={(e) => setF({ ...f, duree: e.target.value })} placeholder="un (1) an" /></Field>
              <Field label="Date d'entrée"><Input type="date" value={f.dateEntree} onChange={(e) => setF({ ...f, dateEntree: e.target.value })} /></Field>
            </div>
            <Field label="Clauses ou articles supplémentaires (facultatif)">
              <Textarea rows={4} value={f.clausesSup} onChange={(e) => setF({ ...f, clausesSup: e.target.value })}
                placeholder="Ajoutez ici des articles spécifiques à ce contrat (climatisation, pas-de-porte, entretien piscine…). Ils seront ajoutés à la fin du bail." />
            </Field>
            <p className="text-xs" style={{ color: C.mute }}>
              Le contrat se remplit automatiquement avec les informations du bailleur, du bien et du locataire. Vous pourrez le relire avant impression.
            </p>
            <div className="flex gap-2 pt-2">
              <Btn variant="accent" onClick={creer}>Générer le contrat</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

function ModelesBail({ data, save, retour }) {
  const modeles = (data.modelesBail && data.modelesBail.length) ? data.modelesBail : MODELES_BAIL_DEFAUT;
  const [edit, setEdit] = useState(null);
  const [f, setF] = useState({ nom: "", titre: "", corps: "" });

  const start = (m) => { setEdit(m || "nouveau"); setF(m ? { ...m } : { id: uid(), nom: "", titre: "BAIL", corps: "" }); };
  const enregistrer = () => {
    if (!f.nom.trim()) return;
    const base = (data.modelesBail && data.modelesBail.length) ? data.modelesBail : MODELES_BAIL_DEFAUT.map((m) => ({ ...m }));
    const existe = base.some((m) => m.id === f.id);
    const suite = existe ? base.map((m) => m.id === f.id ? { ...f } : m) : [...base, { ...f, id: f.id || uid() }];
    save({ ...data, modelesBail: suite }, "a modifié un modèle de bail : " + f.nom);
    setEdit(null);
  };
  const supprimer = (m) => {
    const base = (data.modelesBail && data.modelesBail.length) ? data.modelesBail : MODELES_BAIL_DEFAUT.map((x) => ({ ...x }));
    save({ ...data, modelesBail: base.filter((x) => x.id !== m.id) }, "a supprimé un modèle de bail");
  };
  const restaurer = () => save({ ...data, modelesBail: MODELES_BAIL_DEFAUT.map((m) => ({ ...m })) }, "a restauré les modèles de bail par défaut");

  const MARQUES = ["[PRENEUR]","[PRENEUR_DETAIL]","[BAILLEUR]","[BAILLEUR_DETAIL]","[BIEN]","[TYPE_BIEN]","[ADRESSE]",
    "[LOYER]","[LOYER_LETTRES]","[CAUTION]","[CAUTION_LETTRES]","[AVANCE]","[AVANCE_LETTRES]","[DUREE]","[DATE_ENTREE]","[JOUR_ECHEANCE]","[DATE_DU_JOUR]"];

  if (edit) {
    return (
      <div>
        <button onClick={() => setEdit(null)} className="text-sm mb-4" style={{ color: C.mute }}>← Retour aux modèles</button>
        <Head title={edit === "nouveau" ? "Nouveau modèle" : "Modifier le modèle"} />
        <div className="space-y-3 max-w-3xl">
          <Field label="Nom du modèle"><Input value={f.nom} onChange={(e) => setF({ ...f, nom: e.target.value })} placeholder="Bail habitation — particulier" /></Field>
          <Field label="Titre affiché sur le contrat"><Input value={f.titre} onChange={(e) => setF({ ...f, titre: e.target.value })} placeholder="BAIL À USAGE D'HABITATION" /></Field>
          <div className="px-3 py-2 rounded text-xs" style={{ background: C.goldSoft, color: C.gold }}>
            Marques disponibles (recopiez-les dans le texte, elles seront remplies automatiquement) : {MARQUES.join("  ·  ")}
          </div>
          <Field label="Texte du contrat">
            <Textarea rows={20} value={f.corps} onChange={(e) => setF({ ...f, corps: e.target.value })}
              style={{ fontFamily: "monospace", fontSize: 12 }} />
          </Field>
          <div className="flex gap-2">
            <Btn variant="accent" onClick={enregistrer}>Enregistrer le modèle</Btn>
            <Btn variant="ghost" onClick={() => setEdit(null)}>Annuler</Btn>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <button onClick={retour} className="text-sm mb-4" style={{ color: C.mute }}>← Retour aux contrats</button>
      <Head title="Modèles de bail" sub="Personnalisez les textes utilisés pour générer vos contrats"
        action={<>
          <Btn variant="ghost" onClick={restaurer}>Restaurer les modèles d'origine</Btn>
          <Btn variant="accent" onClick={() => start(null)}>+ Nouveau modèle</Btn>
        </>} />
      <div className="grid md:grid-cols-2 gap-3">
        {modeles.map((m) => (
          <div key={m.id} className={card} style={{ borderColor: C.line }}><div className="p-4">
            <h3 className="font-semibold text-sm mb-1" style={{ color: C.ink }}>{m.nom}</h3>
            <p className="text-xs mb-3" style={{ color: C.mute }}>{m.titre}</p>
            <p className="text-xs mb-3 line-clamp-2" style={{ color: C.mute }}>{m.corps.slice(0, 120)}…</p>
            <div className="flex gap-2">
              <Btn variant="ghost" onClick={() => start(m)}>Modifier</Btn>
              <Btn variant="danger" onClick={() => supprimer(m)}>Supprimer</Btn>
            </div>
          </div></div>))}
      </div>
    </div>
  );
}

/* ============================== cautions ================================= */

function Cautions({ data, save }) {
  const [open, setOpen] = useState(false);
  const [vue, setVue] = useState(null);
  const [filtre, setFiltre] = useState("actifs");
  const P = data.parametres || PARAMS_DEFAUT;
  const suivi = data.cautions || [];

  // Construit la liste : un item par locataire, en fusionnant avec le suivi existant
  const lignes = useMemo(() => {
    return data.locataires.map((loc) => {
      const bien = data.biens.find((b) => b.id === loc.bienId);
      if (!bien) return null;
      const montantTheorique = Number(bien.loyer || 0) * (Number(loc.caution) || 0);
      const s = suivi.find((x) => x.locataireId === loc.id) || {};
      const statut = s.statut || (loc.actif === false ? "a_solder" : "en_cours");
      return {
        loc, bien, montantTheorique,
        montantVerse: s.montantVerse != null ? s.montantVerse : montantTheorique,
        retenues: s.retenues || [],
        restitue: s.restitue || 0,
        dateVersement: s.dateVersement || loc.entree || "",
        dateRestitution: s.dateRestitution || "",
        quitusSodeci: !!s.quitusSodeci, quitusCie: !!s.quitusCie,
        detenteur: s.detenteur || "agence",
        accordProprio: !!s.accordProprio, dateAccordProprio: s.dateAccordProprio || "",
        statut, note: s.note || "", id: s.id,
      };
    }).filter(Boolean);
  }, [data, suivi]);

  const visibles = lignes.filter((l) => {
    if (filtre === "actifs") return l.loc.actif !== false;
    if (filtre === "solder") return l.statut === "a_solder" || (l.loc.actif === false && l.statut !== "restituee");
    if (filtre === "restituees") return l.statut === "restituee";
    return true;
  });

  const enCours = lignes.filter((l) => l.statut !== "restituee");
  const totalDetenu = enCours.reduce((s, l) => s + l.montantVerse, 0);
  const detenuAgence = enCours.filter((l) => (l.detenteur || "agence") === "agence").reduce((s, l) => s + l.montantVerse, 0);
  const detenuProprio = enCours.filter((l) => l.detenteur === "proprietaire").reduce((s, l) => s + l.montantVerse, 0);
  const totalRestitue = lignes.reduce((s, l) => s + (l.restitue || 0), 0);

  const [f, setF] = useState({});
  const ouvrir = (ligne) => {
    setF({
      locataireId: ligne.loc.id, montantVerse: String(ligne.montantVerse),
      dateVersement: ligne.dateVersement || aujourdhui(),
      retenues: ligne.retenues.length ? ligne.retenues : [],
      dateRestitution: ligne.dateRestitution || "", note: ligne.note || "", statut: ligne.statut, id: ligne.id,
      quitusSodeci: !!ligne.quitusSodeci, quitusCie: !!ligne.quitusCie,
      detenteur: ligne.detenteur || "agence",
      accordProprio: !!ligne.accordProprio, dateAccordProprio: ligne.dateAccordProprio || "",
      montantTheorique: ligne.montantTheorique, bienNom: ligne.bien.nom, locNom: ligne.loc.nom,
    });
    setNouvelleRetenue({ motif: "", montant: "" });
    setOpen(true);
  };

  const [nouvelleRetenue, setNouvelleRetenue] = useState({ motif: "", montant: "" });
  const ajouterRetenue = () => {
    if (!nouvelleRetenue.motif.trim() || !nouvelleRetenue.montant) return;
    setF({ ...f, retenues: [...(f.retenues || []), { id: uid(), motif: nouvelleRetenue.motif.trim(), montant: Number(nouvelleRetenue.montant) }] });
    setNouvelleRetenue({ motif: "", montant: "" });
  };

  const totalRetenues = (f.retenues || []).reduce((s, r) => s + r.montant, 0);
  const aRestituer = Math.max(Number(f.montantVerse || 0) - totalRetenues, 0);

  const enregistrer = (statutFinal) => {
    if (statutFinal === "restituee" && (!f.quitusSodeci || !f.quitusCie)) {
      const ok = window.confirm("Les quitus SODECI et/ou CIE ne sont pas cochés comme reçus. Restituer la caution malgré tout ?\n\nUn impayé d'eau ou d'électricité laissé par le locataire pourrait rester à votre charge.");
      if (!ok) return;
    }
    // Si le propriétaire détient et qu'on veut restituer sans son accord, on bloque
    if (statutFinal === "restituee" && f.detenteur === "proprietaire" && !f.accordProprio) {
      const ok = window.confirm("La caution est détenue par le propriétaire et son accord n'est pas encore enregistré. Confirmer quand même la restitution ?\n\nNormalement, le propriétaire doit valider le décompte des retenues avant de libérer les fonds.");
      if (!ok) return;
    }
    const rec = {
      id: f.id || uid(), locataireId: f.locataireId,
      montantVerse: Number(f.montantVerse) || 0, dateVersement: f.dateVersement,
      retenues: f.retenues || [], note: f.note || "",
      quitusSodeci: !!f.quitusSodeci, quitusCie: !!f.quitusCie, detenteur: f.detenteur || "agence",
      accordProprio: !!f.accordProprio, dateAccordProprio: f.dateAccordProprio || (f.accordProprio ? aujourdhui() : ""),
      statut: statutFinal || f.statut,
      restitue: statutFinal === "restituee" ? aRestituer : (f.statut === "restituee" ? f.restitue : 0),
      dateRestitution: statutFinal === "restituee" ? (f.dateRestitution || aujourdhui()) : f.dateRestitution,
    };
    const autres = suivi.filter((x) => x.locataireId !== f.locataireId);
    save({ ...data, cautions: [...autres, rec] },
      (statutFinal === "restituee" ? "a restitué la caution de " + f.locNom + " (" + fcfa(rec.restitue) + ")"
        : "a mis à jour la caution de " + f.locNom));
    setOpen(false);
  };

  // Transmettre le décompte au propriétaire pour accord (quand il détient la caution)
  const transmettreProprio = () => {
    const bien = data.biens.find((b) => b.id === (data.locataires.find((l) => l.id === f.locataireId) || {}).bienId);
    const proprio = bien && (data.proprietaires || []).find((p) => p.id === bien.proprietaireId);
    const totalRet = (f.retenues || []).reduce((s, r) => s + r.montant, 0);
    const msg = "Bonjour" + (proprio ? " " + proprio.nom : "") + ",\n\n" +
      "Décompte de restitution de la caution pour " + (f.locNom || "le locataire") + " (" + (f.bienNom || "") + ") :\n" +
      "- Dépôt versé : " + fcfa(Number(f.montantVerse || 0)) + "\n" +
      (f.retenues || []).map((r) => "- Retenue (" + r.motif + ") : " + fcfa(r.montant)).join("\n") +
      (totalRet ? "\n- Total retenues : " + fcfa(totalRet) : "") +
      "\n- Montant à restituer au locataire : " + fcfa(aRestituer) + "\n\n" +
      "Merci de nous donner votre accord pour procéder à la restitution.\n\n" + (P.societe || "Season Immobilier");
    ouvrirWhatsApp(proprio && proprio.tel, msg);
  };

  const tone = { en_cours: "ok", a_solder: "warn", restituee: "neutral" };
  const lib = { en_cours: "Détenue", a_solder: "À solder", restituee: "Restituée" };

  // Reçu de restitution
  if (vue) {
    const ligne = lignes.find((l) => l.loc.id === vue);
    if (!ligne) { setVue(null); return null; }
    const totalRet = ligne.retenues.reduce((s, r) => s + r.montant, 0);
    return (
      <div>
        <button onClick={() => setVue(null)} className="text-sm mb-4 sans-impression" style={{ color: C.mute }}>← Retour au suivi</button>
        <Head title="Reçu de restitution de caution" sub={ligne.loc.nom}
          action={<>
            <Btn variant="ghost" onClick={() => genererPdf(document.getElementById("doc-caution"), "Restitution_" + ligne.loc.nom.replace(/\s+/g, "_") + ".pdf")}>Télécharger PDF</Btn>
            <Btn variant="solid" onClick={() => window.print()}>Imprimer</Btn>
            <Btn variant="accent" onClick={async () => {
              await genererPdf(document.getElementById("doc-caution"), "Restitution_" + ligne.loc.nom.replace(/\s+/g, "_") + ".pdf");
              const msg = "Bonjour " + ligne.loc.nom + ",\n\nVeuillez trouver le décompte de restitution de votre dépôt de garantie pour " + ligne.bien.nom + ".\nMontant restitué : " + fcfa(ligne.restitue) + ".\n\n" + (P.societe || "Season Immobilier");
              ouvrirWhatsApp(ligne.loc.tel, msg);
            }}>WhatsApp</Btn>
          </>} />
        <div className="zone-impression" id="doc-caution" style={{ background: "#fff" }}><div className="p-2 sm:p-6">
          <EnTete p={P} droite={<div>
            <div className="text-[10px] uppercase tracking-[0.14em]" style={{ color: C.mute }}>Restitution de caution</div>
            <div className="text-[10px] mt-1" style={{ color: C.mute }}>{dateLongue(ligne.dateRestitution || aujourdhui())}</div></div>} />
          <h2 className="text-lg font-bold mb-5" style={{ color: C.ink }}>Décompte de restitution du dépôt de garantie</h2>
          <div className="grid sm:grid-cols-2 gap-5 mb-5">
            <div><Label>Locataire</Label><div className="text-sm" style={{ color: C.ink }}>{ligne.loc.nom}</div></div>
            <div><Label>Bien</Label><div className="text-sm" style={{ color: C.ink }}>{ligne.bien.nom}</div>
              <div className="text-xs" style={{ color: C.mute }}>{ligne.bien.adresse || ""}</div></div>
          </div>
          <p className="text-xs mb-4" style={{ color: C.mute }}>
            Dépôt de garantie qui était détenu par {ligne.detenteur === "proprietaire" ? "le propriétaire" : "l'agence"}.
            {ligne.detenteur === "proprietaire" && ligne.accordProprio ? " Restitution effectuée avec l'accord du propriétaire" + (ligne.dateAccordProprio ? " du " + dateLongue(ligne.dateAccordProprio) : "") + "." : ""}
          </p>
          <table className="w-full text-sm mb-5"><tbody>
            <tr className="border-b" style={{ borderColor: C.line }}>
              <td className="py-2.5" style={{ color: C.mute }}>Dépôt de garantie versé</td>
              <td className="py-2.5 text-right tabular-nums font-semibold" style={{ color: C.ink }}>{fmt(ligne.montantVerse)}</td></tr>
            {ligne.retenues.map((r) => (
              <tr key={r.id} className="border-b" style={{ borderColor: C.line }}>
                <td className="py-2.5 pl-4" style={{ color: C.clay }}>Retenue : {r.motif}</td>
                <td className="py-2.5 text-right tabular-nums" style={{ color: C.clay }}>- {fmt(r.montant)}</td></tr>))}
            {totalRet > 0 && <tr className="border-b" style={{ borderColor: C.line }}>
              <td className="py-2.5" style={{ color: C.mute }}>Total des retenues</td>
              <td className="py-2.5 text-right tabular-nums" style={{ color: C.clay }}>- {fmt(totalRet)}</td></tr>}
          </tbody></table>
          <div className="flex items-center justify-between px-4 py-3.5 rounded gap-3 garder-couleur" style={{ background: C.greenSoft }}>
            <span className="font-bold text-sm" style={{ color: C.ink }}>Montant restitué au locataire</span>
            <span className="font-bold text-lg tabular-nums" style={{ color: C.green }}>{fcfa(ligne.restitue)}</span>
          </div>
          <p className="text-sm italic mt-2" style={{ color: C.mute }}>Soit {enLettres(ligne.restitue)} francs CFA.</p>
          {(ligne.quitusSodeci || ligne.quitusCie) && (
            <p className="text-xs mt-3" style={{ color: C.mute }}>
              Quitus vérifiés avant restitution : {[ligne.quitusSodeci && "SODECI (eau)", ligne.quitusCie && "CIE (électricité)"].filter(Boolean).join(" · ")}.
            </p>
          )}
          {ligne.note && <p className="text-sm mt-4" style={{ color: C.mute }}>{ligne.note}</p>}
          <div className="grid grid-cols-2 gap-8 mt-8">
            <div className="text-center"><div className="text-xs mb-10" style={{ color: C.mute }}>Le locataire</div>
              <div className="border-t pt-1.5 text-xs" style={{ borderColor: C.line, color: C.mute }}>{ligne.loc.nom}</div></div>
            <div className="text-center"><div className="text-xs mb-10" style={{ color: C.mute }}>Pour {P.societe || "l'agence"}</div>
              <div className="border-t pt-1.5 text-xs" style={{ borderColor: C.line, color: C.mute }}>Signature et cachet</div></div>
          </div>
          <PiedPage p={P} />
        </div></div>
      </div>
    );
  }

  return (
    <div>
      <Head title="Suivi des cautions" sub="Dépôts de garantie détenus, retenues et restitutions" />

      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-5">
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: C.green }}></div>
          <div className="p-4"><Label>Cautions détenues</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.green }}>{fcfa(totalDetenu)}</div>
            <div className="text-[10px] mt-1 leading-relaxed" style={{ color: C.mute }}>
              Agence : {fcfa(detenuAgence)}<br />Propriétaire : {fcfa(detenuProprio)}
            </div></div></div>
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: C.mute }}></div>
          <div className="p-4"><Label>Total restitué</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.ink }}>{fcfa(totalRestitue)}</div></div></div>
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: C.orange }}></div>
          <div className="p-4"><Label>À solder</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.orange }}>
              {lignes.filter((l) => l.statut === "a_solder" || (l.loc.actif === false && l.statut !== "restituee")).length}</div></div></div>
      </div>

      <div className="flex gap-2 mb-4 sans-impression">
        {[["actifs","En cours"],["solder","À solder"],["restituees","Restituées"],["tous","Tous"]].map(([k, lab]) => (
          <button key={k} onClick={() => setFiltre(k)} className="px-3 py-1.5 rounded text-sm font-medium"
            style={{ background: filtre === k ? C.ink : "transparent", color: filtre === k ? "#fff" : C.mute, border: "1px solid " + (filtre === k ? C.ink : C.line) }}>
            {lab}</button>))}
      </div>

      {visibles.length === 0 ? <Empty text="Aucune caution dans cette catégorie." />
        : <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr style={{ background: "#F5F4EE" }}>
                {["Locataire","Bien","Caution versée","Détenue par","Retenues","Statut","Action"].map((h) => (
                  <th key={h} className="text-left px-4 py-2.5 text-[10px] font-semibold uppercase tracking-[0.12em]" style={{ color: C.mute }}>{h}</th>))}
              </tr></thead>
              <tbody className="divide-y" style={{ borderColor: C.line }}>
                {visibles.map((l) => {
                  const totalRet = l.retenues.reduce((s, r) => s + r.montant, 0);
                  return (
                    <tr key={l.loc.id}>
                      <td className="px-4 py-3" style={{ color: C.ink }}>{l.loc.nom}</td>
                      <td className="px-4 py-3" style={{ color: C.mute }}>{l.bien.nom}</td>
                      <td className="px-4 py-3 tabular-nums" style={{ color: C.ink }}>{fcfa(l.montantVerse)}</td>
                      <td className="px-4 py-3">{l.detenteur === "proprietaire"
                        ? <Tag tone="neutral">Propriétaire</Tag> : <Tag tone="ok">Agence</Tag>}</td>
                      <td className="px-4 py-3 tabular-nums" style={{ color: totalRet ? C.clay : C.mute }}>{totalRet ? fcfa(totalRet) : "—"}</td>
                      <td className="px-4 py-3">{l.statut === "restituee"
                        ? <Tag tone="neutral">Restituée · {fcfa(l.restitue)}</Tag>
                        : <Tag tone={tone[l.statut]}>{lib[l.statut]}</Tag>}</td>
                      <td className="px-4 py-3"><div className="flex gap-3">
                        <button onClick={() => ouvrir(l)} className="text-xs font-semibold" style={{ color: C.green }}>
                          {l.statut === "restituee" ? "Voir" : "Gérer"}</button>
                        {l.statut === "restituee" && <button onClick={() => setVue(l.loc.id)} className="text-xs font-semibold" style={{ color: C.ink }}>Reçu</button>}
                      </div></td>
                    </tr>);
                })}
              </tbody>
            </table>
          </div></div>}

      {open && (
        <Modal title={"Caution — " + (f.locNom || "")} onClose={() => setOpen(false)} wide>
          <div className="space-y-3">
            <div className="px-3 py-2 rounded text-sm" style={{ background: "#F5F4EE", color: C.mute }}>
              {f.bienNom} · Caution théorique : {fcfa(f.montantTheorique)}
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Montant réellement versé (F CFA)">
                <Input type="number" value={f.montantVerse} onChange={(e) => setF({ ...f, montantVerse: e.target.value })} /></Field>
              <Field label="Date du versement">
                <Input type="date" value={f.dateVersement} onChange={(e) => setF({ ...f, dateVersement: e.target.value })} /></Field>
            </div>
            <Field label="Caution détenue par">
              <Select value={f.detenteur || "agence"} onChange={(e) => setF({ ...f, detenteur: e.target.value })}>
                <option value="agence">L'agence</option>
                <option value="proprietaire">Le propriétaire</option>
              </Select>
            </Field>

            {f.detenteur === "proprietaire" && (
              <div className="rounded border p-3" style={{ borderColor: C.gold, background: C.goldSoft }}>
                <div className="text-sm font-semibold mb-1" style={{ color: C.gold }}>Caution détenue par le propriétaire</div>
                <p className="text-xs mb-3" style={{ color: C.mute }}>
                  Le propriétaire détient les fonds. Transmettez-lui le décompte des retenues pour accord avant de restituer au locataire.
                </p>
                <div className="flex flex-col gap-2">
                  <Btn variant="ghost" onClick={transmettreProprio}>Transmettre le décompte au propriétaire (WhatsApp)</Btn>
                  <label className="flex items-center gap-2 text-sm" style={{ color: C.ink }}>
                    <input type="checkbox" checked={!!f.accordProprio}
                      onChange={(e) => setF({ ...f, accordProprio: e.target.checked, dateAccordProprio: e.target.checked ? aujourdhui() : "" })} />
                    Accord du propriétaire reçu{f.accordProprio && f.dateAccordProprio ? " le " + f.dateAccordProprio : ""}
                  </label>
                </div>
              </div>
            )}

            <div className="pt-2 border-t" style={{ borderColor: C.line }}>
              <Label>Retenues (dégâts, impayés, remise en état…)</Label>
              {(f.retenues || []).length > 0 && (
                <ul className="my-2 divide-y border rounded" style={{ borderColor: C.line }}>
                  {f.retenues.map((r) => (
                    <li key={r.id} className="flex items-center justify-between px-3 py-2 text-sm gap-3">
                      <span style={{ color: C.ink }}>{r.motif}</span>
                      <span className="flex items-center gap-3">
                        <span className="tabular-nums" style={{ color: C.clay }}>{fcfa(r.montant)}</span>
                        <button onClick={() => setF({ ...f, retenues: f.retenues.filter((x) => x.id !== r.id) })} style={{ color: C.clay }}>✕</button>
                      </span>
                    </li>))}
                </ul>)}
              <div className="flex gap-2 items-end flex-wrap mt-2">
                <div className="flex-1 min-w-[160px]"><Input value={nouvelleRetenue.motif} placeholder="Motif (ex : peinture chambre)"
                  onChange={(e) => setNouvelleRetenue({ ...nouvelleRetenue, motif: e.target.value })} /></div>
                <div className="w-32"><Input type="number" value={nouvelleRetenue.montant} placeholder="Montant"
                  onChange={(e) => setNouvelleRetenue({ ...nouvelleRetenue, montant: e.target.value })} /></div>
                <Btn variant="ghost" onClick={ajouterRetenue}>Ajouter</Btn>
              </div>
            </div>

            <div className="rounded p-3 garder-couleur" style={{ background: C.greenSoft }}>
              <div className="flex justify-between text-sm mb-1"><span style={{ color: C.mute }}>Versé</span>
                <span className="tabular-nums" style={{ color: C.ink }}>{fmt(Number(f.montantVerse || 0))}</span></div>
              <div className="flex justify-between text-sm mb-1"><span style={{ color: C.mute }}>Retenues</span>
                <span className="tabular-nums" style={{ color: C.clay }}>- {fmt(totalRetenues)}</span></div>
              <div className="flex justify-between font-bold pt-1 border-t" style={{ borderColor: "rgba(0,0,0,0.1)" }}>
                <span style={{ color: C.ink }}>À restituer</span>
                <span className="tabular-nums" style={{ color: C.green }}>{fcfa(aRestituer)}</span></div>
            </div>

            <div className="rounded border p-3" style={{ borderColor: C.line }}>
              <Label>Quitus à récupérer avant restitution</Label>
              <div className="flex flex-col gap-2 mt-2">
                <label className="flex items-center gap-2 text-sm" style={{ color: C.ink }}>
                  <input type="checkbox" checked={!!f.quitusSodeci} onChange={(e) => setF({ ...f, quitusSodeci: e.target.checked })} />
                  Quitus SODECI (eau) remis — pas d'impayé
                </label>
                <label className="flex items-center gap-2 text-sm" style={{ color: C.ink }}>
                  <input type="checkbox" checked={!!f.quitusCie} onChange={(e) => setF({ ...f, quitusCie: e.target.checked })} />
                  Quitus CIE (électricité) remis — pas d'impayé
                </label>
              </div>
              {(!f.quitusSodeci || !f.quitusCie) && (
                <p className="text-xs mt-2" style={{ color: C.clay }}>
                  Rappel : ne restituez la caution qu'après vérification des quitus, sinon un impayé d'eau ou d'électricité pourrait rester à votre charge.
                </p>
              )}
            </div>

            <Field label="Note (facultatif)">
              <Textarea value={f.note} onChange={(e) => setF({ ...f, note: e.target.value })}
                placeholder="Précisions sur l'état du bien, accord avec le locataire…" /></Field>

            {f.statut === "restituee" && <Field label="Date de restitution">
              <Input type="date" value={f.dateRestitution} onChange={(e) => setF({ ...f, dateRestitution: e.target.value })} /></Field>}

            <div className="flex gap-2 pt-2 flex-wrap">
              <Btn variant="ghost" onClick={() => enregistrer(f.statut === "restituee" ? "restituee" : (data.locataires.find((l) => l.id === f.locataireId) || {}).actif === false ? "a_solder" : "en_cours")}>Enregistrer</Btn>
              {f.statut !== "restituee" && <Btn variant="accent" onClick={() => enregistrer("restituee")}>Marquer restituée &amp; générer le reçu</Btn>}
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ========================= renouvellements & préavis ===================== */

function ajouterMois(iso, n) {
  if (!iso) return null;
  const d = new Date(iso);
  const j = d.getDate();
  d.setMonth(d.getMonth() + n);
  if (d.getDate() < j) d.setDate(0); // gestion fin de mois
  return d;
}
function joursEntre(d1, d2) { return Math.round((d2 - d1) / 86400000); }

function Renouvellements({ data, save }) {
  const [open, setOpen] = useState(false);
  const [vuePreavis, setVuePreavis] = useState(null);
  const [filtre, setFiltre] = useState("tous");
  const P = data.parametres || PARAMS_DEFAUT;
  const preavisList = data.preavis || [];
  const now = new Date(aujourdhui());

  const lignes = useMemo(() => {
    return data.locataires.filter((l) => l.actif !== false).map((loc) => {
      const bien = data.biens.find((b) => b.id === loc.bienId);
      if (!bien || !loc.entree) return { loc, bien, sansDate: true };
      const duree = Number(loc.dureeMois) || 12;
      const preavisM = Number(loc.preavisMois) || 3;
      const fin = ajouterMois(loc.entree, duree);
      const limitePreavis = ajouterMois(fin ? fin.toISOString().slice(0, 10) : null, -preavisM);
      const joursFin = fin ? joursEntre(now, fin) : null;
      const joursPreavis = limitePreavis ? joursEntre(now, limitePreavis) : null;
      const preavisDonne = preavisList.find((p) => p.locataireId === loc.id && !p.annule);
      let statut = "actif";
      if (preavisDonne) statut = "preavis_donne";
      else if (joursFin != null && joursFin < 0) statut = "expire";
      else if (joursFin != null && joursFin <= 30) statut = "echeance";
      else if (joursPreavis != null && joursPreavis <= 30 && joursPreavis >= 0) statut = "preavis_proche";
      return { loc, bien, duree, preavisM, fin, limitePreavis, joursFin, joursPreavis, preavisDonne, statut };
    });
  }, [data, preavisList]);

  const compte = {
    echeance: lignes.filter((l) => l.statut === "echeance" || l.statut === "expire").length,
    preavis: lignes.filter((l) => l.statut === "preavis_proche").length,
    donnes: lignes.filter((l) => l.statut === "preavis_donne").length,
  };

  const visibles = lignes.filter((l) => {
    if (filtre === "tous") return true;
    if (filtre === "alertes") return ["echeance","expire","preavis_proche"].includes(l.statut);
    if (filtre === "preavis") return l.statut === "preavis_donne";
    return true;
  }).sort((a, b) => {
    const ordre = { expire: 0, echeance: 1, preavis_proche: 2, preavis_donne: 3, actif: 4, undefined: 5 };
    return (ordre[a.statut] ?? 5) - (ordre[b.statut] ?? 5);
  });

  const tone = { actif: "ok", echeance: "bad", expire: "bad", preavis_proche: "warn", preavis_donne: "neutral" };
  const lib = { actif: "En cours", echeance: "Échéance proche", expire: "Expiré", preavis_proche: "Préavis à donner", preavis_donne: "Préavis reçu" };

  // Enregistrer un préavis de départ
  const [f, setF] = useState({});
  const ouvrirPreavis = (ligne) => {
    setF({ locataireId: ligne.loc.id, locNom: ligne.loc.nom, bienNom: ligne.bien.nom,
      dateReception: aujourdhui(), dateDepart: ligne.fin ? ligne.fin.toISOString().slice(0, 10) : "",
      motif: "", initiateur: "locataire" });
    setOpen(true);
  };
  const enregistrerPreavis = () => {
    const rec = { id: uid(), ...f, cree: new Date().toISOString() };
    const autres = preavisList.filter((p) => p.locataireId !== f.locataireId);
    save({ ...data, preavis: [...autres, rec] }, "a enregistré un préavis de départ — " + f.locNom);
    setOpen(false);
  };
  const annulerPreavis = (loc) => {
    save({ ...data, preavis: preavisList.map((p) => p.locataireId === loc.id ? { ...p, annule: true } : p) },
      "a annulé le préavis de " + loc.nom);
  };

  const renouveler = (ligne) => {
    // repousse la date d'entrée théorique d'une durée pour prolonger le bail
    const nouvelleEntree = ligne.fin ? ligne.fin.toISOString().slice(0, 10) : aujourdhui();
    save({ ...data, locataires: data.locataires.map((l) => l.id === ligne.loc.id ? { ...l, entree: nouvelleEntree } : l) },
      "a renouvelé le bail de " + ligne.loc.nom + " (échéance repoussée)");
  };

  // Accusé de préavis
  if (vuePreavis) {
    const p = preavisList.find((x) => x.id === vuePreavis);
    if (!p) { setVuePreavis(null); return null; }
    const loc = data.locataires.find((l) => l.id === p.locataireId);
    const bien = loc && data.biens.find((b) => b.id === loc.bienId);
    return (
      <div>
        <button onClick={() => setVuePreavis(null)} className="text-sm mb-4 sans-impression" style={{ color: C.mute }}>← Retour</button>
        <Head title="Accusé de réception de préavis" sub={(loc || {}).nom}
          action={<>
            <Btn variant="ghost" onClick={() => genererPdf(document.getElementById("doc-preavis"), "Preavis_" + ((loc || {}).nom || "").replace(/\s+/g, "_") + ".pdf")}>Télécharger PDF</Btn>
            <Btn variant="solid" onClick={() => window.print()}>Imprimer</Btn>
            <Btn variant="accent" onClick={async () => {
              await genererPdf(document.getElementById("doc-preavis"), "Preavis.pdf");
              ouvrirWhatsApp((loc || {}).tel, "Bonjour " + (loc || {}).nom + ",\n\nNous accusons réception de votre préavis de départ. Veuillez trouver le document ci-joint.\n\n" + (P.societe || "Season Immobilier"));
            }}>WhatsApp</Btn>
          </>} />
        <div className="zone-impression" id="doc-preavis" style={{ background: "#fff" }}><div className="p-2 sm:p-8">
          <EnTete p={P} droite={<div>
            <div className="text-[10px] uppercase tracking-[0.14em]" style={{ color: C.mute }}>Accusé de préavis</div>
            <div className="text-[10px] mt-1" style={{ color: C.mute }}>{dateLongue(p.dateReception)}</div></div>} />
          <h2 className="text-lg font-bold mb-5" style={{ color: C.ink }}>Accusé de réception d'un préavis de départ</h2>
          <p className="text-sm mb-4 leading-relaxed" style={{ color: C.ink }}>
            Nous, {P.societe || "l'agence"}, accusons réception du préavis de départ {p.initiateur === "locataire" ? "notifié par le locataire" : "notifié au locataire"} :
          </p>
          <table className="w-full text-sm mb-5"><tbody>
            <tr className="border-b" style={{ borderColor: C.line }}><td className="py-2.5 w-48" style={{ color: C.mute }}>Locataire</td><td className="py-2.5 font-semibold" style={{ color: C.ink }}>{(loc || {}).nom}</td></tr>
            <tr className="border-b" style={{ borderColor: C.line }}><td className="py-2.5" style={{ color: C.mute }}>Bien concerné</td><td className="py-2.5" style={{ color: C.ink }}>{(bien || {}).nom}{(bien || {}).adresse ? " — " + bien.adresse : ""}</td></tr>
            <tr className="border-b" style={{ borderColor: C.line }}><td className="py-2.5" style={{ color: C.mute }}>Date de réception du préavis</td><td className="py-2.5" style={{ color: C.ink }}>{dateLongue(p.dateReception)}</td></tr>
            <tr className="border-b" style={{ borderColor: C.line }}><td className="py-2.5" style={{ color: C.mute }}>Date de départ prévue</td><td className="py-2.5 font-semibold" style={{ color: C.ink }}>{dateLongue(p.dateDepart)}</td></tr>
          </tbody></table>
          {p.motif && <p className="text-sm mb-5" style={{ color: C.mute }}>Motif : {p.motif}</p>}
          <p className="text-sm mb-6 leading-relaxed" style={{ color: C.ink }}>
            Un état des lieux de sortie sera réalisé à la date de départ. Le dépôt de garantie sera restitué après déduction des éventuelles retenues, conformément au contrat de bail.
          </p>
          <div className="flex justify-end"><div className="text-center">
            <div className="text-xs mb-10" style={{ color: C.mute }}>Pour {P.societe || "l'agence"}</div>
            <div className="border-t pt-1.5 text-xs w-44" style={{ borderColor: C.line, color: C.mute }}>Signature et cachet</div></div></div>
          <PiedPage p={P} />
        </div></div>
      </div>
    );
  }

  return (
    <div>
      <Head title="Baux & préavis" sub="Échéances des baux, renouvellements et départs" />

      <div className="grid grid-cols-3 gap-3 mb-5">
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: C.clay }}></div>
          <div className="p-4"><Label>Échéances proches</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.clay }}>{compte.echeance}</div></div></div>
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: C.orange }}></div>
          <div className="p-4"><Label>Préavis à donner</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.orange }}>{compte.preavis}</div></div></div>
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: C.mute }}></div>
          <div className="p-4"><Label>Préavis reçus</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.ink }}>{compte.donnes}</div></div></div>
      </div>

      <div className="flex gap-2 mb-4 sans-impression">
        {[["tous","Tous les baux"],["alertes","Alertes"],["preavis","Préavis en cours"]].map(([k, lab]) => (
          <button key={k} onClick={() => setFiltre(k)} className="px-3 py-1.5 rounded text-sm font-medium"
            style={{ background: filtre === k ? C.ink : "transparent", color: filtre === k ? "#fff" : C.mute, border: "1px solid " + (filtre === k ? C.ink : C.line) }}>
            {lab}</button>))}
      </div>

      {visibles.length === 0 ? <Empty text="Aucun bail actif. Renseignez la date d'entrée et la durée dans les fiches locataires." />
        : <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr style={{ background: "#F5F4EE" }}>
                {["Locataire","Bien","Fin du bail","Préavis avant","Statut","Action"].map((h) => (
                  <th key={h} className="text-left px-4 py-2.5 text-[10px] font-semibold uppercase tracking-[0.12em]" style={{ color: C.mute }}>{h}</th>))}
              </tr></thead>
              <tbody className="divide-y" style={{ borderColor: C.line }}>
                {visibles.map((l) => (
                  <tr key={l.loc.id}>
                    <td className="px-4 py-3" style={{ color: C.ink }}>{l.loc.nom}</td>
                    <td className="px-4 py-3" style={{ color: C.mute }}>{(l.bien || {}).nom || "—"}</td>
                    <td className="px-4 py-3" style={{ color: C.ink }}>
                      {l.sansDate ? <span style={{ color: C.mute }}>Date manquante</span>
                        : <>{l.fin ? dateLongue(l.fin.toISOString().slice(0, 10)) : "—"}
                            {l.joursFin != null && <div className="text-xs" style={{ color: l.joursFin < 30 ? C.clay : C.mute }}>
                              {l.joursFin < 0 ? "expiré depuis " + Math.abs(l.joursFin) + " j" : "dans " + l.joursFin + " j"}</div>}</>}
                    </td>
                    <td className="px-4 py-3 text-xs" style={{ color: C.mute }}>
                      {l.limitePreavis ? dateLongue(l.limitePreavis.toISOString().slice(0, 10)) : "—"}</td>
                    <td className="px-4 py-3">{l.sansDate ? <Tag tone="neutral">—</Tag> : <Tag tone={tone[l.statut]}>{lib[l.statut]}</Tag>}</td>
                    <td className="px-4 py-3"><div className="flex gap-3 flex-wrap">
                      {!l.sansDate && l.statut !== "preavis_donne" && (
                        <button onClick={() => renouveler(l)} className="text-xs font-semibold" style={{ color: C.green }}>Renouveler</button>
                      )}
                      {l.statut !== "preavis_donne"
                        ? <button onClick={() => ouvrirPreavis(l)} className="text-xs font-semibold" style={{ color: C.orange }}>Saisir préavis</button>
                        : <>
                            <button onClick={() => setVuePreavis(l.preavisDonne.id)} className="text-xs font-semibold" style={{ color: C.ink }}>Accusé</button>
                            <button onClick={() => annulerPreavis(l.loc)} className="text-xs font-semibold" style={{ color: C.clay }}>Annuler préavis</button>
                          </>}
                    </div></td>
                  </tr>))}
              </tbody>
            </table>
          </div></div>}

      <p className="text-xs mt-3 sans-impression" style={{ color: C.mute }}>
        Les échéances se calculent à partir de la date d'entrée, de la durée et du préavis renseignés dans chaque fiche locataire. « Renouveler » repousse l'échéance d'une période.
      </p>

      {open && (
        <Modal title={"Préavis de départ — " + (f.locNom || "")} onClose={() => setOpen(false)}>
          <div className="space-y-3">
            <div className="px-3 py-2 rounded text-sm" style={{ background: "#F5F4EE", color: C.mute }}>{f.bienNom}</div>
            <Field label="Préavis notifié par">
              <Select value={f.initiateur} onChange={(e) => setF({ ...f, initiateur: e.target.value })}>
                <option value="locataire">Le locataire (il quitte les lieux)</option>
                <option value="bailleur">Le bailleur (congé donné au locataire)</option>
              </Select>
            </Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Date de réception du préavis"><Input type="date" value={f.dateReception} onChange={(e) => setF({ ...f, dateReception: e.target.value })} /></Field>
              <Field label="Date de départ prévue"><Input type="date" value={f.dateDepart} onChange={(e) => setF({ ...f, dateDepart: e.target.value })} /></Field>
            </div>
            <Field label="Motif (facultatif)"><Textarea value={f.motif} onChange={(e) => setF({ ...f, motif: e.target.value })} placeholder="Mutation, achat d'un bien, fin d'activité…" /></Field>
            <div className="flex gap-2 pt-2">
              <Btn variant="accent" onClick={enregistrerPreavis}>Enregistrer le préavis</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ============================ prestataires =============================== */

const METIERS = ["Plombier","Électricien","Maçon","Peintre","Menuisier","Carreleur","Climatisation / Froid",
  "Serrurier","Vitrier","Étanchéité","Jardinier / Espaces verts","Nettoyage","Piscine","Ébéniste",
  "Antenniste","Domotique / Sécurité","Déménageur","Géomètre","Notaire","Huissier","Autre"];

function Prestataires({ data, save }) {
  const [open, setOpen] = useState(false);
  const [edit, setEdit] = useState(null);
  const [q, setQ] = useState("");
  const [filtreMetier, setFiltreMetier] = useState("");
  const liste = data.prestataires || [];

  const blank = { nom: "", metier: METIERS[0], tel: "", tel2: "", email: "", zone: "", adresse: "",
    tarif: "", note: 0, actif: true, remarques: "" };
  const [f, setF] = useState(blank);

  const start = (p) => { setEdit(p || null); setF(p ? { ...blank, ...p } : blank); setOpen(true); };
  const submit = () => {
    if (!f.nom.trim()) return;
    save({ ...data, prestataires: edit ? liste.map((x) => x.id === edit.id ? { ...f, id: edit.id } : x)
      : [...liste, { ...f, id: uid() }] }, (edit ? "a modifié le prestataire " : "a ajouté le prestataire ") + f.nom);
    setOpen(false);
  };
  const supprimer = (p) => save({ ...data, prestataires: liste.filter((x) => x.id !== p.id) }, "a supprimé le prestataire " + p.nom);

  const metiersPresents = [...new Set(liste.map((p) => p.metier))].sort();
  const visibles = liste.filter((p) =>
    (!q || p.nom.toLowerCase().includes(q.toLowerCase()) || (p.metier || "").toLowerCase().includes(q.toLowerCase()) || (p.zone || "").toLowerCase().includes(q.toLowerCase())) &&
    (!filtreMetier || p.metier === filtreMetier))
    .sort((a, b) => (a.metier || "").localeCompare(b.metier || "") || (a.nom || "").localeCompare(b.nom || ""));

  const Etoiles = ({ note, onSet }) => (
    <div className="flex gap-0.5">
      {[1, 2, 3, 4, 5].map((n) => (
        <button key={n} onClick={onSet ? () => onSet(n) : undefined} disabled={!onSet}
          style={{ color: n <= note ? C.gold : C.line, cursor: onSet ? "pointer" : "default", fontSize: 16, lineHeight: 1 }}>★</button>))}
    </div>
  );

  return (
    <div>
      <Head title="Artisans & prestataires" sub={liste.length + " contact(s) dans le carnet"}
        action={<Btn variant="accent" onClick={() => start(null)}>+ Ajouter</Btn>} />

      {liste.length === 0 ? <Empty text="Aucun prestataire enregistré. Constituez votre carnet d'artisans de confiance : plombier, électricien, maçon…"
          action={<Btn variant="accent" onClick={() => start(null)}>+ Ajouter un prestataire</Btn>} />
        : <>
            <div className="flex flex-wrap gap-2 mb-4 sans-impression">
              <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Rechercher (nom, métier, zone)"
                className="flex-1 min-w-[200px] px-3 py-2 text-sm rounded border bg-white outline-none" style={{ borderColor: C.line, color: C.ink }} />
              <Select value={filtreMetier} onChange={(e) => setFiltreMetier(e.target.value)}>
                <option value="">Tous les métiers</option>
                {metiersPresents.map((m) => <option key={m} value={m}>{m}</option>)}
              </Select>
            </div>

            <div className="grid md:grid-cols-2 gap-3">
              {visibles.map((p) => (
                <div key={p.id} className={card} style={{ borderColor: C.line, opacity: p.actif === false ? 0.55 : 1 }}>
                  <div className="p-4">
                    <div className="flex justify-between items-start gap-3 mb-2">
                      <div>
                        <h3 className="font-semibold text-sm" style={{ color: C.ink }}>{p.nom}</h3>
                        <div className="flex items-center gap-2 mt-0.5">
                          <Tag tone="neutral">{p.metier}</Tag>
                          {p.note > 0 && <Etoiles note={p.note} />}
                        </div>
                      </div>
                      {p.actif === false && <Tag tone="bad">Inactif</Tag>}
                    </div>
                    <div className="space-y-1 text-sm mb-3">
                      {p.tel && <Row k="Téléphone" v={p.tel} />}
                      {p.zone && <Row k="Zone" v={p.zone} />}
                      {p.tarif && <Row k="Tarif indicatif" v={p.tarif} />}
                    </div>
                    {p.remarques && <p className="text-xs mb-3 p-2 rounded" style={{ background: "#F5F4EE", color: C.mute }}>{p.remarques}</p>}
                    <div className="flex gap-2 flex-wrap">
                      {p.tel && <>
                        <a href={"tel:" + p.tel.replace(/\s/g, "")} className="inline-flex items-center px-3 py-2 rounded text-sm font-medium" style={{ background: C.ink, color: "#fff" }}>Appeler</a>
                        <button onClick={() => ouvrirWhatsApp(p.tel, "Bonjour " + p.nom + ",")} className="inline-flex items-center px-3 py-2 rounded text-sm font-medium" style={{ background: C.green, color: "#fff" }}>WhatsApp</button>
                      </>}
                      <Btn variant="ghost" onClick={() => start(p)}>Modifier</Btn>
                      <Btn variant="danger" onClick={() => supprimer(p)}>Supprimer</Btn>
                    </div>
                  </div>
                </div>))}
            </div>
          </>}

      {open && (
        <Modal title={edit ? "Modifier le prestataire" : "Nouveau prestataire"} onClose={() => setOpen(false)} wide>
          <div className="space-y-3">
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Nom / Entreprise"><Input value={f.nom} onChange={(e) => setF({ ...f, nom: e.target.value })} placeholder="Koffi Plomberie" /></Field>
              <Field label="Métier"><Select value={f.metier} onChange={(e) => setF({ ...f, metier: e.target.value })}>
                {METIERS.map((m) => <option key={m} value={m}>{m}</option>)}</Select></Field>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Téléphone"><Input value={f.tel} onChange={(e) => setF({ ...f, tel: e.target.value })} /></Field>
              <Field label="Téléphone 2"><Input value={f.tel2} onChange={(e) => setF({ ...f, tel2: e.target.value })} /></Field>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Email"><Input value={f.email} onChange={(e) => setF({ ...f, email: e.target.value })} /></Field>
              <Field label="Zone d'intervention"><Input value={f.zone} onChange={(e) => setF({ ...f, zone: e.target.value })} placeholder="Cocody, Riviera, Angré" /></Field>
            </div>
            <Field label="Adresse / Atelier"><Input value={f.adresse} onChange={(e) => setF({ ...f, adresse: e.target.value })} /></Field>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Tarif indicatif"><Input value={f.tarif} onChange={(e) => setF({ ...f, tarif: e.target.value })} placeholder="15 000 F/intervention" /></Field>
              <Field label="Statut"><Select value={f.actif !== false ? "1" : "0"} onChange={(e) => setF({ ...f, actif: e.target.value === "1" })}>
                <option value="1">Actif</option><option value="0">Inactif</option></Select></Field>
            </div>
            <Field label="Évaluation">
              <Etoiles note={f.note} onSet={(n) => setF({ ...f, note: n === f.note ? 0 : n })} />
            </Field>
            <Field label="Remarques"><Textarea value={f.remarques} onChange={(e) => setF({ ...f, remarques: e.target.value })}
              placeholder="Ponctuel, travail soigné, à rappeler pour les urgences…" /></Field>
            <div className="flex gap-2 pt-2">
              <Btn variant="accent" onClick={submit}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ============================== travaux ================================== */




function Travaux({ data, save, moi }) {
  const [open, setOpen] = useState(false);
  const [edit, setEdit] = useState(null);
  const [filtre, setFiltre] = useState("actifs");
  const liste = data.tickets || [];
  const P = data.parametres || PARAMS_DEFAUT;
  const emailGerante = (P.gerante || "aude.nioble@season-immobilier.com").trim().toLowerCase();
  const suisGerante = String(moi || "").trim().toLowerCase() === emailGerante;

  const decaisser = (t) => {
    const montant = window.prompt("Montant réellement décaissé pour « " + t.titre + " » (F CFA) :", String(t.cout || ""));
    if (montant === null) return;
    const d = window.prompt("Date du décaissement :", aujourdhui());
    if (d === null) return;
    save({ ...data, tickets: liste.map((x) => x.id === t.id
      ? { ...x, decaisse: true, montantDecaisse: Number(montant) || Number(t.cout) || 0, dateDecaisse: d || aujourdhui(), decaissePar: moi } : x) },
      "a validé le décaissement de " + fcfa(Number(montant) || t.cout || 0) + " pour « " + t.titre + " »");
  };
  const annulerDecaissement = (t) => {
    save({ ...data, tickets: liste.map((x) => x.id === t.id ? { ...x, decaisse: false, dateDecaisse: "", decaissePar: null } : x) },
      "a annulé le décaissement de « " + t.titre + " »");
  };

  const blank = { titre: "", bienId: "", priorite: "normale", statut: "a_faire",
    description: "", intervenant: "", cout: "", echeance: aujourdhui() };
  const [f, setF] = useState(blank);

  const start = (t) => { setEdit(t || null); setF(t ? { ...t } : { ...blank, bienId: (data.biens[0] || {}).id || "" }); setOpen(true); };

  const submit = () => {
    if (!f.titre.trim()) return;
    const rec = { ...f, cout: Number(f.cout) || 0 };
    const b = data.biens.find((x) => x.id === f.bienId);
    save({ ...data, tickets: edit ? liste.map((t) => t.id === edit.id ? { ...rec, id: edit.id } : t)
      : [{ ...rec, id: uid(), cree: new Date().toISOString() }, ...liste] },
      (edit ? "a modifié le ticket travaux " : "a créé un ticket travaux ") + rec.titre + ((b && b.nom) ? " — " + b.nom : ""));
    setOpen(false);
  };

  const avancer = (t) => {
    const suite = { a_faire: "en_cours", en_cours: "termine", termine: "a_faire" };
    const b = data.biens.find((x) => x.id === t.bienId);
    save({ ...data, tickets: liste.map((x) => x.id === t.id ? { ...x, statut: suite[x.statut] } : x) },
      "a fait passer le ticket « " + t.titre + " »" + ((b && b.nom) ? " (" + b.nom + ")" : "") + " en " +
      ({ a_faire: "à faire", en_cours: "en cours", termine: "terminé" }[suite[t.statut]]));
  };

  const supprimer = (t) => save({ ...data, tickets: liste.filter((x) => x.id !== t.id) }, "a supprimé le ticket « " + t.titre + " »");

  const tonePrio = { basse: "neutral", normale: "warn", urgente: "bad" };
  const libPrio = { basse: "Basse", normale: "Normale", urgente: "Urgente" };
  const toneStat = { a_faire: "bad", en_cours: "warn", termine: "ok" };
  const libStat = { a_faire: "À faire", en_cours: "En cours", termine: "Terminé" };

  const visibles = liste.filter((t) => filtre === "tous" ? true : filtre === "termines" ? t.statut === "termine" : t.statut !== "termine")
    .sort((a, b) => {
      const p = { urgente: 0, normale: 1, basse: 2 };
      if (a.statut === "termine" && b.statut !== "termine") return 1;
      if (b.statut === "termine" && a.statut !== "termine") return -1;
      if (p[a.priorite] !== p[b.priorite]) return p[a.priorite] - p[b.priorite];
      return (a.echeance || "").localeCompare(b.echeance || "");
    });

  const nbActifs = liste.filter((t) => t.statut !== "termine").length;
  const nbUrgents = liste.filter((t) => t.statut !== "termine" && t.priorite === "urgente").length;

  return (
    <div>
      <Head title="Travaux & rappels" sub={nbActifs + " en cours" + (nbUrgents ? " · " + nbUrgents + " urgent(s)" : "")}
        action={<Btn variant="accent" onClick={() => start(null)}>+ Nouveau ticket</Btn>} />

      <div className="flex gap-2 mb-4 sans-impression">
        {[["actifs", "En cours"], ["termines", "Terminés"], ["tous", "Tous"]].map(([k, lab]) => (
          <button key={k} onClick={() => setFiltre(k)}
            className="px-3 py-1.5 rounded text-sm font-medium"
            style={{ background: filtre === k ? C.ink : "transparent", color: filtre === k ? "#fff" : C.mute,
              border: "1px solid " + (filtre === k ? C.ink : C.line) }}>
            {lab}
          </button>))}
      </div>

      {visibles.length === 0
        ? <Empty text="Aucun ticket. Créez un rappel pour un travail à réaliser chez un client : plomberie, peinture, entretien…"
            action={<Btn variant="accent" onClick={() => start(null)}>+ Nouveau ticket</Btn>} />
        : <div className="grid md:grid-cols-2 gap-3">
            {visibles.map((t) => {
              const b = data.biens.find((x) => x.id === t.bienId);
              const retard = t.statut !== "termine" && t.echeance && t.echeance < aujourdhui();
              return (
                <div key={t.id} className={card} style={{ borderColor: retard ? C.clay : C.line,
                  borderLeft: "4px solid " + (t.statut === "termine" ? C.green : t.priorite === "urgente" ? C.clay : C.orange) }}>
                  <div className="p-4">
                    <div className="flex justify-between items-start gap-3 mb-2">
                      <h3 className="font-semibold text-sm" style={{ color: C.ink }}>{t.titre}</h3>
                      <Tag tone={toneStat[t.statut]}>{libStat[t.statut]}</Tag>
                    </div>
                    <div className="flex gap-2 mb-2">
                      <Tag tone={tonePrio[t.priorite]}>{libPrio[t.priorite]}</Tag>
                      {retard && <Tag tone="bad">En retard</Tag>}
                    </div>
                    <div className="space-y-1.5 text-sm mb-3">
                      {b && <Row k="Bien" v={b.nom} />}
                      {t.intervenant && <Row k="Intervenant" v={t.intervenant} />}
                      {t.echeance && <Row k="Échéance" v={t.echeance} />}
                      {t.cout > 0 && <Row k="Coût estimé" v={fcfa(t.cout)} />}
                      {t.decaisse && <Row k="Décaissé" v={fcfa(t.montantDecaisse || t.cout) + (t.dateDecaisse ? " le " + t.dateDecaisse : "")} />}
                    </div>
                    {t.description && <p className="text-xs mb-3 p-2 rounded" style={{ background: "#F5F4EE", color: C.mute }}>{t.description}</p>}
                    {t.statut === "termine" && (
                      <div className="mb-3">
                        {t.decaisse
                          ? <Tag tone="ok">Décaissement validé</Tag>
                          : <Tag tone="warn">{suisGerante ? "Décaissement à valider" : "En attente de validation du décaissement"}</Tag>}
                      </div>
                    )}
                    <div className="flex gap-2 flex-wrap">
                      <Btn variant={t.statut === "termine" ? "ghost" : "accent"} onClick={() => avancer(t)}>
                        {t.statut === "a_faire" ? "Démarrer" : t.statut === "en_cours" ? "Marquer terminé" : "Rouvrir"}
                      </Btn>
                      {t.statut === "termine" && suisGerante && !t.decaisse && (
                        <Btn variant="accent" onClick={() => decaisser(t)}>Valider le décaissement</Btn>
                      )}
                      {t.statut === "termine" && suisGerante && t.decaisse && (
                        <Btn variant="ghost" onClick={() => annulerDecaissement(t)}>Annuler le décaissement</Btn>
                      )}
                      <Btn variant="ghost" onClick={() => start(t)}>Modifier</Btn>
                      <Btn variant="danger" onClick={() => supprimer(t)}>Supprimer</Btn>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>}

      {open && (
        <Modal title={edit ? "Modifier le ticket" : "Nouveau ticket de travaux"} onClose={() => setOpen(false)}>
          <div className="space-y-3">
            <Field label="Intitulé du travail">
              <Input value={f.titre} onChange={(e) => setF({ ...f, titre: e.target.value })} placeholder="Réparer fuite robinet cuisine" />
            </Field>
            <Field label="Bien concerné">
              <Select value={f.bienId} onChange={(e) => setF({ ...f, bienId: e.target.value })}>
                <option value="">Aucun / général</option>
                {data.biens.map((b) => <option key={b.id} value={b.id}>{b.nom}</option>)}
              </Select>
            </Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Priorité">
                <Select value={f.priorite} onChange={(e) => setF({ ...f, priorite: e.target.value })}>
                  <option value="basse">Basse</option><option value="normale">Normale</option><option value="urgente">Urgente</option>
                </Select>
              </Field>
              <Field label="Statut">
                <Select value={f.statut} onChange={(e) => setF({ ...f, statut: e.target.value })}>
                  <option value="a_faire">À faire</option><option value="en_cours">En cours</option><option value="termine">Terminé</option>
                </Select>
              </Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Intervenant / artisan">
                <Input value={f.intervenant} onChange={(e) => setF({ ...f, intervenant: e.target.value })} placeholder="Plombier Koffi" />
              </Field>
              <Field label="Date prévue">
                <Input type="date" value={f.echeance} onChange={(e) => setF({ ...f, echeance: e.target.value })} />
              </Field>
            </div>
            <Field label="Coût estimé (F CFA)">
              <Input type="number" value={f.cout} onChange={(e) => setF({ ...f, cout: e.target.value })} />
            </Field>
            <Field label="Description / notes">
              <Textarea value={f.description} onChange={(e) => setF({ ...f, description: e.target.value })}
                placeholder="Détails de l'intervention, pièces à prévoir…" />
            </Field>
            <div className="flex gap-2 pt-2">
              <Btn variant="accent" onClick={submit}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================================ factures ================================ */


function Factures({ data, save }) {
  const [open, setOpen] = useState(false);
  const blank = { bienId: "", type: "SODECI", libelle: "", montant: "", echeance: "", statut: "encours" };
  const [f, setF] = useState(blank);

  const submit = () => {
    if (!f.bienId || !f.montant) return;
    const b = data.biens.find((x) => x.id === f.bienId);
    save({ ...data, factures: [...data.factures, { ...f, montant: Number(f.montant), id: uid() }] },
      "a ajouté une charge " + f.type + " de " + fcfa(f.montant) + " — " + ((b || {}).nom || ""));
    setOpen(false);
  };

  const toggle = (x) => save({ ...data, factures: data.factures.map((y) => y.id === x.id
    ? { ...y, statut: y.statut === "payee" ? "encours" : "payee" } : y) },
    (x.statut === "payee" ? "a rouvert" : "a réglé") + " la charge " + (x.libelle || x.type));

  const total = data.factures.filter((x) => x.statut !== "payee").reduce((s, x) => s + x.montant, 0);

  return (
    <div>
      <Head title="Charges & factures" sub={fcfa(total) + " en attente de règlement"}
        action={<Btn variant="accent" onClick={() => { setF({ ...blank, bienId: (data.biens[0] || {}).id || "" }); setOpen(true); }}
          disabled={data.biens.length === 0}>+ Ajouter</Btn>} />

      {data.factures.length === 0 ? <Empty text="Aucune facture enregistrée." />
        : <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr style={{ background: "#F5F4EE" }}>
                {["Désignation","Bien","Type","Échéance","Montant","Statut",""].map((h) => (
                  <th key={h} className="text-left px-4 py-2.5 text-[10px] font-semibold uppercase tracking-[0.12em]" style={{ color: C.mute }}>{h}</th>))}
              </tr></thead>
              <tbody className="divide-y" style={{ borderColor: C.line }}>
                {data.factures.map((x) => {
                  const b = data.biens.find((y) => y.id === x.bienId);
                  const retard = x.statut !== "payee" && x.echeance && x.echeance < aujourdhui();
                  return (
                    <tr key={x.id}>
                      <td className="px-4 py-3" style={{ color: C.ink }}>{x.libelle || x.type}</td>
                      <td className="px-4 py-3" style={{ color: C.mute }}>{(b || {}).nom || "—"}</td>
                      <td className="px-4 py-3" style={{ color: C.mute }}>{x.type}</td>
                      <td className="px-4 py-3" style={{ color: retard ? C.clay : C.mute }}>{x.echeance || "—"}</td>
                      <td className="px-4 py-3 tabular-nums font-semibold" style={{ color: C.ink }}>{fcfa(x.montant)}</td>
                      <td className="px-4 py-3"><Tag tone={x.statut === "payee" ? "ok" : retard ? "bad" : "warn"}>
                        {x.statut === "payee" ? "Payée" : retard ? "En retard" : "En cours"}</Tag></td>
                      <td className="px-4 py-3"><div className="flex gap-3">
                        <button onClick={() => toggle(x)} className="text-xs font-semibold whitespace-nowrap" style={{ color: C.green }}>
                          {x.statut === "payee" ? "Rouvrir" : "Marquer payée"}</button>
                        <button onClick={() => save({ ...data, factures: data.factures.filter((y) => y.id !== x.id) },
                          "a supprimé la charge " + (x.libelle || x.type))}
                          className="text-xs font-semibold" style={{ color: C.clay }}>Supprimer</button>
                      </div></td>
                    </tr>);
                })}
              </tbody>
            </table>
          </div></div>}

      {open && (
        <Modal title="Nouvelle charge" onClose={() => setOpen(false)}>
          <div className="space-y-3">
            <Field label="Bien concerné"><Select value={f.bienId} onChange={(e) => setF({ ...f, bienId: e.target.value })}>
              <option value="">Sélectionner</option>
              {data.biens.map((b) => <option key={b.id} value={b.id}>{b.nom}</option>)}</Select></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Type"><Select value={f.type} onChange={(e) => setF({ ...f, type: e.target.value })}>
                <option>SODECI</option><option>CIE</option><option>Travaux</option>
                <option>Entretien</option><option>Impôts</option><option>Autre</option></Select></Field>
              <Field label="Montant (F CFA)"><Input type="number" value={f.montant} onChange={(e) => setF({ ...f, montant: e.target.value })} /></Field>
            </div>
            <Field label="Libellé"><Input value={f.libelle} onChange={(e) => setF({ ...f, libelle: e.target.value })} /></Field>
            <Field label="Date limite de règlement"><Input type="date" value={f.echeance} onChange={(e) => setF({ ...f, echeance: e.target.value })} /></Field>
            <div className="flex gap-2 pt-2">
              <Btn variant="accent" onClick={submit}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================================= agents ================================= */

function Agents({ data, save }) {
  const [open, setOpen] = useState(false);
  const [edit, setEdit] = useState(null);
  const blank = { nom: "", tel: "", email: "" };
  const [f, setF] = useState(blank);

  const start = (a) => { setEdit(a || null); setF(a ? { ...a } : blank); setOpen(true); };
  const submit = () => {
    if (!f.nom.trim()) return;
    const rec = { ...f };
    save({ ...data, agents: edit ? data.agents.map((a) => a.id === edit.id ? { ...rec, id: edit.id } : a)
      : [...data.agents, { ...rec, id: uid() }] }, (edit ? "a modifié l'agent " : "a ajouté l'agent ") + rec.nom);
    setOpen(false);
  };

  // Pour chaque agent : liste des biens dont il est responsable
  const infos = data.agents.map((a) => {
    const biens = data.biens.filter((b) => b.agentId === a.id);
    return { ...a, biens, nbBiens: biens.length };
  });

  return (
    <div>
      <Head title="Agents" sub="Les commerciaux responsables de chaque bien"
        action={<Btn variant="accent" onClick={() => start(null)}>+ Ajouter</Btn>} />

      {data.agents.length === 0 ? <Empty text="Aucun agent enregistré. Ajoutez vos commerciaux pour les rattacher aux biens." action={<Btn variant="accent" onClick={() => start(null)}>+ Ajouter un agent</Btn>} />
        : <div className="grid md:grid-cols-2 gap-3">
            {infos.map((a) => (
              <div key={a.id} className={card} style={{ borderColor: C.line }}><div className="p-4">
                <div className="flex justify-between items-start gap-3 mb-3">
                  <div><h3 className="font-semibold text-sm" style={{ color: C.ink }}>{a.nom}</h3>
                    <p className="text-xs" style={{ color: C.mute }}>{a.tel || "—"}{a.email ? " · " + a.email : ""}</p></div>
                  <Tag tone="neutral">{a.nbBiens} bien(s)</Tag>
                </div>
                {a.biens.length > 0 && (
                  <div className="mb-3 text-xs" style={{ color: C.mute }}>
                    Biens gérés : {a.biens.map((b) => b.nom).join(", ")}
                  </div>
                )}
                <div className="flex gap-2 flex-wrap">
                  {a.tel && <Btn variant="ghost" onClick={() => ouvrirWhatsApp(a.tel, "Bonjour " + a.nom)}>WhatsApp</Btn>}
                  <Btn variant="ghost" onClick={() => start(a)}>Modifier</Btn>
                  <Btn variant="danger" onClick={() => save({ ...data,
                    agents: data.agents.filter((x) => x.id !== a.id),
                    biens: data.biens.map((b) => b.agentId === a.id ? { ...b, agentId: "" } : b) },
                    "a supprimé l'agent " + a.nom)}>Supprimer</Btn>
                </div>
              </div></div>))}
          </div>}

      {open && (
        <Modal title={edit ? "Modifier l'agent" : "Nouvel agent"} onClose={() => setOpen(false)}>
          <div className="space-y-3">
            <Field label="Nom complet"><Input value={f.nom} onChange={(e) => setF({ ...f, nom: e.target.value })} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Téléphone"><Input value={f.tel} onChange={(e) => setF({ ...f, tel: e.target.value })} /></Field>
              <Field label="Email"><Input value={f.email} onChange={(e) => setF({ ...f, email: e.target.value })} /></Field>
            </div>
            <p className="text-xs" style={{ color: C.mute }}>
              L'agent se rattache à un bien via le champ « Agent en charge » dans la fiche du bien. Ses commissions se gèrent dans l'onglet Commissions.
            </p>
            <div className="flex gap-2 pt-2">
              <Btn variant="accent" onClick={submit}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ======================= cagnotte des propriétaires ====================== */

function CagnotteProprietaires({ data }) {
  const anneeActuelle = new Date().getFullYear();
  const [annee, setAnnee] = useState(anneeActuelle);
  const [detail, setDetail] = useState(null);
  const P = data.parametres || PARAMS_DEFAUT;
  const MOIS_COURTS = ["Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"];

  // Liste unifiée des propriétaires : fiches + noms libres sur les biens
  const fiches = data.proprietaires || [];
  const nomsLibres = [...new Set(data.biens.map((b) => b.proprietaire).filter(Boolean))]
    .filter((nom) => !fiches.some((f) => f.nom === nom));
  const proprios = [...fiches.map((f) => ({ id: f.id, nom: f.nom, fiche: f })),
    ...nomsLibres.map((nom) => ({ id: "libre:" + nom, nom, fiche: null }))];

  const moisAnnee = Array.from({ length: 12 }, (_, i) => annee + "-" + String(i + 1).padStart(2, "0"));

  const calcProprio = (proprio) => {
    const biens = data.biens.filter((b) => (proprio.fiche && b.proprietaireId === proprio.fiche.id) || b.proprietaire === proprio.nom);
    const ids = new Set(biens.map((b) => b.id));
    // Par mois : loyers validés, commission, charges payées + travaux terminés
    const parMois = moisAnnee.map((m) => {
      const ps = data.paiements.filter((p) => p.valide && ids.has(p.bienId) && p.mois === m);
      const brut = ps.reduce((s, p) => s + Number(p.montant || 0), 0);
      const com = ps.reduce((s, p) => { const b = biens.find((x) => x.id === p.bienId);
        return s + commissionBien(b, p.montant); }, 0);
      // charges payées rattachées à un bien du propriétaire, datées de ce mois (échéance ou date)
      const charges = (data.factures || []).filter((fc) => fc.statut === "payee" && ids.has(fc.bienId) &&
        ((fc.echeance || fc.date || "").slice(0, 7) === m)).reduce((s, fc) => s + Number(fc.montant || 0), 0);
      // travaux DÉCAISSÉS et validés par la gérante, rattachés à un bien du propriétaire, datés de ce mois
      const travaux = (data.tickets || []).filter((t) => t.decaisse && ids.has(t.bienId) &&
        (((t.dateDecaisse || t.echeance) || "").slice(0, 7) === m)).reduce((s, t) => s + Number(t.montantDecaisse || t.cout || 0), 0);
      const deductions = charges + travaux;
      const net = brut - com - deductions;
      return { mois: m, brut, com, charges, travaux, deductions, net };
    });
    const tot = parMois.reduce((a, x) => ({
      brut: a.brut + x.brut, com: a.com + x.com, charges: a.charges + x.charges,
      travaux: a.travaux + x.travaux, deductions: a.deductions + x.deductions, net: a.net + x.net,
    }), { brut: 0, com: 0, charges: 0, travaux: 0, deductions: 0, net: 0 });
    return { biens, parMois, tot };
  };

  const lignes = useMemo(() => proprios.map((pr) => ({ pr, ...calcProprio(pr) }))
    .filter((l) => l.tot.brut > 0 || l.biens.length > 0)
    .sort((a, b) => b.tot.net - a.tot.net), [data, annee]);

  const totalGeneral = lignes.reduce((a, l) => ({
    brut: a.brut + l.tot.brut, com: a.com + l.tot.com, deductions: a.deductions + l.tot.deductions, net: a.net + l.tot.net,
  }), { brut: 0, com: 0, deductions: 0, net: 0 });

  // Vue détaillée d'un propriétaire
  if (detail) {
    const l = lignes.find((x) => x.pr.id === detail);
    if (!l) { setDetail(null); return null; }
    return (
      <div>
        <button onClick={() => setDetail(null)} className="text-sm mb-4 sans-impression" style={{ color: C.mute }}>← Retour aux reversements</button>
        <Head title={l.pr.nom} sub={"Détail des perceptions " + annee} />

        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
          <StatFin label="Loyers encaissés" value={fcfa(l.tot.brut)} tone="ink" sub="validés" />
          <StatFin label="Commission agence" value={fcfa(l.tot.com)} tone="clay" sub="déduite" />
          <StatFin label="Travaux & charges" value={fcfa(l.tot.deductions)} tone="clay" sub="déduits" />
          <StatFin label="Net perçu" value={fcfa(l.tot.net)} tone="green" sub="dans l'année" />
        </div>

        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr style={{ background: "#F5F4EE" }}>
              {["Mois","Loyers perçus","Commission","Travaux & charges","Net dû"].map((h) => (
                <th key={h} className="text-left px-4 py-2.5 text-[10px] font-semibold uppercase tracking-[0.12em]" style={{ color: C.mute }}>{h}</th>))}
            </tr></thead>
            <tbody className="divide-y" style={{ borderColor: C.line }}>
              {l.parMois.map((m, i) => (
                <tr key={i} style={{ opacity: m.brut || m.deductions ? 1 : 0.5 }}>
                  <td className="px-4 py-2.5 capitalize" style={{ color: C.ink }}>{moisLabel(m.mois)}</td>
                  <td className="px-4 py-2.5 tabular-nums" style={{ color: C.ink }}>{m.brut ? fmt(m.brut) : "—"}</td>
                  <td className="px-4 py-2.5 tabular-nums" style={{ color: C.mute }}>{m.com ? "- " + fmt(m.com) : "—"}</td>
                  <td className="px-4 py-2.5 tabular-nums" style={{ color: m.deductions ? C.clay : C.mute }}>{m.deductions ? "- " + fmt(m.deductions) : "—"}</td>
                  <td className="px-4 py-2.5 tabular-nums font-semibold" style={{ color: m.net >= 0 ? C.green : C.clay }}>{m.brut || m.deductions ? fmt(m.net) : "—"}</td>
                </tr>))}
              <tr className="garder-couleur" style={{ background: "#F5F4EE" }}>
                <td className="px-4 py-3 font-bold" style={{ color: C.ink }}>Total {annee}</td>
                <td className="px-4 py-3 tabular-nums font-bold" style={{ color: C.ink }}>{fmt(l.tot.brut)}</td>
                <td className="px-4 py-3 tabular-nums font-bold" style={{ color: C.clay }}>- {fmt(l.tot.com)}</td>
                <td className="px-4 py-3 tabular-nums font-bold" style={{ color: C.clay }}>- {fmt(l.tot.deductions)}</td>
                <td className="px-4 py-3 tabular-nums font-bold" style={{ color: C.green }}>{fmt(l.tot.net)}</td>
              </tr>
            </tbody>
          </table>
        </div></div>

        <p className="text-xs mt-3" style={{ color: C.mute }}>
          Biens gérés pour ce propriétaire : {l.biens.map((b) => b.nom).join(", ") || "—"}.
        </p>
      </div>
    );
  }

  return (
    <div>
      <Head title="Reversements propriétaires" sub="Ce que perçoit chaque propriétaire, par mois et au total"
        action={
          <div className="flex items-center gap-2">
            <button onClick={() => setAnnee(annee - 1)} className="px-2.5 py-1.5 rounded border text-sm" style={{ borderColor: C.line, color: C.ink }}>‹</button>
            <input type="number" value={annee} onChange={(e) => setAnnee(Number(e.target.value) || annee)} className="w-20 px-2 py-1.5 text-center font-bold tabular-nums rounded border bg-white outline-none" style={{ borderColor: C.line, color: C.ink }} />
            <button onClick={() => setAnnee(annee + 1)} className="px-2.5 py-1.5 rounded border text-sm" style={{ borderColor: C.line, color: C.ink }}>›</button>
          </div>
        } />

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
        <StatFin label="Loyers encaissés" value={fcfa(totalGeneral.brut)} tone="ink" sub="tous propriétaires" />
        <StatFin label="Revenus d'agence" value={fcfa(totalGeneral.com)} tone="green" sub="commissions" />
        <StatFin label="Travaux & charges" value={fcfa(totalGeneral.deductions)} tone="clay" sub="déduits" />
        <StatFin label="Net reversé" value={fcfa(totalGeneral.net)} tone="green" sub="aux propriétaires" />
      </div>

      {lignes.length === 0 ? <Empty text="Aucun propriétaire avec des loyers sur cette année. Rattachez vos biens à des propriétaires et validez les encaissements." />
        : <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr style={{ background: "#F5F4EE" }}>
                <th className="text-left px-4 py-2.5 text-[10px] font-semibold uppercase tracking-[0.1em] sticky left-0" style={{ color: C.mute, background: "#F5F4EE", minWidth: 140 }}>Propriétaire</th>
                {MOIS_COURTS.map((m, i) => (
                  <th key={i} className="px-1 py-2.5 text-[10px] font-semibold text-center" style={{ color: C.mute, minWidth: 44 }}>{m}</th>))}
                <th className="px-3 py-2.5 text-[10px] font-semibold uppercase tracking-[0.1em] text-right" style={{ color: C.mute, minWidth: 90 }}>Net total</th>
              </tr></thead>
              <tbody className="divide-y" style={{ borderColor: C.line }}>
                {lignes.map((l) => (
                  <tr key={l.pr.id} className="cursor-pointer hover:bg-black/[0.02]" onClick={() => setDetail(l.pr.id)}>
                    <td className="px-4 py-2.5 sticky left-0 bg-white" style={{ minWidth: 140 }}>
                      <div className="font-medium" style={{ color: C.green }}>{l.pr.nom}</div>
                      <div className="text-[10px]" style={{ color: C.mute }}>{l.biens.length} bien(s)</div>
                    </td>
                    {l.parMois.map((m, i) => (
                      <td key={i} className="px-1 py-2.5 text-center text-[10px] tabular-nums" style={{ color: m.net ? C.ink : C.mute }}>
                        {m.net ? Math.round(m.net / 1000) + "k" : "—"}
                      </td>))}
                    <td className="px-3 py-2.5 text-right tabular-nums font-bold" style={{ color: C.green }}>{fmt(l.tot.net)}</td>
                  </tr>))}
                <tr className="garder-couleur" style={{ background: "#F5F4EE" }}>
                  <td className="px-4 py-3 font-bold sticky left-0" style={{ color: C.ink, background: "#F5F4EE" }}>Total</td>
                  {moisAnnee.map((m, i) => {
                    const t = lignes.reduce((s, l) => s + l.parMois[i].net, 0);
                    return <td key={i} className="px-1 py-3 text-center text-[9px] tabular-nums font-semibold" style={{ color: t ? C.green : C.mute }}>{t ? Math.round(t / 1000) + "k" : "—"}</td>;
                  })}
                  <td className="px-3 py-3 text-right tabular-nums font-bold" style={{ color: C.green }}>{fmt(totalGeneral.net)}</td>
                </tr>
              </tbody>
            </table>
          </div></div>}

      <p className="text-xs mt-3 sans-impression" style={{ color: C.mute }}>
        Chaque montant est le net perçu par le propriétaire (loyers validés − commission − travaux et charges payés). Touchez une ligne pour le détail mois par mois. Montants en milliers (k) dans le tableau.
      </p>
    </div>
  );
}

function PointProprietaire({ data }) {
  const P = data.parametres || PARAMS_DEFAUT;
  const fiches = data.proprietaires || [];
  // Liste unifiée : fiches propriétaires + noms libres présents sur les biens
  const nomsLibres = [...new Set(data.biens.map((b) => b.proprietaire).filter(Boolean))]
    .filter((nom) => !fiches.some((f) => f.nom === nom));
  const options = [...fiches.map((f) => ({ id: f.id, nom: f.nom, fiche: f })),
    ...nomsLibres.map((nom) => ({ id: "libre:" + nom, nom, fiche: null }))];

  const [sel, setSel] = useState("");
  const [debut, setDebut] = useState(addMois(moisCourant(), -5));
  const [fin, setFin] = useState(moisCourant());
  const [info, setInfo] = useState(null);

  const choix = options.find((o) => o.id === sel);
  const fiche = choix ? choix.fiche : null;
  const nomProprio = choix ? choix.nom : "";

  const calc = useMemo(() => {
    if (!choix) return null;
    const biens = data.biens.filter((b) => (fiche && b.proprietaireId === fiche.id) || b.proprietaire === nomProprio);
    const ids = new Set(biens.map((b) => b.id));
    const ps = data.paiements.filter((p) => ids.has(p.bienId) && p.mois >= debut && p.mois <= fin && p.valide);
    const lignes = ps.map((p) => { const b = biens.find((x) => x.id === p.bienId);
      const com = commissionBien(b, p.montant);
      const loc = data.locataires.find((l) => l.id === p.locataireId || (l.bienId === (b || {}).id && l.actif !== false));
      return { bien: (b || {}).nom || "—", locataire: (loc || {}).nom || "", mois: p.mois,
        brut: Number(p.montant), taux: (b || {}).commission || 0, modeFixe: (b || {}).commissionMode === "fixe", com, net: Number(p.montant) - com };
    }).sort((a, b) => a.mois.localeCompare(b.mois) || a.bien.localeCompare(b.bien));
    // Charges PAYÉES et travaux DÉCAISSÉS sur la période, déduits du net (détaillés pour le propriétaire)
    const dansPeriode = (d) => { const m = (d || "").slice(0, 7); return m && m >= debut && m <= fin; };
    const chargesPayees = data.factures.filter((f) => ids.has(f.bienId) && f.statut === "payee" && dansPeriode(f.echeance || f.date))
      .map((f) => ({ libelle: f.libelle || f.type, montant: Number(f.montant || 0), date: f.echeance || f.date || "", type: "charge" }));
    const travauxDecaisses = (data.tickets || []).filter((t) => t.decaisse && ids.has(t.bienId) && dansPeriode(t.dateDecaisse || t.echeance))
      .map((t) => ({ libelle: t.titre, montant: Number(t.montantDecaisse || t.cout || 0), date: t.dateDecaisse || t.echeance || "", type: "travaux" }));
    const deductions = [...travauxDecaisses, ...chargesPayees].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
    // Charges à venir (non payées) — affichées à titre informatif, non déduites
    const charges = data.factures.filter((f) => ids.has(f.bienId) && f.statut !== "payee");
    const tb = lignes.reduce((s, l) => s + l.brut, 0), tc = lignes.reduce((s, l) => s + l.com, 0);
    const tn = lignes.reduce((s, l) => s + l.net, 0);
    const tded = deductions.reduce((s, d) => s + d.montant, 0);
    // Détail du parc
    const parc = biens.map((b) => {
      const loc = data.locataires.find((l) => l.bienId === b.id && l.actif !== false);
      return { nom: b.nom, adresse: b.adresse, loyer: Number(b.loyer || 0), loue: !!loc, locataire: (loc || {}).nom || "" };
    });
    const attendu = parc.filter((x) => x.loue).reduce((s, x) => s + x.loyer, 0);
    const nbMois = Math.max(1, (Number(fin.slice(0, 4)) * 12 + Number(fin.slice(5, 7))) - (Number(debut.slice(0, 4)) * 12 + Number(debut.slice(5, 7))) + 1);
    return { biens, parc, lignes, charges, deductions, tb, tc, tn, tded, net: tn - tded, attendu, nbMois,
      occ: parc.filter((x) => x.loue).length, vac: parc.filter((x) => !x.loue).length };
  }, [choix, fiche, nomProprio, debut, fin, data]);

  const periode = moisLabel(debut) + (debut !== fin ? " au " + moisLabel(fin) : "");

  const envoyerWhatsApp = async () => {
    await genererPdf(document.getElementById("doc-releve"), "Releve_" + nomProprio.replace(/\s+/g, "_") + ".pdf");
    const msg = "Bonjour " + nomProprio + ",\n\nVeuillez trouver votre relevé de gestion pour la période " + periode + ".\n" +
      "Montant net à reverser : " + fcfa(calc.net) + ".\n\n" + (P.societe || "Season Immobilier");
    ouvrirWhatsApp(fiche && fiche.tel, msg);
  };
  const envoyerMail = async () => {
    await genererPdf(document.getElementById("doc-releve"), "Releve_" + nomProprio.replace(/\s+/g, "_") + ".pdf");
    const sujet = "Relevé de gestion " + periode + " — " + (P.societe || "Season Immobilier");
    const corps = "Bonjour " + nomProprio + ",\n\nVeuillez trouver votre relevé de gestion pour la période " + periode + ".\n" +
      "Montant net à reverser : " + fcfa(calc.net) + ".\n\nLe document PDF est joint à ce message.\n\nCordialement,\n" + (P.societe || "Season Immobilier");
    ouvrirMail(fiche && fiche.email, sujet, corps);
  };

  return (
    <div>
      <Head title="Relevé propriétaire" sub="Synthèse complète des loyers, commissions, charges et net à reverser"
        action={calc && <>
          <Btn variant="ghost" onClick={() => genererPdf(document.getElementById("doc-releve"), "Releve_" + nomProprio.replace(/\s+/g, "_") + ".pdf")}>Télécharger PDF</Btn>
          <Btn variant="solid" onClick={() => window.print()}>Imprimer</Btn>
          <Btn variant="accent" onClick={envoyerWhatsApp}>WhatsApp</Btn>
          <Btn variant="accent" onClick={envoyerMail}>Email</Btn>
        </>} />

      <div className="flex flex-wrap gap-3 mb-6 sans-impression">
        <div className="min-w-[220px]"><Label>Propriétaire</Label>
          <Select value={sel} onChange={(e) => setSel(e.target.value)}>
            <option value="">Sélectionner</option>
            {options.map((o) => <option key={o.id} value={o.id}>{o.nom}</option>)}</Select></div>
        <div><Label>Du mois</Label><input type="month" value={debut} onChange={(e) => setDebut(e.target.value)}
          className="px-3 py-2 text-sm rounded border bg-white outline-none" style={{ borderColor: C.line, color: C.ink }} /></div>
        <div><Label>Au mois</Label><input type="month" value={fin} onChange={(e) => setFin(e.target.value)}
          className="px-3 py-2 text-sm rounded border bg-white outline-none" style={{ borderColor: C.line, color: C.ink }} /></div>
      </div>

      {!choix ? <Empty text="Sélectionnez un propriétaire pour générer son relevé complet." />
        : <div className="zone-impression" id="doc-releve" style={{ background: "#fff" }}><div className="p-2 sm:p-6">

            <EnTete p={P} droite={<div>
              <div className="text-[10px] uppercase tracking-[0.14em]" style={{ color: C.mute }}>Relevé de gestion</div>
              <div className="font-bold text-sm" style={{ color: C.ink }}>{periode}</div>
              <div className="text-[10px] mt-1" style={{ color: C.mute }}>Édité le {dateLongue(aujourdhui())}</div></div>} />

            {/* Bloc propriétaire */}
            <div className="grid sm:grid-cols-2 gap-4 mb-6">
              <div>
                <Label>Propriétaire</Label>
                <div className="text-sm font-bold" style={{ color: C.ink }}>{nomProprio}</div>
                {fiche && <div className="text-xs mt-0.5 leading-relaxed" style={{ color: C.mute }}>
                  {fiche.type && <div>{fiche.type}</div>}
                  {fiche.tel && <div>{fiche.tel}{fiche.tel2 ? " · " + fiche.tel2 : ""}</div>}
                  {fiche.email && <div>{fiche.email}</div>}
                  {fiche.adresse && <div>{fiche.adresse}</div>}
                </div>}
              </div>
              <div className="grid grid-cols-3 gap-2">
                <div className="rounded p-2.5 garder-couleur" style={{ background: C.greenSoft }}>
                  <div className="text-[9px] uppercase tracking-wide" style={{ color: C.mute }}>Biens</div>
                  <div className="text-base font-bold" style={{ color: C.ink }}>{calc.parc.length}</div></div>
                <div className="rounded p-2.5 garder-couleur" style={{ background: C.greenSoft }}>
                  <div className="text-[9px] uppercase tracking-wide" style={{ color: C.mute }}>Occupés</div>
                  <div className="text-base font-bold" style={{ color: C.green }}>{calc.occ}</div></div>
                <div className="rounded p-2.5 garder-couleur" style={{ background: C.goldSoft }}>
                  <div className="text-[9px] uppercase tracking-wide" style={{ color: C.mute }}>Vacants</div>
                  <div className="text-base font-bold" style={{ color: C.gold }}>{calc.vac}</div></div>
              </div>
            </div>

            {/* Parc immobilier */}
            <Label>Patrimoine géré</Label>
            <div className="overflow-x-auto mb-6"><table className="w-full text-sm">
              <thead><tr className="border-b" style={{ borderColor: C.line }}>
                {["Bien","Adresse","Loyer mensuel","Situation"].map((h) => (
                  <th key={h} className="text-left py-2 text-[10px] font-semibold uppercase tracking-[0.12em]" style={{ color: C.mute }}>{h}</th>))}
              </tr></thead>
              <tbody>
                {calc.parc.map((x, i) => (
                  <tr key={i} className="border-b" style={{ borderColor: C.line }}>
                    <td className="py-2.5" style={{ color: C.ink }}>{x.nom}</td>
                    <td className="py-2.5 text-xs" style={{ color: C.mute }}>{x.adresse || "—"}</td>
                    <td className="py-2.5 tabular-nums" style={{ color: C.ink }}>{fmt(x.loyer)}</td>
                    <td className="py-2.5"><Tag tone={x.loue ? "ok" : "warn"}>{x.loue ? "Loué — " + x.locataire : "Vacant"}</Tag></td>
                  </tr>))}
              </tbody>
            </table></div>

            {/* Loyers encaissés */}
            <Label>Loyers encaissés sur la période</Label>
            {calc.lignes.length === 0 ? <p className="text-sm mb-6 mt-1" style={{ color: C.mute }}>Aucun loyer encaissé sur cette période.</p>
              : <div className="overflow-x-auto mb-6 mt-1"><table className="w-full text-sm">
                  <thead><tr className="border-b" style={{ borderColor: C.line }}>
                    {["Bien","Locataire","Mois","Loyer perçu","Commission","À reverser"].map((h) => (
                      <th key={h} className="text-left py-2 text-[10px] font-semibold uppercase tracking-[0.12em]" style={{ color: C.mute }}>{h}</th>))}
                  </tr></thead>
                  <tbody>
                    {calc.lignes.map((l, i) => (
                      <tr key={i} className="border-b" style={{ borderColor: C.line }}>
                        <td className="py-2.5" style={{ color: C.ink }}>{l.bien}</td>
                        <td className="py-2.5 text-xs" style={{ color: C.mute }}>{l.locataire}</td>
                        <td className="py-2.5 capitalize text-xs" style={{ color: C.mute }}>{moisLabel(l.mois)}</td>
                        <td className="py-2.5 tabular-nums" style={{ color: C.ink }}>{fmt(l.brut)}</td>
                        <td className="py-2.5 tabular-nums" style={{ color: C.mute }}>{fmt(l.com)} ({l.modeFixe ? "fixe" : l.taux + "%"})</td>
                        <td className="py-2.5 tabular-nums font-semibold" style={{ color: C.ink }}>{fmt(l.net)}</td>
                      </tr>))}
                    <tr className="garder-couleur" style={{ background: "#F5F4EE" }}>
                      <td className="py-2.5 px-1 font-semibold" colSpan={3} style={{ color: C.ink }}>Totaux</td>
                      <td className="py-2.5 tabular-nums font-semibold" style={{ color: C.ink }}>{fmt(calc.tb)}</td>
                      <td className="py-2.5 tabular-nums font-semibold" style={{ color: C.ink }}>{fmt(calc.tc)}</td>
                      <td className="py-2.5 tabular-nums font-semibold" style={{ color: C.ink }}>{fmt(calc.tn)}</td>
                    </tr>
                  </tbody></table></div>}

            {/* Travaux et charges déduits */}
            <Label>Travaux et charges déduits sur la période</Label>
            {calc.deductions.length === 0 ? <p className="text-sm mb-6 mt-1" style={{ color: C.mute }}>Aucun travail ni charge déduit sur cette période.</p>
              : <table className="w-full text-sm mb-6 mt-1"><tbody>
                  {calc.deductions.map((d, i) => (
                    <tr key={i} className="border-b" style={{ borderColor: C.line }}>
                      <td className="py-2.5" style={{ color: C.ink }}>{d.libelle}
                        <span className="text-xs" style={{ color: C.mute }}> · {d.type === "travaux" ? "travaux" : "charge"}{d.date ? " · " + d.date : ""}</span></td>
                      <td className="py-2.5 text-right tabular-nums" style={{ color: C.clay }}>- {fmt(d.montant)}</td>
                    </tr>))}
                  <tr className="garder-couleur" style={{ background: "#F5F4EE" }}>
                    <td className="py-2.5 px-1 font-semibold" style={{ color: C.ink }}>Total déduit</td>
                    <td className="py-2.5 text-right tabular-nums font-semibold" style={{ color: C.clay }}>- {fmt(calc.tded)}</td>
                  </tr></tbody></table>}

            {calc.charges.length > 0 && (
              <p className="text-xs mb-6" style={{ color: C.mute }}>
                À noter : {calc.charges.length} charge(s) en attente de règlement ne sont pas encore déduites de ce relevé.
              </p>
            )}

            {/* Synthèse */}
            <Label>Synthèse du décompte</Label>
            <div className="rounded border mb-4 mt-1 overflow-hidden garder-couleur" style={{ borderColor: C.line }}>
              <table className="w-full text-sm">
                <tbody>
                  <tr className="border-b" style={{ borderColor: C.line }}>
                    <td className="py-2.5 px-3" style={{ color: C.mute }}>Total des loyers encaissés</td>
                    <td className="py-2.5 px-3 text-right tabular-nums" style={{ color: C.ink }}>{fmt(calc.tb)}</td></tr>
                  <tr className="border-b" style={{ borderColor: C.line }}>
                    <td className="py-2.5 px-3" style={{ color: C.mute }}>Commission d'agence</td>
                    <td className="py-2.5 px-3 text-right tabular-nums" style={{ color: C.clay }}>- {fmt(calc.tc)}</td></tr>
                  <tr className="border-b" style={{ borderColor: C.line }}>
                    <td className="py-2.5 px-3" style={{ color: C.mute }}>Travaux et charges déduits</td>
                    <td className="py-2.5 px-3 text-right tabular-nums" style={{ color: C.clay }}>- {fmt(calc.tded)}</td></tr>
                </tbody>
              </table>
            </div>
            <div className="flex items-center justify-between px-4 py-3.5 rounded gap-3 garder-couleur" style={{ background: C.greenSoft }}>
              <span className="font-bold text-sm" style={{ color: C.ink }}>Montant net à reverser</span>
              <span className="font-bold text-lg tabular-nums" style={{ color: C.green }}>{fcfa(calc.net)}</span>
            </div>
            <p className="text-sm italic mt-2" style={{ color: C.mute }}>
              Soit {enLettres(calc.net)} francs CFA.
            </p>

            {P.banque && <p className="text-xs mt-4" style={{ color: C.mute }}>Règlement par virement — {P.banque}</p>}

            <div className="mt-6 flex justify-end">
              <div className="text-center">
                <div className="text-xs mb-10" style={{ color: C.mute }}>Pour {P.societe || "l'agence"}</div>
                <div className="border-t pt-1.5 text-xs w-44" style={{ borderColor: C.line, color: C.mute }}>Signature et cachet</div>
              </div>
            </div>
            <PiedPage p={P} />
          </div></div>}
    </div>
  );
}

/* ================================= export ================================= */

function Export({ data }) {
  const [msg, setMsg] = useState(null);
  const nomBien = (id) => (data.biens.find((b) => b.id === id) || {}).nom || "";
  const nomAgent = (id) => (data.agents.find((a) => a.id === id) || {}).nom || "";

  const exporter = () => {
    try {
      const wb = XLSX.utils.book_new();
      const biens = data.biens.map((b) => ({ "Bien": b.nom, "Adresse": b.adresse, "Type": b.type,
        "Loyer mensuel (F CFA)": Number(b.loyer) || 0, "Commission (%)": Number(b.commission) || 0,
        "Propriétaire": b.proprietaire, "Agent": nomAgent(b.agentId),
        "Statut": data.locataires.some((l) => l.bienId === b.id && l.actif !== false) ? "Occupé" : "Vacant" }));
      const locataires = data.locataires.map((l) => ({ "Locataire": l.nom, "Téléphone": l.tel, "Email": l.email,
        "Bien": nomBien(l.bienId), "Date d'entrée": l.entree, "Jour d'échéance": l.jour || 5,
        "Caution (mois)": l.caution, "Avance (mois)": l.avance, "Statut": l.actif !== false ? "Actif" : "Sorti" }));
      const paiements = [...data.paiements].sort((a, b) => (a.mois || "").localeCompare(b.mois || "")).map((p) => {
        const b = data.biens.find((x) => x.id === p.bienId);
        const com = commissionBien(b, p.montant);
        return { "N° quittance": p.numero || "", "Mois": moisLabel(p.mois), "Bien": nomBien(p.bienId),
          "Locataire": (data.locataires.find((l) => l.id === p.locataireId) || {}).nom || "",
          "Montant reçu (F CFA)": Number(p.montant) || 0, "Commission agence (F CFA)": com,
          "Net propriétaire (F CFA)": (Number(p.montant) || 0) - com, "Date": p.date, "Mode": p.mode }; });
      const factures = data.factures.map((f) => ({ "Désignation": f.libelle || f.type, "Type": f.type,
        "Bien": nomBien(f.bienId), "Montant (F CFA)": Number(f.montant) || 0, "Échéance": f.echeance,
        "Statut": f.statut === "payee" ? "Payée" : "En cours" }));
      const agents = data.agents.map((a) => {
        const bs = data.biens.filter((b) => b.agentId === a.id);
        const ids = new Set(bs.map((b) => b.id));
        const com = data.paiements.filter((p) => ids.has(p.bienId)).reduce((s, p) => {
          const b = bs.find((x) => x.id === p.bienId);
          return s + commissionBien(b, p.montant); }, 0);
        return { "Agent": a.nom, "Téléphone": a.tel, "Email": a.email, "Biens gérés": bs.length,
          "Part commission (%)": a.part, "Commission agence générée (F CFA)": com,
          "Part agent (F CFA)": Math.round(com * Number(a.part || 0) / 100) }; });
      const lib = { bon: "Bon état", moyen: "État moyen", mauvais: "Mauvais état" };
      const etats = [];
      data.etats.forEach((e) => {
        const b = nomBien(e.bienId);
        const l = (data.locataires.find((x) => x.id === e.locataireId) || {}).nom || "";
        const base = { "Type": e.type === "entree" ? "Entrée" : "Sortie", "Date": e.date, "Bien": b, "Locataire": l,
          "Statut": e.cloture ? "Clôturé" : "En cours" };
        if (e.pieces.length === 0) etats.push({ ...base, "Pièce": "", "État": "", "Observations": e.observations || "", "Photos": 0 });
        e.pieces.forEach((p) => etats.push({ ...base, "Pièce": p.nom, "État": lib[p.etat] || "",
          "Observations": p.obs || "", "Photos": (p.photos || []).length }));
      });

      let vide = true;
      [["Biens", biens],["Locataires", locataires],["Paiements", paiements],
       ["Charges", factures],["Agents", agents],["États des lieux", etats]].forEach(([nom, rows]) => {
        if (!rows.length) return;
        vide = false;
        const ws = XLSX.utils.json_to_sheet(rows);
        ws["!cols"] = Object.keys(rows[0]).map((k) => ({
          wch: Math.min(46, Math.max(k.length + 2, ...rows.map((r) => String(r[k] == null ? "" : r[k]).length + 2))) }));
        XLSX.utils.book_append_sheet(wb, ws, nom);
      });
      if (vide) { setMsg({ t: "warn", m: "Aucune donnée à exporter." }); return; }
      XLSX.writeFile(wb, "Season_Gestion_" + aujourdhui() + ".xlsx");
      setMsg({ t: "ok", m: "Fichier Excel téléchargé." });
    } catch (e) { setMsg({ t: "bad", m: "Export impossible. Réessayez." }); }
  };

  const compte = [["Biens", data.biens.length],["Locataires", data.locataires.length],
    ["Paiements enregistrés", data.paiements.length],["Charges & factures", data.factures.length],
    ["Agents", data.agents.length],["États des lieux", data.etats.length]];

  return (
    <div>
      <Head title="Export Excel" sub="Classeur destiné à la comptabilité" />
      <div className={card + " max-w-lg"} style={{ borderColor: C.line }}><div className="p-5">
        <p className="text-sm mb-4" style={{ color: C.mute }}>
          Une feuille par catégorie, avec commissions et montants nets calculés à l'export.
        </p>
        <div className="space-y-2 text-sm mb-5">{compte.map(([k, v]) => <Row key={k} k={k} v={v} />)}</div>
        <Btn variant="accent" onClick={exporter}>Télécharger le classeur</Btn>
        {msg && <div className="mt-4 px-3 py-2 rounded text-sm"
          style={{ background: msg.t === "ok" ? C.greenSoft : msg.t === "warn" ? C.goldSoft : C.claySoft,
            color: msg.t === "ok" ? C.green : msg.t === "warn" ? C.gold : C.clay }}>{msg.m}</div>}
      </div></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("racine")).render(<Racine />);
</script>

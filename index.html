// Stocke des fichiers (base64) dans la table photos, clé texte libre (etat_id).

function lireFichier(file, maxImg, q) {
  return new Promise((resolve, reject) => {
    const est_image = (file.type || "").startsWith("image/");
    const r = new FileReader();
    r.onerror = () => reject(new Error("x"));
    if (est_image) {
      r.onload = () => { const img = new Image();
        img.onload = () => resolve({ nom: file.name, type: file.type, taille: file.size, url: dessiner(img, img.naturalWidth, img.naturalHeight, maxImg || 1400, q || 0.7) });
        img.onerror = () => reject(new Error("x")); img.src = r.result; };
      r.readAsDataURL(file);
    } else {
      r.onload = () => resolve({ nom: file.name, type: file.type, taille: file.size, url: r.result });
      r.readAsDataURL(file);
    }
  });
}

function PiecesJointes({ cle, c, verrouille }) {
  const [fichiers, setFichiers] = useState([]);
  const [chargement, setChargement] = useState(true);
  const [erreur, setErreur] = useState(null);
  const [apercu, setApercu] = useState(null);

  useEffect(() => {
    (async () => {
      setChargement(true);
      try {
        const { data: r } = await c.from("photos").select("data").eq("etat_id", cle).maybeSingle();
        setFichiers((r && r.data && r.data.fichiers) || []);
      } catch (e) { setFichiers([]); }
      setChargement(false);
    })();
  }, [cle]);

  const sauver = async (liste) => {
    const { error } = await c.from("photos").upsert({ etat_id: cle, data: { fichiers: liste } });
    if (error) throw error;
    setFichiers(liste);
  };

  const ajouter = async (fileList) => {
    // Capturer immédiatement les fichiers dans un tableau (avant tout re-render)
    const arr = [];
    if (fileList && fileList.length) { for (let i = 0; i < fileList.length; i++) arr.push(fileList[i]); }
    if (arr.length === 0) { setErreur("Aucun fichier reçu. Réessayez, et si le fichier vient d'iCloud, ouvrez-le une fois pour le télécharger."); return; }
    setErreur("Traitement de " + arr.length + " fichier(s)…");
    const suite = [...fichiers];
    for (const file of arr) {
      if (!file || file.size === 0) { setErreur("Le fichier « " + (file ? file.name : "?") + " » est vide (peut-être pas téléchargé sur l'appareil). Ouvrez-le une fois puis réessayez."); return; }
      if (file.size > 8000000) { setErreur("« " + file.name + " » dépasse 8 Mo. Réduisez-le ou photographiez le document."); return; }
      const estImg = (file.type || "").startsWith("image/");
      try {
        let f;
        if (estImg) { f = await lireFichier(file, 1100, 0.6); }
        else { f = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res({ nom: file.name, type: file.type || "application/octet-stream", taille: file.size, url: r.result }); r.onerror = () => rej(new Error("lecture")); r.readAsDataURL(file); }); }
        suite.push({ id: uid(), ...f });
      }
      catch (e) { setErreur("Le fichier « " + file.name + " » n'a pas pu être lu (" + (e && e.message ? e.message : "erreur") + ")."); return; }
    }
    const total = JSON.stringify(suite).length;
    if (total > 4500000) { setErreur("Cette fiche a atteint sa capacité (" + Math.round(total/1000) + " Ko). Supprimez des pièces ou réduisez la taille des images."); return; }
    setErreur("Enregistrement en cours…");
    try {
      await sauver(suite);
      setErreur(null);
    }
    catch (e) { setErreur("Enregistrement impossible : " + (e && e.message ? e.message : "erreur inconnue") + "."); }
  };

  const supprimer = async (id) => { await sauver(fichiers.filter((x) => x.id !== id)); };

  const estImage = (f) => (f.type || "").startsWith("image/");
  const ko = (n) => n ? (n > 1000000 ? (n / 1000000).toFixed(1) + " Mo" : Math.round(n / 1000) + " Ko") : "";

  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <Label>Pièces jointes ({fichiers.length})</Label>
        {!verrouille && (
          <button type="button" onClick={() => { const el = document.getElementById("pj-input-" + cle); if (el) el.click(); }}
            className="text-xs font-semibold cursor-pointer sans-impression" style={{ color: C.green }}>
            + Ajouter un fichier
          </button>
        )}
      </div>
      <input id={"pj-input-" + cle} name={"pj-input-" + cle} type="file" multiple style={{ display: "none" }}
        accept="image/*,application/pdf"
        onChange={(e) => { const fl = e.target.files; ajouter(fl); e.target.value = ""; }} />
      {erreur && <div className="mb-2 px-3 py-2 rounded text-xs" style={{ background: C.claySoft, color: C.clay }}>{erreur}</div>}
      {chargement ? <p className="text-sm" style={{ color: C.mute }}>Chargement des fichiers…</p>
        : fichiers.length === 0 ? <p className="text-sm" style={{ color: C.mute }}>Aucun fichier. Ajoutez le titre foncier, le bail, l'attestation, des photos…</p>
        : <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
            {fichiers.map((f) => (
              <div key={f.id} className="relative border rounded overflow-hidden" style={{ borderColor: C.line }}>
                {estImage(f)
                  ? <img src={f.url} alt={f.nom} onClick={() => setApercu(f)} className="w-full h-24 object-cover cursor-pointer" />
                  : <a href={f.url} download={f.nom} className="flex flex-col items-center justify-center h-24 p-2 text-center" style={{ background: "#F5F4EE" }}>
                      <span className="text-2xl">📄</span>
                      <span className="text-[10px] mt-1 line-clamp-2" style={{ color: C.ink }}>{f.nom}</span>
                    </a>}
                <div className="px-1.5 py-1 flex items-center justify-between gap-1">
                  <span className="text-[10px] truncate" style={{ color: C.mute }}>{ko(f.taille)}</span>
                  <div className="flex gap-1.5 items-center">
                    <a href={f.url} download={f.nom} className="text-[10px] font-semibold" style={{ color: C.green }}>↓</a>
                    {!verrouille && <button onClick={() => supprimer(f.id)} className="text-[10px] font-semibold" style={{ color: C.clay }}>✕</button>}
                  </div>
                </div>
              </div>))}
          </div>}
      {apercu && <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sans-impression"
        style={{ background: "rgba(14,23,18,0.85)" }} onClick={() => setApercu(null)}>
        <img src={apercu.url} alt={apercu.nom} className="max-w-full max-h-full rounded" /></div>}
    </div>
  );
}

/* ============================ propriétaires =============================== */

function Proprietaires({ data, save, c, moi }) {
  const [open, setOpen] = useState(false);
  const [edit, setEdit] = useState(null);
  const [q, setQ] = useState("");
  const [fiche, setFiche] = useState(null);
  const liste = data.proprietaires || [];
  const P = data.parametres || PARAMS_DEFAUT;
  const emailsCommerciaux = (P.commerciaux || []).map((e) => String(e).trim().toLowerCase());
  const estCommercial = emailsCommerciaux.includes(String(moi || "").trim().toLowerCase());
  const voirBancaire = !estCommercial; // les commerciaux ne voient pas les données bancaires ni les revenus

  const blank = { nom: "", type: "Particulier", tel: "", tel2: "", email: "", adresse: "",
    piece: "", numPiece: "", rccm: "", banque: "", rib: "", notes: "" };
  const [f, setF] = useState(blank);

  const start = (p) => { setEdit(p || null); setF(p ? { ...blank, ...p } : blank); setOpen(true); };

  const submit = () => {
    if (!f.nom.trim()) return;
    save({ ...data, proprietaires: edit ? liste.map((p) => p.id === edit.id ? { ...f, id: edit.id } : p)
      : [...liste, { ...f, id: uid() }] },
      (edit ? "a modifié le propriétaire " : "a ajouté le propriétaire ") + f.nom);
    setOpen(false);
  };

  const supprimer = async (p) => {
    try { await c.from("photos").delete().eq("etat_id", "proprio:" + p.id); } catch (e) {}
    save({ ...data, proprietaires: liste.filter((x) => x.id !== p.id) }, "a supprimé le propriétaire " + p.nom);
  };

  const visibles = liste.filter((p) => p.nom.toLowerCase().includes(q.toLowerCase()));

  // Fiche détaillée d'un propriétaire
  if (fiche) {
    const p = liste.find((x) => x.id === fiche);
    if (!p) { setFiche(null); return null; }
    const biens = data.biens.filter((b) => b.proprietaireId === p.id || b.proprietaire === p.nom);
    const revenus = biens.reduce((s, b) => {
      const loue = data.locataires.some((l) => l.bienId === b.id && l.actif !== false);
      return s + (loue ? Number(b.loyer || 0) : 0);
    }, 0);
    return (
      <div>
        <button onClick={() => setFiche(null)} className="text-sm mb-4 sans-impression" style={{ color: C.mute }}>← Retour aux propriétaires</button>
        <Head title={p.nom} sub={p.type + (biens.length ? " · " + biens.length + " bien(s)" : "")}
          action={<Btn variant="ghost" onClick={() => start(p)}>Modifier</Btn>} />

        <div className="grid lg:grid-cols-2 gap-4">
          <div className={card} style={{ borderColor: C.line }}>
            <div className="px-4 py-3 border-b" style={{ borderColor: C.line }}>
              <h3 className="text-sm font-semibold" style={{ color: C.ink }}>Coordonnées</h3></div>
            <div className="p-4 space-y-2 text-sm">
              {p.tel && <Row k="Téléphone" v={p.tel} />}
              {p.tel2 && <Row k="Téléphone 2" v={p.tel2} />}
              {p.email && <Row k="Email" v={p.email} />}
              {p.adresse && <Row k="Adresse" v={p.adresse} />}
              {p.piece && <Row k={p.piece} v={p.numPiece || "—"} />}
              {voirBancaire && p.rccm && <Row k="RCCM" v={p.rccm} />}
              {voirBancaire && p.banque && <Row k="Banque" v={p.banque} />}
              {voirBancaire && p.rib && <Row k="RIB / IBAN" v={p.rib} />}
              {!p.tel && !p.email && !p.adresse && <p style={{ color: C.mute }}>Aucune coordonnée renseignée.</p>}
            </div>
            {p.notes && <div className="px-4 pb-4"><Label>Notes</Label>
              <p className="text-sm p-2 rounded" style={{ background: "#F5F4EE", color: C.ink }}>{p.notes}</p></div>}
          </div>

          <div className={card} style={{ borderColor: C.line }}>
            <div className="px-4 py-3 border-b flex items-center justify-between" style={{ borderColor: C.line }}>
              <h3 className="text-sm font-semibold" style={{ color: C.ink }}>Biens de ce propriétaire</h3>
              {voirBancaire && revenus > 0 && <Tag tone="ok">{fcfa(revenus)}/mois</Tag>}</div>
            {biens.length === 0 ? <p className="p-4 text-sm" style={{ color: C.mute }}>Aucun bien rattaché. Dans la fiche d'un bien, sélectionnez ce propriétaire.</p>
              : <ul className="divide-y" style={{ borderColor: C.line }}>
                  {[...biens].sort((a, b) => (a.ensemble || "zzz").localeCompare(b.ensemble || "zzz")).map((b) => {
                    const loue = data.locataires.some((l) => l.bienId === b.id && l.actif !== false);
                    return (
                      <li key={b.id} className="px-4 py-2.5 flex items-center justify-between text-sm gap-3">
                        <div>
                          {b.ensemble && <div className="text-[10px] uppercase tracking-wide font-semibold" style={{ color: C.green }}>{b.ensemble}{b.unite ? " · " + b.unite : ""}</div>}
                          <div style={{ color: C.ink }}>{b.nom}</div>
                          <div className="text-xs" style={{ color: C.mute }}>{b.adresse || "—"}</div></div>
                        <Tag tone={loue ? "ok" : "warn"}>{loue ? "Occupé" : "Vacant"}</Tag>
                      </li>);
                  })}
                </ul>}
          </div>
        </div>

        <div className={card + " mt-4"} style={{ borderColor: C.line }}>
          <div className="px-4 py-3 border-b" style={{ borderColor: C.line }}>
            <h3 className="text-sm font-semibold" style={{ color: C.ink }}>Documents du propriétaire</h3>
            <p className="text-xs mt-0.5" style={{ color: C.mute }}>Pièce d'identité, mandat de gestion, RIB, attestation de propriété…</p></div>
          <div className="p-4"><PiecesJointes cle={"proprio:" + p.id} c={c} /></div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <Head title="Propriétaires" sub={liste.length + " propriétaire(s)"}
        action={<Btn variant="accent" onClick={() => start(null)}>+ Ajouter</Btn>} />

      {liste.length === 0 ? <Empty text="Aucun propriétaire enregistré. Créez la fiche de chaque bailleur avec ses coordonnées et documents."
          action={<Btn variant="accent" onClick={() => start(null)}>+ Ajouter un propriétaire</Btn>} />
        : <>
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Rechercher un propriétaire"
              className="mb-4 max-w-xs w-full px-3 py-2 text-sm rounded border bg-white outline-none" style={{ borderColor: C.line, color: C.ink }} />
            <div className="grid md:grid-cols-2 gap-3">
              {visibles.map((p) => {
                const biens = data.biens.filter((b) => b.proprietaireId === p.id || b.proprietaire === p.nom);
                return (
                  <div key={p.id} className={card} style={{ borderColor: C.line }}><div className="p-4">
                    <div className="flex justify-between items-start gap-3 mb-2">
                      <div><h3 className="font-semibold text-sm" style={{ color: C.ink }}>{p.nom}</h3>
                        <p className="text-xs" style={{ color: C.mute }}>{p.type}{p.tel ? " · " + p.tel : ""}</p></div>
                      <Tag tone="neutral">{biens.length} bien(s)</Tag>
                    </div>
                    <div className="space-y-1.5 text-sm mb-3">
                      {p.email && <Row k="Email" v={p.email} />}
                      {p.rib && <Row k="RIB / IBAN" v={p.rib} />}
                    </div>
                    <div className="flex gap-2">
                      <Btn variant="accent" onClick={() => setFiche(p.id)}>Ouvrir la fiche →</Btn>
                      <Btn variant="ghost" onClick={() => start(p)}>Modifier</Btn>
                      <Btn variant="danger" onClick={() => supprimer(p)}>Supprimer</Btn>
                    </div>
                  </div></div>);
              })}
            </div>
          </>}

      {open && (
        <Modal title={edit ? "Modifier le propriétaire" : "Nouveau propriétaire"} onClose={() => setOpen(false)} wide>
          <div className="space-y-3">
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Nom / Raison sociale"><Input value={f.nom} onChange={(e) => setF({ ...f, nom: e.target.value })} placeholder="Mme ADOU Marie" /></Field>
              <Field label="Type"><Select value={f.type} onChange={(e) => setF({ ...f, type: e.target.value })}>
                <option>Particulier</option><option>Société</option><option>SCI</option><option>Indivision / Succession</option></Select></Field>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Téléphone"><Input value={f.tel} onChange={(e) => setF({ ...f, tel: e.target.value })} /></Field>
              <Field label="Téléphone 2"><Input value={f.tel2} onChange={(e) => setF({ ...f, tel2: e.target.value })} /></Field>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Email"><Input value={f.email} onChange={(e) => setF({ ...f, email: e.target.value })} /></Field>
              <Field label="Adresse"><Input value={f.adresse} onChange={(e) => setF({ ...f, adresse: e.target.value })} /></Field>
            </div>
            <div className="grid sm:grid-cols-3 gap-3">
              <Field label="Type de pièce"><Select value={f.piece} onChange={(e) => setF({ ...f, piece: e.target.value })}>
                <option value="">—</option><option>CNI</option><option>Passeport</option><option>Attestation d'identité</option><option>Permis de conduire</option></Select></Field>
              <Field label="N° de pièce"><Input value={f.numPiece} onChange={(e) => setF({ ...f, numPiece: e.target.value })} /></Field>
              {voirBancaire && <Field label="RCCM (si société)"><Input value={f.rccm} onChange={(e) => setF({ ...f, rccm: e.target.value })} /></Field>}
            </div>
            {voirBancaire && (
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Banque"><Input value={f.banque} onChange={(e) => setF({ ...f, banque: e.target.value })} placeholder="NSIA Banque" /></Field>
              <Field label="RIB / IBAN"><Input value={f.rib} onChange={(e) => setF({ ...f, rib: e.target.value })} /></Field>
            </div>
            )}
            {!voirBancaire && (
              <div className="px-3 py-2 rounded text-xs" style={{ background: "#F5F4EE", color: C.mute }}>
                Les coordonnées bancaires du propriétaire sont gérées par la gérance. Renseignez ici les informations de contact.
              </div>
            )}
            <Field label="Notes"><Textarea value={f.notes} onChange={(e) => setF({ ...f, notes: e.target.value })}
              placeholder="Conditions de reversement, personne à contacter, particularités…" /></Field>
            {edit && <p className="text-xs" style={{ color: C.mute }}>
              Les documents (pièce d'identité, mandat…) s'ajoutent depuis la fiche du propriétaire, après enregistrement.</p>}
            <div className="flex gap-2 pt-2">
              <Btn variant="accent" onClick={submit}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================================= biens ================================== */

function Biens({ data, save, c }) {
  const [open, setOpen] = useState(false);
  const [edit, setEdit] = useState(null);
  const [fiche, setFiche] = useState(null);
  const proprios = data.proprietaires || [];

  const blank = { nom: "", ensemble: "", unite: "", adresse: "", type: "Appartement", surface: "", pieces: "", loyer: "", charges: "",
    commission: 10, commissionMode: "pourcentage", commissionFixe: 0, pasDePorte: 0, proprietaireId: "", proprietaire: "", agentId: "", titreFoncier: "", lot: "", ilot: "", notes: "" };
  const [f, setF] = useState(blank);

  const start = (b) => { setEdit(b || null); setF(b ? { ...blank, ...b } : blank); setOpen(true); };

  const submit = () => {
    if (!f.nom.trim()) return;
    const pr = proprios.find((p) => p.id === f.proprietaireId);
    const rec = { ...f, loyer: Number(f.loyer) || 0, charges: Number(f.charges) || 0, commission: Number(f.commission) || 0,
      commissionMode: f.commissionMode || "pourcentage", commissionFixe: Number(f.commissionFixe) || 0,
      ensemble: (f.ensemble || "").trim(), unite: (f.unite || "").trim(), pasDePorte: Number(f.pasDePorte) || 0,
      proprietaire: pr ? pr.nom : f.proprietaire };
    if (!rec.proprietaireId && !rec.proprietaire.trim()) return;
    save({ ...data, biens: edit ? data.biens.map((b) => b.id === edit.id ? { ...rec, id: edit.id } : b)
      : [...data.biens, { ...rec, id: uid() }] },
      (edit ? "a modifié le bien " : "a ajouté le bien ") + rec.nom);
    setOpen(false);
  };

  const remove = async (b) => {
    try { await c.from("photos").delete().eq("etat_id", "bien:" + b.id); } catch (e) {}
    save({ ...data,
      biens: data.biens.filter((x) => x.id !== b.id),
      locataires: data.locataires.filter((l) => l.bienId !== b.id),
      paiements: data.paiements.filter((p) => p.bienId !== b.id),
      factures: data.factures.filter((x) => x.bienId !== b.id),
      etats: data.etats.filter((e) => e.bienId !== b.id) }, "a supprimé le bien " + b.nom);
  };

  const nomProprio = (b) => {
    const pr = proprios.find((p) => p.id === b.proprietaireId);
    return pr ? pr.nom : (b.proprietaire || "—");
  };

  // Fiche détaillée d'un bien
  if (fiche) {
    const b = data.biens.find((x) => x.id === fiche);
    if (!b) { setFiche(null); return null; }
    const loc = data.locataires.find((l) => l.bienId === b.id && l.actif !== false);
    const ag = data.agents.find((a) => a.id === b.agentId);
    return (
      <div>
        <button onClick={() => setFiche(null)} className="text-sm mb-4 sans-impression" style={{ color: C.mute }}>← Retour aux biens</button>
        <Head title={b.nom} sub={b.type + (b.adresse ? " · " + b.adresse : "")}
          action={<Btn variant="ghost" onClick={() => start(b)}>Modifier</Btn>} />

        <div className="grid lg:grid-cols-2 gap-4">
          <div className={card} style={{ borderColor: C.line }}>
            <div className="px-4 py-3 border-b" style={{ borderColor: C.line }}>
              <h3 className="text-sm font-semibold" style={{ color: C.ink }}>Caractéristiques</h3></div>
            <div className="p-4 space-y-2 text-sm">
              <Row k="Type" v={b.type} />
              {b.surface && <Row k="Surface" v={b.surface + " m²"} />}
              {b.pieces && <Row k="Nombre de pièces" v={b.pieces} />}
              <Row k="Loyer mensuel" v={fcfa(b.loyer)} />
              {b.charges > 0 && <Row k="Charges" v={fcfa(b.charges)} />}
              <Row k="Commission agence" v={b.commission + " %"} />
              <Row k="Propriétaire" v={nomProprio(b)} />
              {ag && <Row k="Agent en charge" v={ag.nom} />}
              <Row k="Locataire actuel" v={loc ? loc.nom : "Vacant"} />
            </div>
          </div>

          <div className={card} style={{ borderColor: C.line }}>
            <div className="px-4 py-3 border-b" style={{ borderColor: C.line }}>
              <h3 className="text-sm font-semibold" style={{ color: C.ink }}>Références foncières</h3></div>
            <div className="p-4 space-y-2 text-sm">
              {b.titreFoncier && <Row k="Titre foncier" v={b.titreFoncier} />}
              {b.lot && <Row k="Lot" v={b.lot} />}
              {b.ilot && <Row k="Îlot" v={b.ilot} />}
              {!b.titreFoncier && !b.lot && !b.ilot && <p style={{ color: C.mute }}>Aucune référence foncière renseignée.</p>}
            </div>
            {b.notes && <div className="px-4 pb-4"><Label>Notes</Label>
              <p className="text-sm p-2 rounded" style={{ background: "#F5F4EE", color: C.ink }}>{b.notes}</p></div>}
          </div>
        </div>

        <div className={card + " mt-4"} style={{ borderColor: C.line }}>
          <div className="px-4 py-3 border-b" style={{ borderColor: C.line }}>
            <h3 className="text-sm font-semibold" style={{ color: C.ink }}>Documents du bien</h3>
            <p className="text-xs mt-0.5" style={{ color: C.mute }}>Titre foncier, contrat de bail, plan, photos, quittances SODECI/CIE…</p></div>
          <div className="p-4"><PiecesJointes cle={"bien:" + b.id} c={c} /></div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <Head title="Biens" sub={data.biens.length + " bien(s) en gestion"}
        action={<Btn variant="accent" onClick={() => start(null)}>+ Ajouter</Btn>} />
      {data.biens.length === 0 ? <Empty text="Aucun bien enregistré." action={<Btn variant="accent" onClick={() => start(null)}>+ Ajouter un bien</Btn>} />
        : <div className="grid md:grid-cols-2 gap-3">
            {[...data.biens].sort((a, b) => (a.ensemble || "zzz").localeCompare(b.ensemble || "zzz") || (a.unite || "").localeCompare(b.unite || "")).map((b) => {
              const loc = data.locataires.find((l) => l.bienId === b.id && l.actif !== false);
              const ag = data.agents.find((a) => a.id === b.agentId);
              return (
                <div key={b.id} className={card} style={{ borderColor: C.line }}><div className="p-4">
                  <div className="flex justify-between items-start gap-3 mb-2">
                    <div>
                      {b.ensemble && <div className="text-[10px] uppercase tracking-wide font-semibold mb-0.5" style={{ color: C.green }}>{b.ensemble}{b.unite ? " · " + b.unite : ""}</div>}
                      <h3 className="font-semibold text-sm" style={{ color: C.ink }}>{b.nom}</h3>
                      <p className="text-xs" style={{ color: C.mute }}>{b.adresse || "—"}</p></div>
                    <Tag tone={loc ? "ok" : "warn"}>{loc ? "Occupé" : "Vacant"}</Tag>
                  </div>
                  <div className="space-y-1.5 text-sm mb-3">
                    <Row k="Loyer mensuel" v={fcfa(b.loyer)} />
                    <Row k="Commission" v={b.commissionMode === "fixe" ? fcfa(b.commissionFixe) + " (fixe)" : (b.commission + " %")} />
                    {b.pasDePorte > 0 && <Row k="Pas-de-porte" v={fcfa(b.pasDePorte)} />}
                    <Row k="Propriétaire" v={nomProprio(b)} />
                    {ag && <Row k="Agent" v={ag.nom} />}{loc && <Row k="Locataire" v={loc.nom} />}
                  </div>
                  <div className="flex gap-2">
                    <Btn variant="accent" onClick={() => setFiche(b.id)}>Fiche →</Btn>
                    <Btn variant="ghost" onClick={() => start(b)}>Modifier</Btn>
                    <Btn variant="danger" onClick={() => remove(b)}>Supprimer</Btn>
                  </div>
                </div></div>
              );
            })}
          </div>}

      {open && (
        <Modal title={edit ? "Modifier le bien" : "Nouveau bien"} onClose={() => setOpen(false)} wide>
          <div className="space-y-3">
            <Field label="Désignation du bien"><Input value={f.nom} onChange={(e) => setF({ ...f, nom: e.target.value })} placeholder="Villa Cocody Ambassades" /></Field>

            <div className="rounded border p-3" style={{ borderColor: C.line, background: "#F5F4EE" }}>
              <Label>Ensemble (facultatif)</Label>
              <p className="text-[11px] mb-2" style={{ color: C.mute }}>
                Pour regrouper plusieurs unités d'un même immeuble, centre commercial ou concession. Laissez vide pour un bien isolé.
              </p>
              <div className="grid sm:grid-cols-2 gap-3">
                <Field label="Nom de l'ensemble">
                  <Input value={f.ensemble} onChange={(e) => setF({ ...f, ensemble: e.target.value })}
                    placeholder="Immeuble Les Palmiers" list="liste-ensembles" />
                  <datalist id="liste-ensembles">
                    {[...new Set((data.biens || []).map((b) => b.ensemble).filter(Boolean))].map((e) => <option key={e} value={e} />)}
                  </datalist>
                </Field>
                <Field label="Unité dans l'ensemble">
                  <Input value={f.unite} onChange={(e) => setF({ ...f, unite: e.target.value })} placeholder="Appartement 3B / Magasin 5" />
                </Field>
              </div>
            </div>

            <Field label="Adresse"><Input value={f.adresse} onChange={(e) => setF({ ...f, adresse: e.target.value })} /></Field>
            <div className="grid sm:grid-cols-3 gap-3">
              <Field label="Type"><Select value={f.type} onChange={(e) => setF({ ...f, type: e.target.value })}>
                <option>Appartement</option><option>Villa</option><option>Studio</option>
                <option>Local commercial</option><option>Bureau</option><option>Magasin</option><option>Terrain</option></Select></Field>
              <Field label="Surface (m²)"><Input type="number" value={f.surface} onChange={(e) => setF({ ...f, surface: e.target.value })} /></Field>
              <Field label="Nombre de pièces"><Input value={f.pieces} onChange={(e) => setF({ ...f, pieces: e.target.value })} placeholder="4" /></Field>
            </div>
            <div className="grid sm:grid-cols-3 gap-3">
              <Field label="Loyer mensuel (F CFA)"><Input type="number" value={f.loyer} onChange={(e) => setF({ ...f, loyer: e.target.value })} /></Field>
              <Field label="Charges (F CFA)"><Input type="number" value={f.charges} onChange={(e) => setF({ ...f, charges: e.target.value })} /></Field>
              <Field label="Mode de commission de gestion">
                <Select value={f.commissionMode || "pourcentage"} onChange={(e) => setF({ ...f, commissionMode: e.target.value })}>
                  <option value="pourcentage">Pourcentage du loyer</option>
                  <option value="fixe">Montant fixe par mois</option>
                </Select>
              </Field>
              {(f.commissionMode || "pourcentage") === "pourcentage"
                ? <Field label="Commission agence (%)"><Input type="number" value={f.commission} onChange={(e) => setF({ ...f, commission: e.target.value })} /></Field>
                : <Field label="Commission fixe (F CFA / mois)"><Input type="number" value={f.commissionFixe} onChange={(e) => setF({ ...f, commissionFixe: e.target.value })} /></Field>}
            </div>

            <Field label="Pas-de-porte (F CFA) — facultatif, pour les locaux commerciaux">
              <Input type="number" value={f.pasDePorte} onChange={(e) => setF({ ...f, pasDePorte: e.target.value })} placeholder="0" />
            </Field>

            <Field label="Propriétaire">
              <Select value={f.proprietaireId} onChange={(e) => setF({ ...f, proprietaireId: e.target.value })}>
                <option value="">— Sélectionner un propriétaire —</option>
                {proprios.map((p) => <option key={p.id} value={p.id}>{p.nom}</option>)}
              </Select>
            </Field>
            {proprios.length === 0 && (
              <Field label="Ou nom du propriétaire (texte)">
                <Input value={f.proprietaire} onChange={(e) => setF({ ...f, proprietaire: e.target.value })} placeholder="Créez d'abord une fiche dans l'onglet Propriétaires" /></Field>
            )}

            <Field label="Agent en charge"><Select value={f.agentId} onChange={(e) => setF({ ...f, agentId: e.target.value })}>
              <option value="">Non assigné</option>
              {data.agents.map((a) => <option key={a.id} value={a.id}>{a.nom}</option>)}</Select></Field>

            <div className="pt-2 border-t" style={{ borderColor: C.line }}>
              <Label>Références foncières</Label>
              <div className="grid sm:grid-cols-3 gap-3 mt-1">
                <Field label="Titre foncier"><Input value={f.titreFoncier} onChange={(e) => setF({ ...f, titreFoncier: e.target.value })} /></Field>
                <Field label="Lot"><Input value={f.lot} onChange={(e) => setF({ ...f, lot: e.target.value })} /></Field>
                <Field label="Îlot"><Input value={f.ilot} onChange={(e) => setF({ ...f, ilot: e.target.value })} /></Field>
              </div>
            </div>
            <Field label="Notes"><Textarea value={f.notes} onChange={(e) => setF({ ...f, notes: e.target.value })}
              placeholder="État général, équipements, particularités…" /></Field>
            {edit && <p className="text-xs" style={{ color: C.mute }}>
              Les documents (titre foncier, bail, photos…) s'ajoutent depuis la fiche du bien, via le bouton Fiche.</p>}

            <div className="flex gap-2 pt-2">
              <Btn variant="accent" onClick={submit}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* =============================== locataires =============================== */


function Locataires({ data, save }) {
  const [open, setOpen] = useState(false);
  const [edit, setEdit] = useState(null);
  const [q, setQ] = useState("");
  const blank = { nom: "", tel: "", email: "", bienId: "", entree: "", sortie: "", caution: 2, avance: 2, jour: 5, dureeMois: 12, preavisMois: 3, actif: true };
  const [f, setF] = useState(blank);

  const marquerDepart = (l) => {
    const b = data.biens.find((x) => x.id === l.bienId);
    const d = window.prompt("Date de départ du locataire " + l.nom + " (le bien deviendra vacant) :", aujourdhui());
    if (d === null) return;
    save({ ...data, locataires: data.locataires.map((x) => x.id === l.id ? { ...x, actif: false, sortie: d || aujourdhui() } : x) },
      "a enregistré le départ de " + l.nom + " — " + ((b || {}).nom || "") + " est désormais vacant");
  };
  const reactiver = (l) => {
    const b = data.biens.find((x) => x.id === l.bienId);
    // vérifie qu'aucun autre locataire actif n'occupe déjà ce bien
    const occupe = data.locataires.some((x) => x.id !== l.id && x.bienId === l.bienId && x.actif !== false);
    if (occupe) { window.alert("Ce bien est déjà occupé par un autre locataire actif. Marquez d'abord son départ."); return; }
    save({ ...data, locataires: data.locataires.map((x) => x.id === l.id ? { ...x, actif: true, sortie: "" } : x) },
      "a réactivé le locataire " + l.nom + " — " + ((b || {}).nom || "") + " est de nouveau occupé");
  };

  const start = (l) => { setEdit(l || null); setF(l ? { ...l } : { ...blank, bienId: (data.biens[0] || {}).id || "" }); setOpen(true); };
  const submit = () => {
    if (!f.nom.trim() || !f.bienId) return;
    const rec = { ...f, caution: Number(f.caution) || 0, avance: Number(f.avance) || 0, jour: Number(f.jour) || 5,
      dureeMois: Number(f.dureeMois) || 12, preavisMois: Number(f.preavisMois) || 3 };
    save({ ...data, locataires: edit ? data.locataires.map((l) => l.id === edit.id ? { ...rec, id: edit.id } : l)
      : [...data.locataires, { ...rec, id: uid() }] },
      (edit ? "a modifié le locataire " : "a ajouté le locataire ") + rec.nom);
    setOpen(false);
  };
  const list = data.locataires.filter((l) => l.nom.toLowerCase().includes(q.toLowerCase()));

  return (
    <div>
      <Head title="Locataires" sub={data.locataires.filter((l) => l.actif !== false).length + " locataire(s) actif(s)"}
        action={<Btn variant="accent" onClick={() => start(null)} disabled={data.biens.length === 0}>+ Ajouter</Btn>} />

      {data.biens.length === 0 ? <Empty text="Ajoutez d'abord un bien pour pouvoir enregistrer un locataire." />
        : data.locataires.length === 0 ? <Empty text="Aucun locataire enregistré." action={<Btn variant="accent" onClick={() => start(null)}>+ Ajouter</Btn>} />
        : <>
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Rechercher un locataire"
              className="mb-4 max-w-xs w-full px-3 py-2 text-sm rounded border bg-white outline-none" style={{ borderColor: C.line, color: C.ink }} />
            <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead><tr style={{ background: "#F5F4EE" }}>
                  {["Locataire","Bien","Entrée","Caution versée","Statut",""].map((h) => (
                    <th key={h} className="text-left px-4 py-2.5 text-[10px] font-semibold uppercase tracking-[0.12em]" style={{ color: C.mute }}>{h}</th>))}
                </tr></thead>
                <tbody className="divide-y" style={{ borderColor: C.line }}>
                  {list.map((l) => {
                    const b = data.biens.find((x) => x.id === l.bienId);
                    return (
                      <tr key={l.id}>
                        <td className="px-4 py-3"><div style={{ color: C.ink }}>{l.nom}</div>
                          <div className="text-xs" style={{ color: C.mute }}>{l.tel || "—"}</div></td>
                        <td className="px-4 py-3" style={{ color: C.mute }}>{(b || {}).nom || "—"}</td>
                        <td className="px-4 py-3" style={{ color: C.mute }}>{l.entree || "—"}</td>
                        <td className="px-4 py-3 tabular-nums" style={{ color: C.ink }}>{fcfa(((b || {}).loyer || 0) * l.caution)}</td>
                        <td className="px-4 py-3"><Tag tone={l.actif !== false ? "ok" : "neutral"}>{l.actif !== false ? "Actif" : "Sorti" + (l.sortie ? " le " + l.sortie : "")}</Tag></td>
                        <td className="px-4 py-3"><div className="flex gap-3 flex-wrap">
                          <button onClick={() => start(l)} className="text-xs font-semibold" style={{ color: C.green }}>Modifier</button>
                          {l.actif !== false
                            ? <button onClick={() => marquerDepart(l)} className="text-xs font-semibold" style={{ color: C.orange }}>Marquer le départ</button>
                            : <button onClick={() => reactiver(l)} className="text-xs font-semibold" style={{ color: C.green }}>Réoccuper</button>}
                          <button onClick={() => save({ ...data, locataires: data.locataires.filter((x) => x.id !== l.id) }, "a supprimé le locataire " + l.nom)}
                            className="text-xs font-semibold" style={{ color: C.clay }}>Supprimer</button>
                        </div></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div></div>
          </>}

      {open && (
        <Modal title={edit ? "Modifier le locataire" : "Nouveau locataire"} onClose={() => setOpen(false)}>
          <div className="space-y-3">
            <Field label="Nom complet"><Input value={f.nom} onChange={(e) => setF({ ...f, nom: e.target.value })} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Téléphone"><Input value={f.tel} onChange={(e) => setF({ ...f, tel: e.target.value })} /></Field>
              <Field label="Email"><Input value={f.email} onChange={(e) => setF({ ...f, email: e.target.value })} /></Field>
            </div>
            <Field label="Bien loué"><Select value={f.bienId} onChange={(e) => setF({ ...f, bienId: e.target.value })}>
              <option value="">Sélectionner</option>
              {data.biens.map((b) => <option key={b.id} value={b.id}>{b.nom}</option>)}</Select></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Date d'entrée"><Input type="date" value={f.entree} onChange={(e) => setF({ ...f, entree: e.target.value })} /></Field>
              <Field label="Jour d'échéance"><Input type="number" min="1" max="28" value={f.jour} onChange={(e) => setF({ ...f, jour: e.target.value })} /></Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Durée du bail (mois)"><Input type="number" value={f.dureeMois} onChange={(e) => setF({ ...f, dureeMois: e.target.value })} placeholder="12" /></Field>
              <Field label="Préavis (mois)"><Input type="number" value={f.preavisMois} onChange={(e) => setF({ ...f, preavisMois: e.target.value })} placeholder="3" /></Field>
            </div>
            <div className="grid grid-cols-3 gap-3">
              <Field label="Caution (mois)"><Input type="number" value={f.caution} onChange={(e) => setF({ ...f, caution: e.target.value })} /></Field>
              <Field label="Avance (mois)"><Input type="number" value={f.avance} onChange={(e) => setF({ ...f, avance: e.target.value })} /></Field>
              <Field label="Statut"><Select value={f.actif !== false ? "1" : "0"} onChange={(e) => setF({ ...f, actif: e.target.value === "1" })}>
                <option value="1">Actif</option><option value="0">Sorti</option></Select></Field>
            </div>
            <div className="flex gap-2 pt-2">
              <Btn variant="accent" onClick={submit}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* =============================== reçus =================================== */

function Recus({ data, save, moi }) {
  const [open, setOpen] = useState(false);
  const [editId, setEditId] = useState(null);
  const [vue, setVue] = useState(null);
  const P = data.parametres || PARAMS_DEFAUT;
  const liste = data.recus || [];

  // Rôle : gérante + comptable valident ; commerciaux créent des reçus à valider
  const emailsCommerciaux = (P.commerciaux || []).map((e) => String(e).trim().toLowerCase());
  const estCommercial = emailsCommerciaux.includes(String(moi || "").trim().toLowerCase());
  const peutValider = !estCommercial;

  const validerRecu = (d) => {
    save({ ...data, recus: liste.map((x) => x.id === d.id ? { ...x, valide: true, validePar: moi, valideLe: new Date().toISOString(), rejet: null } : x) },
      "a validé le reçu " + d.numero);
  };
  const rejeterRecu = (d) => {
    save({ ...data, recus: liste.map((x) => x.id === d.id ? { ...x, valide: false, rejet: true } : x) },
      "a annulé la validation du reçu " + d.numero);
  };

  const blank = {
    numero: "", locataireId: "", clientLibre: "", bienId: "",
    montant: "", motif: "Loyer", motifDetail: "", mode: "Espèces",
    date: aujourdhui(), factureRef: "",
  };
  const [f, setF] = useState(blank);

  const numeroAuto = () => {
    const an = new Date().getFullYear();
    const n = (data.compteurRec || 0) + 1;
    return "REC-SEASON-" + an + "-" + String(n).padStart(4, "0");
  };

  const ouvrirNouveau = () => {
    setEditId(null);
    setF({ ...blank, numero: numeroAuto(), bienId: (data.biens[0] || {}).id || "" });
    setOpen(true);
  };

  const modifier = (d) => {
    setEditId(d.id);
    setF({ ...blank, ...d, montant: String(d.montant) });
    setVue(null);
    setOpen(true);
  };

  const emettre = () => {
    if (!f.montant) return;
    const loc = data.locataires.find((l) => l.id === f.locataireId);
    if (editId) {
      save({ ...data, recus: liste.map((x) => x.id === editId ? { ...f, id: editId, montant: Number(f.montant) } : x) },
        "a modifié le reçu " + (f.numero || ""));
      setOpen(false); setEditId(null); setVue(editId);
      return;
    }
    const n = (data.compteurRec || 0) + 1;
    const doc = { ...f, id: uid(), numero: f.numero || numeroAuto(), montant: Number(f.montant),
      valide: peutValider, validePar: peutValider ? moi : null, valideLe: peutValider ? new Date().toISOString() : null, saisiPar: moi };
    save({ ...data, compteurRec: n, recus: [doc, ...liste] },
      "a émis le reçu " + doc.numero + " de " + fcfa(doc.montant) + (loc ? " — " + loc.nom : "") + (peutValider ? "" : " [à valider]"));
    setOpen(false);
    setVue(doc.id);
  };

  const supprimer = (d) => save({ ...data, recus: liste.filter((x) => x.id !== d.id) }, "a supprimé le reçu " + d.numero);

  const docVu = liste.find((d) => d.id === vue);

  if (docVu) {
    const loc = data.locataires.find((l) => l.id === docVu.locataireId);
    const bien = data.biens.find((b) => b.id === docVu.bienId);
    return (
      <div>
        <button onClick={() => setVue(null)} className="text-sm mb-4 sans-impression" style={{ color: C.mute }}>← Retour aux reçus</button>
        <Head title="Reçu de paiement" sub={docVu.numero}
          action={<>
            {!docVu.valide && peutValider && <Btn variant="accent" onClick={() => validerRecu(docVu)}>Valider le reçu</Btn>}
            {docVu.valide && peutValider && <Btn variant="ghost" onClick={() => rejeterRecu(docVu)}>Annuler validation</Btn>}
            <Btn variant="ghost" onClick={() => modifier(docVu)}>Modifier</Btn>
            <Btn variant="ghost" onClick={() => genererPdf(document.getElementById("doc-recu"), docVu.numero + ".pdf")}>Télécharger PDF</Btn>
            <Btn variant="solid" onClick={() => window.print()}>Imprimer</Btn>
            <Btn variant="accent" onClick={async () => {
              await genererPdf(document.getElementById("doc-recu"), docVu.numero + ".pdf");
              const nom = docVu.clientLibre || (loc || {}).nom || "";
              const msg = "Bonjour " + nom + ",\n\nVeuillez trouver votre reçu de paiement n° " + docVu.numero +
                " d'un montant de " + fcfa(docVu.montant) + " (" + docVu.motif + ").\n\n" + (P.societe || "Season Immobilier");
              ouvrirWhatsApp((loc || {}).tel, msg);
            }}>WhatsApp</Btn>
            <Btn variant="accent" onClick={async () => {
              await genererPdf(document.getElementById("doc-recu"), docVu.numero + ".pdf");
              const nom = docVu.clientLibre || (loc || {}).nom || "";
              const sujet = "Reçu de paiement " + docVu.numero + " — " + (P.societe || "Season Immobilier");
              const corps = "Bonjour " + nom + ",\n\nVeuillez trouver votre reçu de paiement n° " + docVu.numero +
                " d'un montant de " + fcfa(docVu.montant) + " (" + docVu.motif + ").\n\n" +
                "Le document PDF est joint à ce message.\n\nCordialement,\n" + (P.societe || "Season Immobilier");
              ouvrirMail((loc || {}).email, sujet, corps);
            }}>Email</Btn>
          </>} />
        {!docVu.valide && !docVu.rejet && (
          <div className="mb-3 px-4 py-2.5 rounded text-sm font-semibold sans-impression garder-couleur" style={{ background: C.goldSoft, color: C.gold }}>
            {peutValider ? "Ce reçu est en attente de validation. Cliquez sur « Valider le reçu » après vérification."
              : "Ce reçu est en attente de validation par la gérante ou le comptable."}
          </div>
        )}
        <div className="zone-impression" id="doc-recu" style={{ background: "#fff" }}>
          <div className="p-2 sm:p-6"><DocumentRecu d={docVu} loc={loc} bien={bien} p={P} /></div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <Head title="Reçus de paiement" sub="Attestent d'un encaissement : caution, avance, acompte, frais…"
        action={<Btn variant="accent" onClick={ouvrirNouveau}>+ Nouveau reçu</Btn>} />

      {(() => {
        const aValider = liste.filter((d) => !d.valide && !d.rejet);
        if (aValider.length === 0) return null;
        return (
          <div className="mb-5 px-4 py-3 rounded text-sm font-semibold sans-impression garder-couleur"
            style={{ background: peutValider ? C.goldSoft : "#F5F4EE", color: peutValider ? C.gold : C.mute }}>
            {peutValider
              ? aValider.length + " reçu(s) en attente de validation. Ouvrez-en un pour le valider."
              : aValider.length + " reçu(s) en attente de validation par la gérante ou le comptable."}
          </div>
        );
      })()}

      {liste.length === 0
        ? <Empty text="Aucun reçu émis. Créez un reçu pour attester d'un paiement reçu d'un client."
            action={<Btn variant="accent" onClick={ouvrirNouveau}>+ Nouveau reçu</Btn>} />
        : <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr style={{ background: "#F5F4EE" }}>
                {["Numéro","Date","Client","Motif","Montant","Statut",""].map((h) => (
                  <th key={h} className="text-left px-4 py-2.5 text-[10px] font-semibold uppercase tracking-[0.12em]" style={{ color: C.mute }}>{h}</th>))}
              </tr></thead>
              <tbody className="divide-y" style={{ borderColor: C.line }}>
                {liste.map((d) => {
                  const l = data.locataires.find((x) => x.id === d.locataireId);
                  return (
                    <tr key={d.id}>
                      <td className="px-4 py-3 tabular-nums text-xs" style={{ color: C.ink }}>{d.numero}</td>
                      <td className="px-4 py-3" style={{ color: C.mute }}>{d.date}</td>
                      <td className="px-4 py-3" style={{ color: C.mute }}>{d.clientLibre || (l || {}).nom || "—"}</td>
                      <td className="px-4 py-3" style={{ color: C.mute }}>{d.motif}</td>
                      <td className="px-4 py-3 tabular-nums font-semibold" style={{ color: C.ink }}>{fcfa(d.montant)}</td>
                      <td className="px-4 py-3">{d.valide ? <Tag tone="ok">Validé</Tag> : d.rejet ? <Tag tone="bad">Rejeté</Tag> : <Tag tone="warn">À valider</Tag>}</td>
                      <td className="px-4 py-3"><div className="flex gap-3 flex-wrap">
                        <button onClick={() => setVue(d.id)} className="text-xs font-semibold" style={{ color: C.green }}>Ouvrir</button>
                        {!d.valide && peutValider && <button onClick={() => validerRecu(d)} className="text-xs font-semibold" style={{ color: C.gold }}>Valider</button>}
                        <button onClick={() => supprimer(d)} className="text-xs font-semibold" style={{ color: C.clay }}>Supprimer</button>
                      </div></td>
                    </tr>);
                })}
              </tbody>
            </table>
          </div></div>}

      {open && (
        <Modal title={editId ? "Modifier le reçu" : "Nouveau reçu de paiement"} onClose={() => { setOpen(false); setEditId(null); }} wide>
          <div className="space-y-3">
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Numéro"><Input value={f.numero} onChange={(e) => setF({ ...f, numero: e.target.value })} /></Field>
              <Field label="Date du paiement"><Input type="date" value={f.date} onChange={(e) => setF({ ...f, date: e.target.value })} /></Field>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Client (locataire enregistré)">
                <Select value={f.locataireId} onChange={(e) => setF({ ...f, locataireId: e.target.value })}>
                  <option value="">— Saisir un nom libre —</option>
                  {data.locataires.map((l) => <option key={l.id} value={l.id}>{l.nom}</option>)}
                </Select>
              </Field>
              <Field label="Ou nom du client">
                <Input value={f.clientLibre} placeholder="Mr / Mme…" onChange={(e) => setF({ ...f, clientLibre: e.target.value })} />
              </Field>
            </div>
            <Field label="Bien concerné (facultatif)">
              <Select value={f.bienId} onChange={(e) => setF({ ...f, bienId: e.target.value })}>
                <option value="">Aucun</option>
                {data.biens.map((b) => <option key={b.id} value={b.id}>{b.nom}</option>)}
              </Select>
            </Field>
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Montant reçu (F CFA)">
                <Input type="number" value={f.montant} onChange={(e) => setF({ ...f, montant: e.target.value })} />
              </Field>
              <Field label="Mode de règlement">
                <Select value={f.mode} onChange={(e) => setF({ ...f, mode: e.target.value })}>

const UNITES = ["","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze",
  "treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
const DIZAINES = ["","","vingt","trente","quarante","cinquante","soixante","soixante","quatre-vingt","quatre-vingt"];

function centaines(n) {
  if (n === 0) return "";
  if (n < 20) return UNITES[n];
  if (n < 100) {
    const d = Math.floor(n / 10), u = n % 10;
    if (d === 7 || d === 9) {
      const base = DIZAINES[d];
      const reste = UNITES[10 + u];
      return base + (u === 1 && d === 7 ? " et " : "-") + reste;
    }
    if (u === 0) return DIZAINES[d] + (d === 8 ? "s" : "");
    if (u === 1 && d !== 8) return DIZAINES[d] + " et un";
    return DIZAINES[d] + "-" + UNITES[u];
  }
  const c = Math.floor(n / 100), r = n % 100;
  const tete = c === 1 ? "cent" : UNITES[c] + " cent" + (r === 0 ? "s" : "");
  return r === 0 ? tete : tete + " " + centaines(r);
}

function enLettres(n) {
  n = Math.round(Number(n) || 0);
  if (n === 0) return "zéro";
  const parts = [];
  const milliards = Math.floor(n / 1000000000);
  const millions = Math.floor((n % 1000000000) / 1000000);
  const mille = Math.floor((n % 1000000) / 1000);
  const reste = n % 1000;
  if (milliards) parts.push(centaines(milliards) + " milliard" + (milliards > 1 ? "s" : ""));
  if (millions) parts.push(centaines(millions) + " million" + (millions > 1 ? "s" : ""));
  if (mille) parts.push(mille === 1 ? "mille" : centaines(mille) + " mille");
  if (reste) parts.push(centaines(reste));
  const t = parts.join(" ");
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function FacturesLoyer({ data, save, moi }) {
  const [open, setOpen] = useState(false);
  const [editId, setEditId] = useState(null);
  const [vue, setVue] = useState(null);
  const [infoRecu, setInfoRecu] = useState(null);
  const P = data.parametres || PARAMS_DEFAUT;
  const liste = data.facturesLoyer || [];

  // Rôle : la gérante et le comptable peuvent émettre des factures définitives ; les commerciaux, seulement des proformas.
  const emailGerante = (P.gerante || "aude.nioble@season-immobilier.com").trim().toLowerCase();
  const emailsCommerciaux = (P.commerciaux || []).map((e) => String(e).trim().toLowerCase());
  const moiMin = String(moi || "").trim().toLowerCase();
  const estCommercial = emailsCommerciaux.includes(moiMin);
  const peutValider = !estCommercial; // gérante + comptable (tout compte non commercial)

  const blank = {
    type: "proforma", numero: "", bienId: "", locataireId: "", clientLibre: "",
    objet: "", date: aujourdhui(), conditions: "Payable à réception", echeance: "",
    lignes: [], avance: "", message: "MERCI POUR VOTRE CONFIANCE",
    inclureEnreg: true, timbres: 10000, inclureDossier: true, tauxDossier: 10,
    inclureCaution: true, moisCaution: 2, inclureAvance: true, moisAvance: 2, inclureHonoraires: true, moisHonoraires: 1,
  };
  const [f, setF] = useState(blank);
  const [ligne, setLigne] = useState({ libelle: "", detail: "", quantite: 1, pu: "" });
  const [biensSup, setBiensSup] = useState([]); // ids des biens additionnels (locataire à plusieurs unités)

  const numeroAuto = (type) => {
    const an = new Date().getFullYear();
    const n = (type === "proforma" ? (data.compteurPro || 0) : (data.compteurFac || 0)) + 1;
    return "N°" + (type === "proforma" ? "PRO" : "INV") + "-SEASON-" + an + "-" + String(n).padStart(4, "0");
  };

  const ouvrirNouveau = () => {
    setEditId(null);
    setF({ ...blank, numero: numeroAuto("proforma"), bienId: (data.biens[0] || {}).id || "" });
    setLigne({ libelle: "", detail: "", quantite: 1, pu: "" });
    setBiensSup([]);
    setOpen(true);
  };

  const modifier = (d) => {
    setEditId(d.id);
    setF({ ...blank, ...d });
    setLigne({ libelle: "", detail: "", quantite: 1, pu: "" });
    setBiensSup([]);
    setVue(null);
    setOpen(true);
  };

  const majType = (t) => setF({ ...f, type: t, numero: numeroAuto(t) });

  const ajouterLigne = () => {
    if (!ligne.libelle.trim()) return;
    const q = Number(ligne.quantite) || 1;
    const pu = Number(ligne.pu) || 0;
    setF({ ...f, lignes: [...f.lignes, { id: uid(), libelle: ligne.libelle.trim(),
      detail: ligne.detail.trim(), quantite: q, pu, montant: q * pu, nonRemb: !!ligne.nonRemb }] });
    setLigne({ libelle: "", detail: "", quantite: 1, pu: "", nonRemb: false });
  };

  const modeleEntree = () => {
    const bPrincipal = data.biens.find((x) => x.id === f.bienId);
    if (!bPrincipal) return;
    // Liste ordonnée des biens : le principal, puis les biens supplémentaires
    const biens = [bPrincipal, ...biensSup.map((id) => data.biens.find((x) => x.id === id)).filter(Boolean)];
    const multi = biens.length > 1;
    const nom = (b) => (b.unite || b.nom || "").toUpperCase();
    const timbres = Number(f.timbres) || 10000;
    const moisC = Number(f.moisCaution) || 2;
    const moisA = Number(f.moisAvance) || 2;
    const moisH = Number(f.moisHonoraires) || 1;
    const totalLoyer = biens.reduce((s, b) => s + (Number(b.loyer) || 0), 0); // somme des loyers mensuels
    const detailLoyers = biens.map((b) => fmt(Number(b.loyer) || 0)).join(" + ");
    const totalPasDePorte = biens.reduce((s, b) => s + (Number(b.pasDePorte) || 0), 0);
    const L = [];

    // 1) Caution — une seule ligne, total de tous les biens
    if (f.inclureCaution) {
      L.push({ id: uid(), libelle: "CAUTION (" + moisC + " mois de garantie)",
        detail: multi ? "(" + detailLoyers + ") x " + moisC : fmt(totalLoyer) + " x " + moisC,
        quantite: moisC, pu: totalLoyer, montant: totalLoyer * moisC });
    }
    // 2) Loyer d'avance — une seule ligne, total
    if (f.inclureAvance) {
      L.push({ id: uid(), libelle: "LOYER (" + moisA + " mois d'avance)",
        detail: multi ? "(" + detailLoyers + ") x " + moisA : fmt(totalLoyer) + " x " + moisA,
        quantite: moisA, pu: totalLoyer, montant: totalLoyer * moisA });
    }
    // 3) Honoraires — sur le total des loyers
    if (f.inclureHonoraires) {
      L.push({ id: uid(), libelle: "HONORAIRES D'AGENCE (" + moisH + " mois de loyer)",
        detail: (multi || moisH > 1) ? fmt(totalLoyer) + " x " + moisH : "", quantite: moisH, pu: totalLoyer, montant: totalLoyer * moisH, nonRemb: true });
    }
    // 4) Droits d'enregistrement — sur le total des loyers d'avance
    if (f.inclureEnreg) {
      L.push({ id: uid(), libelle: "DROITS D'ENREGISTREMENT & TIMBRES D'ETAT",
        detail: "(" + fmt(totalLoyer) + " x " + moisA + " x 2,5%) + " + fmt(timbres), quantite: 1,
        pu: Math.round(totalLoyer * moisA * 0.025) + timbres, montant: Math.round(totalLoyer * moisA * 0.025) + timbres });
    }
    // 5) Frais de dossier — sur le total des loyers
    if (f.inclureDossier !== false) {
      const taux = Number(f.tauxDossier) || 10;
      L.push({ id: uid(), libelle: "FRAIS DE DOSSIER (" + taux + "% DU LOYER MENSUEL)",
        detail: fmt(totalLoyer) + " x " + taux + "%", quantite: 1,
        pu: Math.round(totalLoyer * taux / 100), montant: Math.round(totalLoyer * taux / 100), nonRemb: true });
    }
    // 6) Pas-de-porte — une seule ligne, total
    if (totalPasDePorte > 0) {
      L.push({ id: uid(), libelle: "PAS-DE-PORTE", detail: "", quantite: 1,
        pu: totalPasDePorte, montant: totalPasDePorte, nonRemb: true });
    }

    const objet = multi
      ? "LOCATION " + biens.map((b) => nom(b)).join(" + ")
      : "LOCATION " + ((bPrincipal.type || "").toUpperCase() || "BIEN") + " SITUE A " + (bPrincipal.adresse || bPrincipal.nom).toUpperCase();
    setF({ ...f, lignes: L, objet: f.objet || objet });
  };

  const emettre = () => {
    // Un commercial ne peut émettre qu'une proforma, quel que soit le type sélectionné
    const type = estCommercial ? "proforma" : f.type;
    const pro = type === "proforma";

    // Édition d'un document existant : on met à jour sans toucher aux compteurs ni au numéro
    if (editId) {
      save({ ...data, facturesLoyer: liste.map((x) => x.id === editId ? { ...f, type, id: editId } : x) },
        "a modifié " + (pro ? "la proforma " : "la facture ") + (f.numero || ""));
      setOpen(false); setEditId(null); setVue(editId);
      return;
    }

    const n = (pro ? (data.compteurPro || 0) : (data.compteurFac || 0)) + 1;
    const numero = f.numero && type === f.type ? f.numero : numeroAuto(type);
    const doc = { ...f, type, id: uid(), numero };
    save({ ...data,
      compteurPro: pro ? n : (data.compteurPro || 0),
      compteurFac: pro ? (data.compteurFac || 0) : n,
      facturesLoyer: [doc, ...liste] },
      "a émis " + (pro ? "une proforma " : "une facture ") + doc.numero);
    setOpen(false);
    setVue(doc.id);
  };

  const convertir = (d) => {
    if (!peutValider) { alert("Seuls la gérante et le comptable peuvent convertir une proforma en facture définitive."); return; }
    const n = (data.compteurFac || 0) + 1;
    const an = new Date().getFullYear();
    const numero = "N°INV-SEASON-" + an + "-" + String(n).padStart(4, "0");
    const doc = { ...d, id: uid(), type: "definitive", numero, date: aujourdhui(), validePar: moi, valideLe: new Date().toISOString() };
    save({ ...data, compteurFac: n, facturesLoyer: [doc, ...liste] },
      "a validé et converti la proforma " + d.numero + " en facture " + numero);
    setVue(doc.id);
  };

  const supprimer = (d) => save({ ...data, facturesLoyer: liste.filter((x) => x.id !== d.id) },
    "a supprimé le document " + d.numero);

  const genererRecu = (d) => {
    const total = (d.lignes || []).reduce((s, x) => s + x.montant, 0);
    const avance = Number(d.avance) || 0;
    const montant = avance > 0 ? avance : total; // si avance saisie, le reçu porte sur l'avance
    const n = (data.compteurRec || 0) + 1;
    const an = new Date().getFullYear();
    const numero = "REC-SEASON-" + an + "-" + String(n).padStart(4, "0");
    const loc = data.locataires.find((l) => l.id === d.locataireId);
    const motifCourt = avance > 0 ? "Acompte sur facture " + d.numero : "Règlement facture " + d.numero;
    const recu = { id: uid(), numero, locataireId: d.locataireId || "", clientLibre: d.clientLibre || "",
      bienId: d.bienId || "", montant, motif: avance > 0 ? "Acompte sur facture" : "Règlement de facture",
      motifDetail: "", mode: "Espèces", date: aujourdhui(), factureRef: d.numero };
    save({ ...data, compteurRec: n, recus: [recu, ...(data.recus || [])] },
      "a généré le reçu " + numero + " depuis la facture " + d.numero);
    setInfoRecu(numero);
  };

  const docVu = liste.find((d) => d.id === vue);

  if (docVu) {
    const bien = data.biens.find((b) => b.id === docVu.bienId);
    const loc = data.locataires.find((l) => l.id === docVu.locataireId);
    return (
      <div>
        <button onClick={() => setVue(null)} className="text-sm mb-4 sans-impression" style={{ color: C.mute }}>← Retour aux factures</button>
        <Head title={docVu.type === "proforma" ? "Facture proforma" : "Facture"} sub={docVu.numero}
          action={<>
            {(docVu.type === "proforma" || peutValider) && <Btn variant="ghost" onClick={() => modifier(docVu)}>Modifier</Btn>}
            <Btn variant="ghost" onClick={() => genererPdf(document.getElementById("doc-facture"), docVu.numero + ".pdf")}>Télécharger PDF</Btn>
            <Btn variant="solid" onClick={() => window.print()}>Imprimer</Btn>
            <Btn variant="accent" onClick={async () => {
              await genererPdf(document.getElementById("doc-facture"), docVu.numero + ".pdf");
              const total = (docVu.lignes || []).reduce((s, x) => s + x.montant, 0);
              const nom = docVu.clientLibre || (loc || {}).nom || "";
              const msg = "Bonjour " + nom + ",\n\nVeuillez trouver votre " + (docVu.type === "proforma" ? "facture proforma" : "facture") +
                " n° " + docVu.numero + (docVu.objet ? "\nObjet : " + docVu.objet : "") +
                "\nMontant total : " + fcfa(total) + (docVu.echeance ? "\nÉchéance : " + dateLongue(docVu.echeance) : "") +
                "\n\n" + (P.societe || "Season Immobilier");
              ouvrirWhatsApp((loc || {}).tel, msg);
            }}>WhatsApp</Btn>
            <Btn variant="accent" onClick={async () => {
              await genererPdf(document.getElementById("doc-facture"), docVu.numero + ".pdf");
              const total = (docVu.lignes || []).reduce((s, x) => s + x.montant, 0);
              const nom = docVu.clientLibre || (loc || {}).nom || "";
              const sujet = (docVu.type === "proforma" ? "Facture proforma " : "Facture ") + docVu.numero + " — " + (P.societe || "Season Immobilier");
              const corps = "Bonjour " + nom + ",\n\nVeuillez trouver votre " + (docVu.type === "proforma" ? "facture proforma" : "facture") +
                " n° " + docVu.numero + (docVu.objet ? "\nObjet : " + docVu.objet : "") +
                "\nMontant total : " + fcfa(total) + (docVu.echeance ? "\nÉchéance : " + dateLongue(docVu.echeance) : "") +
                "\n\nLe document PDF est joint à ce message.\n\nCordialement,\n" + (P.societe || "Season Immobilier");
              ouvrirMail((loc || {}).email, sujet, corps);
            }}>Email</Btn>
            {docVu.type === "proforma" && peutValider && <Btn variant="accent" onClick={() => convertir(docVu)}>Valider en facture définitive</Btn>}
            <Btn variant="accent" onClick={() => genererRecu(docVu)}>Générer le reçu</Btn>
          </>} />
        {infoRecu && (
          <div className="mb-4 px-4 py-2.5 rounded text-sm flex items-center justify-between gap-3 flex-wrap sans-impression"
            style={{ background: C.greenSoft, color: C.green }}>
            <span>Reçu {infoRecu} créé. Vous le retrouvez dans l'onglet « Reçus de paiement » pour l'imprimer ou l'envoyer.</span>
            <button onClick={() => setInfoRecu(null)} style={{ color: C.green }}>✕</button>
          </div>
        )}
        <div className="zone-impression" id="doc-facture" style={{ background: "#fff" }}>
          <div className="p-2 sm:p-6"><DocumentLoyer d={docVu} bien={bien} loc={loc} p={P} /></div>
        </div>
      </div>
    );
  }

  const totalApercu = f.lignes.reduce((s, l) => s + l.montant, 0);

  return (
    <div>
      <Head title="Factures de loyer" sub="Proformas et factures définitives"
        action={<Btn variant="accent" onClick={ouvrirNouveau}>+ Nouvelle facture</Btn>} />

      {(() => {
        const proformas = liste.filter((d) => d.type === "proforma");

        return (
          <div className="mb-5 px-4 py-3 rounded flex items-center justify-between gap-3 flex-wrap sans-impression garder-couleur"

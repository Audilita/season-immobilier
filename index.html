/* ============================== CRM · prospects ============================== */

const CRM_STATUTS = [
  ["nouveau", "Nouveau", "warn"],
  ["a_rappeler", "À rappeler", "gold"],
  ["visite", "Visite prévue", "neutral"],
  ["negociation", "En négociation", "neutral"],
  ["conclu", "Conclu", "ok"],
  ["perdu", "Perdu", "bad"],
];
const CRM_RECHERCHE = ["Location", "Achat"];
const CRM_TYPES_BIEN = ["Studio", "Appartement", "Villa", "Duplex", "Magasin/Local", "Bureau", "Terrain", "Autre"];

function statutLabelCRM(k) { const s = CRM_STATUTS.find((x) => x[0] === k); return s ? s[1] : k; }
function statutToneCRM(k) { const s = CRM_STATUTS.find((x) => x[0] === k); return s ? s[2] : "neutral"; }

// Jours écoulés depuis une date ISO
function joursDepuis(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return Math.floor((Date.now() - d.getTime()) / (1000 * 60 * 60 * 24));
}

function CRM({ data, save, moi }) {
  const P = data.parametres || PARAMS_DEFAUT;
  const prospects = data.prospects || [];
  const emailGerante = (P.gerante || "aude.nioble@season-immobilier.com").trim().toLowerCase();
  const suisGerante = String(moi || "").trim().toLowerCase() === emailGerante;

  const [vue, setVue] = useState("pipeline"); // pipeline, liste, alertes, point
  const [open, setOpen] = useState(false);
  const [editId, setEditId] = useState(null);
  const [filtreStatut, setFiltreStatut] = useState("tous");
  const [ficheId, setFicheId] = useState(null);

  const SEUIL_NON_TRAITE = 7; // jours sans contact = à relancer

  const blank = {
    nom: "", tel: "", email: "", recherche: "Location", typeBien: "Appartement",
    budget: "", quartier: "", bienId: "", agent: moi || "", statut: "nouveau",
    note: "", dateContact: aujourdhui(), prochaineRelance: "", visites: [], echanges: [],
  };
  const [f, setF] = useState(blank);

  const ouvrirNouveau = () => { setEditId(null); setF({ ...blank, agent: moi || "" }); setOpen(true); };
  const modifier = (p) => { setEditId(p.id); setF({ ...blank, ...p }); setOpen(true); };

  const enregistrer = () => {
    if (!f.nom.trim()) return;
    const doc = editId
      ? { ...f, id: editId }
      : { ...f, id: uid(), creePar: moi, cree: new Date().toISOString(), echanges: [], visites: [] };
    save({
      ...data,
      prospects: editId ? prospects.map((x) => x.id === editId ? doc : x) : [doc, ...prospects],
    }, (editId ? "a modifié le prospect " : "a ajouté le prospect ") + f.nom);
    setOpen(false);
  };

  const supprimer = (p) => {
    if (!window.confirm("Supprimer ce prospect ?")) return;
    save({ ...data, prospects: prospects.filter((x) => x.id !== p.id) }, "a supprimé un prospect");
  };

  const changerStatut = (p, statut) => {
    save({ ...data, prospects: prospects.map((x) => x.id === p.id ? { ...x, statut } : x) },
      "a passé " + p.nom + " au statut « " + statutLabelCRM(statut) + " »");
  };

  // Ajouter un échange (note datée) à un prospect — met à jour la date de dernier contact
  const ajouterEchange = (p, texte) => {
    if (!texte || !texte.trim()) return;
    const echanges = [...(p.echanges || []), { id: uid(), date: new Date().toISOString(), par: moi, texte: texte.trim() }];
    save({ ...data, prospects: prospects.map((x) => x.id === p.id ? { ...x, echanges, dateContact: aujourdhui() } : x) },
      "a noté un échange avec " + p.nom);
  };

  // Marquer une visite effectuée
  const ajouterVisite = (p) => {
    const bien = window.prompt("Bien visité (nom ou description) :", "");
    if (bien === null) return;
    const visites = [...(p.visites || []), { id: uid(), date: new Date().toISOString(), bien: bien.trim(), par: moi }];
    save({ ...data, prospects: prospects.map((x) => x.id === p.id ? { ...x, visites, dateContact: aujourdhui() } : x) },
      "a enregistré une visite pour " + p.nom);
  };

  const nomBien = (id) => { const b = data.biens.find((x) => x.id === id); return b ? (b.unite || b.nom) : ""; };
  const nomAgent = (email) => {
    if (!email) return "—";
    if (email === emailGerante) return "Gérante";
    return email.split("@")[0];
  };

  // Prospects visibles : la gérante voit tout ; un commercial voit les siens + non attribués
  const visibles = suisGerante ? prospects : prospects.filter((p) => !p.agent || p.agent === moi || p.creePar === moi);

  // Filtrage par statut
  const filtres = filtreStatut === "tous" ? visibles : visibles.filter((p) => p.statut === filtreStatut);

  // Prospects actifs (non conclus, non perdus)
  const actifs = (list) => list.filter((p) => p.statut !== "conclu" && p.statut !== "perdu");

  // Alertes : non traités (dernier contact > seuil) et sans visite
  const nonTraites = actifs(visibles).filter((p) => { const j = joursDepuis(p.dateContact); return j !== null && j >= SEUIL_NON_TRAITE; });
  const sansVisite = actifs(visibles).filter((p) => !(p.visites && p.visites.length > 0));
  const relancesDues = actifs(visibles).filter((p) => p.prochaineRelance && p.prochaineRelance <= aujourdhui());

  // Regroupement par agent pour le point hebdomadaire
  const parAgent = {};
  actifs(visibles).forEach((p) => { const a = p.agent || "(non attribué)"; (parAgent[a] = parAgent[a] || []).push(p); });

  const messageRelance = (p) =>
    "Bonjour " + p.nom + ",\n\nJe me permets de revenir vers vous concernant votre recherche " +
    (p.recherche === "Achat" ? "d'achat" : "de location") + (p.typeBien ? " (" + p.typeBien + ")" : "") +
    ". Êtes-vous toujours intéressé(e) ? Je reste à votre disposition.\n\nCordialement,\n" + (P.societe || "Season Immobilier");

  const messageAgent = (agentEmail, list) =>
    "Bonjour,\n\nPoint hebdomadaire sur vos prospects (" + list.length + ") :\n" +
    list.map((p) => "• " + p.nom + " — " + statutLabelCRM(p.statut) +
      (joursDepuis(p.dateContact) !== null ? " (dernier contact il y a " + joursDepuis(p.dateContact) + " j)" : "")).join("\n") +
    "\n\nMerci de me faire un retour sur chacun.\n" + (P.societe || "Season Immobilier");

  return (
    <div>
      <Head title="CRM · Prospects" sub="Suivi des clients à la recherche d'un bien (location et achat)"
        action={<Btn variant="accent" onClick={ouvrirNouveau}>+ Prospect</Btn>} />

      {/* Bandeau d'alerte pour la gérante */}
      {(nonTraites.length > 0 || relancesDues.length > 0) && (
        <div className="mb-4 px-4 py-3 rounded text-sm garder-couleur sans-impression" style={{ background: C.goldSoft, color: C.gold }}>
          {relancesDues.length > 0 && <div>🔔 {relancesDues.length} relance(s) prévue(s) aujourd'hui ou en retard.</div>}
          {nonTraites.length > 0 && <div>⚠ {nonTraites.length} client(s) pas recontacté(s) depuis plus de {SEUIL_NON_TRAITE} jours.</div>}
        </div>
      )}

      {/* Sélecteur de vue */}
      <div className="flex gap-2 mb-4 sans-impression flex-wrap">
        {[["pipeline","Pipeline"],["liste","Liste"],["alertes","À traiter"],["point","Point hebdo"]].map(([k, lab]) => (
          <button key={k} onClick={() => setVue(k)} className="px-3 py-1.5 rounded text-sm font-medium"
            style={{ background: vue === k ? C.ink : "transparent", color: vue === k ? "#fff" : C.mute, border: "1px solid " + (vue === k ? C.ink : C.line) }}>
            {lab}{k === "alertes" && (nonTraites.length + sansVisite.length) > 0 ? " (" + (nonTraites.length) + ")" : ""}</button>))}
      </div>

      {prospects.length === 0 && (
        <div className="mb-5 px-4 py-3 rounded text-sm" style={{ background: C.greenSoft, color: C.ink }}>
          Aucun prospect pour l'instant. Cliquez sur « + Prospect » pour enregistrer votre premier client à la recherche d'un bien.
        </div>
      )}

      {/* ===== VUE PIPELINE (colonnes par statut) ===== */}
      {vue === "pipeline" && prospects.length > 0 && (
        <div className="overflow-x-auto sans-impression">
          <div className="flex gap-3" style={{ minWidth: "min-content" }}>
            {CRM_STATUTS.map(([k, lab, tone]) => {
              const col = visibles.filter((p) => p.statut === k);
              return (
                <div key={k} className="rounded-lg p-2" style={{ background: "#F5F4EE", minWidth: 230, width: 230 }}>
                  <div className="flex items-center justify-between px-1 mb-2">
                    <span className="text-xs font-semibold uppercase tracking-wide" style={{ color: C.ink }}>{lab}</span>
                    <span className="text-xs" style={{ color: C.mute }}>{col.length}</span>
                  </div>
                  <div className="space-y-2">
                    {col.map((p) => {
                      const j = joursDepuis(p.dateContact);
                      const alerte = j !== null && j >= SEUIL_NON_TRAITE && k !== "conclu" && k !== "perdu";
                      return (
                        <div key={p.id} onClick={() => setFicheId(p.id)} className={card + " p-2.5 cursor-pointer"}
                          style={{ borderColor: alerte ? C.gold : C.line, borderWidth: alerte ? 2 : 1 }}>
                          <div className="font-semibold text-sm" style={{ color: C.ink }}>{p.nom}</div>
                          <div className="text-[11px] mb-1" style={{ color: C.mute }}>
                            {p.recherche}{p.typeBien ? " · " + p.typeBien : ""}{p.budget ? " · " + fcfa(p.budget) : ""}</div>
                          <div className="flex items-center justify-between">
                            <span className="text-[10px]" style={{ color: C.mute }}>{nomAgent(p.agent)}</span>
                            {alerte && <span className="text-[10px] font-semibold garder-couleur" style={{ color: C.gold }}>⚠ {j}j</span>}
                            {!(p.visites && p.visites.length) && k !== "conclu" && k !== "perdu" &&
                              <span className="text-[10px] garder-couleur" style={{ color: C.clay }}>· 0 visite</span>}
                          </div>
                        </div>);
                    })}
                    {col.length === 0 && <div className="text-[11px] text-center py-2" style={{ color: C.mute }}>—</div>}
                  </div>
                </div>);
            })}
          </div>
        </div>
      )}

      {/* ===== VUE LISTE ===== */}
      {vue === "liste" && prospects.length > 0 && (
        <div>
          <div className="flex gap-2 mb-3 flex-wrap sans-impression">
            <button onClick={() => setFiltreStatut("tous")} className="px-2.5 py-1 rounded text-xs font-medium"
              style={{ background: filtreStatut === "tous" ? C.ink : "transparent", color: filtreStatut === "tous" ? "#fff" : C.mute, border: "1px solid " + C.line }}>Tous ({visibles.length})</button>
            {CRM_STATUTS.map(([k, lab]) => {
              const n = visibles.filter((p) => p.statut === k).length;
              return <button key={k} onClick={() => setFiltreStatut(k)} className="px-2.5 py-1 rounded text-xs font-medium"
                style={{ background: filtreStatut === k ? C.ink : "transparent", color: filtreStatut === k ? "#fff" : C.mute, border: "1px solid " + C.line }}>{lab} ({n})</button>;
            })}
          </div>
          <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead><tr style={{ background: "#F5F4EE" }}>
                  {["Client","Recherche","Budget","Agent","Statut","Dernier contact","Visites",""].map((h) => (

                </tr></thead>
                <tbody className="divide-y" style={{ borderColor: C.line }}>
                  {filtres.map((p) => {
                    const j = joursDepuis(p.dateContact);
                    const alerte = j !== null && j >= SEUIL_NON_TRAITE && p.statut !== "conclu" && p.statut !== "perdu";
                    return (
                      <tr key={p.id} className="cursor-pointer" onClick={() => setFicheId(p.id)}>
                        <td className="px-3 py-2.5 font-medium" style={{ color: C.ink }}>{p.nom}<div className="text-[11px] font-normal" style={{ color: C.mute }}>{p.tel}</div></td>
                        <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{p.recherche}{p.typeBien ? " · " + p.typeBien : ""}{p.quartier ? " · " + p.quartier : ""}</td>
                        <td className="px-3 py-2.5 tabular-nums text-xs" style={{ color: C.ink }}>{p.budget ? fcfa(p.budget) : "—"}</td>
                        <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{nomAgent(p.agent)}</td>
                        <td className="px-3 py-2.5"><Tag tone={statutToneCRM(p.statut)}>{statutLabelCRM(p.statut)}</Tag></td>
                        <td className="px-3 py-2.5 text-xs" style={{ color: alerte ? C.gold : C.mute }}>{j !== null ? "il y a " + j + " j" : "—"}{alerte ? " ⚠" : ""}</td>
                        <td className="px-3 py-2.5 text-xs" style={{ color: (p.visites && p.visites.length) ? C.ink : C.clay }}>{(p.visites && p.visites.length) || 0}</td>
                        <td className="px-3 py-2.5 text-right" onClick={(e) => e.stopPropagation()}>
                          <button onClick={() => ouvrirWhatsApp(p.tel, messageRelance(p))} className="text-xs font-semibold" style={{ color: C.green }}>WhatsApp</button>
                        </td>
                      </tr>);
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {/* ===== VUE ALERTES / À TRAITER ===== */}
      {vue === "alertes" && (
        <div className="space-y-5">
          <div>
            <h3 className="text-sm font-semibold mb-2 flex items-center gap-2" style={{ color: C.ink }}>
              🔔 Relances prévues <span className="text-xs font-normal" style={{ color: C.mute }}>({relancesDues.length})</span></h3>
            {relancesDues.length === 0 ? <p className="text-xs" style={{ color: C.mute }}>Aucune relance prévue en retard.</p>
              : <div className="space-y-2">{relancesDues.map((p) => <LigneAlerte key={p.id} p={p} onFiche={() => setFicheId(p.id)} messageRelance={messageRelance} nomAgent={nomAgent} />)}</div>}
          </div>
          <div>
            <h3 className="text-sm font-semibold mb-2 flex items-center gap-2" style={{ color: C.gold }}>
              ⚠ Clients non recontactés (+{SEUIL_NON_TRAITE}j) <span className="text-xs font-normal" style={{ color: C.mute }}>({nonTraites.length})</span></h3>
            {nonTraites.length === 0 ? <p className="text-xs" style={{ color: C.mute }}>Tous les clients ont été recontactés récemment. 👍</p>
              : <div className="space-y-2">{nonTraites.map((p) => <LigneAlerte key={p.id} p={p} onFiche={() => setFicheId(p.id)} messageRelance={messageRelance} nomAgent={nomAgent} />)}</div>}
          </div>
          <div>
            <h3 className="text-sm font-semibold mb-2 flex items-center gap-2" style={{ color: C.clay }}>
              🚪 Clients sans aucune visite <span className="text-xs font-normal" style={{ color: C.mute }}>({sansVisite.length})</span></h3>
            {sansVisite.length === 0 ? <p className="text-xs" style={{ color: C.mute }}>Tous les clients actifs ont au moins une visite.</p>
              : <div className="space-y-2">{sansVisite.map((p) => <LigneAlerte key={p.id} p={p} onFiche={() => setFicheId(p.id)} messageRelance={messageRelance} nomAgent={nomAgent} />)}</div>}
          </div>
        </div>

      {/* ===== VUE POINT HEBDOMADAIRE ===== */}
      {vue === "point" && (

          <div className="px-4 py-3 rounded text-sm" style={{ background: C.greenSoft, color: C.ink }}>
            Point hebdomadaire par commercial. Envoyez à chacun la demande de point sur ses clients actifs d'un simple clic.
          </div>
          {Object.keys(parAgent).length === 0 ? <Empty text="Aucun prospect actif à suivre." />
            : Object.entries(parAgent).map(([agent, list]) => (
              <div key={agent} className={card + " p-4"} style={{ borderColor: C.line }}>
                <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
                  <div>
                    <h3 className="font-semibold text-sm" style={{ color: C.ink }}>{nomAgent(agent)}</h3>
                    <p className="text-xs" style={{ color: C.mute }}>{list.length} client(s) actif(s)</p>
                  </div>
                  <div className="flex gap-2 sans-impression">
                    {agent.includes("@") && <button onClick={() => ouvrirMail(agent, "Point hebdomadaire — vos prospects", messageAgent(agent, list))} className="text-xs font-semibold" style={{ color: C.green }}>Email le point</button>}
                    <button onClick={() => { navigator.clipboard && navigator.clipboard.writeText(messageAgent(agent, list)); window.alert("Le point a été copié. Collez-le dans WhatsApp."); }} className="text-xs font-semibold" style={{ color: C.ink }}>Copier</button>
                  </div>
                </div>
                <div className="space-y-1">
                  {list.map((p) => {

                      <div key={p.id} className="flex items-center justify-between text-xs py-1 border-t" style={{ borderColor: C.line }}>
                        <span onClick={() => setFicheId(p.id)} className="cursor-pointer" style={{ color: C.ink }}>{p.nom}</span>
                        <span style={{ color: C.mute }}>{statutLabelCRM(p.statut)}{j !== null ? " · " + j + "j" : ""}{(p.visites && p.visites.length) ? " · " + p.visites.length + " visite(s)" : " · 0 visite"}</span>
                      </div>);
                  })}
                </div>
              </div>))}
        </div>
      )}

      {/* ===== MODALE AJOUT / ÉDITION ===== */}
      {open && (
        <Modal title={editId ? "Modifier le prospect" : "Nouveau prospect"} onClose={() => setOpen(false)} wide>
          <div className="space-y-4">
            <div className="grid sm:grid-cols-2 gap-3">
              <Field label="Nom du client"><Input value={f.nom} onChange={(e) => setF({ ...f, nom: e.target.value })} /></Field>
              <Field label="Téléphone"><Input value={f.tel} onChange={(e) => setF({ ...f, tel: e.target.value })} /></Field>
              <Field label="Email"><Input value={f.email} onChange={(e) => setF({ ...f, email: e.target.value })} /></Field>
              <Field label="Recherche">
                <Select value={f.recherche} onChange={(e) => setF({ ...f, recherche: e.target.value })}>
                  {CRM_RECHERCHE.map((x) => <option key={x}>{x}</option>)}
                </Select>
              </Field>
              <Field label="Type de bien recherché">
                <Select value={f.typeBien} onChange={(e) => setF({ ...f, typeBien: e.target.value })}>
                  {CRM_TYPES_BIEN.map((x) => <option key={x}>{x}</option>)}
                </Select>
              </Field>
              <Field label="Budget (F CFA)"><Input type="number" value={f.budget} onChange={(e) => setF({ ...f, budget: e.target.value })} placeholder="Loyer ou prix visé" /></Field>

/* ========================= studios meublés ============================== */

const TARIF_NUITEE = 30000;       // tarif courte durée par nuit
const TARIF_LONG = 20000;         // tarif long séjour (>= 14 nuits) par nuit
const SEUIL_LONG = 14;            // nombre de nuits à partir duquel le tarif long s'applique
const COURANT_MOIS = 30000;       // courant prépayé par mois (longs séjours)
const CAUTION_LONG = 100000;      // caution pour longs séjours
const TAUX_ARRHES = 40;           // arrhes en % (valeur par défaut, modifiable par réservation)

// Nombre de nuits entre deux dates (arrivée, départ)
function nbNuits(arrivee, depart) {
  if (!arrivee || !depart) return 0;
  const a = new Date(arrivee + "T00:00:00");
  const d = new Date(depart + "T00:00:00");
  const n = Math.round((d - a) / (1000 * 60 * 60 * 24));
  return n > 0 ? n : 0;
}

// Calcule le détail tarifaire d'une réservation
function calcResa(r) {
  const nuits = nbNuits(r.arrivee, r.depart);
  const estLong = nuits >= SEUIL_LONG;
  const tarif = estLong ? TARIF_LONG : TARIF_NUITEE;
  const hebergement = nuits * tarif;
  // Courant prépayé : par mois entamé, uniquement si coché (long séjour)
  const mois = estLong ? Math.max(1, Math.ceil(nuits / 30)) : 0;
  const courant = (estLong && r.courant) ? mois * COURANT_MOIS : 0;
  const caution = estLong ? CAUTION_LONG : 0;
  // Dépassement : nuitées supplémentaires facturées manuellement (sortie après 13h)
  const depassement = Number(r.depassement || 0) * tarif;
  const total = hebergement + courant + caution + depassement;
  const tauxArrhes = (r.tauxArrhes !== undefined && r.tauxArrhes !== "" && r.tauxArrhes !== null) ? Number(r.tauxArrhes) : TAUX_ARRHES;
  // Arrhes : soit un montant fixe saisi manuellement, soit le pourcentage
  const arrhes = (r.arrhesFixe !== undefined && r.arrhesFixe !== "" && r.arrhesFixe !== null && Number(r.arrhesFixe) > 0)
    ? Number(r.arrhesFixe)
    : Math.round((hebergement + courant) * tauxArrhes / 100);
  const arrhesManuelle = (r.arrhesFixe !== undefined && r.arrhesFixe !== "" && r.arrhesFixe !== null && Number(r.arrhesFixe) > 0);
  return { nuits, estLong, tarif, hebergement, mois, courant, caution, depassement, total, tauxArrhes, arrhes, arrhesManuelle };
}

    courant: false, depassement: 0, tauxArrhes: TAUX_ARRHES, arrhesFixe: "", statut: "a_valider",
    // fiche signalétique
    naissance: "", lieuNaissance: "", nationalite: "", typePiece: "CNI", numPiece: "", adresse: "", profession: "", contactUrgence: "",
    pourAutrui: false, benefNom: "", benefPiece: "", benefLien: "" };

  const startResa = (studioId) => { setFr({ ...blankResa, studioId: studioId || (studios[0] || {}).id || "" }); setOpenResa(true); };

    if (nbNuits(fr.arrivee, fr.depart) <= 0) { window.alert("La date de départ doit être après l'arrivée."); return; }
    const doc = { ...fr, id: uid(), numero: "RES-" + new Date().getFullYear() + "-" + String(resas.length + 1).padStart(4, "0"),
      saisiPar: moi, cree: new Date().toISOString(), statut: suisGerante ? "validee" : "a_valider" };
    save({ ...data, reservations: [doc, ...resas] },

  const marquerPayee = (r) => save({ ...data, reservations: resas.map((x) => x.id === r.id ? { ...x, statut: "payee", payeeLe: new Date().toISOString() } : x) }, "a marqué payée la réservation de " + r.client);

// Calendrier de disponibilité : lignes = studios, colonnes = 30 prochains jours
function CalendrierDispo({ studios, resas, statutLib }) {
  const [debut, setDebut] = useState(aujourdhui());
  const jours = [];
  const d0 = new Date(debut + "T00:00:00");
  for (let i = 0; i < 30; i++) { const d = new Date(d0); d.setDate(d0.getDate() + i); jours.push(d); }
  const iso = (d) => d.toISOString().slice(0, 10);
  const resaAt = (studioId, jourIso) => resas.find((r) => r.studioId === studioId && r.statut !== "rejetee" && r.arrivee <= jourIso && jourIso < r.depart);

  return (
    <div>
      <div className="flex items-center gap-2 mb-3 sans-impression">
        <Label>À partir du</Label>
        <input type="date" value={debut} onChange={(e) => setDebut(e.target.value)}
          className="px-3 py-2 text-sm rounded border bg-white outline-none" style={{ borderColor: C.line, color: C.ink }} />
        <span className="text-xs" style={{ color: C.mute }}>(30 jours affichés)</span>
      </div>
      <div className="overflow-x-auto">
        <table className="text-xs border-collapse">
          <thead><tr>
            <th className="sticky left-0 bg-white px-2 py-2 text-left" style={{ minWidth: 140, color: C.mute }}>Studio</th>
            {jours.map((d, i) => (
              <th key={i} className="px-1 py-2 text-center font-normal" style={{ minWidth: 26, color: d.getDay() === 0 || d.getDay() === 6 ? C.clay : C.mute }}>
                {d.getDate()}<div className="text-[8px]">{["D","L","M","M","J","V","S"][d.getDay()]}</div></th>))}
          </tr></thead>
          <tbody>
            {studios.map((s) => (
              <tr key={s.id}>
                <td className="sticky left-0 bg-white px-2 py-2 font-medium border-t" style={{ color: C.ink, borderColor: C.line }}>{s.nom}</td>
                {jours.map((d, i) => {
                  const r = resaAt(s.id, iso(d));
                  return (
                    <td key={i} className="px-0.5 py-2 text-center border-t garder-couleur" style={{ borderColor: C.line, background: r ? C.green : "#F0F5EA" }}
                      title={r ? r.client + " (" + statutLib[r.statut] + ")" : "Libre"}>
                      {r ? <span style={{ color: "#fff", fontSize: 9 }}>●</span> : ""}
                    </td>);
                })}
              </tr>))}
          </tbody>
        </table>
      </div>
      <div className="flex gap-4 mt-3 text-xs" style={{ color: C.mute }}>
        <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded garder-couleur" style={{ background: C.green }}></span> Occupé</span>
        <span className="flex items-center gap-1"><span className="inline-block w-3 h-3 rounded garder-couleur" style={{ background: "#F0F5EA" }}></span> Libre</span>
      </div>
    </div>
  );
}

const CATEGORIES_DEPENSE = [
  "Transport commerciaux", "Carburant", "Fournitures de bureau", "Entretien et ménage",
  "Eau et électricité", "Internet et téléphone", "Sortie / détente équipe", "Restauration / accueil clients",
  "Frais de mission / déplacement", "Publicité et communication", "Petit matériel", "Réparations bureau",
  "Frais bancaires", "Impôts et taxes", "Loyer du bureau", "Salaires / primes", "Autre",
];

function Caisse({ data, save, moi }) {
  const [open, setOpen] = useState(false);
  const [typeSaisie, setTypeSaisie] = useState("depense");
  const [periode, setPeriode] = useState("jour"); // jour, mois, tout
  const P = data.parametres || PARAMS_DEFAUT;
  const liste = data.caisse || [];
  const emailGerante = (P.gerante || "aude.nioble@season-immobilier.com").trim().toLowerCase();
  const suisGerante = String(moi || "").trim().toLowerCase() === emailGerante;

  const blank = { type: "depense", montant: "", rendu: "", categorie: CATEGORIES_DEPENSE[0], detail: "",
    beneficiaire: "", date: aujourdhui() };
  const [f, setF] = useState(blank);

  const ouvrir = (type) => { setTypeSaisie(type); setF({ ...blank, type }); setOpen(true); };

  const enregistrer = () => {
    if (!f.montant) return;
    // Une entrée (approvisionnement) saisie par la gérante est validée d'office ; sinon à valider
    const valide = suisGerante;
    const doc = { ...f, id: uid(), montant: Number(f.montant), rendu: Number(f.rendu) || 0, valide, validePar: valide ? moi : null,
      valideLe: valide ? new Date().toISOString() : null, saisiPar: moi, cree: new Date().toISOString() };
    save({ ...data, caisse: [doc, ...liste] },
      (f.type === "entree" ? "a approvisionné la caisse de " : "a enregistré une dépense de ") + fcfa(Number(f.montant) - (Number(f.rendu) || 0))
      + (f.type === "depense" ? " (" + f.categorie + ")" : "") + (valide ? "" : " [à valider]"));
    setOpen(false);
  };

  const valider = (m) => save({ ...data, caisse: liste.map((x) => x.id === m.id ? { ...x, valide: true, validePar: moi, valideLe: new Date().toISOString() } : x) },
    "a validé une opération de caisse de " + fcfa(m.montant));
  const supprimer = (m) => { if (window.confirm("Supprimer cette opération de caisse ?")) save({ ...data, caisse: liste.filter((x) => x.id !== m.id) }, "a supprimé une opération de caisse"); };

  // Solde global (toutes opérations validées) — une dépense retire (montant - rendu), le rendu revient en caisse
  const montantNet = (m) => Number(m.montant || 0) - (Number(m.rendu) || 0);
  const soldeGlobal = liste.filter((m) => m.valide).reduce((s, m) => s + (m.type === "entree" ? m.montant : -montantNet(m)), 0);
  const enAttente = liste.filter((m) => !m.valide);

  // Filtrage par période
  const auj = aujourdhui();
  const moisCour = auj.slice(0, 7);
  const filtrees = liste.filter((m) => {
    if (periode === "jour") return m.date === auj;
    if (periode === "mois") return (m.date || "").slice(0, 7) === moisCour;
    return true;
  }).sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.cree || "").localeCompare(a.cree || ""));

  const entrees = filtrees.filter((m) => m.type === "entree" && m.valide).reduce((s, m) => s + m.montant, 0);
  const sorties = filtrees.filter((m) => m.type === "depense" && m.valide).reduce((s, m) => s + montantNet(m), 0);

  // Répartition par catégorie sur la période
  const parCategorie = {};
  filtrees.filter((m) => m.type === "depense" && m.valide).forEach((m) => {
    parCategorie[m.categorie] = (parCategorie[m.categorie] || 0) + montantNet(m);
  });
  const cats = Object.entries(parCategorie).map(([nom, val]) => ({ nom, val })).sort((a, b) => b.val - a.val);

  const libPeriode = periode === "jour" ? "aujourd'hui" : periode === "mois" ? "ce mois" : "au total";

  return (
    <div>
      <Head title="Caisse & dépenses" sub="Suivi de la petite caisse : approvisionnements et dépenses"
        action={<>
          {suisGerante && <Btn variant="ghost" onClick={() => ouvrir("entree")}>+ Approvisionner</Btn>}
          <Btn variant="accent" onClick={() => ouvrir("depense")}>+ Dépense</Btn>
        </>} />

      {/* Solde et alerte */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: soldeGlobal >= 0 ? C.green : C.clay }}></div>
          <div className="p-4"><Label>Solde de caisse</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: soldeGlobal >= 0 ? C.green : C.clay }}>{fcfa(soldeGlobal)}</div>
            <div className="text-[10px] mt-0.5" style={{ color: C.mute }}>ce qui devrait rester</div></div></div>
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: C.green }}></div>
          <div className="p-4"><Label>Entrées {libPeriode}</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.green }}>{fcfa(entrees)}</div></div></div>
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: C.clay }}></div>
          <div className="p-4"><Label>Dépenses {libPeriode}</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.clay }}>{fcfa(sorties)}</div></div></div>
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: C.orange }}></div>
          <div className="p-4"><Label>À valider</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.orange }}>{enAttente.length}</div></div></div>
      </div>

      {suisGerante && enAttente.length > 0 && (
        <div className="mb-5 px-4 py-3 rounded text-sm font-semibold sans-impression garder-couleur" style={{ background: C.goldSoft, color: C.gold }}>
          ⚠ {enAttente.length} opération(s) de caisse en attente de VOTRE validation.
        </div>
      )}

      {/* Sélecteur de période */}
      <div className="flex gap-2 mb-4 sans-impression">
        {[["jour","Aujourd'hui"],["mois","Ce mois"],["tout","Tout"]].map(([k, lab]) => (
          <button key={k} onClick={() => setPeriode(k)} className="px-3 py-1.5 rounded text-sm font-medium"
            style={{ background: periode === k ? C.ink : "transparent", color: periode === k ? "#fff" : C.mute, border: "1px solid " + (periode === k ? C.ink : C.line) }}>
            {lab}</button>))}
      </div>

      <div className="grid lg:grid-cols-3 gap-6">
        {/* Liste des opérations */}
        <div className="lg:col-span-2">
          {filtrees.length === 0 ? <Empty text="Aucune opération sur cette période." />
            : <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead><tr style={{ background: "#F5F4EE" }}>
                    {["Date","Type / Catégorie","Détail","Montant","Statut",""].map((h) => (
                      <th key={h} className="text-left px-3 py-2.5 text-[10px] font-semibold uppercase tracking-[0.1em]" style={{ color: C.mute }}>{h}</th>))}
                  </tr></thead>
                  <tbody className="divide-y" style={{ borderColor: C.line }}>
                    {filtrees.map((m) => (
                      <tr key={m.id}>
                        <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>{m.date}</td>
                        <td className="px-3 py-2.5">
                          {m.type === "entree" ? <Tag tone="ok">Approvisionnement</Tag>
                            : <span style={{ color: C.ink }}>{m.categorie}</span>}
                        </td>
                        <td className="px-3 py-2.5 text-xs" style={{ color: C.mute }}>
                          {m.detail}{m.beneficiaire ? (m.detail ? " · " : "") + m.beneficiaire : ""}</td>
                        <td className="px-3 py-2.5 tabular-nums font-semibold" style={{ color: m.type === "entree" ? C.green : C.clay }}>
                          {m.type === "entree" ? "+ " : "- "}{fmt(m.type === "entree" ? m.montant : montantNet(m))}
                          {m.type === "depense" && Number(m.rendu) > 0 && <div className="text-[10px] font-normal" style={{ color: C.mute }}>donné {fmt(m.montant)} · rendu {fmt(m.rendu)}</div>}</td>
                        <td className="px-3 py-2.5">{m.valide ? <Tag tone="ok">Validé</Tag> : <Tag tone="warn">À valider</Tag>}</td>
                        <td className="px-3 py-2.5"><div className="flex gap-2">
                          {!m.valide && suisGerante && <button onClick={() => valider(m)} className="text-xs font-semibold" style={{ color: C.green }}>Valider</button>}
                          {(suisGerante || !m.valide) && <button onClick={() => supprimer(m)} className="text-xs font-semibold" style={{ color: C.clay }}>Suppr.</button>}
                        </div></td>
                      </tr>))}
                  </tbody>
                </table>
              </div></div>}
        </div>

        {/* Point par catégorie */}
        <div>
          <div className={card} style={{ borderColor: C.line }}>
            <div className="px-4 py-3 border-b" style={{ borderColor: C.line }}>
              <h3 className="text-sm font-semibold" style={{ color: C.ink }}>Dépenses par poste ({libPeriode})</h3></div>
            <div className="p-4">
              {cats.length === 0 ? <p className="text-sm" style={{ color: C.mute }}>Aucune dépense.</p>
                : <div className="space-y-2.5">
                    {cats.map((c, i) => {
                      const pct = Math.round(c.val / cats[0].val * 100);
                      return (
                        <div key={i}>
                          <div className="flex justify-between text-xs mb-1">
                            <span style={{ color: C.ink }}>{c.nom}</span>
                            <span className="tabular-nums" style={{ color: C.mute }}>{fcfa(c.val)}</span></div>
                          <div className="h-2 rounded" style={{ background: "#F0EEE4" }}>
                            <div className="h-2 rounded garder-couleur" style={{ width: pct + "%", background: C.clay }}></div></div>
                        </div>);
                    })}
                    <div className="flex justify-between pt-2 border-t font-bold text-sm" style={{ borderColor: C.line }}>
                      <span style={{ color: C.ink }}>Total dépenses</span>
                      <span className="tabular-nums" style={{ color: C.clay }}>{fcfa(sorties)}</span></div>
                  </div>}
            </div>
          </div>
        </div>
      </div>

      <p className="text-xs mt-3 sans-impression" style={{ color: C.mute }}>
        L'assistante enregistre les dépenses. Toi seule valides (notamment les approvisionnements quand tu remets l'argent). Le solde ne compte que les opérations validées.
      </p>

      {open && (
        <Modal title={typeSaisie === "entree" ? "Approvisionner la caisse" : "Enregistrer une dépense"} onClose={() => setOpen(false)}>
          <div className="space-y-3">
            {typeSaisie === "depense" && (
              <Field label="Catégorie">
                <Select value={f.categorie} onChange={(e) => setF({ ...f, categorie: e.target.value })}>
                  {CATEGORIES_DEPENSE.map((c) => <option key={c} value={c}>{c}</option>)}
                </Select>
              </Field>
            )}
            <div className="grid grid-cols-2 gap-3">
              <Field label={typeSaisie === "depense" ? "Montant donné (F CFA)" : "Montant (F CFA)"}><Input type="number" value={f.montant} onChange={(e) => setF({ ...f, montant: e.target.value })} /></Field>
              <Field label="Date"><Input type="date" value={f.date} onChange={(e) => setF({ ...f, date: e.target.value })} /></Field>
            </div>
            {typeSaisie === "depense" && (
              <Field label="Monnaie rendue (F CFA) — si l'agent a rendu de l'argent">
                <Input type="number" value={f.rendu} onChange={(e) => setF({ ...f, rendu: e.target.value })} placeholder="0" />
              </Field>
            )}
            {typeSaisie === "depense" && Number(f.montant) > 0 && (
              <div className="px-3 py-2 rounded text-sm flex justify-between garder-couleur" style={{ background: C.greenSoft }}>
                <span style={{ color: C.mute }}>Dépense réelle (donné − rendu)</span>
                <span className="font-bold tabular-nums" style={{ color: C.green }}>{fcfa((Number(f.montant) || 0) - (Number(f.rendu) || 0))}</span>
              </div>
            )}
            <Field label={typeSaisie === "entree" ? "Provenance / note" : "Détail de la dépense"}>
              <Input value={f.detail} onChange={(e) => setF({ ...f, detail: e.target.value })}
                placeholder={typeSaisie === "entree" ? "Ex : remise par la gérante" : "Ex : taxi pour visite Cocody"} /></Field>
            {typeSaisie === "depense" && (
              <Field label="Bénéficiaire / commercial concerné (facultatif)">
                <Input value={f.beneficiaire} onChange={(e) => setF({ ...f, beneficiaire: e.target.value })} placeholder="Nom du commercial" /></Field>
            )}
            <div className="flex gap-2 pt-1">
              <Btn variant="accent" onClick={enregistrer}>Enregistrer</Btn>
              <Btn variant="ghost" onClick={() => setOpen(false)}>Annuler</Btn>
            </div>
            {!suisGerante && <p className="text-xs" style={{ color: C.mute }}>Cette opération sera « à valider » par la gérante.</p>}
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ============================ commissions =============================== */

// Barème d'agence (modifiable au cas par cas sur chaque opération)
const BAREME_VENTE = [
  { max: 50000000, simple: 10, exclusif: 20, agence: 5 },       // jusqu'à 50 M
  { max: 200000000, simple: 12, exclusif: 25, agence: 4 },      // 51 à 200 M
  { max: Infinity, simple: 15, exclusif: 30, agence: 3 },       // plus de 200 M
];
const TYPES_LOCATION = [
  { id: "hab0_2", label: "Habitation (0 à 2 M/an)", part: 15, base: "1 mois de loyer" },
  { id: "hab2plus", label: "Habitation (> 2 M/an)", part: 20, base: "1 mois de loyer" },
  { id: "meuble", label: "Location meublée (courte/longue durée)", part: 15, base: "10% du montant perçu" },
  { id: "bureau", label: "Bureaux ou commerces", part: 20, base: "1 mois de loyer TTC" },
  { id: "gestion", label: "Contrat de gestion locative", part: 15, base: "1 mois de loyer" },
];

function baremeVente(montant) {
  return BAREME_VENTE.find((t) => Number(montant || 0) <= t.max) || BAREME_VENTE[BAREME_VENTE.length - 1];
}

function Commissions({ data, save, moi }) {
  const [open, setOpen] = useState(false);
  const [filtre, setFiltre] = useState("tous");
  const P = data.parametres || PARAMS_DEFAUT;
  const liste = data.operations || [];
  const emailGerante = (P.gerante || "aude.nioble@season-immobilier.com").trim().toLowerCase();
  const suisGerante = String(moi || "").trim().toLowerCase() === emailGerante;
  const emailsCommerciaux = (P.commerciaux || []).map((e) => String(e).trim().toLowerCase());
  const estCommercial = emailsCommerciaux.includes(String(moi || "").trim().toLowerCase());
  const montrerMontants = !estCommercial; // les commerciaux ne voient ni les taux ni les montants de commission

  const blankVente = { type: "vente", bienId: "", ref: "", agentId: "", montant: "", mandat: "simple",
    tauxAgence: "", partCommercial: "", apporteur: "", tauxApporteur: 30, date: aujourdhui() };
  const blankLoc = { type: "location", bienId: "", ref: "", agentId: "", loyer: "", typeLoc: "hab0_2",
    commissionAgence: "", partCommercial: "", apporteur: "", tauxApporteur: 30, date: aujourdhui() };
  const [f, setF] = useState(blankVente);

  // Recalcule les montants d'une opération à partir de ses taux
  const calcOp = (o) => {
    if (o.type === "vente") {
      const b = baremeVente(o.montant);
      const tauxAgence = o.tauxAgence !== "" && o.tauxAgence != null ? Number(o.tauxAgence) : b.agence;
      const tauxComm = o.partCommercial !== "" && o.partCommercial != null ? Number(o.partCommercial) : b[o.mandat || "simple"];
      const commissionAgence = Math.round(Number(o.montant || 0) * tauxAgence / 100);
      const partApporteur = o.apporteur ? Math.round(commissionAgence * (Number(o.tauxApporteur) || 0) / 100) : 0;
      const base = commissionAgence - partApporteur;
      const commissionAgent = Math.round(base * tauxComm / 100);
      return { commissionAgence, partApporteur, base, commissionAgent, tauxAgence, tauxComm };
    } else {
      const t = TYPES_LOCATION.find((x) => x.id === o.typeLoc) || TYPES_LOCATION[0];
      const commissionAgence = Number(o.commissionAgence || 0);
      const tauxComm = o.partCommercial !== "" && o.partCommercial != null ? Number(o.partCommercial) : t.part;
      const partApporteur = o.apporteur ? Math.round(commissionAgence * (Number(o.tauxApporteur) || 0) / 100) : 0;
      const base = commissionAgence - partApporteur;
      const commissionAgent = Math.round(base * tauxComm / 100);
      return { commissionAgence, partApporteur, base, commissionAgent, tauxComm };
    }
  };

  const ouvrirVente = () => { setF({ ...blankVente, agentId: (data.agents[0] || {}).id || "" }); setOpen(true); };
  const ouvrirLoc = () => { setF({ ...blankLoc, agentId: (data.agents[0] || {}).id || "" }); setOpen(true); };

  const enregistrer = () => {
    if (!f.agentId || (f.type === "vente" ? !f.montant : !f.commissionAgence)) return;
    const doc = { ...f, id: uid(), statut: "a_valider", saisiPar: moi, cree: new Date().toISOString() };
    save({ ...data, operations: [doc, ...liste] },
      "a déclaré une opération " + (f.type === "vente" ? "de vente" : "de location") + " (commission à valider)");
    setOpen(false);
  };

  const valider = (o) => {
    save({ ...data, operations: liste.map((x) => x.id === o.id ? { ...x, statut: "validee", validePar: moi, valideLe: new Date().toISOString() } : x) },
      "a validé la commission d'une opération");
  };
  const marquerPayee = (o) => {
    save({ ...data, operations: liste.map((x) => x.id === o.id ? { ...x, statut: "payee", payeeLe: new Date().toISOString() } : x) },
      "a marqué une commission comme payée");
  };
  const rejeter = (o) => {
    if (!window.confirm("Rejeter cette opération ? La commission ne sera pas due.")) return;
    save({ ...data, operations: liste.map((x) => x.id === o.id ? { ...x, statut: "rejetee" } : x) }, "a rejeté une opération");
  };
  const supprimer = (o) => { if (window.confirm("Supprimer cette opération ?")) save({ ...data, operations: liste.filter((x) => x.id !== o.id) }, "a supprimé une opération"); };

  const nomAgent = (id) => (data.agents.find((a) => a.id === id) || {}).nom || "—";
  const nomBien = (id) => (data.biens.find((b) => b.id === id) || {}).nom || "";

  const visibles = liste.filter((o) => {
    if (filtre === "tous") return true;
    if (filtre === "a_valider") return o.statut === "a_valider";
    if (filtre === "a_payer") return o.statut === "validee";
    if (filtre === "payees") return o.statut === "payee";
    return true;
  });

  const totAValider = liste.filter((o) => o.statut === "a_valider").length;
  const totAPayer = liste.filter((o) => o.statut === "validee").reduce((s, o) => s + calcOp(o).commissionAgent, 0);
  const totPaye = liste.filter((o) => o.statut === "payee").reduce((s, o) => s + calcOp(o).commissionAgent, 0);

  const statutTone = { a_valider: "warn", validee: "ok", payee: "neutral", rejetee: "bad" };
  const statutLib = { a_valider: "À valider", validee: "À payer", payee: "Payée", rejetee: "Rejetée" };

  const apercu = calcOp(f);

  return (
    <div>
      <Head title="Commissions" sub="Déclaration, validation et paiement des commissions d'agents"
        action={<>
          <Btn variant="ghost" onClick={ouvrirLoc} disabled={data.agents.length === 0}>+ Location</Btn>
          <Btn variant="accent" onClick={ouvrirVente} disabled={data.agents.length === 0}>+ Vente</Btn>
        </>} />

      {data.agents.length === 0 && (
        <div className="mb-5 px-4 py-3 rounded text-sm" style={{ background: C.goldSoft, color: C.gold }}>
          Ajoutez d'abord vos agents dans l'onglet « Agents » pour pouvoir leur attribuer des commissions.
        </div>
      )}

      {montrerMontants ? (
      <div className="grid grid-cols-3 gap-3 mb-5">
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: C.orange }}></div>
          <div className="p-4"><Label>À valider</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.orange }}>{totAValider}</div></div></div>
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: C.green }}></div>
          <div className="p-4"><Label>À payer (validées)</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.green }}>{fcfa(totAPayer)}</div></div></div>
        <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}>
          <div style={{ height: 4, background: C.mute }}></div>
          <div className="p-4"><Label>Déjà payé</Label>
            <div className="text-lg font-bold tabular-nums" style={{ color: C.ink }}>{fcfa(totPaye)}</div></div></div>
      </div>
      ) : (
        <div className="mb-5 px-4 py-3 rounded text-sm" style={{ background: "#F5F4EE", color: C.mute }}>
          Déclarez vos ventes et locations ici. La gérante valide les commissions. Les montants restent confidentiels.
        </div>
      )}

      {suisGerante && totAValider > 0 && (
        <div className="mb-5 px-4 py-3 rounded text-sm font-semibold sans-impression garder-couleur" style={{ background: C.goldSoft, color: C.gold }}>
          ⚠ {totAValider} commission(s) en attente de VOTRE validation.
        </div>
      )}

      <div className="flex gap-2 mb-4 sans-impression flex-wrap">
        {(montrerMontants ? [["tous","Toutes"],["a_valider","À valider"],["a_payer","À payer"],["payees","Payées"]] : [["tous","Toutes"],["a_valider","En attente"]]).map(([k, lab]) => (
          <button key={k} onClick={() => setFiltre(k)} className="px-3 py-1.5 rounded text-sm font-medium"
            style={{ background: filtre === k ? C.ink : "transparent", color: filtre === k ? "#fff" : C.mute, border: "1px solid " + (filtre === k ? C.ink : C.line) }}>
            {lab}</button>))}
      </div>

      {visibles.length === 0 ? <Empty text="Aucune opération. Déclarez une vente ou une location pour calculer la commission de l'agent." />
        : <div className={card + " overflow-hidden"} style={{ borderColor: C.line }}><div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr style={{ background: "#F5F4EE" }}>
                {(montrerMontants ? ["Type","Bien / Réf","Agent","Montant","Commission agent","Statut","Action"] : ["Type","Bien / Réf","Agent","Date","Statut","Action"]).map((h) => (
                  <th key={h} className="text-left px-4 py-2.5 text-[10px] font-semibold uppercase tracking-[0.12em]" style={{ color: C.mute }}>{h}</th>))}
              </tr></thead>
              <tbody className="divide-y" style={{ borderColor: C.line }}>
                {visibles.map((o) => {
                  const c = calcOp(o);
                  return (
                    <tr key={o.id}>
                      <td className="px-4 py-3"><Tag tone={o.type === "vente" ? "neutral" : "ok"}>{o.type === "vente" ? "Vente" : "Location"}</Tag></td>
                      <td className="px-4 py-3" style={{ color: C.ink }}>{nomBien(o.bienId) || o.ref || "—"}

                      </div></td>
                    </tr>);
                })}

            </table>
